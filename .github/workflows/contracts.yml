name: Contracts

# Gates the spec surface: buf lint on the protos, Gherkin syntax and
# scenario-ID hygiene on the feature tiers, rule citations on the
# example rule tiers, and the reason keys (reasons.proto's rules, and no
# retired or unprefixed key named in the features, protos or docs), and
# wire compatibility against the spec draft (`just proto-breaking`,
# decision 14.54).
# All logic lives in justfile recipes; this workflow only invokes them.

on:
  pull_request:
    paths:
      - 'proto/**'
      - 'features/**'
      - 'parity/**'
      - 'scripts/check_feature_ids.py'
      - 'scripts/test_check_feature_ids.py'
      - 'scripts/check_gherkin_parse.py'
      - 'scripts/check_reason_keys.py'
      - 'scripts/test_check_reason_keys.py'
      - 'site/src/content/docs/**'
      - 'justfile'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Proto + feature contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # proto-breaking compares against the merge base with the draft.
          fetch-depth: 0

      - uses: extractions/setup-just@v2

      - name: proto-lint
        run: just proto-lint

      - name: proto-breaking
        run: just proto-breaking

      - name: check-feature-ids
        run: just test-check-feature-ids check-feature-ids

      - name: check-gherkin
        run: just check-gherkin

      - name: check-rules
        run: just check-rules

      - name: check-reason-names
        run: just check-reason-names

      - name: check-reason-keys
        run: just test-check-reason-keys check-reason-keys
