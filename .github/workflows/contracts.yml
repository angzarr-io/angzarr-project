name: Contracts

# Gates the spec surface: buf lint on the protos and scenario-ID hygiene on
# the framework feature tiers. Wire compatibility is not gated (stored data
# is wiped across schema changes); `just proto-breaking` is a manual check.
# All logic lives in justfile recipes; this workflow only invokes them.

on:
  pull_request:
    paths:
      - 'proto/**'
      - 'features/**'
      - 'parity/**'
      - 'scripts/check_feature_ids.py'
      - 'scripts/test_check_feature_ids.py'
      - 'justfile'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Proto + feature contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - name: proto-lint
        run: just proto-lint

      - name: check-feature-ids
        run: just test-check-feature-ids check-feature-ids
