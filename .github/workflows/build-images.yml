name: Build Images

# Builds and publishes the angzarr toolchain images (base + 5 language images)
# to ghcr.io/angzarr-io/angzarr-{base,rust,python,go,java,csharp}.
#
# Triggers:
#   - push to main when build/images/** changes  → republish + retag :latest
#   - PR touching build/images/**                 → build only (no push)
#   - workflow_dispatch                            → manual rebuild

on:
  push:
    branches: [main]
    paths:
      - 'build/images/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    paths:
      - 'build/images/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Toolchain Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Skaffold
        run: |
          curl -Lo skaffold https://storage.googleapis.com/skaffold/releases/latest/skaffold-linux-amd64
          chmod +x skaffold
          sudo mv skaffold /usr/local/bin/

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main / dispatch)
        run: |
          cd build/images
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            skaffold build --file-output=build.json
          else
            skaffold build --push --file-output=build.json
          fi

      - name: Tag images as :latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd build/images
          for FULL_TAG in $(jq -r '.builds[].tag' build.json); do
            IMAGE_NAME=$(echo "$FULL_TAG" | cut -d: -f1)
            echo "Tagging $IMAGE_NAME:latest"
            docker pull "$FULL_TAG"
            docker tag "$FULL_TAG" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
          done

      - name: Summary
        if: always()
        run: |
          if [ -f build/images/build.json ]; then
            echo "## Built Images" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
            jq -r '.builds[] | "| \(.imageName) | \(.tag | split(":")[1]) |"' build/images/build.json \
              >> $GITHUB_STEP_SUMMARY
          fi
