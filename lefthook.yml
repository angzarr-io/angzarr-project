# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install (again after a hook is added or removed here)
# Bypass: none — fix the finding instead.

pre-commit:
  commands:
    # Refuse commits whose staged files contain secrets (gitleaks).
    scan-secrets:
      run: just scan-secrets

# No mutation testing in any hook: mutation of the Rust (rust/angzarr-ports)
# runs while tests are written and judged (`just mutation-push`, by hand), at
# the end of an unattended run, and in the scheduled CI full pass
# (.github/workflows/mutation.yml).
