# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install (again after a hook is added here: pre-push was)
# Bypass: none — fix the finding instead.

pre-commit:
  commands:
    # Refuse commits whose staged files contain secrets (gitleaks).
    scan-secrets:
      run: just scan-secrets

# Mutation testing of the Rust (rust/angzarr-ports) runs here, not at
# pre-commit: it is too slow for every commit. `just mutation-push` mutates
# what each pushed ref changes there, in the pushed commit's own tree (the
# justfile says how). git's pushed refs are on stdin, and {1} is the remote's
# name. lefthook skips a pre-push command when it finds no files changed
# between HEAD and the remote, which says nothing of the refs pushed; a
# `{files}` in `run` turns that off, so `files` names one that is always
# there, and mutation-push ignores it.
pre-push:
  commands:
    mutation:
      use_stdin: true
      files: echo justfile
      run: just mutation-push {1} {files}
