# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install (again after a hook is added or removed here:
# pre-push was, then pre-merge-commit)
# Bypass: none — fix the finding instead.

pre-commit:
  commands:
    # Refuse commits whose staged files contain secrets (gitleaks).
    scan-secrets:
      run: just scan-secrets
    # What push-check holds a pushed commit to, on the working tree: every
    # test, then buf breaking against the draft. Red is committed off the
    # protected branches (the default one and the justfile's
    # PROTECTED_BRANCHES, the spec drafts) with a warning (RED) and refused
    # on them or a detached HEAD (`just test-commit`).
    tests:
      run: just test-commit

# A merge commit is checked as a commit is: one bringing red onto a
# protected branch is refused, one onto another branch is warned.
pre-merge-commit:
  commands:
    tests:
      run: just test-commit

# No mutation testing in any hook. This repository has no Rust: the crates
# (angzarr-proto, angzarr-ports) moved to angzarr-core, whose scheduled CI
# pass mutates them.

# Red tests never reach main or a spec draft: `just push-check` runs every
# test in each pushed commit's own tree (the justfile says how), refusing a
# push to a protected branch (the default one and PROTECTED_BRANCHES) whose
# tests fail and warning on any other branch. git's pushed refs are on stdin,
# and {1} is the remote's name. lefthook skips a pre-push command when it
# finds no files changed between HEAD and the remote, which says nothing of
# the refs pushed; a `{files}` in `run` turns that off, so `files` names one
# that is always there, and push-check ignores it.
pre-push:
  commands:
    push-check:
      use_stdin: true
      files: echo justfile
      run: just push-check {1} {files}
