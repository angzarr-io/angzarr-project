[package]
name = "angzarr-proto"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "prost types for angzarr's domain-neutral wire contract (io.angzarr.v1 types + upcaster messages); no services, no tonic"
repository = "https://github.com/angzarr-io/angzarr-project"
publish = false

# Standalone: angzarr-project has no Cargo workspace of its own.
[workspace]

[dependencies]
prost = "0.14"
prost-types = "0.14"

[build-dependencies]
prost-build = "0.14"
