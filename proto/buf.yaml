version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - SERVICE_SUFFIX
    - IMPORT_USED
# Breaking checks report wire + JSON incompatibility. Pre-v0.1.0 nothing is
# gated on them: removed fields and messages are deleted outright, with no
# `reserved` statements (stored data is wiped across schema changes).
breaking:
  use:
    - WIRE_JSON
