version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - SERVICE_SUFFIX
    - IMPORT_USED
  # The vendored protos are kept verbatim and are not angzarr's, so lint
  # holds angzarr's protos only: Google's (google/api for non-buf build
  # systems, google/rpc/code.proto for ReasonOptions.grpc_status, decision
  # 14.104) and the CloudEvents Protobuf Format's
  # (io/cloudevents/v1/cloudevents.proto, from github.com/cloudevents/spec
  # cloudevents/formats/cloudevents.proto at bad81171, Apache-2.0; decision
  # 14.108).
  ignore:
    - google
    - io/cloudevents
# Breaking checks report wire + JSON incompatibility, and gate (decision
# 14.54): `just proto-breaking` runs in `just contracts`, the Contracts
# workflow and the pre-push hook, against the merge base with the spec
# draft (the justfile's DRAFT_BRANCH).
# No exception mechanism (decision 14.88, retiring 14.70's
# proto/breaking.exception once its one commit, c5a2ae3, was in the draft).
#
# Reservation policy (decision D6, pass 6, in force since 14.54): the
# first production event any store keeps was taskloom's, on 2026-10-31.
# From then on every removed field number and name, and every removed enum
# value, gets a `reserved` statement in the same change that removes it, so
# a later field can never misdecode stored rows; an incompatible change is
# a new message version plus an upcaster. Stored data is no longer wiped
# across schema changes. (Up to then removals were deleted outright,
# unreserved.)
breaking:
  use:
    - WIRE_JSON
