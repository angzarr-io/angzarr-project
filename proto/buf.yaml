version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - SERVICE_SUFFIX
    - IMPORT_USED
  # The blackjack example's Suit values (CLUBS, ...) are the example's own,
  # mirrored in its language repos; every framework enum, reasons.proto's
  # included, follows buf's enum naming with no exception (decision 14.44).
  ignore_only:
    ENUM_VALUE_PREFIX:
      - io/angzarr/examples/v1/cards.proto
# Breaking checks report wire + JSON incompatibility. Nothing is gated on
# them yet (backlog GAP-3).
#
# Reservation policy (decision D6, pass 6): reserve from the first stored
# production event onwards. Until then (every pass up to and including
# pass 14) removed fields, enum values and messages are deleted outright,
# with no `reserved` statements, and stored data is wiped across schema
# changes. From the first production event any store keeps (hatpick stores
# EventPage bytes as written), every removed field number and name gets a
# `reserved` statement in the same change that removes it, so a later field
# can never misdecode stored rows. That moment is also when `buf breaking`
# starts gating merges (the gate-wire-compat trigger).
breaking:
  use:
    - WIRE_JSON
