syntax = "proto3";
package examples;

import "examples/orchestration.proto";
import "examples/poker_types.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/angzarr/angzarr/proto/examples";
option java_multiple_files = true;
option java_package = "dev.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// Registration Orchestration - PM-coordinated flow for Player ↔ Tournament
// =============================================================================

// -----------------------------------------------------------------------------
// Commands (Player Domain)
// -----------------------------------------------------------------------------

// Client initiates tournament registration - triggers PM orchestration
message InitiateTournamentRegistration {
  bytes tournament_root = 1;
}

// PM confirms successful registration
message ConfirmRegistrationFee {
  bytes reservation_id = 1;
}

// PM releases fee after failed registration
message ReleaseRegistrationFee {
  bytes reservation_id = 1;
  string reason = 2;
}

// -----------------------------------------------------------------------------
// Events (Player Domain)
// -----------------------------------------------------------------------------

// Emitted when registration is requested - triggers PM
message RegistrationRequested {
  bytes reservation_id = 1; // UUID for this registration flow
  bytes tournament_root = 2;
  Currency fee = 3; // Looked up from tournament
  google.protobuf.Timestamp requested_at = 4;
}

// Emitted when registration fee is confirmed
message RegistrationFeeConfirmed {
  bytes reservation_id = 1;
  bytes tournament_root = 2;
  Currency fee = 3;
  google.protobuf.Timestamp confirmed_at = 4;
}

// Emitted when registration fee is released
message RegistrationFeeReleased {
  bytes reservation_id = 1;
  string reason = 2;
  google.protobuf.Timestamp released_at = 3;
}

// -----------------------------------------------------------------------------
// PM Events (RegistrationOrchestrator Domain)
// -----------------------------------------------------------------------------

// PM state: registration flow initiated
message RegistrationInitiated {
  bytes player_root = 1;
  bytes tournament_root = 2;
  bytes reservation_id = 3;
  Currency fee = 4;
  RegistrationPhase phase = 5;
  google.protobuf.Timestamp initiated_at = 6;
}

// PM state: registration flow completed successfully
message RegistrationCompleted {
  bytes player_root = 1;
  bytes tournament_root = 2;
  bytes reservation_id = 3;
  Currency fee = 4;
  int64 starting_stack = 5;
  google.protobuf.Timestamp completed_at = 6;
}

// PM state: registration flow failed
message RegistrationFailed {
  bytes player_root = 1;
  bytes tournament_root = 2;
  bytes reservation_id = 3;
  OrchestrationFailure failure = 4;
}

// PM state: phase transition
message RegistrationPhaseChanged {
  bytes reservation_id = 1;
  RegistrationPhase from_phase = 2;
  RegistrationPhase to_phase = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// -----------------------------------------------------------------------------
// PM State (for snapshots)
// -----------------------------------------------------------------------------

message RegistrationOrchestratorState {
  bytes reservation_id = 1; // Correlation ID for this flow
  bytes player_root = 2;
  bytes tournament_root = 3;
  int64 fee = 4;
  RegistrationPhase phase = 5;
  google.protobuf.Timestamp started_at = 6;
}
