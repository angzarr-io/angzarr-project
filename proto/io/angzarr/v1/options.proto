syntax = "proto3";
package io.angzarr.v1;

import "google/protobuf/descriptor.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// Custom options for declaring dispatch components in proto.
//
// A component (aggregate, saga, process manager, projector) is declared by
// annotating a MESSAGE — its state message for the stateful kinds, or a marker
// message for the stateless saga — with (io.angzarr.v1.component). Its commands
// and events are other messages carrying (io.angzarr.v1.command) /
// (io.angzarr.v1.event) that point back at the anchor. There are no services
// and no rpcs: the annotations ARE the declaration. Code generators read these
// from descriptors and emit a strict per-component handler interface plus a
// local dispatch table; they do NOT emit gRPC service code — transport stays on
// the generic framework services and the Any envelope so the coordinator
// remains domain-blind.

// ComponentKind identifies which dispatch component a message declaration
// generates.
enum ComponentKind {
  COMPONENT_KIND_UNSPECIFIED = 0;
  COMPONENT_KIND_AGGREGATE = 1;
  COMPONENT_KIND_SAGA = 2;
  COMPONENT_KIND_PROCESS_MANAGER = 3;
  COMPONENT_KIND_PROJECTOR = 4;
}

// Component declaration carried on a message. The annotated message is the
// component's anchor: for AGGREGATE / PROCESS_MANAGER / PROJECTOR it is the
// event-sourced state (or per-delivery projection) message the rebuilder folds
// into; for the stateless SAGA it is an empty marker message naming the saga.
//
// Three independent domain roles, never overloaded:
//   domain            — the stream the component OWNS (writes its events to)
//   input_domain      — a domain it SUBSCRIBES to (consumes events from)
//   output_domain(s)  — domains it SENDS COMMANDS to
//
// Per kind (generation fails on a violation):
//   kind             domain     input_domain               output_domain(s)
//   AGGREGATE        required   empty                      empty
//   PROCESS_MANAGER  required   empty (per-event domains)  command targets
//   SAGA             forbidden  required                   command targets
//   PROJECTOR        forbidden  optional (per-event dom.)  empty
// An aggregate owns its domain's stream and subscribes to nothing; a process
// manager owns its own workflow stream (domain) and takes its trigger
// domains from (event).domain; sagas and projectors own no stream.
//
// Two compensation declarations, never interchangeable:
//   compensates — rejections of commands this component CAUSED elsewhere
//                 (RejectionNotification payload)
//   undoes      — undo of commands this component EXECUTED, requested by a
//                 failed CASCADE_ERROR_COMPENSATE request (Compensate payload)
// undoes is allowed only on AGGREGATE: commands are executed only by
// aggregates. It must be empty for PROCESS_MANAGER (a PM issues commands but
// never executes one; its own stream changes only through trigger
// reactions), SAGA and PROJECTOR.
message ComponentOptions {
  ComponentKind kind = 1;
  // Domain this component subscribes to: the saga's single source domain, or
  // a projector's input filter when all of its handlers share one domain
  // (otherwise each (event).domain names the source). Subscriptions only —
  // never the component's own domain. Empty for aggregates and process
  // managers (process-manager trigger domains come from (event).domain).
  string input_domain = 2;
  // Domain this component issues commands to (sagas / process managers).
  // Command targets only — never the component's own domain. Single-target
  // shorthand: the component's output domains are output_domain (when set)
  // together with every entry of output_domains.
  string output_domain = 3;
  // Generated handler/dispatch base name. Optional; defaults to the anchor
  // message name (e.g. a "CounterState" anchor named "Counter" emits
  // CounterHandler / NewCounterDispatch).
  string name = 4;
  // Fully-qualified command types whose rejection this component compensates.
  // Declared on the COMPENSATOR (not the command) so a command's file stays
  // decoupled from the cross-domain sagas/PMs that react to its rejection.
  // Each generates an On<Command>Rejected method, in declaration order
  // (C-0042). The handler takes the rejection envelope, not a typed command.
  //
  // A rejection is dispatched by the pair (rejected command's target domain,
  // fully-qualified command type): an entry here matches a rejected command
  // of that type addressed to any of this component's output domains, so
  // the same command type rejected by two domains is told apart by domain.
  repeated string compensates = 5;
  // Additional domains this component issues commands to; see output_domain.
  repeated string output_domains = 6;
  // Fully-qualified command types this aggregate can undo after executing
  // them. Each entry must name a command the aggregate handles. Generation
  // emits one On<Command>Undo handler per entry, in declaration order; the
  // generated dispatch routes a Compensate notification (types.proto) to the
  // handler for its Compensate.command_type, passing the Compensate (event
  // sequences + reason) with the rebuilt state. Allowed only on AGGREGATE.
  //
  // A Compensate whose command_type has no undo handler is never dropped:
  // the router answers HandleCompensation with UNIMPLEMENTED, which the
  // coordinator treats as non-retryable and dead-letters the delivery
  // envelope at once (compensation_delivery_failed details).
  repeated string undoes = 8;
  // Domain of the event stream this component owns: the aggregate's domain,
  // or the process manager's own workflow domain (its events are persisted
  // there and its state is rebuilt from it). Required for AGGREGATE and
  // PROCESS_MANAGER; must be empty for SAGA and PROJECTOR, which own no
  // stream. Deployment discovery advertises it: an aggregate's
  // angzarr.io/domain label and a process manager's angzarr.io/pm label
  // carry this value.
  string domain = 7;
}

// Marks a message as a COMMAND. Generates one strict handler method on the
// component that owns it, taking the typed command as input. A command is
// owned by exactly one component; compensation for its rejection is declared
// on the compensating component via ComponentOptions.compensates.
message CommandOptions {
  // The anchor message of the component that handles this command. Resolved
  // against the compiled descriptor set; generation fails on an unknown or
  // ambiguous reference.
  string component = 1;
  // Fully-qualified event type(s) this command emits. When set, the generated
  // handler returns the typed events and the framework builds the EventBook and
  // stamps sequences; when empty, the handler returns the raw EventBook (the
  // escape hatch for multi-type emission, custom covers, snapshots).
  repeated string emits = 2;
}

// Marks a message as an EVENT consumed by ONE component. The extension is
// repeated, so an event consumed by several components (e.g. folded into its
// aggregate AND triggering a saga) carries one (event) entry per consumer. For
// an AGGREGATE — or a PROCESS_MANAGER's own state — an entry generates a state
// applier (folded during rebuild); for a SAGA / PROJECTOR / PROCESS_MANAGER
// trigger it generates a reaction handler. The component's kind (and `applies`)
// select which.
message EventConsumer {
  // The anchor message of the component that consumes this event.
  string component = 1;
  // Source domain: the saga / projector input filter, or the process-manager
  // trigger source domain. Unset for an aggregate's own applied events.
  string domain = 2;
  // PROCESS_MANAGER only: true marks this as a fold of the PM's OWN state
  // (an applier); false (with a `domain`) marks it as a cross-domain trigger
  // reaction. Aggregates always apply; saga/projector always react.
  bool applies = 3;
}

extend google.protobuf.MessageOptions {
  ComponentOptions component = 50100;
  CommandOptions command = 50104;
  // Repeated: one entry per consuming component.
  repeated EventConsumer event = 50105;
}
