syntax = "proto3";
package io.angzarr.v1;

import "google/protobuf/descriptor.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// Custom options for declaring dispatch components in proto.
//
// A component (aggregate, policy, process manager, projector) is declared by
// annotating a MESSAGE — its state message for the stateful kinds, or a marker
// message for the stateless policy — with (io.angzarr.v1.component). Its commands
// and events are other messages carrying (io.angzarr.v1.command) /
// (io.angzarr.v1.event) that point back at the anchor. There are no services
// and no rpcs: the annotations ARE the declaration. Code generators read these
// from descriptors and emit a strict per-component handler interface plus a
// local dispatch table; they do NOT emit gRPC service code — transport stays on
// the generic framework services and the Any envelope so the coordinator
// remains domain-blind.

// Component declaration carried on a message. The annotated message is the
// component's anchor: for an aggregate or a process manager it is the
// event-sourced state the rebuilder folds into, for a projector its
// per-delivery projection message, and for the stateless policy an empty
// marker message naming the policy.
//
// The kind is a oneof (decision 14.78, from the owner's ruling #2): each arm
// holds exactly what that kind declares, so nothing can be set on a kind
// that may not have it, and there is no per-kind validity table.
//   aggregate        its domain: the stream it OWNS (writes its events to)
//   process_manager  its domain: its own workflow stream (decision 14.31)
//   policy           its output_domain: the one domain it SENDS commands
//                    and facts to
//   projector        nothing
// A component's SOURCES are never declared: they are derived from the
// events it names (decision 14.78, from the owner's ruling #3). The owner
// of an event is the one aggregate or process manager in the descriptor
// set with an (event) entry folding it, and the event's domain is its
// owner's domain. A policy's source is the one domain of the events its
// (event) entries name; a projector's sources are the domains of the
// events its entries name. An event whose owner is outside the descriptor
// set names its domain on the consumer's entry (EventConsumer.domain, an
// override for that case alone). Generation fails for a policy or
// projector naming no event, a policy whose events come from more than one
// domain, a consumed event with no owner in the set and no override, an
// override on an event that has an owner in the set, and an event folded
// by two stateful components (a process manager subscribing, which 14.31
// forbids).
//
// An aggregate owns its domain's stream and subscribes to nothing. A
// process manager is a domain too (decision 14.31): it owns its own
// workflow stream, subscribes to nothing, takes commands (most from
// policies of other domains) and facts, and sends no commands (its
// decisions reach other domains through policies from its domain).
// Policies and projectors own no stream.
//
// Each declaration is one component, served by its own business process
// behind its own coordinator (see ComponentService in component/v1/component.proto).
// A policy is a translator between exactly two domains: one source and one
// destination (output_domain). There is one policy per (source domain,
// destination domain) pair: every reaction that translates events of one
// domain into commands and facts for another belongs to that pair's one
// policy, however many event types it reacts to; its destination may be
// an aggregate's domain or a process manager's. Anything that needs
// several destinations is a process manager, whose events the policies for
// (the PM's domain, each destination) translate. A policy's outputs name
// only a root (io.angzarr.handler.v1.Output): the coordinator addresses
// every one to PolicyDescriptor.output_domain (decision 14.42).
//
// There are no compensation declarations: a process manager pairs each
// step with its undo in code, with its client library's compensation
// tooling (decision 14.74). A refusal in a choreographed flow
// is a rejection plus a fact: the target refuses a policy's command and
// records nothing, the policy translates the refusal into one fact of its
// own source domain, and that domain's fact handler decides what it means
// (decision 2.2, as amended by 14.31 and 14.78; PolicyService in
// policy.proto, Refusals). The typed refusal objects a command's handler
// may return are named by the command's annotation, CommandOptions.refuses,
// as its events are by emits (the refusals region, below). A process
// manager's inputs are declared like an aggregate's, as (command) entries
// whose component is the PM's state message; they say which inputs may
// start an instance (CommandOptions.starts).
//
//   option (io.angzarr.v1.component) = { aggregate: { domain: "table" } };
//   option (io.angzarr.v1.component) = { policy: { output_domain: "wallet" } };
//   option (io.angzarr.v1.component) = { name: "LedgerProjector" projector: {} };
message ComponentOptions {
  // Generated handler/dispatch base name: a CODE identifier. Optional;
  // defaults to the anchor message name (e.g. a "CounterState" anchor named
  // "Counter" emits CounterHandler / NewCounterDispatch). Not the
  // component's name in an application: that is component_name.
  string name = 4;
  // The component's NAME in an application (decision 14.50): what the
  // host config's [[component]] entry, the generated registration and
  // hand-written code call it, all through the one public helper that
  // computes it from these options and the derived sources. Optional; when
  // empty it defaults by kind:
  //   aggregate        its domain                          "table"
  //   process_manager  "pmg-" + its domain                 "pmg-buy-in"
  //   policy           "policy-" + its derived source      "policy-table-player"
  //                    + "-" + output_domain (unique: one
  //                    policy per pair)
  //   projector        "projector-" + the anchor message   "projector-ledger-projection"
  //                    name in kebab case
  // Kebab case: a "-" before each capital that follows a lower-case letter
  // or a digit, or that is followed by a lower-case letter and follows a
  // capital, then all lower-case ("HTTPServerView" -> "http-server-view").
  // A name is lower-case ASCII letters, digits and "-", starting with a
  // letter; anything else fails generation. Two components of one
  // application with one name is a lint (`angzarr lint app`).
  string component_name = 9;
  // Which kind of component, and what it declares. Required: a
  // declaration with no kind fails generation.
  oneof kind {
    AggregateDecl aggregate = 10;
    ProcessManagerDecl process_manager = 11;
    PolicyDecl policy = 12;
    ProjectorDecl projector = 13;
  }
  // Fields 1 (kind, a ComponentKind), 2 (input_domain), 3 (output_domain),
  // 7 (domain) and 8 (input_domains) were the flat shape, retired by
  // decision 14.78 for the kind oneof and derived sources. A field cannot
  // move into a oneof compatibly, so the arms take new numbers.
  reserved 1, 2, 3, 7, 8;
  reserved "kind", "input_domain", "output_domain", "domain", "input_domains";
}

// An aggregate's declaration.
message AggregateDecl {
  // The domain of the event stream it owns. Required. Deployment discovery
  // advertises it: an aggregate's angzarr.io/domain label carries it.
  string domain = 1;
}

// A process manager's declaration (a PM is a domain, decision 14.31).
message ProcessManagerDecl {
  // The domain of its own workflow stream: its events are persisted there
  // and its state is rebuilt from it. Required. Its angzarr.io/pm label
  // carries it.
  string domain = 1;
}

// A policy's declaration. Its source is derived from the events it names
// (above).
message PolicyDecl {
  // The one domain it sends commands and facts to (decision 14.24).
  // Required: a policy declaring none fails generation.
  string output_domain = 1;
}

// A projector's declaration. Its sources are derived from the events it
// names (above); one handler serves them all, dispatching each event by
// its type and receiving its source domain with it (decision 14.50).
message ProjectorDecl {}

// Marks a message as a COMMAND or FACT payload (CommandOptions.fact says
// which). Generates one strict handler method on the component that owns
// it, taking the typed message as input. It is owned by exactly one component, an aggregate or a
// process manager (a domain too; decision 14.31), whose handler decides a
// command (and may reject it) or ingests a fact (infallibly).
message CommandOptions {
  // The anchor message of the component that handles this command. Resolved
  // against the compiled descriptor set; generation fails on an unknown or
  // ambiguous reference.
  string component = 1;
  // Fully-qualified event type(s) this command emits. A handling returns a
  // list of its component's events, empty, one or many (decision 14.75):
  // when set, of these types (the generated list is typed by them, or by
  // the component's event choice where a language types a list by one
  // type); when empty, of any of the component's events. Either way business
  // output is payloads, plus the post-command state the client library adds
  // to every response, nothing more: the
  // framework builds the EventBook, uses the command's cover, and stamps
  // sequences and EventMeta. A handler answers payloads only
  // (io.angzarr.handler.v1.Decided), so it cannot choose a cover, a
  // sequence or meta.
  repeated string emits = 2;
  // PROCESS_MANAGER only: this command or fact type may START an
  // instance. An input for a correlation with no PM instance starts one
  // only if its entry sets starts; any other is not delivered: a fact is
  // dead-lettered (decision 14.69), and a command refused (ruling B1,
  // adapted; decision 14.31, owner's ruling; see process_manager.proto,
  // Starting an instance). The generator advertises the starting inputs
  // in the PM's descriptor (ProcessManagerDescriptor.starting_types). Setting
  // starts on an aggregate's entry fails generation. A PM that declares no
  // starting input can never start an instance, so the generator warns
  // about it.
  bool starts = 3;
  // Fully-qualified type(s) of the typed REFUSAL objects this command's
  // handler may refuse with: messages of the command's own domain (e.g.
  // InsufficientFunds { available, requested }), business-specific, never
  // events. The parallel of emits, in the same form (decision 14.31, the
  // owner's ruling). A command may name several (decision 14.50), e.g. a
  // domain-wide refusal with a Reason enum beside a command's own. When
  // set, the generated handler returns its typed events or one of these
  // typed refusals; when empty, it may refuse with a
  // raw refusal payload (google.protobuf.Any), or with a message only.
  // Either way the client library packs the chosen refusal object (the
  // concrete message, e.g. InsufficientFunds) as a google.protobuf.Any into
  // the answer's refusal (io.angzarr.handler.v1.Refusal.typed), and the
  // refused policy receives it in TranslateRequest.refusal. Generation fails on a refuses
  // type that does not resolve, or that is not a message of the command's
  // own domain (the refusals region). Set on a FACT (fact, below),
  // generation fails: a fact cannot be refused. A command of a domain some
  // policy targets (a policy may send any of its target's commands) must
  // name at least one (decision 14.76): every command a policy sends has a
  // refusal path, so one naming none fails generation and lint.
  repeated string refuses = 4;
  // Whether this input is a FACT (decision 14.34, the owner's ruling of
  // 2026-10-28). Unset (false): a COMMAND, which its handler decides and
  // may refuse; the scaffold writes #[handles_cmd]. Set: a FACT, something
  // that already happened, which its handler records and cannot refuse
  // (its handler is infallible); the scaffold writes #[handles_fact], and
  // the generator checks a component's markup against this field (a
  // #[handles_cmd] on a fact, or a #[handles_fact] on a command, fails
  // generation). A fact is delivered as a CommandPage whose body is a Fact,
  // a command as one whose body is a Command (types.proto). refuses on a
  // fact fails generation; starts applies to both (a process manager may
  // start from a command or from a fact); emits applies to both. A policy
  // emits what this declares (decision 14.69): its generated code sends a
  // Fact for a type that sets it and a Command for one that does not, so
  // a policy's fact is never refused, and only its commands have a
  // refusal path (policy.proto, PolicyService).
  bool fact = 5;
  // Field 6 was emits_cardinality (decision 14.50), with its enum
  // EmitsCardinality; removed by decision 14.75: every handling of a
  // command or a fact returns a list of its component's events, so there
  // is no cardinality to declare. Its number and name are reserved.
  reserved 6;
  reserved "emits_cardinality";
}

// Marks a message as an EVENT consumed by ONE component. The extension is
// repeated, so an event consumed by several components (e.g. folded into its
// aggregate AND triggering a policy) carries one (event) entry per consumer. For
// an AGGREGATE or a PROCESS_MANAGER an entry generates a state applier
// (folded during rebuild): a PM consumes only its own events, never another
// domain's (decision 14.31). For a POLICY / PROJECTOR it generates a reaction
// handler. The component's kind selects which.
message EventConsumer {
  // The anchor message of the component that consumes this event. A
  // component outside the descriptor set being generated is a REFERENCE,
  // not an error (decision 14.50): the generator skips the entry, so one
  // domain's protos generate alone; `angzarr lint app` reports a consumer
  // an application lists but does not have.
  string component = 1;
  // OVERRIDE ONLY (decision 14.78): the event's source domain, for an
  // event whose owner is outside the descriptor set (a contract-only proto,
  // a remote domain's events). A consumer's sources are otherwise derived
  // from the owner's domain (ComponentOptions, above). Set on an event that
  // has an owner in the set (a folding entry included), generation fails.
  string domain = 2;
  // Field 3 (applies, which told a PM's own-state fold from a trigger) is
  // deleted, unreserved (policy 6.6): a PM has no triggers (decision
  // 14.31), so every entry naming a PM is a fold, as for an aggregate.
}

extend google.protobuf.MessageOptions {
  ComponentOptions component = 50100;
  CommandOptions command = 50104;
  // Repeated: one entry per consuming component.
  repeated EventConsumer event = 50105;
  // On an aggregate's or a process manager's event-sourced STATE message:
  // the conflict resolutions it supports BEYOND the implicit base of STRICT
  // and AGGREGATE_HANDLES (StateOptions, in types.proto). No option means
  // exactly the base. Listing CONFLICT_RESOLUTION_COMMUTATIVE turns on the
  // conflict-unit markers ((conflict), below) on its fields and makes
  // COMMUTATIVE the component's resolution; without it the resolution is
  // STRICT (decision 14.81, DRAFT: the state declares it, and nothing
  // overrides it). See the conflict_units region.
  //   message ListState {
  //     option (io.angzarr.v1.state) = {
  //       conflict_resolutions: [CONFLICT_RESOLUTION_COMMUTATIVE]
  //     };
  //     ...
  //   }
  // 50101-50103 are skipped: earlier, since-deleted options used them, and
  // stale descriptors may still carry them. (50106 was the pass-8 bool
  // commutative_state, replaced in place before production.)
  StateOptions state = 50106;
}

// region conflict_units
// Conflict units: what CONFLICT_RESOLUTION_COMMUTATIVE compares.
//
// COMMUTATIVE (see ConflictResolution in types.proto) accepts a stale
// command when the state the command changes is disjoint from the state the
// concurrency window changed. "The state it changes" is defined here, once,
// for every language: a code generator (angzarr_build::compile for Rust,
// protoc-gen-angzarr for the other client languages; backlog CR-1) reads
// these markers from the descriptors and emits, per COMMUTATIVE state
// message,
//
//   changed(before, after) -> set of unit paths
//
// a pure function over two values of the state message, plus the state's
// StateDescriptor for its ComponentDescriptor (ComponentService.Describe).
// The client library's COMMUTATIVE resolver calls changed() and reports the
// unit sets; the coordinator judges their overlap (decision 14.42).
// Business code never calls it. annals generates the
// same function from the same markers, and a shared golden fixture suite
// holds every implementation to identical output. The developer guide,
// docs/guide/state-and-conflicts.md, explains all of this with examples.
//
// Marking. A state message opts in by listing COMMUTATIVE in its (state)
// option. Each of its fields is then MARKED by carrying (conflict),
// possibly empty:
//   string title = 1 [(conflict) = {}];
//   map<string, Item> items = 2 [(conflict) = {descend: true}];
//   string notes = 3 [(conflict) = {whole_state: true}];
// The ConflictUnit fields only refine how a marked field is split into
// units; an empty ConflictUnit means "this field, at its natural unit".
//
// Units, by field kind. A unit path names one piece of state; changed()
// returns the path of every unit whose value differs between before and
// after.
//
//   Field kind                          Unit                                          Example path
//   ----------------------------------  --------------------------------------------  ------------------
//   scalar / string / bytes / enum      the field                                     title
//   optional scalar (explicit presence) the field; set <-> unset is a change          deadline
//   message, not descend                the whole message (deep equality, presence)   settings
//   message with descend                each inner field, recursively, by these rules settings.cooldown_days
//   map                                 one unit per key (added, removed or changed)  items[42]
//   map of messages with descend        per key, then per inner field                 items[42].weight
//   repeated message with element_key   per element by key; plus field[#order] if     columns[due]
//                                       ordered and the order changed                 columns[#order]
//   repeated message, no element_key    the whole list                                columns
//   repeated scalar / string / bytes    the whole list                                tags
//   oneof                               the whole oneof (a case switch or a value     payment
//                                       change)
//   any field with whole_state          the wildcard: conflicts with everything       *notes
//
// Details of each rule:
// - Scalars compare by value. A proto3 field without explicit presence has
//   no unset state: unset and the default are the same value. A field with
//   explicit presence (proto3 `optional`) also changes when it goes from set
//   to unset or back, even to or from its default. Strings compare as UTF-8
//   bytes; bytes compare as bytes; enums compare by number.
// - FLOATS (float, double) compare BITWISE, on their IEEE 754 encoding: NaN
//   equals NaN only with the same bits, and +0.0 differs from -0.0. Never
//   numeric equality, so every language agrees.
// - Deep equality (a message that is not descended, a map value or list
//   element that is not descended) applies these same comparisons to every
//   field of the message, recursively, markers or not; map entries compare
//   by key regardless of order. Message presence counts: an unset message
//   differs from a set, empty one.
// - descend: the inner message's own fields become units, each under the
//   rules in this table, by its own (conflict) marker (the inner message
//   type needs no (state) option). Unmarked inner fields follow the
//   unmarked-field rule below. A descended message going between unset and
//   set is a change of the field itself (path `settings`), not of its inner
//   fields.
// - Maps: one unit per key present in before or after, named
//   `field[key]`, reported when that entry differs; a key added or removed
//   is a change of `field[key]`. With
//   descend (map values must be messages), a key present on both sides is
//   split into its value's inner fields (`items[42].weight`).
// - Keyed repeated (element_key names a field of the element message: a
//   singular scalar, string, bytes or enum field): one unit per key,
//   `field[key]`, like a map; with descend, split per inner field like a
//   map. With ordered, the field also has the unit `field[#order]`, which
//   changes iff the keys present on BOTH sides appear in a different
//   relative order; adding or removing an element alone is not an order
//   change. Without ordered, order is ignored. If the key is not unique
//   within before or within after, that field falls back to one unit for
//   the whole list (`columns`), compared by deep equality.
// - Oneofs: one unit named after the oneof (`payment`), which changes when
//   the set case changes (including to or from none) or the set member's
//   value changes (deep equality). The oneof is marked iff EVERY member
//   carries (conflict); members carry only an empty ConflictUnit, or all
//   carry whole_state (the oneof then reports the wildcard). A proto3
//   `optional` field's synthetic oneof is not a oneof here: it is the
//   optional-scalar row.
// - whole_state: the field is marked, but as one piece that conflicts with
//   every other change: if it differs, changed() reports the wildcard `*`
//   followed by its path (`*notes`), exactly as for an unmarked field. It
//   is the explicit, warning-free way to say "this field depends on the
//   rest of the state" (see the guide's COMMUTATIVE risks).
//
// Unit path syntax. Proto field names (never JSON names), joined by `.`.
// A map or keyed-repeated key is written in brackets after the field:
// integer keys in decimal, bool keys as `true` / `false`, enum keys by
// number (element keys only; map keys cannot be enums), string and bytes
// keys as their UTF-8 / raw bytes with each `\`, `]` and `#` preceded by a
// `\`. A key therefore never starts with a bare `#`, so `[#order]` cannot
// collide with a key (the string key "#order" is written `[\#order]`).
// Paths are compared as byte strings.
//
// UNMARKED FIELDS CONFLICT WITH EVERYTHING (fail-safe). A field of a
// COMMUTATIVE state message (or of a descended message) without (conflict)
// is never silently ignored: if it differs, changed() reports the wildcard
// unit `*` followed by the field's path (e.g. `*notes`), and a wildcard
// overlaps every unit of the other set. A field added to the state without
// a marker therefore makes COMMUTATIVE behave like STRICT whenever that
// field moves, never like a blind merge; the generator also WARNS about it
// (below). Unknown fields (state decoded from a newer schema) are compared
// as raw bytes per message and, if they differ, report the wildcard `*` +
// that message's path (`*` alone at the top level).
//
// Overlap. Two unit sets OVERLAP iff
//   - one set holds a wildcard and the other set is non-empty, or
//   - a unit of one set equals a unit of the other, or is a path prefix of
//     it ending at a `.` or `[` boundary (`items[42]` overlaps
//     `items[42].weight`; `items[4]` does not overlap `items[42]`).
// Prefixes make every fallback sound: a coarser unit always overlaps the
// finer units inside it.
//
// Recursion bound. descend may recurse, including through a message type
// that contains itself, to a depth of 32 descended messages counted from
// the state message. At depth 32 the field is treated as not descended (one
// whole-message unit, by deep equality): coarser, so still sound. Every
// implementation uses the same bound, so paths agree.
//
// The resolver (the client library computes, the coordinator judges;
// decision 14.42; see ConflictResolution in types.proto):
//   1. expected = state folded to Handling.expected_sequence;
//      head = expected with the window's events folded in.
//   2. window = changed(expected, head).
//   3. decide runs on head (never on expected), so every invariant decide
//      checks is checked against the window's effects.
//   4. mine = changed(head, head with the command's events folded in).
//   5. the client library answers the events with window and mine
//      (io.angzarr.handler.v1.Decided.conflict). The coordinator keeps the events
//      iff the two are disjoint (no overlap); otherwise the command fails as
//      stale (ABORTED, COORDINATOR_REASON_CONFLICT_OVERLAP, metadata window_units and
//      command_units), as STRICT would, and nothing is persisted. An empty
//      window or an empty mine is always disjoint.
// The resolver uses the CURRENT markers, from the descriptors of the code
// that runs decide; markers are never stored with events, so a marker change
// affects resolutions from its deployment on, never history.
//
// COMMUTATIVE is supported only by a state message whose (state) option
// lists it; the registered StateDescriptor says so, and the coordinator
// (domain-blind: it reads only that list) resolves a stale command of that
// component as COMMUTATIVE, and of any other as STRICT (decision 14.81).
//
// Generation diagnostics. Each names the file, the message and the field;
// the exact texts and their fixes are in the developer guide.
//   warning unmarked-field          a field of a COMMUTATIVE state (or of a
//                                   descended message) has no (conflict); it
//                                   conflicts with everything. Silence it by
//                                   marking the field, or with whole_state.
//   error   no-marked-fields        a state lists COMMUTATIVE but marks no
//                                   field.
//   error   unspecified-resolution  (state) lists CONFLICT_RESOLUTION_UNSPECIFIED.
//   error   marker-outside-state    (conflict) on a field of a message that
//                                   is neither a COMMUTATIVE state nor
//                                   reachable from one by descend.
//   error   descend-non-message     descend on a non-message field, a map
//                                   whose values are not messages, or a
//                                   repeated message field without
//                                   element_key.
//   error   bad-element-key         element_key on anything but a repeated
//                                   message field, or naming no singular
//                                   scalar, string, bytes or enum field of
//                                   the element.
//   error   ordered-without-key     ordered without element_key.
//   error   whole-state-combined    whole_state with descend, element_key
//                                   or ordered.
//   error   oneof-member-refined    a oneof member carries descend,
//                                   element_key or ordered, or only some
//                                   members carry whole_state.
//   error   oneof-partially-marked  some but not all members of a oneof
//                                   carry (conflict).
//
// Worked example: hatpick's ListState. hatpick treats a stale edit as safe
// when it touches different items, or the columns versus the settings; the
// markers reproduce exactly that "touched" rule.
//
//   message ListState {
//     option (io.angzarr.v1.state) = {
//       conflict_resolutions: [CONFLICT_RESOLUTION_COMMUTATIVE]
//     };
//     map<string, Item> items = 1 [(io.angzarr.v1.conflict) = {}];  // per item: items[<id>]
//     repeated Column columns = 2 [(io.angzarr.v1.conflict) = {}];  // the whole column list
//     Settings settings = 3 [(io.angzarr.v1.conflict) = {}];        // the whole settings message
//   }
//
// Two stale edits to different items commute (items[a] vs items[b]); two
// edits to one item conflict; a column change conflicts with any other
// column change but not with item or settings edits; a settings change
// conflicts only with another settings change. Finer variants are one
// marker away: {descend: true} on items gives per-field item units
// (items[a].weight), and {element_key: "id", ordered: true} on columns gives
// per-column units plus columns[#order].
message ConflictUnit {
  // Message fields (including map values and keyed list elements): split
  // into the inner message's fields instead of comparing the message whole.
  bool descend = 1;
  // Repeated message fields only: the name of the element field whose value
  // identifies an element, giving one unit per element (`columns[due]`).
  string element_key = 2;
  // With element_key only: the relative order of the elements is state too,
  // reported as the unit `field[#order]`.
  bool ordered = 3;
  // The field conflicts with everything (the wildcard unit), deliberately:
  // marked, so no unmarked-field warning. Exclusive with the fields above.
  bool whole_state = 4;
}

extend google.protobuf.FieldOptions {
  // Marks a field of a COMMUTATIVE state message (or of a message reached
  // from one by descend) as a conflict unit; see the conflict_units region.
  // Unmarked fields of such messages conflict with everything.
  ConflictUnit conflict = 50107;
}
// endregion

// region refusal_status
// The status a refusal code is refused with (decision 14.52). A typed
// refusal with a nested Reason enum (the refusals region, below) is a
// business rejection, fatal (decision 14.37); which of the six business
// statuses it travels as is a property of each code, so it is marked on
// the Reason value:
//   message TableRefused {
//     enum Reason {
//       REASON_UNSPECIFIED = 0;
//       REASON_SEAT_TAKEN = 4;                    // FAILED_PRECONDITION
//       REASON_BET_NOT_EVEN = 17
//         [(io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT];
//     }
//     ...
//   }
// Unset (REFUSAL_STATUS_UNSPECIFIED) is FAILED_PRECONDITION, the default
// for a business rejection. The generated refusal is refused under the
// marked status, and a hand-written handler's helper reads the same
// option, so the two agree. Generation fails when the option is set on a
// value of any enum other than the nested Reason of a message some
// command's refuses names, or on that Reason's zero value.
//
// RefusalStatus holds the business statuses only, so a bug's or a
// retryable status (INTERNAL, UNAVAILABLE, ABORTED, ...) cannot be marked:
// a refusal reaches the issuing policy's Translate, which those never may.
// It is also the type of a handler's refusal status
// (io.angzarr.handler.v1.Refusal.status), so an answer cannot refuse under
// any other. Each value's number is its google.rpc.Code number, so the status
// on the wire is the value's number, read without a table.
enum RefusalStatus {
  // FAILED_PRECONDITION: the default, what unset means.
  REFUSAL_STATUS_UNSPECIFIED = 0;
  REFUSAL_STATUS_INVALID_ARGUMENT = 3;
  REFUSAL_STATUS_NOT_FOUND = 5;
  REFUSAL_STATUS_ALREADY_EXISTS = 6;
  REFUSAL_STATUS_PERMISSION_DENIED = 7;
  REFUSAL_STATUS_FAILED_PRECONDITION = 9;
  REFUSAL_STATUS_OUT_OF_RANGE = 11;
}

extend google.protobuf.EnumValueOptions {
  // On a refusal Reason's value: the status its code is refused with.
  RefusalStatus refusal_status = 50108;
}
// endregion

// region refusals
// Refusals (decision 14.31, amending 2.2; plan ruling 7, "REFUSAL
// WIRING"; PolicyService in policy.proto, Refusals).
//
// The refusing side. A command handler refuses with a business rejection,
// answered in band (io.angzarr.handler.v1.DecideResponse.refused; decision
// 46, Q2) under FAILED_PRECONDITION or the status a Reason value marks (the
// refusal_status region), carrying either a diagnostic code and its args
// (never text; decision 14.37) or a TYPED refusal object of its own domain, named by the command's annotation,
// exactly as emits names its events (the owner's ruling, for
// consistency):
//   message HoldFunds {
//     option (io.angzarr.v1.command) = {
//       component: "examples.v1.WalletState"
//       refuses: "examples.v1.InsufficientFunds"
//     };
//     ...
//   }
// The generated handler returns its events (a list, decision 14.75) or one
// of the refuses types (a typed choice the generator builds in each
// language). The client
// library packs the chosen refusal object, the concrete message, as a
// google.protobuf.Any into the answer's refusal (Refusal.typed), and the
// coordinator hands that refusal on to the policy's Translate unchanged
// (TranslateRequest.refusal). The refusing
// domain records nothing. Generator diagnostics, mirroring emits': a
// refuses type that does not resolve, or that is not a message of the
// command's own domain, fails generation. A command may name several
// refuses types (decision 14.50).
//
// Rejection codes as a typed refusal (decision 14.50). A domain whose
// commands refuse with codes declares them as one typed refusal message
// with a nested Reason enum and one field per argument the codes carry:
//   message TableRefused {
//     enum Reason {
//       REASON_UNSPECIFIED = 0;
//       REASON_ALREADY_BET = 1;
//       ...
//     }
//     Reason reason = 1;
//     optional int32 seat = 2;   // the args, set only where the code names one
//     ...
//   }
// named in each refusing command's refuses. The ErrorInfo.reason on the
// wire is the value's name without the enum's prefix (`ALREADY_BET`), and
// its status the value's (io.angzarr.v1.refusal_status), FAILED_PRECONDITION
// unset (the refusal_status region; decision 14.52). The
// generated refusal's diagnostic key is the generator's, from the
// refusal's full name and the reason, and its args are the message's set
// fields (the reason among them); a public helper of the client library
// reproduces the key, so hand-written code refuses identically.
//
// The policy's side: ONE path (decision 46 #5, amending 14.31, 14.42, 14.73
// and 14.76). When a policy's command is refused, the policy's coordinator
// calls PolicyService.Translate, whose callback,
//     <command>_refused(command, refusal, ctx)
//       -> <a fact of the source domain>, or a Bug,
// reads the refusal and returns a DOMESTIC fact, so the source never refers
// to the foreign protos (the policy already does). The coordinator delivers
// it to the trigger's exact stream. There is no pass-through: no standard
// refusal fact, no source-domain dispatch by the refused command's type,
// and no policy that declines.
//
// A generated policy has the callback for every command of its target
// (decision 14.76, the owner's ruling of 2026-11-02: "all commands must
// declare a refusal path"; "the compensation *must* execute to tell the
// source domain of the business failure"), required in every language the
// generator writes (a missing one does not compile in Rust, and is an
// abstract method of the Python base class); it answers one of its
// source's facts or a Bug, and cannot decline. So generation fails, as does
// lint, for a policy whose target has a command naming no refuses type,
// and for a policy that may send a command whose source takes no fact to
// translate its refusal into. A policy written by hand whose router has no
// callback for a refused command's type answers
// ROUTER_REASON_NO_REFUSAL_HANDLER (decision 46, Q6).
//
// No declaration of what a policy sends ("declaring commands it may send is
// a mistake, period": the owner, 2026-10-28). So the generator holds every
// command of a policy's target to the rule above, sent or not. What the
// generator checks: the refuses diagnostics above, every target command's
// refuses, and its policy's source's facts. angzarr-cli selects no refusal
// mode: there is one (its --translate switch is retired, decision 14.78).
// endregion
