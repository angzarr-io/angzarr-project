syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// ComponentService: how a coordinator learns which component its business
// process is.
//
// One coordinator, one component, one business process. A component is one
// aggregate, one saga, one process manager or one projector, and a
// business process hosts exactly one. (A process manager or projector may
// react to several input domains, and a process manager may take commands
// addressed to its own domain; that is still one component.) A
// component's upcasters are part of it, not components of their own (see
// upcaster.proto).
//
// Every business process serves ComponentService beside its kind service
// (CommandHandlerService, ProcessManagerService, SagaService or
// ProjectorService) and, if its component upcasts, UpcasterService. The
// client library answers Describe from the component's generated
// descriptor; business code never implements it.
//
// The coordinator PULLS the descriptor: it already dials the business
// process for every delivery, and it calls Describe over that same channel.
// The business process never calls its coordinator and needs no
// coordinator address.
//
// Registration. The component is registered with its coordinator while
// the coordinator holds its descriptor from the business process's last
// successful Describe. "Registered", "the registration" and "the registered
// version" elsewhere in these protos mean exactly that.
//   - When: the coordinator calls Describe when it first connects to the
//     business process, and again every time its channel to the business
//     process comes back up after a disconnect. Each successful answer
//     replaces the descriptor the coordinator held, so a business process
//     restarted on a new build is re-described before it is delivered to.
//   - No descriptor, no delivery: the coordinator delivers nothing to its
//     component while it holds no descriptor (no command, fact, trigger or
//     event). Until it holds one, deliveries wait: a synchronous caller is
//     answered UNAVAILABLE (retryable; see the status codes in
//     command_handler.proto), and queued and reaction deliveries stay
//     queued.
//   - Refusal: a descriptor with an empty rules_version (see
//     ComponentDescriptor) is refused. The coordinator does not hold it,
//     delivers nothing, logs an error naming the business process and the
//     component, and raises an alert. It answers the business process
//     nothing (the coordinator is the caller): the refusal is visible as
//     the coordinator's readiness.
//   - Failure: a failed Describe call (the business process unreachable, or
//     an error status) leaves the coordinator holding no descriptor,
//     delivering nothing and NOT_SERVING, until a later Describe on a
//     re-established channel succeeds. Every failed call is logged. An
//     alert is raised only once Describe has kept failing for longer than
//     the coordinator's describe_alert_grace_period (configuration; default
//     2 minutes), so a business process that is merely restarting does not
//     page anyone.
//   - Readiness: the coordinator reports itself SERVING (gRPC health
//     checking, grpc.health.v1, and its readiness probe) only after a
//     successful Describe, and NOT_SERVING while it holds no descriptor.
service ComponentService {
  // Describe the one component this business process is.
  rpc Describe(DescribeRequest) returns (ComponentDescriptor);
}

// Describe takes no arguments.
message DescribeRequest {}
