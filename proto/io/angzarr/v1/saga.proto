syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";
import "google/api/annotations.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// SagaService: stateless translation from source events to commands.
//
// Every emitted command is a Command (never a Fact) whose origin is a
// Causation (see types.proto): it records the event being reacted to. The
// command usually carries no Expectation, so the destination stamps its head
// before business code.
//
// Sagas carry choreographed flows, including their refusals: a target that
// must refuse records the refusal as a domain event, and a saga subscribed
// to that domain translates it into the commands that respond to it. There
// is no compensation channel back to a saga (sagas own no stream). A hard
// rejection of a saga's command is retried when retryable and otherwise
// dead-lettered.
service SagaService {
  // Translate source events into commands for target domains.
  rpc Handle(SagaHandleRequest) returns (SagaResponse);
}

// SagaCoordinatorService: orchestrates saga execution.
// Stamps framework provenance (Causation.component and index) onto the
// emitted commands, delivers them and retries retryable failures.
service SagaCoordinatorService {
  // Execute saga: translate source events → commands, deliver to targets
  rpc Execute(SagaHandleRequest) returns (SagaResponse) {
    option (google.api.http) = {
      post: "/v1/saga/execute"
      body: "*"
    };
  }
}

// Request for saga execution.
// Sagas are pure translators: source events → commands. The request carries
// no destination state or sequences; the destination stamps the head of each
// emitted command that carries no Expectation.
message SagaHandleRequest {
  EventBook source = 1; // Source events that triggered the saga
  SyncMode sync_mode = 2; // Mode the source events were delivered under; no mode waits for sagas
}

// Response from saga - commands for other aggregates
message SagaResponse {
  repeated CommandBook commands = 1; // Commands for other aggregates; each carries a Causation origin
}
