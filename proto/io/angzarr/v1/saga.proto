syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";
import "google/api/annotations.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// SagaService: stateless translation from source events to commands.
//
// Every emitted command is a Command (never a Fact) whose CommandPage.origin
// is a Causation (see types.proto): it records the event being reacted to.
// It carries no Handling (see Handling): the destination always stamps its
// head before business code, conflict resolution never applies, and
// delivery mode (which coordinator RPC delivers it) comes from the saga's
// configuration.
//
// Sagas carry choreographed flows, including their refusals: a target that
// must refuse records the refusal as a domain event, and a saga subscribed
// to that domain translates it into the commands that respond to it. There
// is no compensation channel back to a saga (sagas own no stream). A hard
// rejection of a saga's command is retried when retryable and otherwise
// dead-lettered.
service SagaService {
  // Translate source events into commands for target domains.
  rpc Handle(EventBook) returns (SagaResponse);
}

// SagaCoordinatorService: orchestrates saga execution.
// Stamps framework provenance onto the emitted commands (Causation.component
// and index, and Provenance actor and correlation_id copied from the
// triggering event; see Provenance), records them in the transient outbox
// (see SagaResponse), delivers them and retries retryable failures.
service SagaCoordinatorService {
  // Execute saga: translate source events → commands, deliver to targets.
  // The request is the source EventBook; the saga's configuration, not the
  // request, sets how its commands are delivered.
  rpc Execute(EventBook) returns (SagaResponse) {
    option (google.api.http) = {
      post: "/v1/saga/execute"
      body: "*"
    };
  }
}

// Sagas are pure translators: source events → commands. The request is the
// source EventBook and carries no destination state or sequences.

// Response from saga - commands for other aggregates.
//
// Transient outbox. ALL reactor output (a saga's commands here, and a
// process manager's events and commands) goes through a transient outbox.
// The coordinator stores the output atomically with the reactor's source
// checkpoint (its position past the triggering event), then dispatches it,
// then clears it: once dispatched, only the commands' idempotency keys
// remain. A crash before dispatch completes re-sends the stored output
// verbatim; the reactor is never re-run for a trigger whose output is
// stored, so the keys re-sent are the keys first recorded and the
// destinations deduplicate them. Reactors therefore carry NO purity or
// determinism requirement: one run's output is recorded once and re-sent
// as recorded.
message SagaResponse {
  // Commands for other aggregates; each carries a Causation origin and NO
  // Handling: handling is left unset (or empty). A command that sets any
  // Handling field (expected_sequence or conflict_resolution) is a saga
  // bug, refused loudly: dead-lettered and alerted, never delivered, never
  // silently stripped (see Handling). Provenance is likewise left empty for the
  // coordinator to stamp from the trigger; an actor or correlation_id that
  // differs from the trigger's is refused the same way. Delivery mode comes
  // from the saga's configuration, never from the command.
  repeated CommandBook commands = 1;
}
