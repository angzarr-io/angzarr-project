syntax = "proto3";
package io.angzarr.v1;

import "google/api/annotations.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// SagaService: stateless translation from source events to commands, or
// to facts for a process manager.
//
// A saga translates between exactly two domains: events of its one source
// domain (input_domain) into commands (or facts) for its one destination
// domain (output_domain). One saga per (source domain, destination domain)
// pair: every reaction from one domain's events to another domain is part
// of that pair's single saga, and anything needing several destinations is
// a process manager (see ComponentOptions in options.proto).
//
// Sagas are how a process manager's decisions reach other domains: a PM
// sends no commands (decision 14.31), so it records events carrying the
// data each command needs, and the saga for (the PM's domain, the target
// domain) builds the commands from those events, like any other saga.
// Sagas are also how other domains' events reach a process manager: a PM
// subscribes to nothing and takes facts only, so the saga for (that
// domain, the PM's domain) turns the events the PM must know about into
// facts addressed to it.
//
// What a saga emits depends on its destination (decision 14.31, as the
// owner revised it on 2026-10-28; a change to the saga contract, which
// until then said a saga emits Commands, never Facts):
//   - destination an aggregate's domain: Commands only;
//   - destination a process manager's domain: Facts only, each addressed
//     to the PM instance its trigger's correlation names (cover root = the
//     trigger's correlation_id; types.proto, the command_identity region).
// The generated handler returns the right kind (options.proto,
// ComponentOptions), and the destination refuses the wrong one: a PM's
// coordinator refuses a Command, and an aggregate's refuses a Fact that
// carries a causation_id; either refusal is a saga bug, dead-lettered and
// alerted.
//
// The saga's coordinator stamps each emitted command's or fact's identity:
// CommandPage.causation_id (the event being reacted to) and the trigger's
// correlation_id on both; a command's derived command_id; and a fact's
// reaction origin (fact_origin.external_id "angzarr-reaction:" + the
// reaction name) with the fact id derived from it (types.proto, the
// derived_ids region, Reaction facts). It carries no Handling (see
// Handling): the destination always stamps its head before business code,
// conflict resolution never applies, and delivery mode (which coordinator
// RPC delivers it) comes from the saga's configuration.
//
// Sagas carry choreographed flows, including their refusals: a target that
// must refuse records the refusal as a domain event, and a saga subscribed
// to that domain translates it into the commands (or the facts for a
// process manager) that respond to it. There
// is no compensation channel back to a saga (sagas own no stream). A hard
// rejection of a saga's command is retried when retryable and otherwise
// dead-lettered.
service SagaService {
  // Translate source events into commands for an aggregate's domain, or
  // facts for a process manager's.
  rpc Handle(EventBook) returns (SagaResponse);
}

// SagaCoordinatorService: orchestrates saga execution.
// Stamps each emitted command's or fact's identity: causation_id (the
// triggering event's EventRef) and correlation_id (the trigger's) on both;
// a command's command_id (UUIDv5 of the trigger, the saga's registered
// name and its index in the output; derived_ids region); a fact's
// fact_origin and fact id (the reaction origin; derived_ids region,
// Reaction facts). Records them in the transient outbox (see SagaResponse),
// delivers them through the destination's coordinator
// (CommandHandlerCoordinatorService, served by an aggregate's or a process
// manager's coordinator alike) as a framework component, and retries
// retryable failures.
service SagaCoordinatorService {
  // Execute saga: translate source events → commands, deliver to targets.
  // The request is the source EventBook; the saga's configuration, not the
  // request, sets how its commands are delivered. A trigger entry point:
  // callers authenticated as framework components only; a client is
  // refused PERMISSION_DENIED (see the entry_points region of
  // command_handler.proto).
  rpc Execute(EventBook) returns (SagaResponse) {
    option (google.api.http) = {
      post: "/v1/saga/execute"
      body: "*"
    };
  }
}

// Sagas are pure translators: source events → commands. The request is the
// source EventBook and carries no destination state or sequences.

// Response from saga - commands for other aggregates.
//
// Transient outbox. A saga's commands go through the transient outbox
// (decision 5.6, as amended by 14.31). The outbox is not a saga mechanism:
// it is ONE transactional outbox, a capability that names no component
// kind. Any component whose output leaves its own stream (output that is
// not an append to a stream the component owns) uses it, under the same
// rules. Today the saga is the only such kind, so it is the only user; a
// process manager needs none today, because its only output is its own
// events (see ProcessManagerService, No outbox needed). A kind that later
// emits output leaving its stream uses this outbox, with no new design.
// The rules, for whichever component uses it: the coordinator stores the
// output atomically with the component's source checkpoint (its position
// past the triggering event), then dispatches it, then clears it. A crash
// before dispatch completes re-sends the stored output verbatim; the
// component is never re-run for a trigger whose output is stored, so the
// command ids re-sent are the ones first stamped and the destinations
// deduplicate them. Components using it therefore carry NO purity or
// determinism requirement: one run's output is recorded once and re-sent
// as recorded.
message SagaResponse {
  // The saga's output, all for its one destination: Commands when that is
  // an aggregate's domain, Facts when it is a process manager's (decision
  // 14.31; SagaService). Each carries NO Handling: handling is left unset
  // (or empty). One that sets any Handling field (expected_sequence or
  // conflict_resolution) is a saga bug, refused loudly: dead-lettered and
  // alerted, never delivered, never silently stripped (see Handling).
  // command_id, causation_id, correlation_id and fact_origin are likewise
  // left unset for the coordinator to stamp; a value that differs from the
  // stamp is refused the same way, as is output mixing Commands and Facts.
  // A Fact's cover root names the PM instance, which is its trigger's
  // correlation_id; any other root is refused the same way. One whose
  // cover names a domain other than the
  // saga's one destination (ComponentOptions.output_domain) is a saga bug
  // refused by the client library before it answers: SagaService.Handle
  // fails INTERNAL with no commands, and the coordinator dead-letters the
  // trigger and alerts, as for any terminal failure of a reaction. Delivery
  // mode comes from the saga's configuration, never from the command. The
  // field keeps its name: a Fact rides a CommandBook too.
  repeated CommandBook commands = 1;
}
