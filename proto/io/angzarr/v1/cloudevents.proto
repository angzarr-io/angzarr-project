syntax = "proto3";
package io.angzarr.v1;

import "google/protobuf/any.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// region cloud_event
// CloudEvent represents a single event for external consumption.
//
// Client projectors create these by filtering/transforming internal events.
// Framework fills envelope fields (id, source, time) from Cover/EventPage
// if not explicitly set by the client; time is EventMeta.recorded_at.
//
// The `data` field is a protobuf Any that framework converts to JSON via
// prost-reflect using the descriptor pool. Clients should pack a "public"
// proto message that omits sensitive fields.
//
// Editions. Only main-timeline events reach external sinks (the CloudEvents
// HTTP webhook, Kafka, and any other automation with effects outside
// angzarr). CloudEvents projected from a non-main edition (a what-if; see
// Cover.edition) are never delivered to them, whatever the projector
// returns. A named edition is nevertheless part of the default id and
// source (main, which is unnamed, adds no segment), so a CloudEvent's
// identity can never collide across timelines (e.g. in an edition's own
// internal sinks or logs).
message CloudEvent {
  // Event type (e.g., "com.example.order.created").
  // Default: the original event's fully-qualified message name (the text
  // after the last "/" of its type_url).
  string type = 1;

  // Event payload as proto Any.
  // Framework converts to JSON for CloudEvents output.
  // Client should filter sensitive fields before packing.
  google.protobuf.Any data = 2;

  // Custom extension attributes.
  // Keys should follow CloudEvents naming (lowercase, no dots).
  // Framework adds correlationid automatically when the event's
  // EventMeta.provenance.correlation_id is set (correlation is per page; covers carry
  // none).
  map<string, string> extensions = 3;

  // Optional overrides. Framework uses Cover/EventPage values if not set.
  // Default: {domain}:{root_id}:{sequence} on the main timeline (Cover.edition
  // unset: no edition segment), and {domain}:{edition}:{root_id}:{sequence}
  // on a named edition. The shapes cannot collide: domains, root ids and
  // sequences never contain ':', so a main id has exactly three segments and
  // an edition id at least four.
  optional string id = 4;
  // Default: angzarr/{domain} on the main timeline (no edition segment),
  // and angzarr/{domain}/editions/{edition} on a named edition.
  optional string source = 5;
  optional string subject = 6; // Default: aggregate root ID
}

// CloudEventsResponse is returned by client projectors in Projection.projection.
//
// Framework detects this type by the message name after the last "/" of
// projection.type_url (any prefix is accepted) and routes
// the events to configured sinks (HTTP webhook, Kafka).
//
// Client may return 0 events (skip), 1 event (typical), or N events
// (fan-out scenarios like multi-tenant notifications).
message CloudEventsResponse {
  repeated CloudEvent events = 1;
}
// endregion
