syntax = "proto3";
package io.angzarr.v1;

import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// PolicyService: stateless translation from source events to commands.
//
// A policy translates between exactly two domains: events of its one source
// domain (input_domain) into commands for its one destination domain
// (output_domain). One policy per (source domain, destination domain) pair:
// every reaction from one domain's events to another domain's commands is
// part of that pair's single policy, and anything needing several
// destinations is a process manager (see ComponentOptions in
// options.proto).
//
// The destination may be an aggregate's domain or a process manager's: a
// process manager is a domain (decision 14.31), so a policy's commands reach
// it like any other domain's. Policies are how other domains' events reach a
// process manager (a PM subscribes to nothing), and how a PM's decisions
// reach other domains (a PM sends no commands: it records events carrying
// the data each command needs, and the policy for (the PM's domain, the
// target domain) builds the commands from those events).
//
// Every command a policy's business code emits is a Command (never a Fact).
// Its coordinator stamps CommandPage.causation_id (the event being reacted
// to), the derived command_id and the trigger's correlation_id
// (types.proto, the command_identity region). It carries no Handling (see
// Handling): the destination always stamps its head before business code,
// conflict resolution never applies, and delivery mode (which coordinator
// RPC delivers it) comes from the policy's configuration.
//
// Refusals (decision 2.2, as amended by 14.31; plan ruling 7, "REFUSAL
// WIRING", and the owner's rulings of 2026-10-28). A target, an aggregate
// or a process manager alike, refuses a policy's command the way it refuses
// any command: a business rejection (FAILED_PRECONDITION) carrying either
// a business-specific TYPED refusal object of its own domain (one of the
// command's CommandOptions.refuses types, options.proto; e.g.
// InsufficientFunds { available, requested }) or a diagnostic code and its
// args, never text (decision 14.37), and it records NOTHING. The refusal
// then yields the one unrefusable fact of it for the policy's OWN source:
// the exact stream of its triggering event. The policy's coordinator builds
// and addresses that fact (decision 14.42); the policy's business process
// only translates, when it has a callback for the refused command.
//   - The policy's coordinator calls PolicyService.OnRefused with a Refusal
//     { event, command, response }: the triggering event, the command as
//     sent, and the target's RefusalResponse { refusal | diagnostic },
//     whose refusal is the typed refusal object as an Any (types.proto).
//     It calls it in both modes, because only the policy's business process
//     knows whether it translates that command.
//   - PASS-THROUGH (the default): the business process has no callback for
//     the refused command's type and answers an EMPTY OnRefusedResponse
//     ("no translation"). The coordinator then builds the standard
//     CommandRefused { command, refusal (the typed refusal object, still
//     packed), trigger (the triggering event's EventRef) } (types.proto,
//     the refusal_facts region), addressed to the stream of the triggering
//     event. The source
//     domain's command handler has a generated dispatch by the refused
//     (foreign) command's type,
//       on_refused_<Command>(refusal, state) -> events,
//     where its author writes the reaction and unpacks the typed refusal
//     object; it is an ordinary, infallible fact handler, and the source
//     imports the foreign command's and refusal object's protos.
//   - TRANSLATE: the policy's own callback,
//       on_refused_<Command>(Refusal { event, command, response })
//         -> <a fact type of the source domain>,
//     reads the typed refusal object and returns a DOMESTIC fact, which the
//     business process answers as the fact's payload alone, so the
//     source never refers to the foreign protos (the policy already does).
//     This is WHY translate exists: CommandRefused carries only the
//     foreign object, so a domain that does not want to unpack it, or
//     import the foreign protos, has the policy unpack it there and hand
//     over a domestic fact. Refusal is one struct, so a field can be
//     added later without breaking policy code; no context object rides
//     with the command (considered and deferred, decision 14.31).
//   - The mode is chosen per policy or per policy command by angzarr-cli's
//     refusal switch, at code generation, and nowhere else (no proto
//     option); pass-through is the CLI's default, and selecting translate
//     makes the callback required, so a missing one fails generation (or
//     the build). Nothing about the mode is decided or visible at run
//     time beyond which fact type arrives (options.proto, the refusals
//     region).
//   - Nothing declares which commands a policy sends, or which refusals a
//     domain handles: the source's on_refused_<Command> dispatch is
//     inferred from the handlers it defines. So the generator cannot check
//     that every refusal has a path; one with none (a pass-through
//     CommandRefused whose command type the source has no handler for) is
//     caught at RUN time: answered NO_REFUSAL_HANDLER (decision 14.37:
//     its own key, metadata command_type), dead-lettered and alerted.
// Mechanics, the same in both modes:
//   - The coordinator builds or takes the fact and addresses it (decision
//     14.42). The fact's identity is the REFUSED COMMAND'S: its command_id is the
//     refused command's command_id (no prefix, no derivation), and the
//     coordinator stamps causation_id (the refused command's, the
//     triggering event), the trigger's correlation_id, and
//     fact_origin.external_id = that command_id's canonical text, and
//     addresses it to the exact stream the trigger names (domain, root
//     and edition). One id
//     therefore appears in two streams by design: never applied in the
//     foreign (target) stream, which recorded nothing, and recorded as the
//     refusal fact in the domestic (source) stream. A translated fact
//     carries its payload only: one that sets its cover, Handling or any
//     identity field, has no page, or whose page is not a Fact is a policy
//     bug, and the coordinator refuses it (REFUSAL_FACT_ADDRESSED,
//     REFUSAL_FACT_IDENTIFIED, REFUSAL_FACT_NO_PAGE,
//     REFUSAL_FACT_NOT_A_FACT), dead-lettered and alerted.
//   - Distributed: the coordinator calls OnRefused when the outbox relay
//     receives the refusal, and writes the fact as a new outbox entry in
//     the same transaction that clears the command's entry. A crash before
//     that commit retries the step; deduplication is by the command's id
//     at the target and by the same id at the source, so a retry records
//     nothing twice. annals makes the same calls directly, in the chain.
//   - The fact is unrefusable, so compensation cannot loop.
//   - Only a business rejection reaches OnRefused, and the status decides
//     which is one (decision 14.37; command_handler.proto, status codes):
//     FAILED_PRECONDITION, INVALID_ARGUMENT, NOT_FOUND, ALREADY_EXISTS,
//     OUT_OF_RANGE or PERMISSION_DENIED, and it is never retried. ABORTED
//     (an immediate-return business error: re-read and re-decide) makes
//     the runtime reload and re-run the policy step under the capped
//     backoff, then dead-letter it and alert. A fatal bug (INTERNAL,
//     UNKNOWN, DATA_LOSS) is dead-lettered and alerted at once; any other
//     failure is a retryable bug, retried with exponential backoff and
//     jitter up to a configured cap, then dead-lettered and alerted. Past
//     the cap, or on a fatal bug, the policy's position follows its bug
//     setting (on_policy_bug).
//   - Owner's rulings (decision 14.31): a refusal with no path is
//     dead-lettered for a human and alerted; a translating callback that
//     FAILS (an error status, or a malformed fact) is a policy bug,
//     dead-lettered and alerted; a fact whose handler fails at the source
//     is dead-lettered and alerted there.
//   - This is the one exception to "a policy never delivers a fact": a
//     policy's business code emits Commands only, and the one fact each
//     refusal yields goes only to its own source domain.
service PolicyService {
  // Translate source events into commands for the destination domain (an
  // aggregate's or a process manager's).
  rpc Handle(EventBook) returns (PolicyResponse);

  // One refusal of the policy's command (Refusals, above): the translated
  // fact, or no translation. Called by the policy's coordinator only, for
  // every business rejection of one of its commands. The business process
  // runs the translating callback for the refused command's type and
  // answers its fact (payload only), or answers an empty response when it
  // has none; the coordinator then builds the pass-through CommandRefused
  // (decision 14.42). An error status, or a fact the coordinator refuses as
  // malformed, is a policy bug (dead-lettered and alerted).
  rpc OnRefused(Refusal) returns (OnRefusedResponse);
}

// PolicyCoordinatorService: orchestrates policy execution.
// Checks every emitted command (see PolicyResponse; decision 14.42), stamps
// its edition when unset, and stamps its identity: causation_id (the
// triggering event's EventRef: the page its PolicyReaction names),
// command_id (UUIDv5 of the trigger, the policy's registered name and the
// command's index within its reaction; derived_ids region) and
// correlation_id (the trigger's). Records them in the
// transient outbox (see PolicyResponse), delivers them through the
// destination's coordinator (CommandHandlerCoordinatorService) as a
// framework component, and retries retryable failures. On a business
// rejection it calls PolicyService.OnRefused and delivers the refusal fact
// it answers, through the outbox, to the policy's own source domain
// (PolicyService, Refusals).
service PolicyCoordinatorService {
  // Execute policy: translate source events → commands, deliver to targets.
  // The request is the source EventBook; the policy's configuration, not the
  // request, sets how its commands are delivered. A trigger entry point:
  // callers authenticated as framework components only; a client is
  // refused PERMISSION_DENIED (see the entry_points region of
  // command_handler.proto).
  rpc Execute(EventBook) returns (PolicyResponse) {
    option (google.api.http) = {
      post: "/v1/policy/execute"
      body: "*"
    };
  }
}

// Policies are pure translators: source events → commands. The request is the
// source EventBook and carries no destination state or sequences.

// Response from policy - commands for other aggregates.
//
// Transient outbox. A policy's commands, and its refusal facts, go through
// the transient outbox
// (decision 5.6, as amended by 14.31). The outbox is not a policy mechanism:
// it is ONE transactional outbox, a capability that names no component
// kind. Any component whose output leaves its own stream (output that is
// not an append to a stream the component owns) uses it, under the same
// rules. Today the policy is the only such kind, so it is the only user; a
// process manager needs none today, because its only output is its own
// events (a PM is a domain; see process_manager.proto). A kind that later
// emits output leaving its stream uses this outbox, with no new design.
// The rules, for whichever component uses it: the coordinator stores the
// output atomically with the component's source checkpoint (its position
// past the triggering event), then dispatches it, then clears it. A crash
// before dispatch completes re-sends the stored output verbatim; the
// component is never re-run for a trigger whose output is stored, so the
// command ids re-sent are the ones first stamped and the destinations
// deduplicate them. Components using it therefore carry NO purity or
// determinism requirement: one run's output is recorded once and re-sent
// as recorded. A
// refusal fact is put into the outbox, as a new entry, in the same
// transaction that clears its refused command's entry (PolicyService,
// Refusals), and dispatched and retried the same way.
message PolicyResponse {
  // One reaction per source page whose event type the policy handles, in
  // page order: the commands business code returned for that page, as it
  // returned them (decision 14.42). The business process checks nothing
  // and stamps nothing; the policy's coordinator does, per command:
  //   - destination: its cover's domain must be the policy's one
  //     destination (ComponentDescriptor.output_domain); otherwise
  //     POLICY_COMMAND_OUTSIDE_DESTINATION (metadata expected_domain,
  //     actual_domain);
  //   - edition: unset, or the trigger's; unset is stamped with the
  //     trigger's (a policy stays in its trigger's edition), and any other
  //     is POLICY_COMMAND_OUTSIDE_EDITION (expected_edition,
  //     actual_edition);
  //   - root: named (cover.root), for every target, an aggregate's or a
  //     process manager's alike: nothing fills one in; otherwise
  //     POLICY_COMMAND_NO_ROOT (domain, command_type);
  //   - correlation: unset or exactly the trigger's; another is
  //     POLICY_COMMAND_OTHER_CORRELATION (domain, command_type);
  //   - no Handling (expected_sequence or conflict_resolution), no
  //     command_id or causation_id that differs from the stamp, no Fact
  //     and no fact_origin: a policy's business code emits Commands only,
  //     and its refusal facts come from OnRefused (PolicyService, Refusals).
  // Any failed check is a policy bug: the whole answer is refused INTERNAL,
  // nothing is delivered, and the trigger is dead-lettered and alerted
  // (decisions 14.24, 14.36). Delivery mode comes from the policy's
  // configuration, never from the command.
  repeated PolicyReaction reactions = 2;
}

// What a policy's business code returned for one source page.
message PolicyReaction {
  // The sequence of the triggering page in the source book (its
  // EventPage.sequence): the event the commands react to, which the
  // coordinator stamps as each command's causation_id.
  uint64 trigger_sequence = 1;
  // The commands, in the order business code returned them; their index
  // here is the index in the reaction's output (derived_ids region).
  repeated CommandBook commands = 2;
}

// The input to PolicyService.OnRefused, and the one argument of a
// translating callback (PolicyService, Refusals): the three things a
// stateless policy needs. One struct, so a field (a context object, say;
// considered and deferred by decision 14.31) can be added later without
// breaking policy code.
message Refusal {
  // The triggering event: a book of the source stream holding the one
  // event the policy reacted to (the refused command's causation_id).
  EventBook event = 1;
  // The refused command, as it was delivered (identity stamped).
  CommandBook command = 2;
  // The target's refusal response, with its typed refusal object
  // (types.proto).
  RefusalResponse response = 3;
}

// OnRefused's answer: the translated fact, or no translation.
message OnRefusedResponse {
  // Translate: a CommandBook whose page body is a Fact holding only the
  // domestic fact's payload, its cover, Handling and identity left empty;
  // the coordinator addresses it to the trigger's stream and stamps its
  // identity (PolicyService, Refusals). Unset: no translation; the
  // coordinator builds the pass-through CommandRefused itself (decision
  // 14.42).
  CommandBook fact = 1;
}
