syntax = "proto3";
package io.angzarr.v1;

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// Process managers (decision 14.31): A PROCESS MANAGER IS A DOMAIN.
//
// This file defines no service and no message. A process manager is
// served exactly as an aggregate is: its business process implements
// CommandHandlerService (command_handler.proto), its coordinator serves
// CommandHandlerCoordinatorService for the PM's domain, and it is
// described by ComponentService with kind PROCESS_MANAGER. The PM-specific
// ProcessManagerService, ProcessManagerCoordinatorService and their
// request and response messages are deleted, unreserved (policy 6.6). What
// sets a PM apart from an aggregate is written here, and nothing else.
//
// WARNING: Only use when saga + queries is insufficient. Consider:
// - Can a simple saga + destination queries solve this?
// - Is the "state" you want to track already derivable from existing aggregates?
// - Are you adding Process Manager because the workflow is genuinely complex?
//
// Process Manager is warranted when:
// - Workflow state is NOT derivable from aggregates (PM owns unique state)
// - You need to query workflow status independently ("show all pending fulfillments")
// - Timeout/scheduling logic is complex enough to merit its own aggregate
// - The workflow gathers what happened in SEVERAL domains (each reaches
//   the PM as commands, through a saga from that domain)
// - You must track the replies to the steps you start (see below)
//
// Inputs. Like any domain, a PM takes:
//   - COMMANDS, which it may refuse (a business rejection, recording
//     nothing). Most come from sagas: a PM subscribes to no domain and has
//     no triggers, so the saga for (another domain, the PM's domain) turns
//     that domain's events into commands to the PM. A client may also
//     command it (an operator's cancel, say).
//   - FACTS, which it never refuses: timeouts, webhooks, other external
//     inputs, and the refusal facts that the sagas whose source is the
//     PM's domain deliver when their commands are refused (SagaService in
//     saga.proto, Refusals): the standard CommandRefused, handled by a
//     generated on_refused_<Command> (ComponentOptions.refusals), or a
//     domestic fact a saga translates the refusal into.
// Its (command) entries name both (options.proto); the handler
// registration says which is a command and which a fact, as for an
// aggregate.
//
// Outputs. A PM's only output is its own events, on its own stream (ruling
// P1): it sends NO commands and no facts. To act on another domain it
// records an event carrying the data that domain's command needs, and the
// saga for (the PM's domain, that domain) builds the command. Its events
// are ordinary stored events, published like an aggregate's.
//
// Stream. A PM instance's stream is (the PM's domain, an edition, the
// instance's correlation_id): domain is the one the PM owns
// (ComponentOptions.domain), the edition is the input's cover's (a saga's
// command carries its trigger's edition; see Cover.edition), and the root
// IS the instance's correlation_id, unchanged (decision 14.30, as amended
// by 14.31). There is no derivation (no hash, no UUIDv5) and no text
// fallback: a correlation_id is always a 16-byte UUID (decision 9.1), so
// it is a valid root as it stands. A command or fact addressed to a PM
// names the instance in its cover (domain = the PM's, root = the
// instance's correlation_id), and its correlation_id must agree: one that
// is unset is given its cover's root, and one that is set and differs from
// its cover's root is malformed (INVALID_ARGUMENT to a client; a saga's
// command is dead-lettered and alerted as a saga bug). A saga addressing a
// PM therefore names the instance its trigger's correlation names. This
// is the one pipeline rule a PM's coordinator adds to an aggregate's.
//
// Starting an instance (ruling B1, adapted; decision 14.31). A PM instance
// exists once its stream holds an event (in the input's edition, as read
// there). An input for a correlation with no instance starts one only if
// the PM declares its type as STARTING ((command) entry with starts set,
// options.proto; advertised to the coordinator as
// ComponentDescriptor.starting_types). It is then delivered with an empty
// state. Any other input for a correlation with no instance is not
// delivered; the coordinator decides, before the handler, by its type URL
// after upcasting (decision 14.25):
//   - a FACT is skipped, silently: nothing is recorded, dead-lettered or
//     alerted, and the sender is answered OK, APPLIED, with no events;
//   - a COMMAND is refused (owner's ruling; decision 14.31):
//     FAILED_PRECONDITION, with a google.rpc.ErrorInfo of reason
//     PM_NO_INSTANCE, recording nothing, as any business rejection. A
//     saga's refused command then yields its refusal fact to the saga's
//     source, which decides what an unstarted process means for it. The
//     alternative, a silent skip answered APPLIED with no events, would
//     tell the sender a command took effect that did not.
// An input for a correlation whose instance exists is delivered whatever
// its type. A PM should declare as starting every input that can arrive
// first: inputs from different domains arrive in no guaranteed order.
//
// Replies and refusals. A PM tracks the replies to the steps it starts:
// its event carries the instance's correlation_id, so the saga's command
// built from it carries that correlation, so the target's events carry it
// too, and the saga from the target's domain to the PM's domain turns the
// replies the PM needs into commands to the instance that correlation
// names. A target that REFUSES the saga's command records nothing; the
// saga delivers a refusal fact to the PM (the saga's source domain), and
// the PM's fact handler decides the next step
// (decision 2.2, as amended by 14.31; SagaService in saga.proto,
// Refusals). There is no compensation or notification channel.
//
// Handlers. A PM's handlers follow the aggregate's: a command handler may
// refuse; a fact handler is infallible, and a failing one is a bug (the
// fact is dead-lettered and alerted, its sender answered PARKED). A PM
// command handler that fails with anything but a business rejection is a
// bug too: the command is dead-lettered and alerted. The client library
// gives every PM handler one context type, carrying the input's identity
// (its command_id, its fact_origin for a fact, and its correlation_id, the
// instance's root), which is exactly the cause the coordinator stamps on
// the events the handler writes.
//
// Deduplication is the coordinator's job, never the handler's, as for any
// domain: by command_id (a fact's derived from its fact_origin), on the
// PM's stream, before the handler runs (types.proto, the command_identity
// region). There is no trigger, no trigger EventRef and no find_triggered
// lookup.
//
// No outbox needed. A PM's whole output is its own events, appended to its
// own stream like any domain's, and it consumes no stream, so it has no
// checkpoint. The outbox is one capability for any component whose output
// leaves its own stream (see SagaResponse in saga.proto, Transient
// outbox); a PM would use that same outbox if it ever emitted such output.
