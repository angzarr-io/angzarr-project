syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";
import "google/api/annotations.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// ProcessManagerService: stateful coordinator for long-running workflows across multiple aggregates.
//
// WARNING: Only use when saga + queries is insufficient. Consider:
// - Can a simple saga + destination queries solve this?
// - Is the "state" you want to track already derivable from existing aggregates?
// - Are you adding Process Manager because the workflow is genuinely complex?
//
// Process Manager is warranted when:
// - Workflow state is NOT derivable from aggregates (PM owns unique state)
// - You need to query workflow status independently ("show all pending fulfillments")
// - Timeout/scheduling logic is complex enough to merit its own aggregate
// - You must react to events from MULTIPLE domains (saga recommends single domain)
// - You must handle the replies to the commands you issue (see below)
//
// Process Manager IS an aggregate with its own domain, events, and state.
// It reuses all aggregate infrastructure (EventStore, SnapshotStore, AggregateCoordinator).
//
// Replies. A PM handles the replies to its own commands: a target's
// answer, including a refusal recorded as a domain event, reaches the PM as
// a trigger, and the PM decides the next step in its own workflow state.
// Replies route to the PM instance by correlation: a PM's commands carry the
// trigger's correlation_id (stamped by the coordinator; see Provenance), so
// the target's events carry it too, and the PM subscribed to that domain
// receives them under the same correlation. Causation always names the
// triggering event: a PM command's Causation.event is the trigger it reacted
// to, never one of the PM's own process events, and a reply event's causation
// names the PM's command's trigger in turn. There is no compensation or
// notification channel. A hard rejection of a PM's command is retried when
// retryable and otherwise dead-lettered.
//
// Transient outbox. Everything a PM returns (process_events and commands)
// goes through the transient outbox described on SagaResponse: stored
// atomically with the PM's source checkpoint (here, with the append of its
// process_events), dispatched, then cleared, leaving only the commands'
// idempotency keys. Redelivery re-sends the stored commands verbatim, so the
// PM is never re-run for a trigger whose output is stored and need not be
// pure or deterministic. The destination deduplicates on the Causation
// tuple.
service ProcessManagerService {
  // Handle with trigger + process state. Returns commands for other
  // aggregates and events for the PM's own domain.
  //
  // PMs do not rebuild destination aggregate state — they translate
  // events into commands. Emitted commands are Commands (never Facts) whose
  // origin is a Causation naming the trigger, exactly as saga commands are
  // (see Causation in types.proto).
  rpc Handle(ProcessManagerHandleRequest) returns (ProcessManagerHandleResponse);
}

// ProcessManagerCoordinatorService: orchestrates PM execution
service ProcessManagerCoordinatorService {
  // Full orchestration: persist process events, then deliver commands
  // through the outbox.
  // The request is the triggering EventBook; the PM's configuration, not
  // the request, sets how its commands are delivered.
  rpc Handle(EventBook) returns (ProcessManagerHandleResponse) {
    option (google.api.http) = {
      post: "/v1/pm/handle"
      body: "*"
    };
  }
}

// PM handle request: full context for PM decision. It carries no destination
// state or sequences; the destination stamps the head of every emitted
// command.
message ProcessManagerHandleRequest {
  // Full state of triggering domain.
  EventBook trigger = 1;
  // Current process manager state (event-sourced).
  EventBook process_state = 2;
}

// PM handle response: local events, then remote commands.
// Execution order: process_events persisted first, then commands sent.
message ProcessManagerHandleResponse {
  // Local: Events for the process manager's own domain (non-duplicative workflow state).
  // These are persisted via AggregateCoordinator to the PM's domain.
  // Each book is merged by the coordinator, which owns the cover and page
  // concatenation policy; a PM that emits a single book sends a 1-element list.
  // Business output only: payloads (and an optional snapshot state). Page
  // meta, sequences and a cover other than the PM's own stream are refused,
  // as for an aggregate (see CommandHandlerService.Handle).
  repeated EventBook process_events = 1;
  // Remote: Commands to issue to other aggregates, delivered through the
  // outbox (see ProcessManagerService) under the PM's configured delivery
  // mode (which coordinator RPC delivers it); the command never chooses it.
  // Each carries NO Handling: handling is left unset (or empty). A command
  // that sets any Handling field (expected_sequence or merge) is a PM bug,
  // refused loudly: dead-lettered and alerted, never delivered, never
  // silently stripped (see Handling). Provenance is left empty for the
  // coordinator to stamp from the trigger (actor and correlation_id); a
  // differing value is refused the same way.
  repeated CommandBook commands = 2;
}
