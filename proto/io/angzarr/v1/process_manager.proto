syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";
import "google/api/annotations.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// ProcessManagerService: stateful coordinator for long-running workflows across multiple aggregates.
//
// WARNING: Only use when saga + queries is insufficient. Consider:
// - Can a simple saga + destination queries solve this?
// - Is the "state" you want to track already derivable from existing aggregates?
// - Are you adding Process Manager because the workflow is genuinely complex?
//
// Process Manager is warranted when:
// - Workflow state is NOT derivable from aggregates (PM owns unique state)
// - You need to query workflow status independently ("show all pending fulfillments")
// - Timeout/scheduling logic is complex enough to merit its own aggregate
// - You must react to events from MULTIPLE domains (saga recommends single domain)
//
// Process Manager IS an aggregate with its own domain, events, and state.
// It reuses all aggregate infrastructure (EventStore, SnapshotStore, AggregateCoordinator).
service ProcessManagerService {
  // Handle with trigger + process state. Returns commands for other
  // aggregates and events for the PM's own domain.
  //
  // PMs do not rebuild destination aggregate state — they translate
  // events into commands/facts. Emitted commands carry
  // PageHeader.angzarr_deferred exactly as saga commands do (see
  // AngzarrDeferredSequence in types.proto).
  rpc Handle(ProcessManagerHandleRequest) returns (ProcessManagerHandleResponse);
}

// ProcessManagerCoordinatorService: orchestrates PM execution
service ProcessManagerCoordinatorService {
  // Full orchestration with sync mode.
  // Used by CASCADE mode to call PMs synchronously.
  rpc Handle(ProcessManagerCoordinatorRequest) returns (ProcessManagerHandleResponse) {
    option (google.api.http) = {
      post: "/v1/pm/handle"
      body: "*"
    };
  }

  // Speculative execution - returns commands and events without persisting
  rpc HandleSpeculative(SpeculatePmRequest) returns (ProcessManagerHandleResponse) {
    option (google.api.http) = {
      post: "/v1/pm/speculative"
      body: "*"
    };
  }
}

// Request for PM coordinator orchestration.
// Used by CASCADE mode to invoke PM synchronously.
message ProcessManagerCoordinatorRequest {
  EventBook trigger = 1; // Triggering events
  SyncMode sync_mode = 2; // Propagate for CASCADE recursion
  CascadeErrorMode cascade_error_mode = 3; // How to handle errors in CASCADE mode
}

// Request for speculative PM execution.
message SpeculatePmRequest {
  ProcessManagerHandleRequest request = 1;
}

// PM handle request: full context for PM decision. It carries no destination
// state or sequences; emitted commands are deferred and the destination
// appends them at its head.
message ProcessManagerHandleRequest {
  // Full state of triggering domain.
  EventBook trigger = 1;
  // Current process manager state (event-sourced).
  EventBook process_state = 2;
  reserved 3;
  reserved "destination_sequences";
}

// PM handle response: local events, then remote commands and facts.
// Execution order: process_events persisted first, then commands sent, then facts injected.
message ProcessManagerHandleResponse {
  // Local: Events for the process manager's own domain (non-duplicative workflow state).
  // These are persisted via AggregateCoordinator to the PM's domain.
  // Each book is merged by the coordinator, which owns the cover and page
  // concatenation policy; a PM that emits a single book sends a 1-element list.
  repeated EventBook process_events = 1;
  // Remote: Commands to issue to other aggregates.
  repeated CommandBook commands = 2;
  // Remote: Facts to inject to other aggregates.
  // Each EventBook targets a specific aggregate via its Cover.
  repeated EventBook facts = 3;
  // Forward escalation notification upstream. Mirrors the rejection
  // notification on BusinessResponse (command_handler.proto); carries a
  // PM's escalation when a rejection cannot be compensated locally.
  Notification notification = 4;
}
