syntax = "proto3";

package io.angzarr.v1.meta;

import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Meta";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1/meta;angzarrmeta";
option java_multiple_files = true;
option java_package = "io.angzarr.meta";
option ruby_package = "Angzarr::Meta";

// ============================================================================
// Framework meta-events
// ============================================================================
//
// The reserved namespace for FRAMEWORK META-EVENTS (decision 14.32, the
// owner's ruling of 2026-10-28). A meta-event is a real event, appended to
// a stream and stamped like any other (a framework-derived command_id of
// its own, never that of the command whose arrival made it), but it is the
// framework's, not a domain's:
// - Stores and coordinators MAY recognise a meta-event by its type URL
//   (/io.angzarr.v1.meta.<Name>) and act on it (a store reads an edition
//   stream through its EditionCreated; a coordinator removes a stream's
//   edition rows once its EditionDeleted has propagated).
// - Business handlers NEVER see one: the client library hands no applier,
//   policy, process manager or projector handler a meta-event.
// - It travels on the same data flow as any event: a policy's step that
//   reacts to an event in edition X carries X's meta-events onward to the
//   streams it reaches (angzarr automates this; annals does it in its
//   in-process chain of committed steps).
// Only meta-events something needs are defined here.

// region edition_meta_events
// An edition's creation, per stream (decisions 14.32 and 14.36;
// Cover.edition). The first event of X's version of a stream (D, X, R),
// appended at the sequence it states (its FORK SEQUENCE, parent_sequence):
// (D, X, R) reads main's events below it, then X's own. A store accepts any
// stated sequence at or below main's head for that stream (the sequence
// main's version would use next) and refuses one above it as a conflict;
// it never moves a fork to the head. The fork point is per stream: no
// cross-stream snapshot is promised.
//
// Propagation: the creation TRAVELS WITH THE DATA. A policy's command in X
// that reaches a stream with no EditionCreated in X is the propagation: the
// angzarr system layer (shared; called by the stream's coordinator, or by
// annals' kernel) reads that one stream's main head and appends
// EditionCreated at it, recording it as parent_sequence (policies never
// handle sequences; if main appends in between, the fork still lands where
// it says), with propagated_from
// = the EditionCreated of the stream the policy reacted to and forked_by =
// the arriving command's command_id, and then hands the command to the
// router as an ordinary command in X. This is the system layer's: the router
// never sees an EditionCreated. An arrival in an edition that is deleted,
// or being deleted, is refused NOT_FOUND, ErrorInfo reason
// EDITION_NOT_FOUND, before the router is called.
// Concurrent arrivals race on the append like any two writes; the loser
// finds the stream created and appends no second one. Only an origin
// creation (ForkStream) brings a deleted edition's name back.
message EditionCreated {
  // The edition (also the stream's Cover.edition, repeated so the payload
  // describes itself). Required, non-empty.
  string edition = 1;
  // The fork sequence, as stated: equal to this event's own
  // EventPage.sequence, at or below main's head for this stream (decision
  // 14.36). On arrival, the main head the system layer read; for an origin,
  // the sequence ForkStream was asked for, or the head it read.
  uint64 parent_sequence = 2;
  // For a creation made by a policy command's arrival: the EditionCreated of
  // the stream the policy reacted to. Unset for an origin (ForkStream).
  io.angzarr.v1.EventRef propagated_from = 4;
  // For a creation made by a policy command's arrival: that command's
  // command_id. Unset for an origin.
  io.angzarr.v1.UUID forked_by = 5;
}

// An edition's deletion, per stream (decision 14.32, the owner's rulings of
// 2026-10-28: "delete edition / EditionDeleted needs to be an EVENT, to
// propagate via policies to other domains"; "it needs to exist in its
// domains"). Per stream (D, X, R), in this order:
// 1. RECORDED: DeleteEdition appends EditionDeleted to X's origin streams;
//    each other stream the deletion reaches records its own, in its own
//    domain, in sequence after its earlier work.
// 2. PROPAGATED: the system layer carries it onward along the streams that
//    domain's policies reached in X, writing each one's own EditionDeleted
//    (never as a policy's command: no policy sees it).
// 3. REMOVED: only after it has propagated onward (the system layer's onward
//    writes and outbox entries for it have completed), the stream's rows
//    tagged X are removed, this event included. Nothing remains.
// Who owns it (decision 14.32, amended): the ANGZARR SYSTEM LAYER, the
// shared system code both runtimes call around the router, never the
// router, which sees no meta-event. It writes EditionDeleted in X's origin stream(s),
// then propagates it along the streams its policies reached in X, as its
// own write in each; a stream with nothing of X left is skipped, and
// nothing is created or forked there. It is not carried as a policy
// command. A meta-event payload arriving from outside the system layer is
// refused INVALID_ARGUMENT, google.rpc.ErrorInfo reason
// META_EVENT_FROM_OUTSIDE, writing nothing.
//
// Main is never written. A stream in X that the deletion cannot reach
// through the policy flows keeps its rows and stays visible in ListEditions.
// After deletion, a later arrival in X (a policy command, or a step's
// position on a removed stream) is REFUSED NOT_FOUND: X does not exist,
// and the arrival re-creates neither the stream nor the edition. X is
// known to be deleted, or being deleted, while any stream of it holds an
// EditionDeleted, and not to exist once no EditionCreated of it remains.
message EditionDeleted {
  // The edition. Required, non-empty.
  string edition = 1;
  // For a deletion carried by a policy command's arrival: the EditionDeleted
  // of the stream the policy reacted to. Unset at an origin.
  io.angzarr.v1.EventRef propagated_from = 3;
  // For a deletion carried by a policy command's arrival: that command's
  // command_id. Unset at an origin.
  io.angzarr.v1.UUID deleted_by = 4;
}
// endregion
