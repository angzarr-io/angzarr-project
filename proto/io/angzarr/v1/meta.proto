syntax = "proto3";
package io.angzarr.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// ============================================================================
// Edition administration
// ============================================================================
//
// Editions are PER-STREAM FORKS (decision 14.32, the owner's ruling of
// 2026-10-28; Cover.edition and EditionForked in types.proto). There is no
// edition registry and no separate metadata store: an edition exists
// exactly as far as its fork events do. Creating edition X forks an origin
// stream: it appends an EditionForked event to (D, X, R). The fork then
// travels with the data: each saga command in X that reaches a stream with
// no fork in X forks it on arrival (types.proto, EditionForked). Listing
// editions is a query over X's own fork events; deleting one removes every
// row tagged with it, once its in-flight work is done. Everything of an
// edition's
// lifecycle lives in the edition's own streams and store: main knows
// nothing of it.
//
// These operations are authorised as operator actions from the call's
// credentials, and who performed one goes to the deployment's security log,
// never into the data (types.proto, security_logs region). ForkStream
// writes an event (the fork) to an edition stream only, and DeleteEdition
// removes the edition's rows; nothing here writes to, records in or
// indexes against main, and
// main can be neither forked into nor deleted.

// region edition_admin
// EditionAdminService: forks origin streams into editions, lists editions,
// and deletes them (see Cover.edition in types.proto).
service EditionAdminService {
  // Fork one origin stream into an edition: append EditionForked to (the
  // stream's domain, edition, root), creating the edition if no fork event
  // of it exists yet. From there the fork travels with the data
  // (types.proto, EditionForked). Forking more origin streams into an
  // existing edition is allowed, and is how a stream that saga commands
  // have not reached is addressed from outside. Answers the fork event's
  // EventRef.
  //   INVALID_ARGUMENT     edition is empty or unset (main is unnamed and
  //                        cannot be forked into), or the cover names no
  //                        domain or root;
  //   ALREADY_EXISTS       the stream is already forked in this edition;
  //   FAILED_PRECONDITION  commit_position is set, but the deployment's
  //                        stores keep no global commit position, or the
  //                        edition's existing forks use another point (an
  //                        edition is either per-stream or time-based).
  rpc ForkStream(ForkStreamRequest) returns (EventRef) {
    option (google.api.http) = {
      post: "/v1/admin/editions/{stream.edition}/forks"
      body: "*"
    };
  }
  // List the editions: a query over the edition stores' fork events (no
  // record is kept anywhere else, and main is never read for it).
  rpc ListEditions(ListEditionsRequest) returns (ListEditionsResponse) {
    option (google.api.http) = {get: "/v1/admin/editions"};
  }
  // Delete an edition: sequenced after the edition's in-flight work (its
  // work below the edition's commit position at the call), then remove
  // every row tagged with it from its store(s): events, fork events,
  // snapshots, projector output, outbox entries and positions. Nothing
  // remains, and the edition is unknown afterwards (types.proto, the
  // editions region, Deletion). Answers once the deletion is sequenced;
  // it then completes in order. A deletion that genuinely fails is
  // dead-lettered and alerted. Main is never touched.
  //   INVALID_ARGUMENT  name is empty (a name is required; main is unnamed
  //                     and can never be deleted);
  //   NOT_FOUND         the edition is unknown (no stream of it is forked
  //                     and not yet deleted).
  rpc DeleteEdition(DeleteEditionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/admin/editions/{name}"};
  }
}

message ForkStreamRequest {
  // The origin stream, named in the edition to create or extend: domain,
  // root, and edition (required, non-empty). Its main version is forked.
  Cover stream = 1;
  // The TIME-BASED OPTION (decision 14.32; EA-3's former whole-system
  // behaviour and the 2026-10-27 commit-order ruling, kept as an option):
  // fork at this global commit position, so every stream the edition
  // forks, at the origin or on a saga command's arrival, diverges at the
  // same moment, for a consistent snapshot. Unset (0), the default: a
  // per-stream fork at the origin stream's head, and each stream a saga
  // command reaches at its own head when it arrives.
  uint64 commit_position = 2;
}

message ListEditionsRequest {}

message ListEditionsResponse {
  repeated EditionSummary editions = 1;
}

// One edition, as the fork events show it. Derived on each call; never
// stored.
message EditionSummary {
  string name = 1; // Always non-empty (main is not an edition)
  // The origin forks: the EditionForked events with no propagated_from.
  repeated EventRef origins = 2;
  uint64 forked_streams = 3; // How many streams hold a fork event of it
  uint64 commit_position = 4; // The time-based option's point; 0 if per-stream
}

message DeleteEditionRequest {
  string name = 1; // The edition name: required, non-empty
}
// endregion
