syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";


// ============================================================================
// Edition administration
// ============================================================================
//
// Editions are PER-STREAM FORKS (decision 14.32, the owner's ruling of
// 2026-10-28; Cover.edition in types.proto, and the meta-events
// EditionCreated and EditionDeleted in meta/events.proto). There is no
// edition registry and no separate metadata store: an edition exists
// exactly as far as its fork events do. Creating edition X forks an origin
// stream: it appends an EditionCreated meta-event to (D, X, R). It then
// travels with the data: each policy command in X that reaches a stream with
// no fork in X forks it on arrival (meta.EditionCreated). Listing
// editions is a query over X's own creation events. Deleting one is an
// event too: EditionDeleted is recorded in X's origin streams, and the
// angzarr system layer (shared system code in angzarr-core, called by
// core's coordinator and the angzarr-embedded kernel; never the router,
// which sees no meta-event) propagates it along
// the streams X's policies reached; each stream's rows of X are removed
// only after its EditionDeleted has propagated onward.
// Everything of an edition's lifecycle lives in the edition's own streams
// and store: main knows nothing of it.
//
// These operations are authorised as operator actions from the call's
// credentials, and who performed one goes to the deployment's security log,
// never into the data (types.proto, security_logs region). ForkStream
// and DeleteEdition write meta-events to edition streams only; nothing
// here writes to, records in or
// indexes against main, and
// main can be neither forked into nor deleted.

// The administration RPCs (EditionAdminService) and their requests are the
// distributed transport's (io/angzarr/transport/distributed/v1/meta.proto);
// an edition's summary is core's, since every store lists editions
// (decision 14.64).

// One edition, as the fork events show it. Derived on each call; never
// stored.
message EditionSummary {
  string name = 1; // Always non-empty (main is not an edition)
  // The origin forks: the EditionCreated events with no propagated_from.
  repeated EventRef origins = 2;
  uint64 forked_streams = 3; // How many streams hold a fork event of it
}
