syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// ============================================================================
// Meta Domain (_angzarr) - Infrastructure commands/events
// ============================================================================

// Delete all events for an edition+domain combination.
// Restricted to non-main editions: a request whose edition is "" (the main
// timeline; see Edition in types.proto) is rejected and deletes nothing.
message DeleteEditionEvents {
  string edition = 1; // Edition name to delete from
  string domain = 2; // Domain to delete from
}
