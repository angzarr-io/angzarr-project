syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";


// ============================================================================
// Edition administration
// ============================================================================
//
// Editions are PER-STREAM FORKS (decision 14.32; Cover.edition in
// types.proto, the meta-event EditionCreated in its meta_events region;
// docs/design/edition-meta-events.md). There is no edition registry and no
// separate metadata store: an edition exists exactly as far as its fork
// events do. Every stream of edition X is forked explicitly, by ForkStream,
// which appends an EditionCreated to (D, X, R); an input in X to a stream
// with no fork is refused ANGZARR_REASON_EDITION_NOT_FORKED (decision
// 14.107, DRAFT: no automatic propagation). Listing editions is a query
// over X's creation events, and deleting one enumerates its streams by them
// and removes each stream's rows. Everything of an edition's lifecycle
// lives in the edition's own streams and store: main knows nothing of it.
//
// These operations are authorised as operator actions from the call's
// credentials, and who performed one goes to the deployment's security log,
// never into the data (types.proto, security_logs region). ForkStream
// writes meta-events to edition streams only, and DeleteEdition removes
// edition rows only; nothing
// here writes to, records in or
// indexes against main, and
// main can be neither forked into nor deleted.

// The administration RPCs (EditionAdminService) and their requests are the
// distributed transport's (io/angzarr/transport/distributed/v1/meta.proto);
// an edition's summary is core's, since every store lists editions
// (decision 14.64).

// One edition, as the fork events show it. Derived on each call; never
// stored.
message EditionSummary {
  string name = 1; // Always non-empty (main is not an edition)
  // Every stream forked in it: each stream's EditionCreated (decision
  // 14.107, DRAFT: every fork is explicit, so there is no origin to tell
  // apart, and the count is this list's length).
  repeated EventRef forks = 2;
}
