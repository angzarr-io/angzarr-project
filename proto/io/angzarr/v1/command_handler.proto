syntax = "proto3";
package io.angzarr.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// CommandHandlerService: the business logic for one domain's aggregates,
// implemented in a client library and called by the coordinator. Business code behaves the same in every
// command mode.
service CommandHandlerService {
  // Process one command and return the events it produces, with the rules
  // version that decided them. This is the only input path into an
  // aggregate: facts arrive here too, in the Fact arm of CommandPage.body.
  //
  // By the time Handle is called the coordinator has already run pipeline
  // steps 1-4 (types.proto, Handling): validated the command, assigned its
  // command_id and correlation_id, deduplicated it, and resolved its
  // Handling (checked or stamped the expected sequence and resolved the
  // conflict resolution), so decide always sees a concrete sequence. Which
  // coordinator RPC the caller used (the command mode) is not passed on.
  //
  // In the client library, in order:
  //   1. the payload is upcast through the library's upcaster chain, by
  //      type URL (see upcaster.proto), for a Command and a Fact alike. A
  //      type URL that, after upcasting, reaches no registered handler is
  //      refused INVALID_ARGUMENT: the status message names the type URL as
  //      sent ("no handler for type URL /orders.v1.PlaceOrder"), and the
  //      status details carry the type URL the chain ended at.
  //   2. reflective dispatch: the body arm picks the pipeline (Command ->
  //      decide, which may reject; Fact -> ingest, which never rejects), and
  //      the type URL picks the handler. A failing fact handler is a bug,
  //      not a business rejection: the fact is dead-lettered (and alerted)
  //      and the sender answered PARKED, never a rejection.
  //   3. AGGREGATE_HANDLES and COMMUTATIVE are resolved (the nonce; see
  //      ConflictResolution).
  // The library never checks a delivered snapshot: the coordinator offers
  // only snapshots that pass its validity checks (see Snapshot in
  // types.proto), and the library folds whatever it is given.
  //
  // A rejection is answered as a gRPC error status, never as a response
  // message. There is no compensation input: an aggregate that must refuse
  // something in a choreographed flow records the refusal as a domain event
  // (e.g. ReservationDeclined), which a saga translates into commands for
  // whoever must respond.
  //
  // Business output is payloads, plus an optional snapshot state, and
  // nothing else. The returned EventBook carries pages with only a payload
  // set (and, optionally, snapshot.state). The coordinator supplies the
  // cover (the command's), every sequence and every EventMeta, stamping
  // EventMeta.rules_version (and Snapshot.rules_version) in full from the
  // response's rules_version. Output that sets page meta or a page sequence,
  // or a cover other than the command's (empty counts as the command's), is
  // a handler bug: the coordinator refuses it and persists nothing. A caller
  // of Handle or HandleSync is answered INTERNAL; an asynchronous or
  // reaction delivery is dead-lettered and alerted. It is never treated as
  // a business rejection.
  rpc Handle(ContextualCommand) returns (CommandHandlerResponse);
}

// What the business logic answers for one command.
message CommandHandlerResponse {
  reserved 3;
  reserved "snapshot_refused";

  // The events (payloads only) and optional snapshot state; see Handle.
  EventBook events = 1;
  // The full version of the business binary that produced this answer
  // (e.g. "1.4.2+build.7"), baked in when the binary is built (e.g. by
  // versionator), never a label chosen by hand: the same value the
  // component registered (ComponentDescriptor.rules_version). The client
  // library fills it on every response; the coordinator stamps it in full
  // onto every event (EventMeta.rules_version) and onto any snapshot
  // written from this response. Reported per response, so a rolling
  // deployment stamps each event with the build that actually decided it.
  // The business logic only reports it: what it means for snapshot
  // compatibility is the coordinator's rule (see Snapshot in types.proto).
  string rules_version = 2;
}

// region command_modes
// CommandHandlerCoordinatorService: the entry point for commands and facts
// into a domain's aggregates, for clients and framework components alike.
// (CommandHandlerService, above, is the business-logic service the
// coordinator calls.)
//
// Command modes. How much of a command's processing the caller waits for is
// a call-level choice, never part of the command: one RPC per mode.
//
//   Handle       DECISION  Accept or reject synchronously; returns the
//                          persisted events. Projectors and reactions run
//                          asynchronously.
//   HandleAsync  ASYNC     Validate, assign ids, enqueue and return. Nothing
//                          about the decision comes back.
//   HandleSync   SIMPLE    As DECISION, and also waits for the synchronous
//                          projectors; their results come back in
//                          CommandResponse.outcome.projections.
//
// Impact ordering (lowest to highest): ASYNC < DECISION < SIMPLE.
//
// No mode waits for reactions. Sagas and process managers always run
// asynchronously, after the command's events are persisted; the commands
// they emit are separate commands with their own outcomes. Every mode
// publishes the persisted events downstream: there is no mode that writes
// silently, so replay, migration and recovery tooling either lets reactions
// run or rebuilds projections afterwards.
//
// Every mode follows the one pipeline (types.proto, Handling: validate,
// assign ids, deduplicate, resolve Handling, business code) and refuses a
// malformed command loudly, with the codes listed there, never ignoring the
// offending field.
//
// Deduplication is the same in every mode (types.proto, command_identity
// region): by command_id, on the addressed stream's events, before
// business code runs; a duplicate is answered from the stored events. A
// client Command without a command_id gets a minted UUIDv7, before
// enqueueing in the case of HandleAsync, so redelivery from the queue (and
// a DLQ replay) is deduplicated; a CALLER's own retry is deduplicated only
// when the caller supplied the command_id and reuses it.
//
// Status codes. One set, used by every coordinator and by every framework
// retry loop (reaction delivery, the PM and saga outbox, asynchronous
// commands, projector retries):
//   Retryable:  UNAVAILABLE, DEADLINE_EXCEEDED, RESOURCE_EXHAUSTED, ABORTED.
//   Terminal:   every other code, notably INVALID_ARGUMENT (malformed),
//               FAILED_PRECONDITION (a business rejection), NOT_FOUND,
//               PERMISSION_DENIED (a field or route reserved for framework
//               components; see entry_points), UNIMPLEMENTED and INTERNAL (a
//               handler bug).
// ABORTED is a stale expected_sequence under STRICT (a failed
// test-and-set). Retrying it means re-reading and re-issuing: a caller does
// that itself, and the framework retries ABORTED only for commands whose
// expected_sequence it stamped. A queued command with a caller-provided
// expected_sequence that is ABORTED is dead-lettered with
// SequenceMismatchDetails, since resending it verbatim cannot succeed.
//
// Reaction commands (saga and process-manager output) and process-manager
// outbox deliveries are delivered by framework components through these
// same RPCs; the delivering component's configuration chooses the mode,
// never the message.
//
// Client libraries may expose a single handle(book, mode) call as API sugar
// over these three RPCs; the mode still selects the RPC, and is never sent
// on the wire.
//
// What-if execution is an ordinary command whose cover names an edition
// (see Cover.edition), in any mode; there is no speculative RPC.
service CommandHandlerCoordinatorService {
  // DECISION. Process one command and answer with its decision. The
  // CommandBook is the request: its handling says how to treat it (expected
  // sequence, conflict resolution), with unspecified fields taken from
  // configuration (see Handling). Facts (external realities) are injected
  // here too, in the Fact arm of CommandPage.body.
  //
  // Accepted: the response carries the persisted events, with
  // outcome.delivery APPLIED. A command whose command_id the addressed
  // stream already holds is not handed to business code again; the response
  // carries those events, re-read from the stream, with outcome.delivery
  // DUPLICATE. A fact whose ingest handler fails is answered OK with
  // outcome.delivery PARKED and no events ("accepted, parked"; it is
  // dead-lettered). outcome.projections and outcome.projector_failures are
  // always empty. Rejected: a gRPC error status, and nothing is written (a
  // stale sequence under STRICT is ABORTED; see the status codes above).
  rpc Handle(CommandBook) returns (CommandResponse) {
    option (google.api.http) = {
      post: "/v1/ch/{cover.domain}/commands"
      body: "*"
    };
  }
  // ASYNC. Validate the command, assign its ids (pipeline steps 1-2),
  // enqueue it durably and return. The OK response says only that the
  // command was accepted for processing: no decision has been made, and
  // deduplication happens when it is processed, so there are no events and
  // no delivery outcome to report.
  //
  // Asynchronous delivery is at least once; the command_id assigned before
  // enqueueing makes redelivery from the queue safe. A caller that may
  // itself retry the call should supply the command_id, as for Handle.
  //
  // Validation happens before enqueueing: a malformed command (see Handling)
  // is refused here, never enqueued. A business rejection happens later,
  // with no caller to answer: like a reaction command's, it is retried when
  // retryable and otherwise dead-lettered. A caller that needs the outcome
  // uses Handle, or follows the command's correlation_id
  // (EventStreamFilter).
  rpc HandleAsync(CommandBook) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/ch/{cover.domain}/commands:async"
      body: "*"
    };
  }
  // SIMPLE. As Handle (DECISION), and also waits for the domain's
  // synchronous projectors to project the persisted events; their results
  // come back in outcome.projections. The projectors run on the committed
  // events, so a projector failure never undoes the decision and never
  // turns the answer into an error: once the decision commits, HandleSync
  // answers OK with the events, the projections that succeeded, and one
  // outcome.projector_failures entry per projector that failed (whose
  // events then follow the asynchronous projection path's retries).
  rpc HandleSync(CommandBook) returns (CommandResponse) {
    option (google.api.http) = {
      post: "/v1/ch/{cover.domain}/commands:sync"
      body: "*"
    };
  }
}
// endregion

// region entry_points
// Framework components and clients use the SAME RPCs. What differs is what
// a caller may send, decided by who the caller is, never by the message.
//
// A framework component (a saga or process-manager coordinator delivering
// reaction commands, the outbox dispatcher, the DLQ replayer, a coordinator
// delivering triggers) authenticates with its mTLS identity, issued to
// framework components only. Only such a caller may send:
//   - CommandPage.causation_id (with the derived command_id of a reaction
//     command; the receiving coordinator trusts both from this caller);
//   - a caller-supplied trigger EventBook to SagaCoordinatorService.Execute
//     or ProcessManagerCoordinatorService.Handle (whose stamping copies the
//     trigger's correlation and EventRef onto reaction commands).
// Any other caller is a client. A client that sends a causation_id is
// refused PERMISSION_DENIED, as is a client call to a trigger entry point:
// the request is well formed, but the caller is not allowed to make it
// (INVALID_ARGUMENT would wrongly tell the caller to fix the message).
// Deployments may still expose the trigger routes over HTTP; the gateway
// forwards the caller's identity, so a client reaching them is refused the
// same way.
//
// Who called, framework or client, goes to the security log, never into
// the data (types.proto, security_logs region).
// endregion

// Response to one command: its business result (the events) and what the
// system did with it (the outcome).
message CommandResponse {
  EventBook events = 1; // Events from the target aggregate
  // Results of handling: delivery outcome and, from HandleSync (SIMPLE),
  // synchronous projector results. Response-only, never persisted (see
  // Outcome).
  Outcome outcome = 5;
}
