syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// What a command handler answers, and how every runtime handles a command.
// The handler's service is the component contract's
// (io.angzarr.component.v1.CommandHandlerService,
// io/angzarr/component/v1/command_handler.proto); the coordinator's RPCs
// are the distributed transport's
// (io.angzarr.transport.distributed.v1.CommandHandlerCoordinatorService,
// io/angzarr/transport/distributed/v1/command_handler.proto). The
// pipeline, the command modes and the status codes below are every
// runtime's: core's coordinator and the angzarr-embedded kernel alike
// (decision 14.64).

// What the business logic answers for one command.
message CommandHandlerResponse {
  // Under AGGREGATE_HANDLES and COMMUTATIVE, what the coordinator judges the
  // command's conflicts by (decision 14.42); unset under STRICT. A stale
  // command whose report fails the judgement is refused ABORTED, its
  // events discarded and nothing persisted. Field 4, not 3: bytes of the
  // deleted snapshot_refused (3, a bool) never decode into it.
  ConflictReport conflict = 4;
  // The events (payloads only) and, always, the post-command state in
  // events.snapshot.state; see Handle.
  EventBook events = 1;
  // The full version of the business binary that produced this answer
  // (e.g. "1.4.2+build.7"), baked in when the binary is built (e.g. by
  // versionator), never a label chosen by hand: the same value the
  // component registered (ComponentDescriptor.rules_version). The client
  // library fills it on every response; the coordinator stamps it in full
  // onto every event (EventMeta.rules_version) and onto any snapshot
  // written from this response. Reported per response, so a rolling
  // deployment stamps each event with the build that actually decided it.
  // It must equal the version in the component's registration: a response
  // reporting any other version (an empty one included) is refused as a
  // handler bug and nothing is persisted (see Handle: a caller of Handle or
  // HandleSync is answered INTERNAL; an asynchronous or reaction delivery
  // is dead-lettered and alerted).
  // The business logic only reports it: what it means for snapshot
  // compatibility is the coordinator's rule (see Snapshot in types.proto).
  string rules_version = 2;
}

// The client library's report of a stale command's conflicts (decision
// 14.42; ConflictResolution in types.proto, the conflict_units region in
// options.proto).
message ConflictReport {
  // AGGREGATE_HANDLES: the nonce the handler passed to resolve_conflicts,
  // empty when it never called it. The coordinator accepts the events only
  // if it equals ContextualCommand.conflict_nonce; otherwise ABORTED,
  // COORDINATOR_REASON_CONFLICT_UNRESOLVED.
  bytes resolved_nonce = 1;
  // COMMUTATIVE: changed(state at expected_sequence, head), the units the
  // window changed, as unit paths.
  repeated string window_units = 2;
  // COMMUTATIVE: changed(head, head with the command's events folded in),
  // the units the command changed. The coordinator accepts the events only
  // if window_units and command_units do not overlap (options.proto,
  // Overlap); otherwise ABORTED, COORDINATOR_REASON_CONFLICT_OVERLAP, metadata window_units and
  // command_units.
  repeated string command_units = 3;
}

// region command_modes
// CommandHandlerCoordinatorService (the distributed transport's) and the
// angzarr-embedded kernel: the entry points for commands and facts into a
// domain's aggregates, for clients and framework components alike.
// (CommandHandlerService, the component contract's, is the business-logic
// service they call.)
//
// Command modes. How much of a command's processing the caller waits for is
// a call-level choice, never part of the command: one RPC per mode.
//
//   Handle       DECISION  Accept or reject synchronously; returns the
//                          persisted events. Projectors and reactions run
//                          asynchronously.
//   HandleAsync  ASYNC     Validate, assign ids, enqueue and return. Nothing
//                          about the decision comes back.
//   HandleSync   SIMPLE    As DECISION, and also waits for the synchronous
//                          projectors; their results come back in
//                          CommandResponse.outcome.projections.
//
// Impact ordering (lowest to highest): ASYNC < DECISION < SIMPLE.
//
// No mode waits for reactions. Policies always run asynchronously, after the
// command's events are persisted; the commands and facts policies emit (to
// aggregates and process managers alike), and their refusal facts, are
// separate inputs with their own outcomes (a process manager reacts to nothing
// directly and emits no commands; decision 14.31). Every mode
// publishes the persisted events downstream: there is no mode that writes
// silently, so replay, migration and recovery tooling either lets reactions
// run or rebuilds projections afterwards.
//
// Every mode follows the one pipeline (types.proto, Handling: validate,
// assign ids, deduplicate, resolve Handling, business code) and refuses a
// malformed command loudly, with the codes listed there, never ignoring the
// offending field.
//
// Deduplication is the same in every mode (types.proto, command_identity
// region): by command_id, on the addressed stream's events, before
// business code runs; a duplicate is answered from the stored events. A
// client Command without a command_id gets a minted UUIDv7, before
// enqueueing in the case of HandleAsync, so redelivery from the queue (and
// a DLQ replay) is deduplicated; a CALLER's own retry is deduplicated only
// when the caller supplied the command_id and reuses it.
//
// Status codes. One set, used by every coordinator and by every framework
// retry loop (reaction delivery, the transient outbox, asynchronous
// commands, projector retries). The status alone decides an error's class,
// one of four (decision 14.37):
//   Business, fatal: FAILED_PRECONDITION, INVALID_ARGUMENT, NOT_FOUND,
//               ALREADY_EXISTS, OUT_OF_RANGE, PERMISSION_DENIED (among
//               them a field or route reserved for framework components;
//               see entry_points; and an expected_sequence ahead of the
//               stream's head, under every resolution, INVALID_ARGUMENT
//               COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD, decision
//               14.47). Final: never retried; a refused policy
//               command reaches the policy's OnRefused (policy.proto,
//               Refusals); a refused HandleAsync command, with no caller
//               to answer, is dead-lettered with its key and args as
//               AngzarrDeadLetter.reason, and alerted.
//   Business, immediate return: ABORTED, "re-read and re-decide": the
//               framework's conflicts (an expected_sequence behind the
//               head under STRICT,
//               COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE; a COMMUTATIVE
//               overlap; an unresolved conflict window), or a handler's
//               own choice under its own key. Returned at once to an outside caller, who re-reads
//               and decides again; for a policy step the runtime is the
//               caller, reloading and re-running the step under the capped
//               backoff below, then dead-lettering it and alerting. Never a
//               policy's OnRefused.
//   Bug, fatal: INTERNAL, UNKNOWN, DATA_LOSS (a handler bug is INTERNAL
//               ROUTER_REASON_UNHANDLED_HANDLER_ERROR, its own key the cause). Never
//               retried; alerted and dead-lettered at once, and never a
//               policy's OnRefused.
//   Bug, retryable: UNAVAILABLE, DEADLINE_EXCEEDED, RESOURCE_EXHAUSTED
//               (a handler's retryable bug picks one: ROUTER_REASON_UNHANDLED_HANDLER_ERROR,
//               its own key the cause), UNIMPLEMENTED and every other code.
//               Retried, on by default, with exponential backoff and jitter
//               up to a cap (the scale, the jitter factor and the cap are
//               configuration), then dead-lettered and alerted; never a
//               policy's OnRefused. Every retryable failure carries a key
//               (reasons.proto; decision 14.51), so whoever gives up when
//               the retries are spent reports it: the dead letter's
//               reason, or a caller's last answer.
// The retryable statuses are not interchangeable: UNAVAILABLE means resend;
// DEADLINE_EXCEEDED means resend only if the call is idempotent (a command
// is, by its command_id); RESOURCE_EXHAUSTED means wait longer before
// resending; ABORTED means re-read and re-decide. A policy step that
// reaches the cap, or fails as a fatal bug, moves or keeps the policy's
// position as its bug setting says (on_policy_bug).
// Two caps bound the coordinator's own retries of a command that loses a
// race at its write to another write to the same stream, and both are
// configuration, like the retry cap above: the retry cap bounds an
// AGGREGATE_HANDLES or COMMUTATIVE command's re-deliveries, and the race
// re-run cap, a count of runs (the first included, default 10), bounds a
// stamped command's re-runs on the new head; between runs the coordinator
// waits with the exponential backoff and jitter above, never re-running at
// once. At either cap the command is dead-lettered and alerted, nothing is
// persisted, and a caller waiting on Handle or HandleSync is answered
// INTERNAL COORDINATOR_REASON_RETRY_CAP_EXHAUSTED (args attempts, cap):
// the retries are spent and the dead letter holds the command, so no
// caller retries it again (decision 14.46). HandleAsync has no caller to
// answer; its command is only dead-lettered and alerted. A fact is always
// stamped, so a lost race re-runs it under the race re-run cap too, but a
// fact is never refused: at the cap it is dead-lettered and alerted,
// nothing is persisted, and its sender is answered "accepted, parked" (OK,
// outcome.delivery PARKED, no events), never the key. Either way the dead
// letter's reason (AngzarrDeadLetter.reason) is
// COORDINATOR_REASON_RETRY_CAP_EXHAUSTED with the same args.
// A race re-run cap of 0 is the opt-out for a consumer that owns its
// retries (decision 14.46, amended): a stamped command or fact that loses
// a race at its write is never re-run, and the coordinator neither parks
// nor dead-letters it nor raises an alert, whatever the retry cap says.
// It goes back to its caller at once, with no wait, as the store's write
// conflict, retryable: UNAVAILABLE COORDINATOR_REASON_STORE_CONFLICT (args
// expected, the head it was stamped with, and actual, the stream's head;
// decision 14.51), never COORDINATOR_REASON_RETRY_CAP_EXHAUSTED, and a
// fact never PARKED (C-0740, C-0741). A policy step that loses such a race
// fails with that key and nothing is persisted; its position holds at
// its trigger, since a step's position moves past its trigger only after
// the step is dead-lettered (decision 14.37), so the policy's next
// catch-up runs the step again (C-0742).
// ABORTED COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE is STRICT's failed
// test-and-set: the command's caller-provided expected_sequence is behind
// the stream's head, found at load or at the write (decision 14.45,
// amended). One AHEAD of the head is no conflict under any resolution: it
// is malformed, refused at load before business code, INVALID_ARGUMENT
// COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD (args expected, head), and
// nothing is persisted (types.proto, ConflictResolution; decision 14.47).
// Deduplication comes first: a command whose command_id the stream already
// holds is answered DUPLICATE whatever its expected_sequence, ahead or
// behind, and never this key or the ahead one.
// Under AGGREGATE_HANDLES and COMMUTATIVE a moved stream is never answered
// this key: the window is delivered and the resolution's own rule decides
// (an unresolved window is COORDINATOR_REASON_CONFLICT_UNRESOLVED, a
// COMMUTATIVE overlap COORDINATOR_REASON_CONFLICT_OVERLAP); if another
// write to the same stream lands after the window is delivered and before
// the command's write, the coordinator re-delivers the widened window and
// that rule decides again, under the retry cap (types.proto,
// ConflictResolution; decision 14.45). Under STRICT re-reading and re-issuing is the caller's:
// the coordinator re-runs on the new head only a command whose
// expected_sequence it stamped, under the race re-run cap, and such a
// command is never answered this key. A queued command with a caller-provided expected_sequence that is
// ABORTED is dead-lettered with SequenceMismatchDetails, since resending it
// verbatim cannot succeed.
//
// Reaction commands and refusal facts (policy output) are delivered by
// framework components through these same RPCs; the delivering component's
// configuration chooses the mode, never the message.
//
// A process manager is a domain (decision 14.31): its coordinator serves
// these RPCs for the PM's own domain, and its business process implements
// CommandHandlerService, exactly as an aggregate's do. Its commands may be
// refused and its facts never are. The coordinator adds the PM's root and
// start rules (process_manager.proto).
//
// Client libraries may expose a single handle(book, mode) call as API sugar
// over these three RPCs; the mode still selects the RPC, and is never sent
// on the wire.
//
// What-if execution is an ordinary command whose cover names an edition
// (see Cover.edition), in any mode; there is no speculative RPC.
// endregion
