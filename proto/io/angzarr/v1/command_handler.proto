syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";
import "google/api/annotations.proto";
import "google/protobuf/any.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// CommandHandlerService: client logic that processes commands and emits events
// Business logic layer that implements command handling for a domain aggregate
// client logic doesn't care about sync - coordinator decides
service CommandHandlerService {
  // Process command and return business response (events or revocation request)
  rpc Handle(ContextualCommand) returns (BusinessResponse);
  // Process fact events - record external realities. A fact of a type the
  // aggregate declares (ComponentOptions.facts) is routed to its fact
  // handler, which returns the events to persist (the fact, optionally plus
  // events that flag it) and cannot refuse it. A fact of an undeclared type
  // is refused with INVALID_ARGUMENT, angzarr error code NO_FACT_HANDLER;
  // the coordinator then persists nothing.
  rpc HandleFact(FactRequest) returns (EventBook);
  // Replay events to compute state (for conflict detection)
  // Optional: only needed if aggregate supports MERGE_COMMUTATIVE
  rpc Replay(ReplayRequest) returns (ReplayResponse);
}

// Request to process fact events through aggregate business logic.
// The aggregate updates its state based on external realities and returns
// events to persist. The coordinator assigns real sequence numbers.
message FactRequest {
  EventBook facts = 1;           // Fact events with ExternalDeferredSequence markers
  EventBook prior_events = 2;    // Prior events for state reconstruction
}

// Request to replay events and compute resulting state
message ReplayRequest {
  Snapshot base_snapshot = 1; // Starting state (empty = initial state)
  repeated EventPage events = 2; // Events to apply in order
}

// Response with computed state after replay
message ReplayResponse {
  google.protobuf.Any state = 1; // Resulting state
}

// CommandHandlerCoordinatorService: orchestrates command processing for domain aggregates
service CommandHandlerCoordinatorService {
  // Process command with optional sync mode (default: async fire-and-forget)
  rpc HandleCommand(CommandRequest) returns (CommandResponse) {
    option (google.api.http) = {
      post: "/v1/ch/{command.cover.domain}/commands"
      body: "*"
    };
  }
  // Inject fact events - external realities that cannot be rejected.
  // Idempotent: subsequent requests with same external_id return original events.
  // By default (EventRequest.skip_handler unset/false) each fact is routed to
  // the aggregate's declared fact handler (see HandleFact); a fact of an
  // undeclared type fails the request with INVALID_ARGUMENT /
  // NO_FACT_HANDLER and nothing is persisted. skip_handler = true persists
  // the facts directly without handler invocation (operator replay/repair).
  rpc HandleEvent(EventRequest) returns (FactInjectionResponse) {
    option (google.api.http) = {
      post: "/v1/ch/{events.cover.domain}/events"
      body: "*"
    };
  }
  // Speculative execution - execute against temporal state without persisting
  rpc HandleSyncSpeculative(SpeculateCommandHandlerRequest) returns (CommandResponse) {
    option (google.api.http) = {
      post: "/v1/ch/{command.cover.domain}/commands/speculative"
      body: "*"
    };
  }
  // Compensation delivery. The request's command is a Notification delivery
  // envelope (see Notification in types.proto) carrying a RejectionNotification
  // or a Compensate payload, sent from a coordinator's compensation outbox.
  // The coordinator rebuilds the target's state, invokes
  // CommandHandlerService.Handle and persists only the events the handler
  // returns; the Notification itself is never written to the stream.
  // Deliveries are deduplicated by the notification kind plus the envelope's
  // angzarr_deferred provenance tuple (never against a command with the same
  // tuple): a redelivery does not invoke the handler again and returns the
  // first delivery's result. The caller acts on a RevocationResponse and
  // forwards a returned Notification upstream.
  rpc HandleCompensation(CommandRequest) returns (BusinessResponse) {
    option (google.api.http) = {
      post: "/v1/ch/{command.cover.domain}/compensation"
      body: "*"
    };
  }
}

// Response from entity - aggregate events + sync projector results
message CommandResponse {
  EventBook events = 1; // Events from the target aggregate
  repeated Projection projections = 2; // Synchronous projector results
  reserved 3;
  reserved "cascade_errors";
  // Reactions that failed under CASCADE_ERROR_CONTINUE. Empty for every
  // other mode: FAIL_FAST and COMPENSATE fail the request instead, and
  // DEAD_LETTER records failures in the dead-letter queue.
  repeated CascadeReactionError reaction_errors = 4;
}

// One failed downstream reaction in a CASCADE request.
//
// Why the reaction failed is carried as for RejectionNotification:
//   code    — machine code for programmatic handling (e.g. "CARD_DECLINED");
//             callers branch on this field and never parse message
//   message — human-readable reason for logs and UIs
// The coordinator copies `code` from the google.rpc.ErrorInfo.reason in the
// failure's status details and `message` from the status message. A failure
// without ErrorInfo has an empty code.
message CascadeReactionError {
  string component = 1;    // Registered name of the saga or process manager
  Cover target = 2;        // Aggregate the reaction's command was sent to (unset for handler errors)
  string command_type = 3; // Fully qualified type of the failed command (empty for handler errors)
  int32 status_code = 4;   // gRPC status code of the failure
  string message = 5;      // Human-readable failure reason (status message)
  string code = 6;         // Machine failure code (ErrorInfo.reason); empty when the failure carried none
}

// client logic requests framework to handle revocation
message RevocationResponse {
  bool emit_system_revocation = 1; // Emit SagaCompensationFailed event
  bool send_to_dead_letter_queue = 2; // Send to DLQ
  bool escalate = 3; // Flag for alerting/human intervention
  bool abort = 4; // Stop saga chain, propagate error to caller
  string reason = 5; // Context/reason
}

// Response of CommandHandlerService.Handle. A compensation delivery may be
// answered with any variant; an ordinary command is answered with events.
message BusinessResponse {
  oneof result {
    EventBook events = 1; // Business provides compensation events
    RevocationResponse revocation = 2; // Business requests framework action
    Notification notification = 3; // Forward rejection notification upstream
  }
}

// Request for speculative command execution against temporal state.
message SpeculateCommandHandlerRequest {
  CommandBook command = 1;
  TemporalQuery point_in_time = 2;
}

// ============================================================================
// Fact Injection - External realities that cannot be rejected
// ============================================================================

// region fact_injection
// Response from fact injection.
// Indicates whether facts were newly persisted or already existed (idempotent).
//
// Request uses EventRequest with:
// - events: EventBook containing fact events (with ExternalDeferredSequence markers in PageHeader)
// - sync_mode: Controls sync processing (default: async)
// - skip_handler: false/unset (default) routes each fact to the aggregate's
//   declared fact handler; true persists facts directly without handler invocation
//
// IMPORTANT: Set PageHeader.external_deferred.external_id for idempotency. The coordinator
// uses this to deduplicate fact injections - subsequent requests with the same external_id
// return the original events without re-persisting.
message FactInjectionResponse {
  EventBook events = 1; // Persisted events with real sequence numbers
  bool already_processed = 2; // True if external_id was already seen (idempotent response)
  repeated Projection projections = 3; // Synchronous projector results (if any)
}
// endregion
