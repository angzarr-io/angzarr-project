syntax = "proto3";
package io.angzarr.v1;

import "google/protobuf/descriptor.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// The framework's reason keys (decisions 14.37, 14.42 and 14.44): every key
// angzarr answers, once, in the enum of the component that answers it, in
// the package whose code raises it (decision 14.64). This file holds core's:
//
//   RouterReason       the client library's router, in every language
//   HostReason         the client library's component host, in every
//                      language (parity/client/hosting.feature): its
//                      configuration and composition keys, which a
//                      Rust-only application can hit too
//   CoordinatorReason  core's coordinator and the angzarr-embedded kernel
//
// Two transports add keys of their own, under the same enum names and
// prefixes, so each moved key kept its string:
//
//   io.angzarr.transport.embedded.v1.HostReason
//       (transport/embedded/v1/reasons.proto) whatever runs a child
//       process: its handshake, health and exit (parity/client/child.feature)
//   io.angzarr.transport.distributed.v1.CoordinatorReason
//       (transport/distributed/v1/reasons.proto) only a distributed
//       coordinator: registration by Describe, a query server, a claim
//       check
//
// A key's string is unique across every package: it is what travels.
//
// The key on the wire is the VALUE'S FULL NAME, its enum's prefix
// included: the gRPC status message, the google.rpc.ErrorInfo reason and
// Diagnostic.code are "ROUTER_REASON_DUPLICATE_COMPONENT", never a number.
// The prefix is buf's standard ENUM_VALUE_PREFIX rule, kept with no
// exception, so the key also names its owner. The numbers are bookkeeping
// only: no message carries these enums as a field, nothing encodes a key by
// its number, and renumbering one breaks nothing on the wire. Each
// *_UNSPECIFIED value exists because proto3 demands a zero; it is never
// answered.
//
// Each value's (reason) option declares the names of its args (the
// ErrorInfo metadata keys and Diagnostic.args names) and the gRPC status it
// travels with (the reason region, below; decision 14.65): every live key
// carries the option with its status, so `just check-reason-keys` tells a
// key with no args from one whose args were never declared, and each
// language's generated status table is read off it, never typed again by
// hand. A key that concerns one stream declares a `stream` arg: the
// stream's text, its domain, `/`, its root as canonical lowercase UUID text,
// then `@` and its edition when it is in one (the main timeline is unset,
// and adds nothing), as `order/0192f3a4-5b6c-7d8e-9f01-23456789ab07@what-if`
// (decision 14.65). A key
// whose answerers differ declares every name any of them gives (the
// comment says which gives which), and an answer gives none it does not
// declare. A key whose status is REASON_STATUS_READINESS never travels as a
// status: it is a readiness refusal, logged and alerted
// (component/v1/component.proto). A `cause` arg flattens a
// wrapped key and its args as `cause` and `cause.<arg>` (types.proto, the
// diagnostic region). Which class a status is (decision 14.37's four
// classes) is the coordinator's to decide, not listed here. English for a
// key comes from a Fluent catalog keyed by it, never from this file: the
// spec's en-US catalog is reasons.en-US.ftl, beside this file, one message
// per live key using only that key's args, which every runtime embeds
// (decision 14.60).
//
// A retryable failure carries a key too (decision 14.51): every failure a
// coordinator retries, or hands back for its caller to retry, is answered
// under a key of its own, so that when the retries are spent, whoever
// gives up (the coordinator, as the dead letter's reason, or a caller
// that owns its retries, as its last answer) reports the key, never a
// bare status.
//
// A retired key is never answered again and never reused for another
// meaning. Each enum reserves every retired key under its own prefix
// (RouterReason reserves ROUTER_REASON_MISSING_COMMAND_BOOK), so protoc
// refuses a value that would bring one back in any of them. The retired
// keys were answered bare, before the prefix, and prose may still name
// them so; `just check-reason-names` refuses either form in the
// features, the protos and the site docs. Unlike a removed field (policy
// 6.6, buf.yaml), a retired key is reserved from the moment it retires: the
// reservation guards a meaning, not stored bytes.

// region reason
// What the spec says of a key beyond its name (decision 14.60), read from
// the descriptor by each language's code generator, as options.proto's
// options are: arg-name constants generated from it, never typed again by
// hand.
message ReasonOptions {
  // The key's args, by name, in the order its prose lists them: snake_case,
  // each a valid Fluent variable name. `cause` stands for itself and the
  // `cause.<arg>` names it flattens to; no other dotted name is declared.
  repeated string args = 1;
  // The gRPC status the key travels with (decision 14.65). Every live key
  // sets it: unset is no declaration, which `just check-reason-keys`
  // refuses. The key's comment says when an answerer may pick another (a
  // retryable bug's status, C-0678).
  ReasonStatus status = 2;
}

// The status a reason key travels with (decision 14.65). Each value's
// number is its google.rpc.Code number, so the status on the wire is the
// value's number, read without a table; READINESS alone is no
// google.rpc.Code: a key with it never travels as a status (a readiness
// refusal, logged and alerted; component/v1/component.proto). It holds
// the statuses the keys travel with, and grows when a key needs another.
enum ReasonStatus {
  // No status declared; never a live key's.
  REASON_STATUS_UNSPECIFIED = 0;
  REASON_STATUS_INVALID_ARGUMENT = 3;
  REASON_STATUS_FAILED_PRECONDITION = 9;
  REASON_STATUS_ABORTED = 10;
  REASON_STATUS_UNIMPLEMENTED = 12;
  REASON_STATUS_INTERNAL = 13;
  REASON_STATUS_UNAVAILABLE = 14;
  REASON_STATUS_DATA_LOSS = 15;
  REASON_STATUS_READINESS = 100;
}

extend google.protobuf.EnumValueOptions {
  // On every live value of RouterReason, HostReason and
  // CoordinatorReason, here and in the transports' reasons.proto. Numbered after options.proto's extensions of
  // EnumValueOptions (refusal_status, 50108), which share the field space.
  ReasonOptions reason = 50109;
}
// endregion

// Keys the client library's router answers.
enum RouterReason {
  ROUTER_REASON_UNSPECIFIED = 0;
  // Or, in its status's place, the retryable status a handler picks
  // (C-0678).
  ROUTER_REASON_UNHANDLED_HANDLER_ERROR = 1 [(reason) = {
    args: ["cause"]
    status: REASON_STATUS_INTERNAL
  }];
  // Travels only as ROUTER_REASON_UNHANDLED_HANDLER_ERROR's cause.
  ROUTER_REASON_HANDLER_PANICKED = 2 [(reason) = {
    status: REASON_STATUS_INTERNAL
  }];
  ROUTER_REASON_COMMAND_REFUSED = 3 [(reason) = {
    args: ["refusal_type"]
    status: REASON_STATUS_FAILED_PRECONDITION
  }];
  ROUTER_REASON_FOLD_FAILED = 4 [(reason) = {
    args: ["sequence", "type_url", "first_sequence", "last_sequence", "state_type_url", "cause"]
    status: REASON_STATUS_INTERNAL
  }];
  ROUTER_REASON_FOLD_FAILED_EMITTED = 5 [(reason) = {
    args: ["sequence", "type_url", "first_sequence", "last_sequence", "state_type_url", "cause"]
    status: REASON_STATUS_INTERNAL
  }];
  ROUTER_REASON_PERSISTED_EVENT_CORRUPT = 6 [(reason) = {
    args: ["type_url"]
    status: REASON_STATUS_DATA_LOSS
  }];
  ROUTER_REASON_ANY_DECODE_FAILED = 7 [(reason) = {
    args: ["message_type", "ext_err_txt"]
    status: REASON_STATUS_INTERNAL
  }];
  // The router sends type_url only; the coordinator relays it with
  // upcast_type_url (14.39).
  ROUTER_REASON_UNKNOWN_COMMAND_TYPE = 8 [(reason) = {
    args: ["type_url", "upcast_type_url"]
    status: REASON_STATUS_INTERNAL
  }];
  // Relayed as ROUTER_REASON_UNKNOWN_COMMAND_TYPE is.
  ROUTER_REASON_NO_FACT_HANDLER = 9 [(reason) = {
    args: ["type_url", "upcast_type_url"]
    status: REASON_STATUS_INTERNAL
  }];
  ROUTER_REASON_NO_REFUSAL_HANDLER = 10 [(reason) = {
    args: ["command_type"]
    status: REASON_STATUS_INTERNAL
  }];
  ROUTER_REASON_CONFLICT_RESOLUTION_UNSUPPORTED = 11 [(reason) = {
    status: REASON_STATUS_INTERNAL
  }];
  ROUTER_REASON_NO_COMPONENT_OF_KIND = 12 [(reason) = {
    status: REASON_STATUS_UNIMPLEMENTED
  }];
  ROUTER_REASON_NO_HANDLERS_REGISTERED = 13 [(reason) = {
    status: REASON_STATUS_INTERNAL
  }];
  // The router answers it with component and component_kind;
  // the component host with registered and refused instead, naming the
  // component already registered and the one refused (C-0579; decision
  // 14.44, amended).
  ROUTER_REASON_DUPLICATE_COMPONENT = 14 [(reason) = {
    args: ["component", "component_kind", "registered", "refused"]
    status: REASON_STATUS_INTERNAL
  }];
  // A limit a router may enforce: where a client library lets a handler's
  // decision continue in follow-on steps (each deciding from the state after
  // the events before it, all of them one decision, committed together), a
  // decision that ran more steps after its handler than the router's step
  // limit (`limit`, a count). A step that always continues never settles, so
  // the same input runs the same steps again: the router keeps nothing the
  // decision emitted, and the command or fact fails as a handler's bug does.
  // Bug, fatal (decision 14.37): dead-lettered and alerted at once, never
  // retried (a retryable status would re-run business code to the cap for the
  // same answer), never a policy's OnRefused (a business status would invite a
  // compensating reaction to a bug). A router that offers no follow-on steps
  // never answers it. (Decision 14.49.)
  ROUTER_REASON_TOO_MANY_STEPS = 15 [(reason) = {
    args: ["limit"]
    status: REASON_STATUS_INTERNAL
  }];

  // Retired by 14.37.
  reserved
    "ROUTER_REASON_MALFORMED_REFUSAL_FACT",
    "ROUTER_REASON_DUPLICATE_REGISTRATION",
    "ROUTER_REASON_NO_HANDLER_REGISTERED";
  // Retired by 14.39.
  reserved
    "ROUTER_REASON_DUPLICATE_UPCASTER_CHAIN",
    "ROUTER_REASON_DUPLICATE_COMMAND_HANDLER";
  // Retired by 14.42.
  reserved
    "ROUTER_REASON_MISSING_COMMAND_BOOK",
    "ROUTER_REASON_MISSING_COMMAND_PAGE",
    "ROUTER_REASON_MISSING_COMMAND_PAYLOAD",
    "ROUTER_REASON_MISSING_EVENT_BOOK_COVER",
    "ROUTER_REASON_EMPTY_POLICY_SOURCE",
    "ROUTER_REASON_POLICY_SOURCE_OUTSIDE_INPUT_DOMAIN",
    "ROUTER_REASON_REFUSAL_FACT_MISSING",
    "ROUTER_REASON_REFUSAL_WITHOUT_COMMAND",
    "ROUTER_REASON_REFUSAL_WITHOUT_EVENT",
    "ROUTER_REASON_REFUSAL_WITHOUT_REFUSED_COMMAND",
    "ROUTER_REASON_REFUSED_COMMAND_WITHOUT_ID",
    "ROUTER_REASON_REFUSAL_WITHOUT_TRIGGER_STREAM",
    "ROUTER_REASON_HOST_STATUS_UNDECODABLE",
    "ROUTER_REASON_NULL_ABI_POINTER";
}

// Keys the client library's component host answers. Each is a refusal to
// start, raised as the language's configuration error.
enum HostReason {
  HOST_REASON_UNSPECIFIED = 0;
  // An upcaster is its own sidecar (14.39), never hosted beside a component.
  HOST_REASON_UPCASTER_WITH_COMPONENT = 1 [(reason) = {
    args: ["component"]
    status: REASON_STATUS_INTERNAL
  }];
  // A host with no component registered (C-0504).
  HOST_REASON_NO_COMPONENTS_REGISTERED = 2 [(reason) = {
    status: REASON_STATUS_INTERNAL
  }];
  // A component registered with a descriptor whose rules_version (`described`)
  // is not the version its answers report (`reported`:
  // CommandHandlerResponse.rules_version), generated or written by hand alike.
  // Refused at registration, before anything is served, and nothing is
  // registered: the coordinator would refuse every answer the component gave
  // (types.proto, ComponentDescriptor; C-0743).
  HOST_REASON_DESCRIPTOR_RULES_VERSION_MISMATCH = 3 [(reason) = {
    args: ["component", "described", "reported"]
    status: REASON_STATUS_INTERNAL
  }];
  // A projector that names no domain it reads: its descriptor's inputs are
  // empty, as are its table's domains where the client builds the descriptor
  // from the table. There is no wildcard domain (decision 14.53), so it would
  // fold nothing. Refused at registration, before anything is served, and
  // nothing is registered; a client's describe() of such a table refuses with
  // it too (C-0747; decision 14.55).
  HOST_REASON_PROJECTOR_NO_INPUT_DOMAIN = 4 [(reason) = {
    args: ["component"]
    status: REASON_STATUS_INTERNAL
  }];

  // Moved to io.angzarr.transport.embedded.v1 (decision 14.64), each
  // key's string unchanged: a key lives in the package whose code raises it.
  reserved 5 to 11;
  reserved
    "HOST_REASON_HANDSHAKE_MALFORMED",
    "HOST_REASON_HANDSHAKE_TIMEOUT",
    "HOST_REASON_HANDSHAKE_CLOSED",
    "HOST_REASON_CHILD_NOT_SERVING",
    "HOST_REASON_CHILD_EXIT_STATUS",
    "HOST_REASON_CHILD_NOT_EXITED",
    "HOST_REASON_PROBE_INPUT";

  // Retired by 14.37.
  reserved
    "HOST_REASON_MALFORMED_REFUSAL_FACT",
    "HOST_REASON_DUPLICATE_REGISTRATION",
    "HOST_REASON_NO_HANDLER_REGISTERED";
  // Retired by 14.39.
  reserved
    "HOST_REASON_DUPLICATE_UPCASTER_CHAIN",
    "HOST_REASON_DUPLICATE_COMMAND_HANDLER";
  // Retired by 14.42.
  reserved
    "HOST_REASON_MISSING_COMMAND_BOOK",
    "HOST_REASON_MISSING_COMMAND_PAGE",
    "HOST_REASON_MISSING_COMMAND_PAYLOAD",
    "HOST_REASON_MISSING_EVENT_BOOK_COVER",
    "HOST_REASON_EMPTY_POLICY_SOURCE",
    "HOST_REASON_POLICY_SOURCE_OUTSIDE_INPUT_DOMAIN",
    "HOST_REASON_REFUSAL_FACT_MISSING",
    "HOST_REASON_REFUSAL_WITHOUT_COMMAND",
    "HOST_REASON_REFUSAL_WITHOUT_EVENT",
    "HOST_REASON_REFUSAL_WITHOUT_REFUSED_COMMAND",
    "HOST_REASON_REFUSED_COMMAND_WITHOUT_ID",
    "HOST_REASON_REFUSAL_WITHOUT_TRIGGER_STREAM",
    "HOST_REASON_HOST_STATUS_UNDECODABLE",
    "HOST_REASON_NULL_ABI_POINTER";
}

// Keys core's coordinator and the angzarr-embedded kernel answer.
enum CoordinatorReason {
  COORDINATOR_REASON_UNSPECIFIED = 0;
  COORDINATOR_REASON_CONFLICT_UNRESOLVED = 1 [(reason) = {
    args: ["stream"]
    status: REASON_STATUS_ABORTED
  }];
  COORDINATOR_REASON_CONFLICT_OVERLAP = 2 [(reason) = {
    args: ["stream", "window_units", "command_units"]
    status: REASON_STATUS_ABORTED
  }];
  COORDINATOR_REASON_PM_NO_INSTANCE = 3 [(reason) = {
    args: ["stream", "type_url"]
    status: REASON_STATUS_FAILED_PRECONDITION
  }];
  COORDINATOR_REASON_REFUSAL_FACT_WRONG_STREAM = 4 [(reason) = {
    args: ["domain"]
    status: REASON_STATUS_INTERNAL
  }];
  COORDINATOR_REASON_POLICY_COMMAND_OUTSIDE_DESTINATION = 5 [(reason) = {
    args: ["expected_domain", "actual_domain"]
    status: REASON_STATUS_INTERNAL
  }];
  COORDINATOR_REASON_POLICY_COMMAND_OUTSIDE_EDITION = 6 [(reason) = {
    args: ["expected_edition", "actual_edition"]
    status: REASON_STATUS_INTERNAL
  }];
  COORDINATOR_REASON_POLICY_COMMAND_NO_ROOT = 7 [(reason) = {
    args: ["domain", "command_type"]
    status: REASON_STATUS_INTERNAL
  }];
  COORDINATOR_REASON_POLICY_COMMAND_OTHER_CORRELATION = 8 [(reason) = {
    args: ["domain", "command_type"]
    status: REASON_STATUS_INTERNAL
  }];
  COORDINATOR_REASON_REFUSAL_FACT_ADDRESSED = 9 [(reason) = {
    status: REASON_STATUS_INTERNAL
  }];
  COORDINATOR_REASON_REFUSAL_FACT_NO_PAGE = 10 [(reason) = {
    status: REASON_STATUS_INTERNAL
  }];
  COORDINATOR_REASON_REFUSAL_FACT_NOT_A_FACT = 11 [(reason) = {
    status: REASON_STATUS_INTERNAL
  }];
  COORDINATOR_REASON_REFUSAL_FACT_IDENTIFIED = 12 [(reason) = {
    status: REASON_STATUS_INTERNAL
  }];
  COORDINATOR_REASON_MISSING_RULES_VERSION = 13 [(reason) = {
    args: ["component"]
    status: REASON_STATUS_READINESS
  }];
  COORDINATOR_REASON_MISSING_STATE_TYPE = 14 [(reason) = {
    args: ["component", "component_kind"]
    status: REASON_STATUS_READINESS
  }];
  COORDINATOR_REASON_STARTING_TYPES_ON_NON_PM = 15 [(reason) = {
    args: ["component", "component_kind"]
    status: REASON_STATUS_READINESS
  }];
  COORDINATOR_REASON_STATE_ON_STATELESS_KIND = 16 [(reason) = {
    args: ["component", "component_kind"]
    status: REASON_STATUS_READINESS
  }];
  COORDINATOR_REASON_POLICY_INPUT_COUNT = 17 [(reason) = {
    args: ["component", "input_count"]
    status: REASON_STATUS_READINESS
  }];
  COORDINATOR_REASON_POLICY_NO_OUTPUT_DOMAIN = 18 [(reason) = {
    args: ["component"]
    status: REASON_STATUS_READINESS
  }];
  COORDINATOR_REASON_OUTPUT_DOMAIN_ON_NON_POLICY = 19 [(reason) = {
    args: ["component", "component_kind"]
    status: REASON_STATUS_READINESS
  }];
  // STRICT only. The command, under STRICT, set
  // CommandBook.handling.expected_sequence (`expected`) behind the stream's
  // head, its next_sequence (`actual`): found when the command is loaded
  // (before business code runs), or at its write, when another write to the
  // same stream landed first. Nothing is persisted. Under AGGREGATE_HANDLES
  // and COMMUTATIVE a moved stream is never answered this: those resolutions
  // apply their own rules (types.proto, ConflictResolution). A command without
  // an expected sequence that loses such a race is never answered this either:
  // the coordinator re-runs it on the new head, under the race re-run cap.
  // Business, immediate return (decision 14.37): a direct caller re-reads and
  // decides; a policy step is re-run under the retry cap. (Decision 14.45.) An
  // expected sequence ahead of the head is never this, under any resolution:
  // it is malformed, COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD (decision
  // 14.47).
  COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE = 20 [(reason) = {
    args: ["stream", "expected", "actual"]
    status: REASON_STATUS_ABORTED
  }];
  // Commands only: the coordinator gave up on a command its caller is waiting
  // for (Handle, HandleSync): every run lost a race at the write to another
  // write to the same stream, until a cap. A stamped command (no expected
  // sequence) re-run on the new head stops at the race re-run cap; an
  // AGGREGATE_HANDLES or COMMUTATIVE command re-delivered its widened window
  // stops at the retry cap. `attempts` is how many times business code ran,
  // `cap` the configured limit reached. The command is dead-lettered and
  // alerted, and nothing is persisted. INTERNAL, a fatal bug's status
  // (decision 14.37): the retries are spent and the dead letter holds the
  // command, so no caller retries it again, and a policy step that sent it
  // follows on_policy_bug, as at any cap. A lost race carries no key, so there
  // is no cause. A fact is never answered this: at the race re-run cap it is
  // parked (OK, PARKED). A command or fact dead-lettered at either cap records
  // this key, with the same args, as its AngzarrDeadLetter.reason, whether or
  // not a caller was waiting. (Decision 14.46.) The key is for write races
  // only: a retryable bug dead-lettered at its cap records its own key, as
  // last answered (decision 14.48, amended). A race re-run cap of 0 never
  // reaches this key: a lost race then goes back to its caller as the store's
  // write conflict (command_handler.proto, the status codes; decision 14.46,
  // amended), COORDINATOR_REASON_STORE_CONFLICT (decision 14.51).
  COORDINATOR_REASON_RETRY_CAP_EXHAUSTED = 21 [(reason) = {
    args: ["stream", "attempts", "cap"]
    status: REASON_STATUS_INTERNAL
  }];
  // Every resolution (STRICT, AGGREGATE_HANDLES, COMMUTATIVE). The command set
  // CommandBook.handling.expected_sequence (`expected`) ahead of the stream's
  // head, its next_sequence (`head`): it names a sequence the stream has not
  // reached, so it was decided against no state the stream ever held, and no
  // resolution can apply (there is no window to deliver). Malformed input,
  // found when the command is loaded (pipeline step 4, before business code):
  // business code is not invoked and nothing is persisted. A head only moves
  // forward, so it is never found at the write. Business, fatal (decision
  // 14.37): never retried; a direct caller fixes the command, and a
  // HandleAsync command, with no caller to answer, is dead-lettered with this
  // key and its args as its AngzarrDeadLetter.reason, and alerted.
  // Deduplication comes first, so a command the stream already holds is
  // answered DUPLICATE, never this. Reaction commands never carry an expected
  // sequence, so they are never answered this. An expected sequence behind the
  // head is COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE under STRICT. (Decision
  // 14.47.)
  COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD = 22 [(reason) = {
    args: ["stream", "expected", "head"]
    status: REASON_STATUS_INVALID_ARGUMENT
  }];
  // A reaction command (a policy's) that carries Handling (an
  // expected_sequence or a conflict_resolution), which a reaction command
  // never may (types.proto, Handling): refused by the policy's coordinator
  // (PolicyResponse.reactions), its trigger dead-lettered, or, if one reaches
  // its destination, refused there before business code and dead-lettered as a
  // reactor bug, with this key as its AngzarrDeadLetter.reason. Never
  // delivered. (Decision 14.48, amended.)
  COORDINATOR_REASON_POLICY_COMMAND_WITH_HANDLING = 23 [(reason) = {
    args: ["domain", "command_type"]
    status: REASON_STATUS_INTERNAL
  }];
  // The rows of a deleted edition in one stream could not be removed
  // (transport/distributed/v1/meta.proto, DeleteEdition): the removal is
  // dead-lettered (the stream and its meta.EditionDeleted as
  // AngzarrDeadLetter.failed_edition_removal) with this key as its reason, and
  // alerted. `attempts` is how many removals were tried, `cause` the store's
  // failure. Never answered to a caller: DeleteEdition has already answered.
  // (Decision 14.48, amended.)
  COORDINATOR_REASON_EDITION_REMOVAL_FAILED = 24 [(reason) = {
    args: ["stream", "edition", "attempts", "cause"]
    status: REASON_STATUS_INTERNAL
  }];
  // A reaction command (a policy's) that sets its own command_id or
  // causation_id (`field`, the field's name) to a value other than the one its
  // coordinator stamps (types.proto, the command_identity region): refused by
  // the policy's coordinator (PolicyResponse.reactions), its trigger
  // dead-lettered with this key as its AngzarrDeadLetter.reason, and alerted.
  // Never delivered. (Decision 14.48, amended.)
  COORDINATOR_REASON_POLICY_COMMAND_OTHER_IDENTITY = 25 [(reason) = {
    args: ["domain", "command_type", "field"]
    status: REASON_STATUS_INTERNAL
  }];
  // `command_type` is the Fact's payload type. A policy's reaction that is a
  // Fact (CommandPage.body = Fact): a policy's business code emits Commands
  // only, and its refusal facts come from OnRefused (policy.proto,
  // PolicyService, Refusals). Refused by the policy's coordinator
  // (PolicyResponse.reactions), its trigger dead-lettered with this key as its
  // AngzarrDeadLetter.reason, and alerted. Never delivered. (Decision 14.48,
  // amended.)
  COORDINATOR_REASON_POLICY_COMMAND_IS_FACT = 26 [(reason) = {
    args: ["domain", "command_type"]
    status: REASON_STATUS_INTERNAL
  }];
  // A reaction command (a policy's) that carries fact_origin, which only a
  // Fact carries (types.proto, the command_identity region): refused by the
  // policy's coordinator (PolicyResponse.reactions), its trigger
  // dead-lettered, or, if one reaches its destination, refused there before
  // business code and dead-lettered as a reactor bug, with this key as its
  // AngzarrDeadLetter.reason, and alerted. Never delivered. (Decision 14.48,
  // amended.)
  COORDINATOR_REASON_POLICY_COMMAND_FACT_ORIGIN = 27 [(reason) = {
    args: ["domain", "command_type"]
    status: REASON_STATUS_INTERNAL
  }];
  // A reaction command (a policy's) addressed to a domain its coordinator
  // cannot route: no component of the domain is registered with it, and it
  // knows no coordinator for the domain elsewhere. Found when the reactions
  // are checked (PolicyResponse.reactions), after the destination check
  // (COORDINATOR_REASON_POLICY_COMMAND_OUTSIDE_DESTINATION): refused, its
  // trigger dead-lettered with this key as its AngzarrDeadLetter.reason
  // (processing_failed), and alerted. Never delivered. Bug, fatal (decision
  // 14.37): a deployment that wires a policy to a domain it does not host is
  // fixed by its operator, not by a retry. A client's command for an unknown
  // domain is the client's malformed input, never this. (Decision 14.49.)
  COORDINATOR_REASON_POLICY_COMMAND_UNKNOWN_DOMAIN = 28 [(reason) = {
    args: ["domain", "command_type"]
    status: REASON_STATUS_INTERNAL
  }];
  // The coordinator could not reach the business process that handles
  // `domain`: its process is not running, the connection or the transport
  // failed, or the call timed out before an answer (`cause`, the transport's
  // failure, a third-party library's text as `cause.ext_err_txt`). Nothing ran
  // and nothing was written. Bug, retryable (decision 14.37): UNAVAILABLE
  // means resend, under the retry cap with backoff and jitter. At the cap the
  // input is dead-lettered with this key and its args, as last answered, as
  // its AngzarrDeadLetter.reason (processing_failed, is_transient true), never
  // COORDINATOR_REASON_RETRY_CAP_EXHAUSTED, which is for write races only
  // (decision 14.48, amended), and alerted. A business process that is reached
  // and answers a retryable bug of its own answers
  // ROUTER_REASON_UNHANDLED_HANDLER_ERROR (C-0678), never this. (Decision
  // 14.49.)
  COORDINATOR_REASON_HANDLER_UNAVAILABLE = 29 [(reason) = {
    args: ["stream", "domain", "cause"]
    status: REASON_STATUS_UNAVAILABLE
  }];
  // A limit a coordinator may enforce: where it follows a chain of reactions
  // from the input a caller sent (the input at depth 0, a policy's reaction to
  // its events at depth 1, and so on), a reaction that would go deeper than
  // its chain depth limit (`limit`, configuration): a policy cycle that never
  // settles, or a cascade longer than allowed. The reaction is not delivered;
  // the trigger whose reaction it was is dead-lettered with this key as its
  // AngzarrDeadLetter.reason (processing_failed, retry_count 0, is_transient
  // false), and alerted. Bug, fatal (decision 14.37): the same chain runs as
  // deep again, so a retry cannot help, and a business status would reach
  // OnRefused, whose reaction deepens the chain. A coordinator that does not
  // follow chains never answers it. (Decision 14.49.)
  COORDINATOR_REASON_CHAIN_TOO_DEEP = 30 [(reason) = {
    args: ["limit"]
    status: REASON_STATUS_INTERNAL
  }];
  // A race re-run cap of 0 (decision 14.46, amended): a stamped command or
  // fact (no expected sequence, so the coordinator stamped the head it loaded,
  // `expected`) lost a race at its write to another write to the same stream,
  // now at `actual`, and the coordinator, opted out of re-running it, hands it
  // back at once, with no wait. Nothing is persisted. Bug, retryable (decision
  // 14.37): UNAVAILABLE means resend, and a resend is safe, since nothing was
  // written; the consumer that owns its retries resends, and if its own
  // retries are spent, this key is what it reports. The coordinator never
  // dead-letters, parks or alerts on it: a fact is answered this, never
  // PARKED, and a policy step that fails with it holds its position at its
  // trigger, so the next catch-up runs it again (C-0740 to C-0742). Never
  // answered at a race re-run cap above 0, where a lost race is re-run and, at
  // the cap, COORDINATOR_REASON_RETRY_CAP_EXHAUSTED; never a STRICT command's,
  // whose lost race is COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE. (Decision
  // 14.51.)
  COORDINATOR_REASON_STORE_CONFLICT = 31 [(reason) = {
    args: ["stream", "expected", "actual"]
    status: REASON_STATUS_UNAVAILABLE
  }];
  // The coordinator's event store failed to answer (I/O, a timeout, a dropped
  // connection, a busy or locked database: `cause`, the store's failure, a
  // third-party driver's text as `cause.ext_err_txt`); a write may or may not
  // have landed. Bug, retryable (decision 14.37): resent under the retry cap
  // with backoff and jitter, safe because a resend starts at deduplication (a
  // write that landed after all is answered DUPLICATE). At the cap the input
  // is dead-lettered with this key and its args, as last answered, as its
  // AngzarrDeadLetter.reason (processing_failed, is_transient true), and
  // alerted; a waiting caller is answered this key. A write that lost a race
  // is never this: the store was sure (COORDINATOR_REASON_STORE_CONFLICT at a
  // race re-run cap of 0, a re-run otherwise). (Decision 14.51.)
  COORDINATOR_REASON_STORE_UNAVAILABLE = 32 [(reason) = {
    args: ["cause"]
    status: REASON_STATUS_UNAVAILABLE
  }];
  // The upcaster sidecar `domain`'s coordinator upcasts through (decision
  // 14.39) is configured but could not be reached, or answered under a
  // retryable status (`cause`): the coordinator delivers nothing it would have
  // to upcast and reports NOT_SERVING (upcaster.proto, Failure). A waiting
  // caller and a query are answered this key, to resend; queued and reaction
  // deliveries stay queued until the sidecar is back, so it is never a dead
  // letter's reason. A rule that fails (an error status from Upcast) is a
  // handler bug, never this. (Decision 14.51.)
  COORDINATOR_REASON_UPCASTER_UNAVAILABLE = 33 [(reason) = {
    args: ["domain", "cause"]
    status: REASON_STATUS_UNAVAILABLE
  }];
  // A CommandHandlerResponse whose rules_version (`reported`, an empty one
  // included) is not the version the component registered (`registered`: its
  // ComponentDescriptor.rules_version). Bug, fatal (decision 14.37): refused
  // and nothing persisted; a caller of Handle or HandleSync is answered it, an
  // asynchronous or reaction delivery dead-lettered with it as its
  // AngzarrDeadLetter.reason and alerted (command_handler.proto, Handle;
  // C-0558, C-0559, C-0748). (Decision 14.56.)
  COORDINATOR_REASON_RULES_VERSION_MISMATCH = 37 [(reason) = {
    args: ["stream", "component", "registered", "reported"]
    status: REASON_STATUS_INTERNAL
  }];
  // A handler's answer whose events book names another stream than the one
  // it was handed (`stream`, the input's; `event_stream`, the stream the
  // book's cover names, another edition's included): a domain's or a
  // process manager's answer is payloads for its own stream alone. Refused
  // before any write, so nothing is persisted; a waiting caller is answered
  // it, and the input is dead-lettered as a handler bug with this key and
  // its args as its AngzarrDeadLetter.reason, and alerted. Bug, fatal
  // (decision 14.37): the same handler answers the same way again. A book
  // with no cover, or the input's own, is the input's stream. (C-0590;
  // decision 14.65.)
  COORDINATOR_REASON_EVENTS_NOT_ITS_STREAM = 38 [(reason) = {
    args: ["stream", "event_stream"]
    status: REASON_STATUS_INTERNAL
  }];
  // An outside input (a client's command or fact) to a stream in an
  // edition (`edition`) that is not forked there (`stream`, the input's
  // stream in that edition): the store's Editions capability knows no fork
  // of the stream in the edition. Checked when the input is loaded, before
  // business code runs: nothing runs and nothing is persisted. Business,
  // fatal (decision 14.37): the caller forks the stream into the edition,
  // or waits for a policy to propagate into it, and resends. A reaction
  // command into an edition is never this: its coordinator forks on arrival
  // (edition_forks.feature). (C-0633; decision 14.65.)
  COORDINATOR_REASON_EDITION_NOT_FORKED = 39 [(reason) = {
    args: ["stream", "edition"]
    status: REASON_STATUS_FAILED_PRECONDITION
  }];

  // Moved to io.angzarr.transport.distributed.v1 (decision 14.64), each
  // key's string unchanged: a key lives in the package whose code raises it.
  reserved 34 to 36;
  reserved
    "COORDINATOR_REASON_COMPONENT_NOT_REGISTERED",
    "COORDINATOR_REASON_COMMANDS_NOT_SERVED",
    "COORDINATOR_REASON_PAYLOAD_UNAVAILABLE";

  // Retired by 14.37.
  reserved
    "COORDINATOR_REASON_MALFORMED_REFUSAL_FACT",
    "COORDINATOR_REASON_DUPLICATE_REGISTRATION",
    "COORDINATOR_REASON_NO_HANDLER_REGISTERED";
  // Retired by 14.39.
  reserved
    "COORDINATOR_REASON_DUPLICATE_UPCASTER_CHAIN",
    "COORDINATOR_REASON_DUPLICATE_COMMAND_HANDLER";
  // Retired by 14.42.
  reserved
    "COORDINATOR_REASON_MISSING_COMMAND_BOOK",
    "COORDINATOR_REASON_MISSING_COMMAND_PAGE",
    "COORDINATOR_REASON_MISSING_COMMAND_PAYLOAD",
    "COORDINATOR_REASON_MISSING_EVENT_BOOK_COVER",
    "COORDINATOR_REASON_EMPTY_POLICY_SOURCE",
    "COORDINATOR_REASON_POLICY_SOURCE_OUTSIDE_INPUT_DOMAIN",
    "COORDINATOR_REASON_REFUSAL_FACT_MISSING",
    "COORDINATOR_REASON_REFUSAL_WITHOUT_COMMAND",
    "COORDINATOR_REASON_REFUSAL_WITHOUT_EVENT",
    "COORDINATOR_REASON_REFUSAL_WITHOUT_REFUSED_COMMAND",
    "COORDINATOR_REASON_REFUSED_COMMAND_WITHOUT_ID",
    "COORDINATOR_REASON_REFUSAL_WITHOUT_TRIGGER_STREAM",
    "COORDINATOR_REASON_HOST_STATUS_UNDECODABLE",
    "COORDINATOR_REASON_NULL_ABI_POINTER";
}
