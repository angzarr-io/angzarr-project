syntax = "proto3";
package io.angzarr.v1;

import "google/protobuf/descriptor.proto";
import "google/rpc/code.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// The framework's reason keys (decisions 14.37, 14.42 and 14.44): every key
// angzarr answers, once, named by LAYER (decision 14.104): core's
// AngzarrReason here (ANGZARR_REASON_*), the transports' EmbeddedReason and
// DistributedReason beside their packages. A key travels as its value's full
// name, never its number; each value's (reason) option declares its args and
// its surface; its English is reasons.en-US.ftl beside this file. The rules
// (layers, wire form, args, the `stream` arg, `cause` flattening, surfaces,
// catalogs, retryable keys, removed keys): docs/design/reason-keys.md §1 to §7.

// region reason
// What the spec says of a key beyond its name (decision 14.60), read from
// the descriptor by each language's code generator: its args and its
// surface. docs/design/reason-keys.md §4 and §5.
message ReasonOptions {
  // The key's args, by name, in the order its prose lists them: snake_case,
  // each a valid Fluent variable name. `cause` stands for itself and the
  // `cause.<arg>` names it flattens to (docs/design/reason-keys.md §4).
  repeated string args = 1;
  // How the key surfaces, by kind (decision 14.91). Required: every
  // live key names one.
  oneof surfaces {
    // The gRPC status the key travels with (decisions 14.65 and 14.104,
    // ruled 2026-11-02): google.rpc.Code itself, never OK. When an answerer may pick
    // another: docs/design/reason-keys.md §5.
    google.rpc.Code grpc_status = 2;
    // A readiness refusal: the key never travels as a status; it is logged
    // and alerted as the coordinator's readiness
    // (docs/design/component-registration.md §6 and §8).
    Readiness readiness = 3;
  }
}

// A readiness key's surface: nothing to say but its kind.
message Readiness {}

extend google.protobuf.EnumValueOptions {
  // On every value of AngzarrReason, here, and of the transports'
  // EmbeddedReason and DistributedReason. In angzarr's extension range
  // (options.proto).
  ReasonOptions reason = 50105;
}
// endregion

// Core's keys, ANGZARR_REASON_*, whichever core component raises them
// (decision 14.104): the router and the component host (the client
// library's, in every language) and the coordinator (core's and the
// angzarr-embedded kernel's). Each key's comment opens with who raises it.
// Per-key behaviour: docs/design/reason-keys.md §8 to §10.
enum AngzarrReason {
  ANGZARR_REASON_UNSPECIFIED = 0;
  // Raised by the router and the coordinator.
  // A command refused with a typed refusal; arg refusal_type its object's
  // full type name. docs/design/reason-keys.md §8.1.
  ANGZARR_REASON_COMMAND_REFUSED = 1 [(reason) = {
    args: ["refusal_type"]
    grpc_status: FAILED_PRECONDITION
  }];
  // Raised by the router.
  // A handler failed with an error it does not classify, its key the cause;
  // or a retryable status the handler picks (C-0678).
  // docs/design/reason-keys.md §8.2.
  ANGZARR_REASON_UNHANDLED_HANDLER_ERROR = 2 [(reason) = {
    args: ["cause"]
    grpc_status: INTERNAL
  }];
  // Raised by the router.
  // A handler panicked; travels only as
  // ANGZARR_REASON_UNHANDLED_HANDLER_ERROR's cause.
  // docs/design/reason-keys.md §8.3.
  ANGZARR_REASON_HANDLER_PANICKED = 3 [(reason) = {
    grpc_status: INTERNAL
  }];
  // Raised by the router.
  // A stored event could not be folded into the state.
  // docs/design/reason-keys.md §8.4.
  ANGZARR_REASON_FOLD_FAILED = 4 [(reason) = {
    args: ["sequence", "type_url", "first_sequence", "last_sequence", "state_type_url", "cause"]
    grpc_status: INTERNAL
  }];
  // Raised by the router.
  // An event the command emitted could not be folded into the state.
  // docs/design/reason-keys.md §8.5.
  ANGZARR_REASON_FOLD_FAILED_EMITTED = 5 [(reason) = {
    args: ["sequence", "type_url", "first_sequence", "last_sequence", "state_type_url", "cause"]
    grpc_status: INTERNAL
  }];
  // Raised by the router.
  // A stored event or snapshot does not decode.
  // docs/design/reason-keys.md §8.6.
  ANGZARR_REASON_PERSISTED_EVENT_CORRUPT = 6 [(reason) = {
    args: ["type_url"]
    grpc_status: DATA_LOSS
  }];
  // Raised by the router.
  // A payload did not decode as its type.
  // docs/design/reason-keys.md §8.7.
  ANGZARR_REASON_ANY_DECODE_FAILED = 7 [(reason) = {
    args: ["message_type", "ext_err_txt"]
    grpc_status: INTERNAL
  }];
  // Raised by the router.
  // No handler takes the command type, after upcasting; the router sends
  // type_url only, the coordinator relays it with upcast_type_url (14.39).
  // docs/design/reason-keys.md §8.8.
  ANGZARR_REASON_UNKNOWN_COMMAND_TYPE = 8 [(reason) = {
    args: ["type_url", "upcast_type_url"]
    grpc_status: INTERNAL
  }];
  // Raised by the router.
  // No handler takes the fact type; relayed as
  // ANGZARR_REASON_UNKNOWN_COMMAND_TYPE is. docs/design/reason-keys.md §8.9.
  ANGZARR_REASON_NO_FACT_HANDLER = 9 [(reason) = {
    args: ["type_url", "upcast_type_url"]
    grpc_status: INTERNAL
  }];
  // Raised by the router.
  // A policy's router handed a refusal for a `command_type` with no refusal
  // callback. docs/design/reason-keys.md §8.10.
  ANGZARR_REASON_NO_REFUSAL_HANDLER = 10 [(reason) = {
    args: ["command_type"]
    grpc_status: INTERNAL
  }];
  // Raised by the router.
  // The business process hosts no component of the kind dispatched to.
  // docs/design/reason-keys.md §8.11.
  ANGZARR_REASON_NO_COMPONENT_OF_KIND = 11 [(reason) = {
    grpc_status: UNIMPLEMENTED
  }];
  // Raised by the router.
  // No component is registered with the router.
  // docs/design/reason-keys.md §8.12.
  ANGZARR_REASON_NO_HANDLERS_REGISTERED = 12 [(reason) = {
    grpc_status: INTERNAL
  }];
  // Raised by the router.
  // A second component registered where one (`registered`) already is
  // (`refused`). docs/design/reason-keys.md §8.13.
  ANGZARR_REASON_DUPLICATE_COMPONENT = 13 [(reason) = {
    args: ["registered", "refused"]
    grpc_status: INTERNAL
  }];
  // Raised by the component host, as a refusal to start.
  // An upcaster hosted beside a component (`component`).
  // docs/design/reason-keys.md §9.1.
  ANGZARR_REASON_UPCASTER_WITH_COMPONENT = 14 [(reason) = {
    args: ["component"]
    grpc_status: INTERNAL
  }];
  // Raised by the component host, as a refusal to start.
  // A host with no component registered (C-0504).
  // docs/design/reason-keys.md §9.2.
  ANGZARR_REASON_NO_COMPONENTS_REGISTERED = 15 [(reason) = {
    grpc_status: INTERNAL
  }];
  // Raised by the component host, as a refusal to start.
  // An upcaster given for `domain`, which no component of the host handles.
  // docs/design/reason-keys.md §9.3.
  ANGZARR_REASON_UPCASTER_UNKNOWN_DOMAIN = 16 [(reason) = {
    args: ["domain"]
    grpc_status: INTERNAL
  }];
  // Raised by the component host, as a refusal to start.
  // The upcaster registered for `domain` upcasts another domain's payloads
  // (`upcaster`). docs/design/reason-keys.md §9.4.
  ANGZARR_REASON_UPCASTER_OTHER_DOMAIN = 17 [(reason) = {
    args: ["domain", "upcaster"]
    grpc_status: INTERNAL
  }];
  // Raised by the component host, as a refusal to start.
  // A policy or projector (`component`) reading the events of `domain`,
  // which a coordinator elsewhere handles. docs/design/reason-keys.md §9.5.
  ANGZARR_REASON_REMOTE_SOURCE = 18 [(reason) = {
    args: ["component", "domain"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // An input for a process manager's root with no instance, of a type that
  // does not start one. docs/design/reason-keys.md §10.1.
  ANGZARR_REASON_PM_NO_INSTANCE = 19 [(reason) = {
    args: ["stream", "type_url"]
    grpc_status: FAILED_PRECONDITION
  }];
  // Raised by the coordinator.
  // A policy's output whose root is unset or not 16 bytes.
  // docs/design/reason-keys.md §10.2.
  ANGZARR_REASON_POLICY_COMMAND_NO_ROOT = 20 [(reason) = {
    args: ["domain", "command_type"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // A component's descriptor with no rules version.
  // docs/design/reason-keys.md §10.3.
  ANGZARR_REASON_MISSING_RULES_VERSION = 21 [(reason) = {
    args: ["component"]
    readiness: {}
  }];
  // Raised by the coordinator.
  // A stateful component's descriptor with no state type.
  // docs/design/reason-keys.md §10.4.
  ANGZARR_REASON_MISSING_STATE_TYPE = 22 [(reason) = {
    args: ["component", "component_kind"]
    readiness: {}
  }];
  // Raised by the coordinator.
  // A policy's descriptor with no output domain.
  // docs/design/reason-keys.md §10.5.
  ANGZARR_REASON_POLICY_NO_OUTPUT_DOMAIN = 23 [(reason) = {
    args: ["component"]
    readiness: {}
  }];
  // Raised by the coordinator.
  // Every run lost a race at the write to another write to the same
  // stream, until the race re-run cap; `attempts` the runs, `cap` the limit.
  // docs/design/reason-keys.md §10.6.
  ANGZARR_REASON_RETRY_CAP_EXHAUSTED = 24 [(reason) = {
    args: ["stream", "attempts", "cap"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // The rows of a deleted edition in one stream could not be removed.
  // docs/design/reason-keys.md §10.7.
  ANGZARR_REASON_EDITION_REMOVAL_FAILED = 25 [(reason) = {
    args: ["stream", "edition", "attempts", "cause"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // A policy's reaction command addressed to a domain its coordinator
  // cannot route. docs/design/reason-keys.md §10.8.
  ANGZARR_REASON_POLICY_COMMAND_UNKNOWN_DOMAIN = 26 [(reason) = {
    args: ["domain", "command_type"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // The business process that handles `domain` could not be reached.
  // docs/design/reason-keys.md §10.9.
  ANGZARR_REASON_HANDLER_UNAVAILABLE = 27 [(reason) = {
    args: ["stream", "domain", "cause"]
    grpc_status: UNAVAILABLE
  }];
  // Raised by the coordinator.
  // A reaction that would go deeper than the chain depth limit (`limit`).
  // docs/design/reason-keys.md §10.10.
  ANGZARR_REASON_CHAIN_TOO_DEEP = 28 [(reason) = {
    args: ["limit"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // The coordinator's event store failed to answer.
  // docs/design/reason-keys.md §10.11.
  ANGZARR_REASON_STORE_UNAVAILABLE = 29 [(reason) = {
    args: ["cause"]
    grpc_status: UNAVAILABLE
  }];
  // Raised by the coordinator.
  // The upcaster sidecar `domain`'s coordinator upcasts through could not
  // be reached, or answered a retryable status. docs/design/reason-keys.md
  // §10.12.
  ANGZARR_REASON_UPCASTER_UNAVAILABLE = 30 [(reason) = {
    args: ["domain", "cause"]
    grpc_status: UNAVAILABLE
  }];
  // Raised by the coordinator.
  // A handler's answer whose rules_version (`reported`) is not the version
  // the component registered (`registered`). docs/design/reason-keys.md
  // §10.13.
  ANGZARR_REASON_RULES_VERSION_MISMATCH = 31 [(reason) = {
    args: ["stream", "component", "registered", "reported"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // An input to a stream (`stream`) in an edition (`edition`) it is not
  // forked into. docs/design/reason-keys.md §10.14.
  ANGZARR_REASON_EDITION_NOT_FORKED = 32 [(reason) = {
    args: ["stream", "edition"]
    grpc_status: FAILED_PRECONDITION
  }];
  // Raised by the coordinator.
  // A policy's reaction addressed to its trigger's own stream.
  // docs/design/reason-keys.md §10.15.
  ANGZARR_REASON_POLICY_TARGETS_ITS_TRIGGER = 33 [(reason) = {
    args: ["stream", "command_type"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // A policy or projector descriptor that names no source.
  // docs/design/reason-keys.md §10.16.
  ANGZARR_REASON_NO_INPUT_DOMAIN = 34 [(reason) = {
    args: ["component", "component_kind"]
    readiness: {}
  }];
  // Raised by the coordinator.
  // A descriptor whose kind is unset, or an arm this coordinator does not
  // know. docs/design/reason-keys.md §10.17.
  ANGZARR_REASON_DESCRIPTOR_NO_KIND = 35 [(reason) = {
    args: ["component"]
    readiness: {}
  }];
  // Raised by the coordinator.
  // A fact that could not be recorded and is dead-lettered; `cause` the
  // dead letter's reason. docs/design/reason-keys.md §10.18.
  ANGZARR_REASON_FACT_DEAD_LETTERED = 36 [(reason) = {
    args: ["stream", "cause"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // An aggregate's or a process manager's descriptor with no domain.
  // docs/design/reason-keys.md §10.19.
  ANGZARR_REASON_DESCRIPTOR_NO_DOMAIN = 37 [(reason) = {
    args: ["component", "component_kind"]
    readiness: {}
  }];
  // Raised by the coordinator.
  // A handler's answer whose state (`state_type`) is not the type the
  // component registered (`registered`). docs/design/reason-keys.md §10.20.
  ANGZARR_REASON_STATE_TYPE_MISMATCH = 38 [(reason) = {
    args: ["stream", "component", "registered", "state_type"]
    grpc_status: INTERNAL
  }];
  // Raised by the coordinator.
  // HandleSync only: the decision committed, then a named projector failed
  // to project it. docs/design/reason-keys.md §10.21.
  ANGZARR_REASON_SYNC_PROJECTION_FAILED = 39 [(reason) = {
    args: ["stream", "projector", "cause"]
    grpc_status: UNAVAILABLE
  }];
  // Raised by the coordinator.
  // HandleSync with no projector named. docs/design/reason-keys.md §10.22.
  ANGZARR_REASON_SYNC_NO_PROJECTORS = 40 [(reason) = {
    grpc_status: INVALID_ARGUMENT
  }];
  // Raised by the coordinator.
  // HandleSync naming a projector (`projector`) not subscribed to the
  // command's domain (`domain`). docs/design/reason-keys.md §10.23.
  ANGZARR_REASON_SYNC_PROJECTOR_NOT_SUBSCRIBED = 41 [(reason) = {
    args: ["domain", "projector"]
    grpc_status: INVALID_ARGUMENT
  }];
}
