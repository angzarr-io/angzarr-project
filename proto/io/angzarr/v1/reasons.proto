syntax = "proto3";
package io.angzarr.v1;

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// The framework's reason keys (decisions 14.37, 14.42 and 14.44): every key
// angzarr answers, once, in the enum of the component that answers it.
//
//   RouterReason       the client library's router, in every language
//   HostReason         the client library's component host, in every
//                      language (parity/client/hosting.feature)
//   CoordinatorReason  core's coordinator and the angzarr-embedded kernel
//
// The key on the wire is the VALUE'S FULL NAME, its enum's prefix
// included: the gRPC status message, the google.rpc.ErrorInfo reason and
// Diagnostic.code are "ROUTER_REASON_DUPLICATE_COMPONENT", never a number.
// The prefix is buf's standard ENUM_VALUE_PREFIX rule, kept with no
// exception, so the key also names its owner. The numbers are bookkeeping
// only: no message carries these enums as a field, nothing encodes a key by
// its number, and renumbering one breaks nothing on the wire. Each
// *_UNSPECIFIED value exists because proto3 demands a zero; it is never
// answered.
//
// Each value's comment gives the gRPC status it travels with and the names
// of its args (the ErrorInfo metadata keys and Diagnostic.args names).
// "Readiness" means the key never travels as a status: it is a readiness
// refusal, logged and alerted (component.proto). A `cause` arg flattens a
// wrapped key and its args as `cause` and `cause.<arg>` (types.proto, the
// diagnostic region). Which class a status is (decision 14.37's four
// classes) is the coordinator's to decide, not listed here. English for a
// key comes from a Fluent catalog keyed by it, never from this file.
//
// A retryable failure carries a key too (decision 14.51): every failure a
// coordinator retries, or hands back for its caller to retry, is answered
// under a key of its own, so that when the retries are spent, whoever
// gives up (the coordinator, as the dead letter's reason, or a caller
// that owns its retries, as its last answer) reports the key, never a
// bare status.
//
// A retired key is never answered again and never reused for another
// meaning. Each enum reserves every retired key under its own prefix
// (RouterReason reserves ROUTER_REASON_MISSING_COMMAND_BOOK), so protoc
// refuses a value that would bring one back in any of them. The retired
// keys were answered bare, before the prefix, and prose may still name
// them so; `just check-reason-names` refuses either form in the
// features, the protos and the site docs. Unlike a removed field (policy
// 6.6, buf.yaml), a retired key is reserved from the moment it retires: the
// reservation guards a meaning, not stored bytes.

// Keys the client library's router answers.
enum RouterReason {
  ROUTER_REASON_UNSPECIFIED = 0;
  // INTERNAL, or the retryable status a handler picks (C-0678). Args:
  // cause.
  ROUTER_REASON_UNHANDLED_HANDLER_ERROR = 1;
  // INTERNAL. No args. Travels only as
  // ROUTER_REASON_UNHANDLED_HANDLER_ERROR's cause.
  ROUTER_REASON_HANDLER_PANICKED = 2;
  // FAILED_PRECONDITION. Args: refusal_type.
  ROUTER_REASON_COMMAND_REFUSED = 3;
  // INTERNAL. Args: sequence, type_url, first_sequence, last_sequence,
  // state_type_url, cause.
  ROUTER_REASON_FOLD_FAILED = 4;
  // INTERNAL. Args: sequence, type_url, first_sequence, last_sequence,
  // state_type_url, cause.
  ROUTER_REASON_FOLD_FAILED_EMITTED = 5;
  // DATA_LOSS. Args: type_url.
  ROUTER_REASON_PERSISTED_EVENT_CORRUPT = 6;
  // INTERNAL. Args: message_type, ext_err_txt.
  ROUTER_REASON_ANY_DECODE_FAILED = 7;
  // INTERNAL. Args: type_url, upcast_type_url. The router sends type_url
  // only; the coordinator relays it with upcast_type_url (14.39).
  ROUTER_REASON_UNKNOWN_COMMAND_TYPE = 8;
  // INTERNAL. Args: type_url, upcast_type_url. Relayed as
  // ROUTER_REASON_UNKNOWN_COMMAND_TYPE is.
  ROUTER_REASON_NO_FACT_HANDLER = 9;
  // INTERNAL. Args: command_type.
  ROUTER_REASON_NO_REFUSAL_HANDLER = 10;
  // INTERNAL. No args.
  ROUTER_REASON_CONFLICT_RESOLUTION_UNSUPPORTED = 11;
  // UNIMPLEMENTED. No args.
  ROUTER_REASON_NO_COMPONENT_OF_KIND = 12;
  // INTERNAL. No args.
  ROUTER_REASON_NO_HANDLERS_REGISTERED = 13;
  // INTERNAL. Args: component, component_kind, as the router answers it;
  // the component host answers it with registered, refused instead, naming
  // the component already registered and the one refused (C-0579; decision
  // 14.44, amended).
  ROUTER_REASON_DUPLICATE_COMPONENT = 14;
  // INTERNAL. Args: limit. A limit a router may enforce: where a client
  // library lets a handler's decision continue in follow-on steps (each
  // deciding from the state after the events before it, all of them one
  // decision, committed together), a decision that ran more steps after
  // its handler than the router's step limit (`limit`, a count). A step
  // that always continues never settles, so the same input runs the same
  // steps again: the router keeps nothing the decision emitted, and the
  // command or fact fails as a handler's bug does. Bug, fatal (decision
  // 14.37): dead-lettered and alerted at once, never retried (a retryable
  // status would re-run business code to the cap for the same answer),
  // never a policy's OnRefused (a business status would invite a
  // compensating reaction to a bug). A router that offers no follow-on
  // steps never answers it. (Decision 14.49.)
  ROUTER_REASON_TOO_MANY_STEPS = 15;

  // Retired by 14.37.
  reserved
    "ROUTER_REASON_MALFORMED_REFUSAL_FACT",
    "ROUTER_REASON_DUPLICATE_REGISTRATION",
    "ROUTER_REASON_NO_HANDLER_REGISTERED";
  // Retired by 14.39.
  reserved
    "ROUTER_REASON_DUPLICATE_UPCASTER_CHAIN",
    "ROUTER_REASON_DUPLICATE_COMMAND_HANDLER";
  // Retired by 14.42.
  reserved
    "ROUTER_REASON_MISSING_COMMAND_BOOK",
    "ROUTER_REASON_MISSING_COMMAND_PAGE",
    "ROUTER_REASON_MISSING_COMMAND_PAYLOAD",
    "ROUTER_REASON_MISSING_EVENT_BOOK_COVER",
    "ROUTER_REASON_EMPTY_POLICY_SOURCE",
    "ROUTER_REASON_POLICY_SOURCE_OUTSIDE_INPUT_DOMAIN",
    "ROUTER_REASON_REFUSAL_FACT_MISSING",
    "ROUTER_REASON_REFUSAL_WITHOUT_COMMAND",
    "ROUTER_REASON_REFUSAL_WITHOUT_EVENT",
    "ROUTER_REASON_REFUSAL_WITHOUT_REFUSED_COMMAND",
    "ROUTER_REASON_REFUSED_COMMAND_WITHOUT_ID",
    "ROUTER_REASON_REFUSAL_WITHOUT_TRIGGER_STREAM",
    "ROUTER_REASON_HOST_STATUS_UNDECODABLE",
    "ROUTER_REASON_NULL_ABI_POINTER";
}

// Keys the client library's component host answers. Each is a refusal to
// start, raised as the language's configuration error.
enum HostReason {
  HOST_REASON_UNSPECIFIED = 0;
  // INTERNAL. Args: component. An upcaster is its own sidecar (14.39),
  // never hosted beside a component.
  HOST_REASON_UPCASTER_WITH_COMPONENT = 1;
  // INTERNAL. No args. A host with no component registered (C-0504).
  HOST_REASON_NO_COMPONENTS_REGISTERED = 2;
  // INTERNAL. Args: component, described, reported. A component registered
  // with a descriptor whose rules_version (`described`) is not the version
  // its answers report (`reported`: CommandHandlerResponse.rules_version),
  // generated or written by hand alike. Refused at registration, before
  // anything is served, and nothing is registered: the coordinator would
  // refuse every answer the component gave (types.proto,
  // ComponentDescriptor; C-0743).
  HOST_REASON_DESCRIPTOR_RULES_VERSION_MISMATCH = 3;
  // INTERNAL. Args: component. A projector that names no domain it reads:
  // its descriptor's inputs are empty, as are its table's domains where
  // the client builds the descriptor from the table. There is no wildcard
  // domain (decision 14.53), so it would fold nothing. Refused at
  // registration, before anything is served, and nothing is registered;
  // a client's describe() of such a table refuses with it too (C-0747;
  // decision 14.55).
  HOST_REASON_PROJECTOR_NO_INPUT_DOMAIN = 4;

  // Retired by 14.37.
  reserved
    "HOST_REASON_MALFORMED_REFUSAL_FACT",
    "HOST_REASON_DUPLICATE_REGISTRATION",
    "HOST_REASON_NO_HANDLER_REGISTERED";
  // Retired by 14.39.
  reserved
    "HOST_REASON_DUPLICATE_UPCASTER_CHAIN",
    "HOST_REASON_DUPLICATE_COMMAND_HANDLER";
  // Retired by 14.42.
  reserved
    "HOST_REASON_MISSING_COMMAND_BOOK",
    "HOST_REASON_MISSING_COMMAND_PAGE",
    "HOST_REASON_MISSING_COMMAND_PAYLOAD",
    "HOST_REASON_MISSING_EVENT_BOOK_COVER",
    "HOST_REASON_EMPTY_POLICY_SOURCE",
    "HOST_REASON_POLICY_SOURCE_OUTSIDE_INPUT_DOMAIN",
    "HOST_REASON_REFUSAL_FACT_MISSING",
    "HOST_REASON_REFUSAL_WITHOUT_COMMAND",
    "HOST_REASON_REFUSAL_WITHOUT_EVENT",
    "HOST_REASON_REFUSAL_WITHOUT_REFUSED_COMMAND",
    "HOST_REASON_REFUSED_COMMAND_WITHOUT_ID",
    "HOST_REASON_REFUSAL_WITHOUT_TRIGGER_STREAM",
    "HOST_REASON_HOST_STATUS_UNDECODABLE",
    "HOST_REASON_NULL_ABI_POINTER";
}

// Keys core's coordinator and the angzarr-embedded kernel answer.
enum CoordinatorReason {
  COORDINATOR_REASON_UNSPECIFIED = 0;
  // ABORTED. No args.
  COORDINATOR_REASON_CONFLICT_UNRESOLVED = 1;
  // ABORTED. Args: window_units, command_units.
  COORDINATOR_REASON_CONFLICT_OVERLAP = 2;
  // FAILED_PRECONDITION. Args: type_url.
  COORDINATOR_REASON_PM_NO_INSTANCE = 3;
  // INTERNAL. Args: domain.
  COORDINATOR_REASON_REFUSAL_FACT_WRONG_STREAM = 4;
  // INTERNAL. Args: expected_domain, actual_domain.
  COORDINATOR_REASON_POLICY_COMMAND_OUTSIDE_DESTINATION = 5;
  // INTERNAL. Args: expected_edition, actual_edition.
  COORDINATOR_REASON_POLICY_COMMAND_OUTSIDE_EDITION = 6;
  // INTERNAL. Args: domain, command_type.
  COORDINATOR_REASON_POLICY_COMMAND_NO_ROOT = 7;
  // INTERNAL. Args: domain, command_type.
  COORDINATOR_REASON_POLICY_COMMAND_OTHER_CORRELATION = 8;
  // INTERNAL. No args.
  COORDINATOR_REASON_REFUSAL_FACT_ADDRESSED = 9;
  // INTERNAL. No args.
  COORDINATOR_REASON_REFUSAL_FACT_NO_PAGE = 10;
  // INTERNAL. No args.
  COORDINATOR_REASON_REFUSAL_FACT_NOT_A_FACT = 11;
  // INTERNAL. No args.
  COORDINATOR_REASON_REFUSAL_FACT_IDENTIFIED = 12;
  // Readiness. Args: component.
  COORDINATOR_REASON_MISSING_RULES_VERSION = 13;
  // Readiness. Args: component, component_kind.
  COORDINATOR_REASON_MISSING_STATE_TYPE = 14;
  // Readiness. Args: component, component_kind.
  COORDINATOR_REASON_STARTING_TYPES_ON_NON_PM = 15;
  // Readiness. Args: component, component_kind.
  COORDINATOR_REASON_STATE_ON_STATELESS_KIND = 16;
  // Readiness. Args: component, input_count.
  COORDINATOR_REASON_POLICY_INPUT_COUNT = 17;
  // Readiness. Args: component.
  COORDINATOR_REASON_POLICY_NO_OUTPUT_DOMAIN = 18;
  // Readiness. Args: component, component_kind.
  COORDINATOR_REASON_OUTPUT_DOMAIN_ON_NON_POLICY = 19;
  // ABORTED. Args: expected, actual. STRICT only. The command, under
  // STRICT, set CommandBook.handling.expected_sequence (`expected`) behind
  // the stream's head, its next_sequence (`actual`): found when the
  // command is loaded (before business code runs), or at its write, when
  // another write to the same stream landed first. Nothing is persisted.
  // Under AGGREGATE_HANDLES and COMMUTATIVE a moved stream is never answered
  // this: those resolutions apply their own rules (types.proto,
  // ConflictResolution). A command without an expected sequence that loses
  // such a race is never answered this either: the coordinator re-runs it
  // on the new head, under the race re-run cap. Business, immediate return
  // (decision 14.37): a direct caller re-reads and decides; a policy step
  // is re-run under the retry cap. (Decision 14.45.) An expected sequence
  // ahead of the head is never this, under any resolution: it is malformed,
  // COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD (decision 14.47).
  COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE = 20;
  // INTERNAL. Args: attempts, cap. Commands only: the coordinator gave up
  // on a command its caller is waiting for (Handle, HandleSync): every run
  // lost a race
  // at the write to another write to the same stream, until a cap. A
  // stamped command (no expected sequence) re-run on the new head stops at
  // the race re-run cap; an AGGREGATE_HANDLES or COMMUTATIVE command
  // re-delivered its widened window stops at the retry cap.
  // `attempts` is how many times business code ran, `cap` the configured
  // limit reached. The command is dead-lettered and alerted, and nothing
  // is persisted. INTERNAL, a fatal bug's status (decision 14.37): the
  // retries are spent and the dead letter holds the command, so no caller
  // retries it again, and a policy step that sent it follows on_policy_bug,
  // as at any cap. A lost race carries no key, so there is no cause. A
  // fact is never answered this: at the race re-run cap it is parked (OK,
  // PARKED). A command or fact dead-lettered at either cap records this
  // key, with the same args, as its AngzarrDeadLetter.reason, whether or
  // not a caller was waiting. (Decision 14.46.) The key is for write races
  // only: a retryable bug dead-lettered at its cap records its own key, as
  // last answered (decision 14.48, amended). A race re-run cap of 0 never
  // reaches this key: a lost race then goes back to its caller as the
  // store's write conflict (command_handler.proto, the status codes;
  // decision 14.46, amended), COORDINATOR_REASON_STORE_CONFLICT (decision
  // 14.51).
  COORDINATOR_REASON_RETRY_CAP_EXHAUSTED = 21;
  // INVALID_ARGUMENT. Args: expected, head. Every resolution (STRICT,
  // AGGREGATE_HANDLES, COMMUTATIVE). The command set
  // CommandBook.handling.expected_sequence (`expected`) ahead of the
  // stream's head, its next_sequence (`head`): it names a sequence the
  // stream has not reached, so it was decided against no state the stream
  // ever held, and no resolution can apply (there is no window to
  // deliver). Malformed input, found when the command is loaded (pipeline
  // step 4, before business code): business code is not invoked and
  // nothing is persisted. A head only moves forward, so it is never found
  // at the write. Business, fatal (decision 14.37): never retried; a
  // direct caller fixes the command, and a HandleAsync command, with no
  // caller to answer, is dead-lettered with this key and its args as its
  // AngzarrDeadLetter.reason, and alerted. Deduplication comes first, so a
  // command the stream already holds is answered DUPLICATE, never this.
  // Reaction commands never carry an
  // expected sequence, so they are never answered this. An expected
  // sequence behind the head is COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE
  // under STRICT. (Decision 14.47.)
  COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD = 22;
  // INTERNAL. Args: domain, command_type. A reaction command (a policy's)
  // that carries Handling (an expected_sequence or a conflict_resolution),
  // which a reaction command never may (types.proto, Handling): refused by
  // the policy's coordinator (PolicyResponse.reactions), its trigger
  // dead-lettered, or, if one reaches its destination, refused there
  // before business code and dead-lettered as a reactor bug, with this key
  // as its AngzarrDeadLetter.reason. Never delivered. (Decision 14.48,
  // amended.)
  COORDINATOR_REASON_POLICY_COMMAND_WITH_HANDLING = 23;
  // INTERNAL. Args: edition, attempts, cause. The rows of a deleted
  // edition in one stream could not be removed (meta.proto,
  // DeleteEdition): the removal is dead-lettered (the stream and its
  // meta.EditionDeleted as AngzarrDeadLetter.failed_edition_removal) with
  // this key as its reason, and alerted. `attempts` is how many removals
  // were tried, `cause` the store's failure. Never answered to a caller:
  // DeleteEdition has already answered. (Decision 14.48, amended.)
  COORDINATOR_REASON_EDITION_REMOVAL_FAILED = 24;
  // INTERNAL. Args: domain, command_type, field. A reaction command (a
  // policy's) that sets its own command_id or causation_id (`field`, the
  // field's name) to a value other than the one its coordinator stamps
  // (types.proto, the command_identity region): refused by the policy's
  // coordinator (PolicyResponse.reactions), its trigger dead-lettered with
  // this key as its AngzarrDeadLetter.reason, and alerted. Never
  // delivered. (Decision 14.48, amended.)
  COORDINATOR_REASON_POLICY_COMMAND_OTHER_IDENTITY = 25;
  // INTERNAL. Args: domain, command_type (the Fact's payload type). A
  // policy's reaction that is a Fact (CommandPage.body = Fact): a policy's
  // business code emits Commands only, and its refusal facts come from
  // OnRefused (policy.proto, PolicyService, Refusals). Refused by the
  // policy's coordinator (PolicyResponse.reactions), its trigger
  // dead-lettered with this key as its AngzarrDeadLetter.reason, and
  // alerted. Never delivered. (Decision 14.48, amended.)
  COORDINATOR_REASON_POLICY_COMMAND_IS_FACT = 26;
  // INTERNAL. Args: domain, command_type. A reaction command (a policy's)
  // that carries fact_origin, which only a Fact carries (types.proto, the
  // command_identity region): refused by the policy's coordinator
  // (PolicyResponse.reactions), its trigger dead-lettered, or, if one
  // reaches its destination, refused there before business code and
  // dead-lettered as a reactor bug, with this key as its
  // AngzarrDeadLetter.reason, and alerted. Never delivered. (Decision
  // 14.48, amended.)
  COORDINATOR_REASON_POLICY_COMMAND_FACT_ORIGIN = 27;
  // INTERNAL. Args: domain, command_type. A reaction command (a policy's)
  // addressed to a domain its coordinator cannot route: no component of
  // the domain is registered with it, and it knows no coordinator for the
  // domain elsewhere. Found when the reactions are checked
  // (PolicyResponse.reactions), after the destination check
  // (COORDINATOR_REASON_POLICY_COMMAND_OUTSIDE_DESTINATION): refused, its
  // trigger dead-lettered with this key as its AngzarrDeadLetter.reason
  // (processing_failed), and alerted. Never delivered. Bug, fatal
  // (decision 14.37): a deployment that wires a policy to a domain it does
  // not host is fixed by its operator, not by a retry. A client's command
  // for an unknown domain is the client's malformed input, never this.
  // (Decision 14.49.)
  COORDINATOR_REASON_POLICY_COMMAND_UNKNOWN_DOMAIN = 28;
  // UNAVAILABLE. Args: domain, cause. The coordinator could not reach the
  // business process that handles `domain`: its process is not running,
  // the connection or the transport failed, or the call timed out before
  // an answer (`cause`, the transport's failure, a third-party library's
  // text as `cause.ext_err_txt`). Nothing ran and nothing was written.
  // Bug, retryable (decision 14.37): UNAVAILABLE means resend, under the
  // retry cap with backoff and jitter. At the cap the input is
  // dead-lettered with this key and its args, as last answered, as its
  // AngzarrDeadLetter.reason (processing_failed, is_transient true), never
  // COORDINATOR_REASON_RETRY_CAP_EXHAUSTED, which is for write races only
  // (decision 14.48, amended), and alerted. A business process that is
  // reached and answers a retryable bug of its own answers
  // ROUTER_REASON_UNHANDLED_HANDLER_ERROR (C-0678), never this.
  // (Decision 14.49.)
  COORDINATOR_REASON_HANDLER_UNAVAILABLE = 29;
  // INTERNAL. Args: limit. A limit a coordinator may enforce: where it
  // follows a chain of reactions from the input a caller sent (the input
  // at depth 0, a policy's reaction to its events at depth 1, and so on),
  // a reaction that would go deeper than its chain depth limit (`limit`,
  // configuration): a policy cycle that never settles, or a cascade longer
  // than allowed. The reaction is not delivered; the trigger whose
  // reaction it was is dead-lettered with this key as its
  // AngzarrDeadLetter.reason (processing_failed, retry_count 0,
  // is_transient false), and alerted. Bug, fatal (decision 14.37): the
  // same chain runs as deep again, so a retry cannot help, and a business
  // status would reach OnRefused, whose reaction deepens the chain. A
  // coordinator that does not follow chains never answers it. (Decision
  // 14.49.)
  COORDINATOR_REASON_CHAIN_TOO_DEEP = 30;
  // UNAVAILABLE. Args: expected, actual. A race re-run cap of 0 (decision
  // 14.46, amended): a stamped command or fact (no expected sequence, so
  // the coordinator stamped the head it loaded, `expected`) lost a race at
  // its write to another write to the same stream, now at `actual`, and
  // the coordinator, opted out of re-running it, hands it back at once,
  // with no wait. Nothing is persisted. Bug, retryable (decision 14.37):
  // UNAVAILABLE means resend, and a resend is safe, since nothing was
  // written; the consumer that owns its retries resends, and if its own
  // retries are spent, this key is what it reports. The coordinator never
  // dead-letters, parks or alerts on it: a fact is answered this, never
  // PARKED, and a policy step that fails with it holds its position at
  // its trigger, so the next catch-up runs it again (C-0740 to C-0742).
  // Never answered at a race re-run cap above 0, where a lost race is
  // re-run and, at the cap, COORDINATOR_REASON_RETRY_CAP_EXHAUSTED; never
  // a STRICT command's, whose lost race is
  // COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE. (Decision 14.51.)
  COORDINATOR_REASON_STORE_CONFLICT = 31;
  // UNAVAILABLE. Args: cause. The coordinator's event store failed to
  // answer (I/O, a timeout, a dropped connection, a busy or locked
  // database: `cause`, the store's failure, a third-party driver's text as
  // `cause.ext_err_txt`); a write may or may not have landed. Bug,
  // retryable (decision 14.37): resent under the retry cap with backoff
  // and jitter, safe because a resend starts at deduplication (a write
  // that landed after all is answered DUPLICATE). At the cap the input is
  // dead-lettered with this key and its args, as last answered, as its
  // AngzarrDeadLetter.reason (processing_failed, is_transient true), and
  // alerted; a waiting caller is answered this key. A write that lost a
  // race is never this: the store was sure (COORDINATOR_REASON_STORE_CONFLICT
  // at a race re-run cap of 0, a re-run otherwise). (Decision 14.51.)
  COORDINATOR_REASON_STORE_UNAVAILABLE = 32;
  // UNAVAILABLE. Args: domain, cause. The upcaster sidecar `domain`'s
  // coordinator upcasts through (decision 14.39) is configured but could
  // not be reached, or answered under a retryable status (`cause`): the
  // coordinator delivers nothing it would have to upcast and reports
  // NOT_SERVING (upcaster.proto, Failure). A waiting caller and a query
  // are answered this key, to resend; queued and reaction deliveries stay
  // queued until the sidecar is back, so it is never a dead letter's
  // reason. A rule that fails (an error status from Upcast) is a handler
  // bug, never this. (Decision 14.51.)
  COORDINATOR_REASON_UPCASTER_UNAVAILABLE = 33;
  // UNAVAILABLE. Args: domain. The coordinator holds no descriptor of
  // `domain`'s component (component.proto, Registration): it has not yet
  // been described, or its Describe failed or was refused, so the
  // coordinator delivers nothing to it. A waiting caller is answered this
  // key, to resend; queued and reaction deliveries stay queued until the
  // component is registered, so it is never a dead letter's reason. A
  // business process that is described and then cannot be reached is
  // COORDINATOR_REASON_HANDLER_UNAVAILABLE. (Decision 14.51.)
  COORDINATOR_REASON_COMPONENT_NOT_REGISTERED = 34;
  // UNIMPLEMENTED. Args: domain. A command or fact sent to a standalone
  // query server for `domain`'s event store, which has no component
  // behind it and takes no commands (query_server.feature, C-0588). Bug,
  // retryable (decision 14.37): a misroute or a stale deployment, which
  // the caller's resend to the right address, or a corrected deployment,
  // can clear. Never a dead letter's reason: a query server queues
  // nothing. (Decision 14.51.)
  COORDINATOR_REASON_COMMANDS_NOT_SERVED = 35;
  // UNAVAILABLE. Args: uri, cause. A claim-checked payload
  // (PayloadReference, at `uri`) the coordinator could not retrieve from
  // its payload store (`cause`, the store's failure, a third-party
  // library's text as `cause.ext_err_txt`). Bug, retryable (decision
  // 14.37): retried under the retry cap with backoff and jitter; at the cap
  // dead-lettered with this key and its args as its
  // AngzarrDeadLetter.reason, payload_retrieval_failed its details
  // variant, with this key as its failure, and alerted (C-0447).
  // (Decision 14.51.)
  COORDINATOR_REASON_PAYLOAD_UNAVAILABLE = 36;
  // INTERNAL. Args: component, registered, reported. A
  // CommandHandlerResponse whose rules_version (`reported`, an empty one
  // included) is not the version the component registered (`registered`:
  // its ComponentDescriptor.rules_version). Bug, fatal (decision 14.37):
  // refused and nothing persisted; a caller of Handle or HandleSync is
  // answered it, an asynchronous or reaction delivery dead-lettered with
  // it as its AngzarrDeadLetter.reason and alerted (command_handler.proto,
  // Handle; C-0558, C-0559, C-0748). (Decision 14.56.)
  COORDINATOR_REASON_RULES_VERSION_MISMATCH = 37;

  // Retired by 14.37.
  reserved
    "COORDINATOR_REASON_MALFORMED_REFUSAL_FACT",
    "COORDINATOR_REASON_DUPLICATE_REGISTRATION",
    "COORDINATOR_REASON_NO_HANDLER_REGISTERED";
  // Retired by 14.39.
  reserved
    "COORDINATOR_REASON_DUPLICATE_UPCASTER_CHAIN",
    "COORDINATOR_REASON_DUPLICATE_COMMAND_HANDLER";
