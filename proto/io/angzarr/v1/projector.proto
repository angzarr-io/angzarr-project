syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// ProjectorService: client logic that projects events to read models
// client logic doesn't care about sync - coordinator decides
//
// Events from a non-main edition are projected like any others; the
// projection's output follows that edition's storage configuration (an
// in-memory edition's projections are kept in memory; see Cover.edition).
// A non-main edition never reaches an external sink: a CloudEventsResponse
// projected from a non-main edition's events is never routed to the
// CloudEvents HTTP or Kafka sinks, nor to any other automation with
// effects outside angzarr (see cloudevents.proto).
service ProjectorService {
  // Async projection - projector should persist and return
  rpc Handle(EventBook) returns (Projection);
}

// ProjectorCoordinatorService: orchestrates projection processing
service ProjectorCoordinatorService {
  // Synchronous processing: project the events and return the projection.
  // "Sync" is in the name; the request is the EventBook itself, with no
  // mode wrapper. The command coordinator's HandleSync (SIMPLE) calls this
  // for each synchronous projector.
  rpc HandleSync(EventBook) returns (Projection) {
    option (google.api.http) = {
      post: "/v1/projector/sync"
      body: "*"
    };
  }
  // Asynchronous processing: accept the events for projection and return
  // without waiting (fire and forget). Named for the mode, as on the command
  // coordinator (HandleAsync / HandleSync).
  rpc HandleAsync(EventBook) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/projector/async"
      body: "*"
    };
  }
}
