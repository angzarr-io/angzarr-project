// DOC: This file is referenced in docs/docs/reference/patterns.mdx
//      Update documentation when making changes to ConflictResolution,
//      Handling, Cover (editions), Snapshot, the command identity
//      fields, or the CommandPage body. The command handling modes
//      (DECISION, ASYNC, SIMPLE) are RPCs, documented in
//      command_handler.proto.

syntax = "proto3";
package io.angzarr.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
// Sentry-compat structured stack-trace + error-chain capture from the sererr
// project (sererr.fyi). The schema is vendored in this repo at
// proto/sererr/v1/sererr.proto and resolves from the same proto root as
// this file.
import "sererr/v1/sererr.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// Type URLs. Every google.protobuf.Any an Angzarr implementation emits uses
// the type URL "/" + the message's fully-qualified name (TYPE_URL_PREFIX =
// "/"), e.g. "/io.angzarr.v1.EventPage", "/orders.OrderCreated". Readers
// accept any prefix: a type URL identifies the message whose fully-qualified
// name is the text after its last "/", so
// "type.googleapis.com/orders.OrderCreated", "/orders.OrderCreated" and
// "orders.OrderCreated" all name the same message.
// Matching compares full names exactly: "orders.OrderCreated" never matches
// "OrderCreated" or "orders.v2.OrderCreated".

// region uuid
// A UUID as its 16 bytes, most significant first (RFC 9562 byte order).
// The ONE type for every UUID on the wire: roots, command ids and
// correlation ids. 16 bytes, not 36 characters of text, because every
// stored event carries several of them (pass 9, decision 9.1).
//
// Where a UUID comes from:
//   - caller-chosen roots are any 16 bytes, never inspected;
//   - framework-derived ids are UUIDv5 (RFC 9562, SHA-1 name-based) under a
//     fixed angzarr namespace (see the derived_ids region): roots from
//     compute_root, and the command id of every reaction command and every
//     fact;
//   - minted ids are UUIDv7 (see the minted_ids region).
// Client-supplied command and correlation ids must be UUIDs too, of any
// version: a set UUID whose value is not exactly 16 bytes (an empty value
// included) is malformed and refused INVALID_ARGUMENT wherever it is
// accepted. An unset UUID field means "not supplied". The framework checks
// only the length, never the version or variant bits.
//
// Operations use UUID objects. Code compares, stores, hashes and passes the
// 16 bytes; it never round-trips through text. Conversion to and from the
// canonical text form (36 characters, lowercase hex, hyphenated 8-4-4-4-12,
// RFC 9562) happens only at display and input boundaries (logs, consoles,
// CLI arguments, URLs a human types), through per-language helpers (Rust:
// the angzarr-proto crate's Display and FromStr; the other client libraries:
// backlog UU-1). Input helpers accept the hyphenated form in either case and
// output helpers always write lowercase.
//
// Protobuf JSON (and so REST transcoding) renders the bytes as base64, e.g.
// {"value": "1HQbGlLNQ8+t0T27lhVRCw=="}. That is accepted: storage cost wins
// over JSON readability, and the display helpers are for humans.
message UUID {
  bytes value = 1;
}
// endregion

// region derived_ids
// Framework-derived identifiers: UUIDv5 (RFC 9562 section 5.5, SHA-1
// name-based) under fixed angzarr namespace UUIDs. Every runtime (core, each
// client library, annals) derives the same 16 bytes from the same name. The
// name is always the UTF-8 encoding of the text shown, with no
// normalisation.
//
// Derived roots: compute_root(domain, key) =
//   UUIDv5(ANGZARR_ROOT_NAMESPACE, "{domain}:{key}")
//   ANGZARR_ROOT_NAMESPACE = d4741b1a-52cd-43cf-add1-3dbb9615510b
// The domain never contains ':' (see Cover.domain), so the first ':' splits
// the name unambiguously whatever the key holds. Example:
//   compute_root("player", "alice@example.com")
//     = cfe936c0-2912-5ca9-96e6-f37c0b441759
//
// Reaction command ids (see the command_identity region). The command a
// policy emits as the index-th command (0-based, in emission order) of its
// reaction to the trigger event T has (a process manager emits no
// commands; decision 14.31)
//   command_id = UUIDv5(ANGZARR_COMMAND_NAMESPACE, name)
//   ANGZARR_COMMAND_NAMESPACE = e2c9f744-9fe1-4b4b-bfee-ae514dde293b
// where name is six netstrings, concatenated:
//   ns(T.stream.domain) ns(T.stream.edition, "" when unset)
//   ns(T.stream.root as canonical lowercase text)
//   ns(T.sequence in decimal) ns(component) ns(index in decimal)
// and ns(s) is a netstring: the byte length of the UTF-8 s in decimal, ':',
// s itself, ','. component is the reacting component's registered name.
// Netstrings make the split unambiguous whatever the strings hold (a
// component or edition may contain ':' or ','), and a set edition is never
// empty, so "0:," always means main. Worked example: the trigger
// {domain "list", main, root 01920c8e-7b3a-7cc2-9f4e-5a1b2c3d4e5f, sequence
// 7}, component "reminders", index 0 has the 70-byte name
//   4:list,0:,36:01920c8e-7b3a-7cc2-9f4e-5a1b2c3d4e5f,1:7,9:reminders,1:0,
// and the command id 45764676-e6e4-56fe-8c80-d782423577ee. Index 1 gives
// e45bdfdf-d722-56c8-a4bd-35340c9c3c06; the same trigger in edition
// "what-if" (name 4:list,7:what-if,36:...) gives
// e2321e9e-d55a-5f48-bbe1-b09081c2e445; component "a,b:c" (name
// ...,1:7,5:a,b:c,1:0,) gives 27ccb6bf-e37e-54bd-b0f0-9eac56ff5f93.
// The name never includes the reactor's rules_version or anything else
// about its code, so a re-run reproduces the same ids (see Reactor re-runs
// in the command_identity region).
//
// Fact command ids and correlations. A fact's command id is
//   UUIDv5(ANGZARR_FACT_CORRELATION_NAMESPACE, external_id)
//   ANGZARR_FACT_CORRELATION_NAMESPACE = e9ef0ae2-6fc6-4c14-b713-ef03971dd867
// and a fact whose correlation_id is unset gets the same value as its
// correlation (as a client command's absent correlation is its command id;
// see the command_identity region). The namespace keeps its pass-9 name and
// value, so pass-9 fact correlations are unchanged. Example: external_id
// "pi_1234" = 917f26ae-ea2e-58af-86de-77013a69617e.
//
// Refusal facts take no derivation (decision 14.31): a refusal fact's
// command_id IS the refused command's command_id, which is already a
// reaction command id derived above (PolicyService in policy.proto, Refusals;
// the command_identity region).
//
// Three namespaces, not one: "{domain}:{key}" is also a valid external_id,
// so under one namespace a fact's command id could equal a stream's root;
// and a reaction's name could equal some external_id. Separate namespaces
// keep the id spaces unrelated by construction. All three values were
// generated once as random UUIDv4s, as RFC 9562 suggests for a new
// namespace, and never change: changing one changes every derived id, and
// with it every stored command id that deduplication looks up.
// endregion

// region minted_ids
// Minted identifiers. Every identifier the framework mints is a UUIDv7
// (RFC 9562): time-ordered, so minted ids sort by creation time and index
// well, with 74 random bits. This holds in angzarr (coordinator and client
// libraries) and in annals alike. On the wire a minted id is a UUID message
// (16 bytes). Today the framework mints:
//   - CommandPage.command_id of a client Command that arrives without one;
//   - correlation, only indirectly: an absent correlation on a client
//     Command is its command id verbatim (see the command_identity region),
//     which may be a minted one;
//   - ids an SDK mints on its caller's behalf (a command helper's
//     command_id, a new aggregate root); these count as client-supplied.
// Client-supplied identifiers are never inspected beyond their shape: a
// command_id, correlation_id or root is any 16 bytes (see UUID); an
// external_id is an opaque string the framework never parses or reformats.
// Not identifiers, so not covered: the conflict nonce
// (ContextualCommand.conflict_nonce, opaque per-delivery bytes) and
// store-assigned row numbers (e.g. the DLQ's int64 entry ids).
// endregion

// region cover
// Stream identity, and nothing else: one stream is (domain, edition, root).
// Everything that varies per write or per page (command id, correlation,
// causation, fact source) lives on the page and its meta (CommandPage,
// EventMeta), and how a command
// is handled (expected sequence, conflict resolution) lives on
// CommandBook.handling;
// never on the Cover. Parent/child relationships between aggregates are
// carried in domain event payloads, not in the Cover.
message Cover {
  string domain = 2; // Domain name; never contains ':' (the root-derivation separator)
  // The stream's root: caller-chosen (any 16 bytes), derived by
  // compute_root (UUIDv5; see the derived_ids region) or minted (UUIDv7).
  // A process manager's stream is no exception: a command or fact
  // addressed to it names its root, whatever its correlation_id; by
  // convention a policy may set it to its trigger's correlation_id
  // (process_manager.proto, Stream; decisions 14.30 and 14.36).
  UUID root = 1;
  // Edition: the NAME of the timeline the stream belongs to.
  //
  // Main timeline: unset (absent). The main timeline has no name; there is
  // no magic value for it. A set edition is a named, non-main edition and
  // must be non-empty: a set empty string is malformed and refused
  // INVALID_ARGUMENT wherever a Cover is accepted. Editions are part of
  // stream identity on the wire
  // (here and in EventRef.stream), so an edition's events can never be
  // mistaken for, or copied as, main-timeline events.
  //
  // Per-stream forks (decision 14.32, the owner's ruling of 2026-10-28).
  // An edition is a set of per-stream FORKS, and nothing else: there is no
  // edition registry and no separate metadata store. Stream (D, X, R)
  // exists in edition X from its creation: an EditionCreated meta-event
  // (meta/events.proto) at the sequence it states (its parent_sequence),
  // at or below main's head for (D, main, R), the sequence main would use
  // next; above it is a conflict (decision 14.36). That event is the first
  // of X's version of the stream, and its sequence marks main's end and
  // X's start for that stream. The fork point is per stream: no
  // cross-stream snapshot is promised.
  //   - Read rule, per stream: (D, X, R) reads main's events BELOW ITS OWN
  //     fork sequence, then X's own events (the fork event first). Main's
  //     later events never reach it.
  //   - Creating X forks an origin stream (EditionAdminService.ForkStream,
  //     meta.proto).
  //   - The fork TRAVELS WITH THE DATA (the owner's ruling): when a policy's
  //     command in X reaches a stream with no fork in X, that arrival is
  //     the propagation; the angzarr system layer forks the stream then,
  //     at the main head it reads, and the command is handled
  //     (meta.EditionCreated, Propagation). Streams X's activity
  //     never touches are never forked.
  //   - A command or fact from outside (not a policy's) addressed in X to a
  //     stream with no fork in X is REFUSED until propagation forks it:
  //     FAILED_PRECONDITION, google.rpc.ErrorInfo reason EDITION_NOT_FORKED
  //     (the owner's ruling). Fork it with ForkStream to address it
  //     directly.
  //   - A query or subscription of a stream not forked in X reads main's
  //     version (it is identical so far) and forks nothing.
  //   - Unknown edition: an edition is known while any fork event of it
  //     exists (a query over X's own fork events, never main;
  //     cacheable). A command, query or subscription naming an edition
  //     that was never created, or was deleted, is refused loudly
  //     (NOT_FOUND), never silently given storage: a misspelt edition
  //     cannot write anywhere.
  //   - Deleting X is an event too (meta.EditionDeleted): recorded in each
  //     stream it reaches, propagated onward through the policy flows, and
  //     only then are that stream's rows of X removed, the event included.
  //   - Main knows nothing of an edition: its lifecycle lives only in the
  //     edition's streams and store (the editions region).
  //
  // What-if execution. A what-if is a command run in an edition: send an
  // ordinary CommandBook whose cover names the edition. There is no
  // separate speculative RPC. Reactions (policies) stay in the edition of the
  // event they react to, and so do the commands and refusal facts they
  // send.
  //
  // Storage. Where an edition's rows live is configuration (an edition
  // name, or pattern, mapped to a store; otherwise the configured default
  // edition store), which may be in memory, redis, another persistent
  // store, or the existing production database (the edition is part of the
  // storage key, and the edition column stays in every database schema so
  // the existing database can host editions). Nothing is recorded about
  // placement: there is no record. Placement never changes the wire
  // contract. Projector output follows the edition's storage: an in-memory
  // edition's projections are kept in memory.
  //
  // Lifetime follows the backend: memory lives as long as the process, redis
  // as long as its TTL, a database persists. EditionAdminService.DeleteEdition
  // (meta.proto) deletes a named edition explicitly: every row tagged with
  // it, once its in-flight work is done; main cannot be named, so it can
  // never be deleted.
  optional string edition = 4;
}
// endregion

// region conflict_resolution
// Conflict resolution: how the aggregate coordinator treats a command whose
// expected sequence (Handling.expected_sequence) is behind the stream's
// head (a stale command). An expected sequence AHEAD of the head is no
// conflict at all, under any resolution: it is malformed (below). Carried by Handling.conflict_resolution. Three
// resolutions: STRICT, AGGREGATE_HANDLES and COMMUTATIVE. (Renamed from
// MergeStrategy: Axon calls the same choice conflict resolution.)
//
// Which resolutions a component supports is a property of its state
// message, declared with the (io.angzarr.v1.state) option (StateOptions,
// below; options.proto) and carried at registration in
// ComponentDescriptor.state. Every state supports STRICT and
// AGGREGATE_HANDLES (the implicit base); COMMUTATIVE is supported only
// where the state lists it and marks its conflict units.
//
// The DEFAULT is COMMUTATIVE where the state supports it, and STRICT
// otherwise. The coordinator learns which from the registered
// StateDescriptor (a list of enum values, never the state's schema, so it
// stays domain-blind). Configuration and Handling may choose another
// supported resolution (see Handling for the precedence).
//
// CONFLICT_RESOLUTION_UNSPECIFIED (the zero value) means "not specified":
// the configured default applies (see Handling). After the coordinator
// resolves Handling, conflict_resolution is never UNSPECIFIED. A command,
// or configuration, that names a resolution the component's state does not
// support is malformed: the command is refused INVALID_ARGUMENT before
// deduplication, and the configuration is refused when it is loaded or
// when the coordinator receives the component's descriptor (see
// ComponentService in component.proto).
//
// The strategy matters only for commands whose sender provided
// expected_sequence. A command without one is stamped by the framework with
// the head it decides against, so it can never be stale: if another write
// to the same stream lands between its load and its write, the coordinator
// re-runs it on the new head (optimistic concurrency, per stream only;
// decision 14.45). Re-runs are capped by the race re-run cap (default 10
// runs), with exponential backoff and jitter between them (the status
// codes in command_handler.proto; decision 14.46).
//
// COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE is STRICT's alone: under
// STRICT, a stream that has moved, found at load or because another write
// to the same stream lands between the command's load and its write, fails
// the command ABORTED with that key (args expected, actual), nothing is
// persisted, and the command is never re-run. Under AGGREGATE_HANDLES and
// COMMUTATIVE a moved stream is never answered that key: each applies its
// own rule, below. If another write to the same stream lands after the
// window is delivered and before the command's write (a race lost at the
// write), the coordinator re-delivers the widened window (expected_sequence
// .. the new head-1, with a fresh nonce) and the resolution's rule decides
// again on it: AGGREGATE_HANDLES's nonce, COMMUTATIVE's unit overlap.
// Re-deliveries are capped by the retry cap (the status codes in
// command_handler.proto; decision 14.45).
//
// A command that reaches either cap is dead-lettered and alerted, as any
// exhausted retry is, and nothing is persisted; a caller waiting on Handle
// or HandleSync is answered INTERNAL,
// COORDINATOR_REASON_RETRY_CAP_EXHAUSTED (args attempts, cap; decision
// 14.46). A fact (always stamped) that reaches the race re-run cap is
// dead-lettered and alerted too, but never refused: its sender is answered
// "accepted, parked" (see Fact). Either dead letter's reason is
// COORDINATOR_REASON_RETRY_CAP_EXHAUSTED with the same args.
//
// The concurrency window is the run of events the command did not see:
// sequences handling.expected_sequence .. head-1 (see ContextualCommand).
//
// AHEAD of the head. A provided expected_sequence greater than the
// stream's head (its next_sequence) names a state the stream never held:
// there is nothing for any resolution to decide, and no window to
// deliver. Under STRICT, AGGREGATE_HANDLES and COMMUTATIVE alike the
// command is malformed: refused INVALID_ARGUMENT,
// COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD (args expected, head), when
// it is loaded (pipeline step 4, see Handling), before business code;
// business code is not invoked and nothing is persisted. Business, fatal
// (decision 14.37): never retried; a HandleAsync command so refused is
// dead-lettered with the key as its reason, and alerted. Deduplication
// (step 3) comes first, so a command the stream already holds is answered
// DUPLICATE, never the key. A head only moves forward, so a
// command is never found ahead at its write. Every rule below concerns a
// sequence at or behind the head (decision 14.47).
//
// STRICT: a sequence behind the head rejects with ABORTED,
// COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE (args expected, actual; a
// failed test-and-set: the caller re-reads and re-issues), before business
// code runs. STRICT runs in the coordinator.
// AGGREGATE_HANDLES: no coordinator check (never
// COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE); decide receives the events
// since the expected sequence (the window) with the command and applies its
// own conflict rule. The window is always delivered as pages: the snapshot
// delivered with the command is at or below expected_sequence-1, never one
// that has already folded part of the window (see ContextualCommand).
//
// Safety default (the nonce). Under AGGREGATE_HANDLES the handler cannot
// silently ignore the window: the coordinator delivers a nonce with the
// command (ContextualCommand.conflict_nonce), and the handler must call
// resolve_conflicts(...) with that value before it returns. The client
// library reports the value the handler resolved with
// (CommandHandlerResponse.conflict.resolved_nonce; empty when it never
// called it), and the coordinator compares it with the nonce it minted. A
// handler that returns without doing so (or passes another value) fails the
// command as stale (ABORTED, COORDINATOR_REASON_CONFLICT_UNRESOLVED), exactly as STRICT would
// have, and nothing is persisted (decision 14.42).
// (Axon's ConflictResolver likewise fails a command whose handler never
// examined the conflicting events.)
//
// COMMUTATIVE: the client library resolves the window automatically, so
// business code writes no conflict logic (and the coordinator never answers
// COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE: an overlap is
// COORDINATOR_REASON_CONFLICT_OVERLAP). The window and the nonce are
// delivered exactly as under AGGREGATE_HANDLES, and the same snapshot rule
// applies (the delivered snapshot is at or below expected_sequence-1, so
// the window arrives as pages). The library, not the handler, then computes
// CONFLICT UNITS (the conflict_units region of options.proto, which defines
// them field kind by field kind):
//   window = changed(state at expected_sequence, state at the head)
//   decide runs on the head state, so its invariants are checked against
//     the window's effects
//   mine   = changed(head, head with the command's events folded in)
// changed() is generated from the state message's (state) and (conflict)
// markers, the current ones of the code running decide.
// and answers window and mine with the events
// (CommandHandlerResponse.conflict). The coordinator judges them (decision
// 14.42). Disjoint (no overlap, as options.proto defines it): the command's
// events are kept. Overlapping: the command fails as stale (ABORTED,
// COORDINATOR_REASON_CONFLICT_OVERLAP), as under STRICT, and nothing is persisted. Unmarked
// fields conflict with everything, so an unmarked change can only make
// COMMUTATIVE stricter. The states are computed in the client library: there
// is no Replay RPC and the coordinator never reads a state; it compares two
// sets of unit paths. To the coordinator COMMUTATIVE is delivered exactly
// like AGGREGATE_HANDLES.
//
// COMMUTATIVE is a justified divergence from established frameworks (none
// of Axon, Marten, Eventuous, KurrentDB or NServiceBus ships automatic
// field-overlap merging): it serves goal 2, hiding CQRS/ES complexity so
// implementors do not write conflict logic, and it is the default only for
// a state whose author declared conflict units. Because decide runs on the
// head, the invariants decide checks still hold; what no structural
// comparison can see is a caller's intent that depended on state the window
// changed in a disjoint unit (the caller read A, decided to change B), or a
// stored value derived from another unit. The developer guide
// (docs/guide/state-and-conflicts.md) treats that as a modelling failure
// and shows the fixes.
//
// Conflict-resolution helpers live in the per-client libraries, computed
// locally over the events delivered with the command; there is no
// framework RPC for conflict resolution.
enum ConflictResolution {
  CONFLICT_RESOLUTION_UNSPECIFIED = 0; // Not specified: the configured default applies (COMMUTATIVE if the state supports it, else STRICT)
  CONFLICT_RESOLUTION_COMMUTATIVE = 1; // Accepted iff the window and the command change disjoint conflict units (options.proto): the client library reports them, the coordinator judges
  CONFLICT_RESOLUTION_STRICT = 2; // Reject a command behind the head, ABORTED (optimistic concurrency); one ahead is malformed under every resolution
  CONFLICT_RESOLUTION_AGGREGATE_HANDLES = 3; // decide receives the window and applies its own conflict rule
}

// What a state message supports: the value of the (io.angzarr.v1.state)
// message option (options.proto), and, resolved, of
// StateDescriptor.options. Defined here, beside ConflictResolution and the
// runtime messages that carry it; options.proto imports it.
//
// As written on a state message, the list ADDS to the implicit base of
// STRICT and AGGREGATE_HANDLES: no option at all means exactly those two,
// and in practice the only value worth listing is COMMUTATIVE. Listing a
// base value is redundant and harmless; UNSPECIFIED is a generation error.
// As generated into StateDescriptor.options, the list is the full resolved
// set, base included, deduplicated, in enum-number order (e.g.
// [COMMUTATIVE, STRICT, AGGREGATE_HANDLES]).
message StateOptions {
  repeated ConflictResolution conflict_resolutions = 1;
}
// endregion

// region payload_reference
// TRANSPORT-ONLY: claim-check references for the message bus.
//
// A bus envelope may carry a PayloadReference in place of an oversized
// payload when the payload exceeds the bus's size limit; the receiving side
// resolves it back into the payload before anything else sees the message.
// PayloadReference is never part of a persisted page: EventPage and
// CommandPage payloads are always a plain google.protobuf.Any, and the
// event store records the resolved payload. (These protos define no bus
// envelope message; the transport layer owns that envelope.)

// Storage backend type for externally stored payloads (claim check pattern).
enum PayloadStorageType {
  PAYLOAD_STORAGE_TYPE_UNSPECIFIED = 0;
  PAYLOAD_STORAGE_TYPE_FILESYSTEM = 1;
  PAYLOAD_STORAGE_TYPE_GCS = 2;
  PAYLOAD_STORAGE_TYPE_S3 = 3;
}

// Reference to an externally stored payload (claim check pattern), carried
// only by a bus envelope, never by a persisted page (see above).
message PayloadReference {
  PayloadStorageType storage_type = 1;
  // Location URI:
  // - file:///var/angzarr/payloads/{hash}.bin
  // - gs://bucket/prefix/{hash}.bin
  // - s3://bucket/prefix/{hash}.bin
  string uri = 2;
  // Content hash for integrity verification and deduplication (SHA-256)
  bytes content_hash = 3;
  // Original serialized payload size in bytes
  uint64 original_size = 4;
  // Timestamp when payload was stored (for TTL cleanup)
  google.protobuf.Timestamp stored_at = 5;
}
// endregion

// region event_page
// One persisted event. Sequences are uint64 wherever they appear (pages,
// snapshots, next_sequence, query ranges, DLQ details): a stream's sequence
// space is not bounded at 2^32.
//
// An event has no business-time field of its own: when it was recorded is
// EventMeta.recorded_at, and any business time (e.g. when an external fact
// originally occurred) belongs in the event payload.
message EventPage {
  // The domain event. Its type URL names the event type and version
  // (versioned packages: pkg.v1.Foo -> pkg.v2.Foo).
  google.protobuf.Any payload = 3;
  EventMeta meta = 8; // Provenance: which command, why, when recorded, under which rules (see EventMeta)
  // The event's position in its stream (domain, edition, root). Always
  // definite: assigned by the framework when the event is persisted, never
  // deferred. Together with the stream it is the event's identity (EventRef).
  uint64 sequence = 9;
}
// endregion

// region event_ref
// Identifies one event: the page at `sequence` in the stream `stream`. This
// is an event's identity — no separate event id is minted — and is how a
// reaction names the event it reacted to (CommandPage.causation_id).
message EventRef {
  Cover stream = 1; // The stream holding the event (domain, edition, root)
  uint64 sequence = 2; // The event's EventPage.sequence within that stream
}
// endregion

// region command_identity
// Why a command exists, and how it is deduplicated. Every command carries
// one command_id; reaction commands also carry the triggering event
// (causation_id); facts carry their source (fact_origin). All of it rides
// the CommandPage. This follows the established message-metadata
// convention (KurrentDB's $correlationId / $causationId, NServiceBus,
// Marten and Wolverine): one message id, a correlation id, and a causation
// id naming the message's DIRECT cause. A command's direct cause is its
// trigger (causation_id); an event's direct cause is the command (or fact)
// that produced it (EventMeta.causation). Every event has one: a process
// manager's events too, since its only input is facts (decision 14.31).
// Each event records only its own direct cause, never its command's
// causation (decision 13.3).
//
// command_id: one per command, a UUID, assigned before deduplication:
//   client Command  the caller's CommandPage.command_id (any UUID version,
//                   reused verbatim on every retry of that command; an SDK
//                   mints a v7), or, when the caller supplied none, a
//                   UUIDv7 the coordinator mints (see the minted_ids
//                   region). A caller that sends several commands (several
//                   CommandBooks, e.g. one API call fanning out) uses one
//                   command id per command and may group them by a shared
//                   correlation_id it sets itself.
//   reaction        derived: UUIDv5 of (trigger EventRef, reacting
//                   component, index in the reaction's output); the exact
//                   name encoding and worked values are in the derived_ids
//                   region. Stamped by the reactor's coordinator, never by
//                   the reactor.
//   Fact            derived: UUIDv5(ANGZARR_FACT_CORRELATION_NAMESPACE,
//                   fact_origin.external_id) (derived_ids region). A sender
//                   may set it only to that value (an SDK may compute it);
//                   any other value is malformed.
// Every event the command produces records it as its causation
// (EventMeta.causation.command_id).
//
// correlation_id: the workflow. The caller's when supplied (verbatim; a
// UUID of any version). When absent, the coordinator sets it, before
// business code: a client Command's correlation is its command_id (client
// or minted), so every retry of a client-keyed command lands in one
// correlation; a Fact's is its derived command_id. A reaction command's is
// its trigger's correlation, stamped by the coordinator; a reactor that sets
// a different one is a reactor bug. A refusal fact takes the refused
// command's correlation (its trigger's) the same way: every command or
// fact a policy sends, to any target, carries its trigger's correlation
// unchanged, so correlation traces the causal chain (decision 14.36). A
// command or Fact addressed to a process manager's stream with no
// correlation_id is given its cover's root; a set one is kept, whatever
// the root. Nothing fills in a root: a policy names its command's root
// for every target, and an unset one is a policy bug
// (COORDINATOR_REASON_POLICY_COMMAND_NO_ROOT; PolicyResponse.commands). A process
// manager's events carry their command's or fact's correlation, like any
// domain's.
// Correlation is never unset on a persisted event, and the framework never
// mints one of its own. It groups a workflow and is not an identity: two
// sources' external ids can coincide, and a sender that must keep them
// apart supplies correlation_id itself. Correlation is recorded per page
// only (covers carry none); Query.correlation_id, CorrelationQuery and
// EventStreamFilter select by it.
//
// causation_id: the command message's own causation, as the standard
// defines it: the EventRef of the event a policy reacted to, always the
// triggering event (a process manager emits nothing but its own events,
// so it stamps no causation_id; decision 14.31). Set by a policy's
// coordinator only: on reaction commands, where it is the input the
// reaction command_id is derived from, and on refusal facts, where it is
// the refused command's own causation_id, so it names the very stream the
// fact is addressed to (PolicyService in policy.proto, Refusals).
// It is transport and trace metadata, NOT persisted on the events the
// command produces: their causation is the command itself
// (EventMeta.causation.command_id). The coordinators record the trigger
// edge in the command's trace and logs (OpenTelemetry), as Marten and
// Wolverine do, so "which event led to these events" is answered from
// traces, not from the event store (decision 13.3; see CorrelationQuery for
// what the store still answers). Accepted only from a caller authenticated
// as a framework component (command_handler.proto, the entry_points
// region); a client caller that sets it is refused PERMISSION_DENIED.
//
// fact_origin: where a Fact came from (FactOrigin, below), kept for audit
// and copied onto every event the fact produces (EventMeta.fact).
//
// Validation (refused before deduplication; see Handling for the full list):
//   Fact      requires fact_origin with a non-empty external_id; never
//             any Handling field; a set command_id must equal the
//             derivation; never causation_id. The one exception is a
//             refusal fact (decision 14.31), the only Fact with a
//             causation_id: it is accepted only by the exact stream
//             causation_id names, domain, root and edition alike (the
//             stream of the policy's triggering event); its command_id is
//             the refused command's, not a derivation, and its
//             fact_origin.external_id is that command_id's canonical
//             text. The same id is thus in two
//             streams by design: never applied in the refusing (target)
//             stream, and recorded as the refusal in the source stream.
//   Command   never fact_origin.
// A client's malformed command is answered INVALID_ARGUMENT; a reaction
// command has no caller to answer, so it is dead-lettered and alerted as a
// reactor bug.
//
// Deduplication: by command_id, ON THE EVENTS. There is no separate key
// store. "Already applied?" means: the addressed stream (CommandBook.cover)
// already holds events whose EventMeta.causation.command_id is this
// command's. Every backend keeps an index on (stream, command_id) for that
// lookup; it is not unique, since one command may produce several events.
// On a hit the coordinator does not run business code: it answers with
// those events, in sequence order, and Outcome.delivery DUPLICATE.
// Deduplication is per addressed stream, the same command_id sent to two
// streams is two commands, and because the id is written with the events it
// is atomic with the append on every backend. (KurrentDB deduplicates
// appends by event id the same way, and Equinox keeps processed ids in the
// stream.)
//
// Concurrent deliveries of one command race on the append's optimistic
// sequence check: exactly one commits. The losing append writes nothing,
// and the coordinator runs the losing delivery again from the deduplication
// lookup, which now finds the winner's events and answers DUPLICATE (or,
// if the winner produced no events, decides again; see the costs below).
//
// Process managers. A process manager is a domain (decision 14.31): its
// events are the events of the commands and facts addressed to it, with
// causation.command_id, and are deduplicated by command_id like any
// domain's. There is no trigger and no separate trigger lookup.
//
// Reactor re-runs. A reaction command_id depends only on (trigger,
// component, index), never on the reactor's rules_version or code, so a
// reactor run again over a trigger it already handled (a checkpoint reset)
// emits the same ids, which every destination answers DUPLICATE, a
// process manager included (and a command refused again yields a refusal
// fact with the same id, which its source answers DUPLICATE). A re-run
// never changes history: it adds nothing where the first run applied, even
// if the reactor's code has changed since. Checkpoint resets are for
// recovery only (output that was lost before it reached the outbox).
// Repairing what a buggy reactor did is done with NEW commands, with new
// ids, which append new events after the old ones; the buggy-era events
// remain, append-only (decision 13.4).
//
// Accepted costs (decision 12.2):
//   - A decision that produced NO events leaves nothing to find, so a
//     redelivery of that command is decided again, against the stream as
//     it is then (Equinox-style). It is answered APPLIED (with the events
//     that decision produces, possibly none).
//   - A command_id reused for a DIFFERENT command goes undetected: it is
//     answered DUPLICATE with the first command's events. Payloads are not
//     fingerprinted. A client must mint a new id for every new command.
//     The same holds for a reactor re-run whose new code would emit
//     different commands (above).
//   - Deduplication is FOREVER: the events are permanent, so a command_id
//     that applied on a stream can never apply on it again. There is no
//     expiry, purge or retention window.
// Rejections leave nothing: a rejected command (a gRPC error status) writes
// no event, so a retry with the same command_id runs business code again.
// The same holds for a parked Fact (Outcome.delivery PARKED): its source's
// redelivery runs ingest again.
// endregion

// region security_logs
// Who did it is not data. No message in these protos records an actor,
// operator or principal: not events, not commands, not the edition or
// dead-letter records. Every coordinator authenticates its caller (a
// client principal, or a framework component by its mTLS identity) and
// writes who called what, and when, with the command_id, to a separate
// security log owned by the deployment. Events record why and under which
// rules (EventMeta); the security log records who. Keeping identity out of
// the event store keeps personal data out of immutable history, so erasing
// or rotating it never rewrites an event (decision 12.3).
// endregion

// Where a fact came from: something that already happened outside the
// system (a webhook, an integration). Carried on the CommandPage of a Fact
// (fact_origin) and copied onto every event the fact produces
// (EventMeta.fact). See Fact.
message FactOrigin {
  // The external system's id for this fact (e.g. "pi_1234" from Stripe).
  // Required: a Fact whose external_id is empty is refused INVALID_ARGUMENT.
  // A string, not a UUID: it is the external system's id, in that system's
  // format. The fact's command_id is derived from it (see the
  // command_identity region), so redeliveries of one external_id to one
  // stream are deduplicated; a redelivery with a different payload is NOT
  // detected (it is answered DUPLICATE with the first delivery's events).
  // When the fact's command supplies no correlation_id, its correlation is
  // the same derived value. external_id must be unique across all sources
  // that address one stream; prefix it with the source when two might
  // collide.
  string external_id = 1;
  string description = 2; // Human-readable origin (e.g. "Stripe webhook"); audit only, not part of the derivation
}

// region editions
// An edition's lifecycle is FRAMEWORK META-EVENTS in the edition's own
// streams (decision 14.32): io.angzarr.v1.meta.EditionCreated and
// io.angzarr.v1.meta.EditionDeleted, in meta/events.proto, the reserved
// namespace for meta-events (stores and coordinators may recognise them by
// type; business handlers never see them).
//
// Main knows nothing (the owner's invariant). Every datum and message of
// an edition's lifecycle lives in the edition's own streams (D, X, R), in
// the edition's configured store, and every row of X carries X in its key.
// Nothing is appended to, recorded in, indexed against or read from main's
// streams for an edition's lifecycle, except that a creation READS main's
// head (its fork sequence) and a stream in X reads main's events below it.
// Listing editions and checking that one exists query X's own creation
// events. X's outbox entries, positions and deliveries are X's, kept apart
// from main's. Main's coordinators, projectors and readers behave exactly
// as if no edition existed: creating and deleting an edition leaves main's
// streams, outbox and positions byte-for-byte unchanged.
// endregion

// region diagnostic
// Errors carry a KEY and an ARGUMENT MAP, never rendered English (decision
// 14.37). Text is rendered only where it is displayed (a console, a UI, a
// client's message()), from a Fluent catalog keyed by the code; logs show
// the code and its args as they are. No free text crosses any boundary:
// not a gRPC status message, not a dead letter, not a response field.
//
//   On a gRPC status   the status message IS the reason key; the
//                      google.rpc.ErrorInfo (domain "angzarr.io") carries
//                      the same key as its reason and the args as its
//                      metadata. Every distinct condition has its own key:
//                      two conditions never share one and differ only by
//                      text.
//   In a message       a Diagnostic, below.
//
// A business rejection is one of two things. A TYPED rejection is its
// refusal object (one of the command's CommandOptions.refuses types,
// packed as an Any): the object's type is the key and its fields are the
// map, so it carries no Diagnostic. On the wire its reason (and so its
// status message) is ROUTER_REASON_COMMAND_REFUSED, its ErrorInfo metadata refusal_type
// names the object's fully-qualified type, and the object itself is packed
// in the status details. Any other rejection, and every handler bug,
// carries a diagnostic code and its args: an untyped rejection's reason is
// its own code; a handler bug's reason is ROUTER_REASON_UNHANDLED_HANDLER_ERROR, with the
// handler's own code and args as its cause (flattened as below; a panic's
// cause is ROUTER_REASON_HANDLER_PANICKED), and what escaped stays in the handler's log.
// A handler that fails with the language's unclassified error has no cause.
// In a language with only exceptions (Python), the client library exports a
// named unclassified exception for that (angzarr_client.UnclassifiedError): raising it is a bug with no
// cause, and any other exception is a panic, cause ROUTER_REASON_HANDLER_PANICKED
// (decision 14.42; C-0669).
//
// The framework's reason keys. Every framework key, the component that
// answers it (the router, the component host or the coordinator), the gRPC
// status it travels with and its arg names are listed once, as the enums of
// reasons.proto (RouterReason, HostReason, CoordinatorReason; decision
// 14.44); a key travels as its value's full name, prefix included
// (ROUTER_REASON_DUPLICATE_COMPONENT). Which class a status is
// (decision 14.37's four classes) is the coordinator's to decide, never
// the router's. A Fluent catalog keys a typed refusal by
// its fully-qualified type name with each "." replaced by "-" (a Fluent id
// has no dots).
//
// A cause wrapped inside a diagnostic is flattened into the args: the
// cause's code under the arg's name, and each of its args under
// "<name>.<arg>" (so "cause" = "annals-store-sql-io", "cause.errno" =
// "10"). The same flattening serves ErrorInfo metadata.
//
// The one text an arg may hold: where angzarr converts a third-party
// library's error (a store driver's, an I/O error, a transport or decode
// error), that library's own text, verbatim, as the arg "ext_err_txt",
// beside its numeric code where it has one ("cause.errno" = "5",
// "cause.ext_err_txt" = "database is locked"). angzarr's own errors and a
// handler's text never travel (decision 14.37).
message Diagnostic {
  // The key: a stable identifier, never reused for another meaning, and a
  // valid Fluent message id. Framework codes are SCREAMING_SNAKE
  // (ROUTER_REASON_NO_COMPONENT_OF_KIND) or the ports' kebab-case (angzarr-ports-...);
  // a domain's codes are its own. Required.
  string code = 1;
  // The arguments, by name: data (ids, counts, type URLs, a domain), never
  // a sentence. The same names every time for a given code.
  map<string, string> args = 2;
}
// endregion

// region refusal_facts
// The standard refusal fact (decision 14.31; PolicyService in policy.proto,
// Refusals). The policy's COORDINATOR builds it (decision 14.42): in
// PASS-THROUGH mode, the default chosen by angzarr-cli, the policy's
// business process answers PolicyService.OnRefused with no translation, and
// the coordinator builds this fact, addressed to the exact stream of the
// policy's triggering event (domain, root and edition). The source domain handles it by a generated dispatch on the
// refused command's type, on_refused_<Command>(refusal, state) -> events,
// inferred from the handlers it defines; with none for that type it
// answers ROUTER_REASON_NO_REFUSAL_HANDLER (metadata command_type; decision 14.37), and the fact is dead-lettered and alerted. Its
// identity is the refused command's: its command_id is the refused
// command's command_id, and its fact_origin.external_id that id's
// canonical text (the command_identity region, Validation).
//
// It carries the refused command, the foreign domain's TYPED refusal
// object (packed), and the trigger, and nothing else: no reason code or
// message. A source that handles it unpacks the foreign object, so it
// imports the foreign domain's protos. That is the REASON the policy's
// translate mode exists: a domain that does not want to unpack a foreign
// object, or import foreign protos, has angzarr-cli select translate for
// that command, and the policy unpacks the object there and hands over a
// domestic fact instead.
message CommandRefused {
  // The refused command, as it was delivered (identity stamped): its
  // cover (the target domain and root) and its payload, whose type URL
  // picks the source domain's on_refused_<Command> handler.
  CommandBook command = 1;
  // The foreign domain's TYPED refusal object, packed: one of the
  // command's CommandOptions.refuses types (options.proto; e.g.
  // InsufficientFunds { available, requested }),
  // business-specific, unpacked by the source's handler. Unset when the
  // target refused without one.
  google.protobuf.Any refusal = 2;
  // The policy's triggering event (the refused command's causation_id),
  // which is also the stream this fact is addressed to.
  EventRef trigger = 3;
}

// A target's refusal of a command, as the refused policy receives it
// (Refusal.response in policy.proto), built by the policy's coordinator from
// the business rejection (FAILED_PRECONDITION) the target answered. It
// carries a key and a map, never text (decision 14.37): exactly one of
// refusal and diagnostic is set.
message RefusalResponse {
  oneof reason {
    // The typed refusal object the handler returned: one of the command's
    // CommandOptions.refuses types, packed by the client library into the
    // rejection's status details and handed on here. Its type is the key
    // and its fields the map.
    google.protobuf.Any refusal = 1;
    // An untyped rejection: the rejection's ErrorInfo reason as the code
    // and its metadata as the args. Never forwarded into CommandRefused: a
    // domestic domain that wants it gets it through translate mode.
    Diagnostic diagnostic = 3;
  }
}
// endregion

// region event_meta
// Provenance of one persisted event, stamped by the framework. Every
// persisted event carries meta. Business code never sets meta: an EventBook
// returned by business code whose pages carry meta is refused (see
// CommandHandlerService.Handle).
//
// causation, correlation_id and recorded_at are always recorded. causation
// is the event's DIRECT cause (see the command_identity region):
// command_id, for every event: each was produced by a command or fact
// (client, reaction or fact, a process manager's events included; a PM
// is a domain, with no trigger-caused events; decision 14.31). fact is
// set iff the producing command was a Fact.
// rules_version is always recorded from the business logic's report
// (empty only if the business logic reports none). A reaction command's
// causation_id (its trigger) is NOT recorded: an event names its own
// cause, not its cause's cause (decision 13.3; the trigger edge is in
// traces).
//
// The event's own identity is the EventRef of its page (its stream plus
// EventPage.sequence); EventMeta does not repeat it.
//
// One write is the events one command or fact produced. All pages of one
// write share one EventMeta, so the events of one command are exactly the
// pages with its command_id; the deduplication index (command_identity
// region) is on that field. The
// head the decision saw is not recorded: it is the sequence of the write's
// first event (decision 12.4).
message EventMeta {
  // The event's direct cause. Always set on a persisted event. It has one
  // arm: triggering_event (18), a process manager's trigger, is deleted,
  // unreserved (policy 6.6), because a PM is a domain whose inputs are
  // commands and facts (decision 14.31). The oneof stays, so command_id
  // keeps its encoding, its JSON and its generated accessor.
  oneof causation {
    // The producing command's command_id (see the command_identity
    // region): every event a client Command, reaction command or Fact
    // produced, a process manager's events included. The deduplication key
    // on the stream.
    UUID command_id = 17;
  }
  // The producing Fact's source: the command's fact_origin, copied. Unset
  // for Commands.
  FactOrigin fact = 16;
  // The producing command's correlation (see the command_identity
  // region). Never unset on a persisted event.
  UUID correlation_id = 14;
  // When the event was durably recorded, stamped by the server that persisted
  // it. The only timestamp an event carries; TemporalQuery.as_of_time selects
  // by it.
  //
  // Non-decreasing per stream: the coordinator stamps
  // max(previous event's recorded_at, now), so a clock step backwards never
  // makes a later event look older. Events of one write share one
  // recorded_at. Because of this, the events recorded at or before any time
  // T are always a prefix of the stream (see TemporalQuery).
  google.protobuf.Timestamp recorded_at = 5;
  // The full version of the business binary that decided (or ingested) the
  // event (e.g. "1.4.2+build.7"): baked in when the binary is built (e.g.
  // by versionator), never a label chosen by hand. Reported by the business
  // logic with every response (CommandHandlerResponse.rules_version, a
  // process manager's included) and stamped in full by the
  // coordinator from that response, so during a rolling deployment each
  // event names the build that decided it. Business code never sets it on
  // an event. The framework reads it only to choose which snapshots to
  // offer (see Snapshot); otherwise it explains a historical decision.
  // (annals, which shares these protos, treats rules_version differently:
  // a documented divergence, see
  // docs/design/audit-meta/annals-divergence.md.)
  string rules_version = 7;
}
// endregion

// region aggregate_snapshot
// Snapshot of aggregate state at a given sequence number.
// State must be a protobuf Message to serialize into Any.
//
// Snapshots are a framework optimisation, never business data. How often
// they are taken and how many are kept is framework/storage policy,
// configured per domain and following the edition's storage configuration;
// the default keeps the newest snapshot only. Business milestones are domain
// events, never retained snapshots.
//
// Validity. A snapshot records what produced it: the state's type (the type
// URL of `state`) and the rules version reported with the response that
// returned the state (rules_version, the business binary's full version).
// The coordinator, never the business logic, decides whether a snapshot may
// be used. It offers a snapshot with a delivery (ContextualCommand.events,
// for an aggregate or a process manager alike) only if both hold:
//   1. its state type URL equals the type_url of the StateDescriptor the
//      component registered (ComponentDescriptor.state); and
//   2. its rules_version passes the domain's compatibility rule against the
//      version the component registered (ComponentDescriptor.rules_version).
// The default rule: strip ONE leading "v" or "V" from each version, then
// both parse as SemVer 2.0.0 and their major and minor numbers are equal
// (patch, pre-release and build metadata are ignored), so "v1.4.2" and
// "1.4.7" are compatible. If either version, so stripped, does not parse as
// SemVer 2.0.0, the default rule is exact string equality of the versions
// as recorded.
// Coordinator configuration may replace the default rule for a domain with
// an accept pattern and an optional reject pattern, each matched against
// the snapshot's rules_version. The snapshot passes iff the accept pattern
// matches and the reject pattern, when set, does not: a reject match wins.
// A pattern matches only the WHOLE version (full-match semantics, as if
// anchored at both ends). Patterns use the RE2 syntax, which runs in linear
// time and has no lookaround and no backreferences; a pattern outside that
// syntax is refused when the configuration is loaded.
// A snapshot that fails either check is simply not offered: the delivery
// carries no snapshot and every page from sequence 0, and business code
// folds the full history. The business logic declares no snapshot
// compatibility and never checks or refuses a delivered snapshot. A
// state-schema change or a rules change therefore never needs a snapshot
// migration: the next load replays, and the next snapshot is written under
// the current rules version.
//
// Queries (EventQueryService, including a TemporalQuery) choose snapshots
// the same way: a coordinator answering a query returns a snapshot only if
// it passes both checks against that coordinator's own registration (one
// business process per coordinator; during a rolling deployment each
// instance's coordinator judges by its own instance's version). A server
// holding no registration (a coordinator before its first successful
// Describe, or a standalone query server, which has no component behind
// it; see query.proto) returns no snapshot and every page from sequence
// 0.
message Snapshot {
  // Sequence of the last event folded into `state`. A TemporalQuery
  // as_of_time T may start from this snapshot iff that event's
  // EventMeta.recorded_at <= T, i.e. iff the snapshot lies within the
  // prefix recorded by T (see TemporalQuery).
  //
  // Where snapshots come from. The client library returns the post-command
  // state on EVERY response (CommandHandlerResponse.events.snapshot.state,
  // for an aggregate or a process manager alike); business code never
  // decides when. The coordinator persists it per the
  // domain's storage policy (default: keep the newest only), setting
  // sequence (the last event folded in) and rules_version (the response's,
  // in full), and offers the stored bytes, unchanged, with the next
  // delivery to that stream, subject to the Validity checks above and the
  // window bound (see ContextualCommand). Neither side asks: there is no
  // request flag. The coordinator decides when to write one; the client
  // library never does. A delivery that offers a snapshot carries only the
  // pages after it: the coordinator drops the pages it covers, and the
  // client library folds what it is given (decision 14.40).
  uint64 sequence = 2;
  // The folded state. Its type URL is the state type recorded with the
  // snapshot and checked before the snapshot is offered (see Validity
  // above).
  google.protobuf.Any state = 3;
  // The rules version reported with the response that returned `state`
  // (CommandHandlerResponse.rules_version), stamped in full by the
  // coordinator, never by business code. Checked by the coordinator before
  // the snapshot is offered (see Validity above).
  string rules_version = 5;
}
// endregion

// region event_book
// A run of events from one stream. Every page shares the book's Cover.
message EventBook {
  Cover cover = 1;
  Snapshot snapshot = 2; // Snapshot state; always set on a business response (see Snapshot)
  repeated EventPage pages = 3;
  uint64 next_sequence = 6; // Computed on load, never stored: (last page seq OR snapshot seq if no pages) + 1
}
// endregion

// One projector's output for one stream.
message Projection {
  Cover cover = 1; // The stream projected
  string projector = 2; // Registered name of the projector
  // The projector's position in the stream after this projection: the
  // stream's next_sequence once the projected events are applied, i.e. the
  // sequence of the last projected event + 1. (Renamed from `sequence`,
  // which read as the last event's sequence.)
  uint64 next_sequence = 3;
  google.protobuf.Any projection = 4;
}

// region handling
// How the system treats one command. Handling is instructions, not data:
// it is never persisted (EventMeta records what was decided, not how the
// command was handled), and identity, business data and provenance never
// live here.
//
// How much of the processing the caller waits for is NOT handling: it is a
// call-level choice, made by which coordinator RPC the caller uses (Handle,
// HandleAsync or HandleSync; see the command_modes region in
// command_handler.proto).
//
// As sent, then resolved. Before the coordinator, Handling holds what the
// sender asked for, and any field may be unset. An empty Handling (no field
// set) is the same as an unset one. Before business code runs, the
// coordinator resolves it in place: it stamps expected_sequence when
// absent, and fills conflict_resolution from configuration when
// unspecified. From then on (ContextualCommand, business code) every field
// is concrete. A dead letter stores Handling as sent (see
// AngzarrDeadLetter).
//
// Defaults come from configuration. The conflict resolution is configured
// per command type and per component (the aggregate; a command to a process
// manager carries no Handling, below).
// Precedence, highest first:
//   1. Handling, when the field is set and configuration allows the override
//   2. configuration for the command type (its payload's type URL)
//   3. configuration for the component
//   4. the built-in default: COMMUTATIVE when the component's registered
//      state supports it (ComponentDescriptor.state), otherwise STRICT
// Whatever is chosen must be supported by the component's state (see
// ConflictResolution).
//
// The pipeline. The coordinator's order, NORMATIVE in every runtime and
// every mode:
//   1. validate      the malformed list below; refuse before anything is
//                    minted, looked up or stored;
//   2. assign ids    mint or derive command_id, and set an absent
//                    correlation_id (see the command_identity region);
//   3. load, then    load the stream (snapshot and events, its head)
//      deduplicate   FIRST, then look up (stream, command_id); a hit is
//                    answered DUPLICATE with the stored events, and
//                    nothing below runs. The loaded pages exclude those
//                    the snapshot covers (decision 14.40), and the pages
//                    and the input's payload are upcast through the
//                    component's upcaster sidecar (decision 14.39; see
//                    upcaster.proto) before anything below judges them;
//   4. resolve       stamp or check expected_sequence against the head
//                    step 3 loaded, and resolve conflict_resolution
//                    (STRICT's ABORTED happens here, and the refusal of
//                    an expected_sequence ahead of the head, below);
//   5. business code CommandHandlerService.Handle (the client library
//                    folds the delivered state, dispatches to decide or
//                    ingest, and resolves AGGREGATE_HANDLES /
//                    COMMUTATIVE), then
//                    the append. A process manager's business code is
//                    the same CommandHandlerService.Handle (a PM is a
//                    domain; decision 14.31).
// The load comes before the lookup: under READ COMMITTED, a lookup first
// could miss an original delivery that commits before the load, and the
// retry would append after the original's events with no conflict (applied
// twice). Loading first, a commit after the load is either seen by the
// lookup or fails this delivery's append on its expected head.
// Deduplication comes before the sequence check, so a retry of an applied
// command is answered DUPLICATE whatever its expected_sequence: one now
// stale is never ABORTED, and one ahead of the head never INVALID_ARGUMENT
// COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD (decision 14.47).
// A HandleAsync command refused at step 4 or 5 by a business, fatal key
// has no caller to answer: it is dead-lettered with that key and its args
// as AngzarrDeadLetter.reason, and alerted (decision 14.47). An append that loses an optimistic race re-runs from step 3
// (a STRICT command with a provided expected_sequence then fails at step
// 4), at most to a cap: the race re-run cap for a stamped command, the
// retry cap for an AGGREGATE_HANDLES or COMMUTATIVE re-delivery. At the
// cap the command is dead-lettered and alerted, and a waiting caller is
// answered INTERNAL, COORDINATOR_REASON_RETRY_CAP_EXHAUSTED (a fact,
// PARKED; decision 14.46).
//
// Violations are refused loudly, never silently ignored. Each of these is
// malformed, refused at step 1, before deduplication or business code:
//   - a field that configuration forbids overriding for the command type or
//     component;
//   - a conflict_resolution the component's state does not support;
//   - any Handling field on a Fact (see below);
//   - any Handling field on a reaction command (see below);
//   - a policy's command with no cover root, whatever its target (INTERNAL,
//     google.rpc.ErrorInfo reason COORDINATOR_REASON_POLICY_COMMAND_NO_ROOT, metadata domain
//     and command_type; decision 14.36, as amended);
//   - a policy's command carrying a correlation_id other than its trigger
//     page's (INTERNAL, reason COORDINATOR_REASON_POLICY_COMMAND_OTHER_CORRELATION);
//   - a Fact with causation_id addressed to any stream but the one its
//     causation_id names (domain, root and edition: a policy's refusal fact
//     goes only to the stream of its triggering event);
//   - a Fact without fact_origin, or with an empty external_id, or with a
//     command_id other than its derivation (a refusal fact excepted: its
//     command_id is the refused command's); a Command with fact_origin
//     (see the command_identity region);
//   - a set UUID that is not 16 bytes, or a set empty Cover.edition.
// One more is malformed but needs the head, so it is refused at step 4,
// after deduplication and still before business code: an
// expected_sequence ahead of the head, under every resolution
// (INVALID_ARGUMENT, COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD, args
// expected and head; see ConflictResolution; decision 14.47).
// A client's malformed command is answered INVALID_ARGUMENT, by every
// coordinator RPC (HandleAsync included: it validates before enqueueing).
// causation_id from a caller not authenticated as a framework component is
// refused PERMISSION_DENIED, and an unknown edition (no fork event of it
// exists: never created, or deleted) NOT_FOUND (see the
// entry_points region in command_handler.proto). A reaction command has no
// caller to answer, so it is dead-lettered as a reactor bug (and alerted),
// never delivered; one that carries Handling, with reason
// COORDINATOR_REASON_POLICY_COMMAND_WITH_HANDLING.
//
// Reaction commands (emitted by policies; a process manager emits none) carry
// NO Handling at all: expected_sequence and conflict_resolution are both
// forbidden. A reactor never knows the destination's state, so the
// destination always stamps expected_sequence, and with a stamped sequence
// conflict resolution can never apply. How a reaction command is delivered
// comes from the emitting component's configuration.
//
// Facts (CommandPage.body = Fact) cannot be refused, so no sequence check
// or conflict resolution applies: a Fact that sets any Handling field is
// malformed and refused as above. The coordinator always stamps a Fact.
//
// A process manager is a domain (decision 14.31): Handling applies to the
// commands addressed to it exactly as to an aggregate's.
message Handling {
  // The stream state the command was issued against: the expected
  // next_sequence of the target stream.
  //
  // If provided and AHEAD of the stream's head (greater than its
  // next_sequence), the command is malformed under every resolution:
  // refused before business code, INVALID_ARGUMENT,
  // COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD (args expected and head),
  // and nothing is persisted (decision 14.47).
  //
  // If provided and BEHIND the head, the command is rejected before
  // business code (ABORTED, COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE,
  // args expected and actual) unless the resolved conflict resolution is
  // AGGREGATE_HANDLES or COMMUTATIVE, in which case the events since
  // expected_sequence are delivered with the command and a conflict rule is
  // applied: under AGGREGATE_HANDLES decide receives them and applies its
  // own; under COMMUTATIVE decide runs on the head, the client library
  // computes the conflict units and the coordinator compares them (see
  // ConflictResolution). If absent, the
  // framework stamps the head it decides against, before business code.
  //
  // Either way, the check or the stamp happens in the framework before the
  // command reaches business code (pipeline step 4), so decide always sees
  // a concrete sequence.
  //
  // At the write the stream may have moved again: another write to the same
  // stream landed after the load. Under STRICT a provided expected_sequence
  // then fails the command ABORTED,
  // COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE; a stamped one is re-run by
  // the coordinator on the new head, under the race re-run cap. Under
  // AGGREGATE_HANDLES and COMMUTATIVE a provided expected_sequence is never
  // answered that key: the coordinator re-delivers the widened window and
  // the resolution's rule decides again, under the retry cap. At either
  // cap the command is dead-lettered and alerted, and a waiting caller is
  // answered INTERNAL, COORDINATOR_REASON_RETRY_CAP_EXHAUSTED (see
  // ConflictResolution; decisions 14.45 and 14.46). Ordering is per stream: no other stream's writes
  // matter.
  optional uint64 expected_sequence = 1;
  // What to do with a stale expected_sequence (see ConflictResolution).
  // Unspecified: the configured default.
  ConflictResolution conflict_resolution = 2;
}
// endregion

// region command_page
// The one command of a CommandBook: its identity and provenance
// (command_id, correlation_id, causation_id, fact_origin; see the
// command_identity region) and a body
// that is either a decision-requesting Command or an already-happened Fact.
// How the command is handled is not part of the page (see
// CommandBook.handling).
//
// Reflective dispatch. The framework picks the pipeline from which body arm
// is set (the arm's message type): a Command goes through decide (fallible:
// it may be rejected), a Fact through ingest (infallible). Within the
// pipeline the payload's type URL picks the handler, after the
// coordinator, through the component's upcaster sidecar, has brought an
// old payload type up to the current one (decision 14.39; see
// upcaster.proto); Command and Fact payloads alike are upcast, and the
// client library never sees an old type. A payload whose type URL reaches
// no handler is refused by the client library INTERNAL (a bug: decision
// 14.37) with reason ROUTER_REASON_UNKNOWN_COMMAND_TYPE (ROUTER_REASON_NO_FACT_HANDLER for a fact),
// which is also the status message (decision 14.37: a key, never text),
// naming the type it was given as ErrorInfo metadata "type_url". The
// coordinator answers its caller with that status, its ErrorInfo metadata
// "type_url" holding the type URL as sent and "upcast_type_url" the type
// URL the sidecar returned (the sent one when no rule applies). On
// the wire the arm is the fact marker; in code, the handler registration (a
// fact handler, e.g. #[handles_fact] / ingest, versus a command handler) is
// the declaration, and the router refuses an arm that does not match the
// registered handler's kind. There is no proto flag for facts. A process
// manager's stream takes both arms, like any domain's (decision 14.31).
//
// The arm says what kind of payload this is; fact_origin says where a fact
// came from. They must agree: a Fact requires fact_origin, and a Command
// never has one. A policy's business code never injects a fact: it emits
// Commands with a causation_id, and one that emits a Fact is refused
// (dead-lettered and alerted). The one fact a policy delivers is the
// refusal fact of a refused command (the standard CommandRefused, or a
// domestic fact its callback translates the refusal into), and only to
// the policy's own source domain (decision 14.31, amending 2.2;
// PolicyService in policy.proto, Refusals).
message CommandPage {
  oneof body {
    Command command = 3; // Asks the aggregate to decide; may be rejected
    Fact fact = 4; // Records something that already happened; never rejected
  }
  // The command's id: client-supplied or minted (client Command), derived
  // (reaction command, Fact). Unset on arrival from a client means "mint
  // one". Recorded on every event it produces as their causation
  // (EventMeta.causation.command_id), and the deduplication key there.
  UUID command_id = 8;
  // The workflow correlation; set by the coordinator when absent. Copied
  // onto every event (EventMeta.correlation_id).
  UUID correlation_id = 9;
  // A policy's output only (reaction commands, and refusal facts): the
  // command's own causation, its triggering event. Framework-authenticated
  // callers only. The reaction command_id is derived from it, and a refusal
  // fact must be addressed to the exact stream it names (domain, root and
  // edition). Transport and trace metadata: NOT persisted on the events
  // the command produces (their causation is this command; see the
  // command_identity region).
  EventRef causation_id = 10;
  // Facts only, and required there: where the fact came from. Copied onto
  // every event (EventMeta.fact).
  FactOrigin fact_origin = 11;
}

// A command proper: a request for the aggregate to decide. decide may emit
// events or reject it. Never carries a fact_origin. A rejected command
// writes nothing, so the same command_id may be retried.
//
// Commands may be upcast: the coordinator runs the payload through the
// same upcaster chain as for events, by type URL, in the component's
// upcaster sidecar, before dispatch (decision 14.39; see upcaster.proto,
// which also explains why that is discouraged).
message Command {
  google.protobuf.Any payload = 1; // The domain command; its type URL picks the handler
}

// A fact: something that already happened outside the system (a webhook,
// an integration), delivered through the command coordinator like any
// command (Handle, HandleAsync or HandleSync).
//
// Facts are upcast like commands: the coordinator runs the payload through
// the same upcaster chain, by type URL, in the component's upcaster
// sidecar, before dispatch (decision 14.39; see upcaster.proto).
//
// Fact handlers are infallible: they record the fact (possibly together
// with events that flag it, e.g. a payment received for an unknown order)
// and never reject it. A failing fact handler is a bug, not a business
// rejection: the fact is dead-lettered and alerted, and the sender is
// answered "accepted, parked" (OK, Outcome.delivery PARKED, no events),
// never a rejection. The framework deduplicates on the command_id derived
// from CommandPage.fact_origin.external_id, per addressed stream, before
// the handler runs; a parked fact wrote nothing, so its redelivery runs
// ingest again. A fact that loses a race at its write to another write to
// the same stream is re-run on the new head under the race re-run cap, and
// one that reaches the cap is parked the same way (dead-lettered with
// reason COORDINATOR_REASON_RETRY_CAP_EXHAUSTED, alerted, answered OK
// PARKED; decision 14.46).
//
// A Fact is never checked against a sequence and never conflict-resolved:
// the coordinator always stamps the head. A book whose Fact sets any
// Handling field is malformed and refused loudly (INVALID_ARGUMENT), before
// deduplication or ingest; it is never silently stamped over (see
// Handling).
message Fact {
  google.protobuf.Any payload = 1; // The fact; its type URL picks the ingest handler
}
// endregion

// region command_book
// Exactly one command addressed to one stream, with how it is to be
// handled (decision 1.4). A CommandBook carries exactly one command, its
// page. More than one is unsupported: deduplication, the expected-sequence
// check, errors and the outcome are all per command. A caller with
// several commands sends several CommandBooks (a client library may batch
// such calls on its side). (EventBooks, by contrast, group the pages of one
// stream under a shared Cover.) CommandBook is the request itself: the
// coordinator's Handle, HandleAsync and HandleSync take it directly, with
// no request wrapper.
message CommandBook {
  Cover cover = 1; // The target stream (domain, edition, root)
  CommandPage page = 3; // The one command
  // How the system treats this command: as sent before the coordinator,
  // resolved after it (see Handling). Never persisted.
  Handling handling = 6;
}
// endregion

// region outcome
// What the system did with one command: results of its handling, carried on
// CommandResponse and NEVER persisted. Nothing here is written to any
// stream, and replaying a stream cannot reproduce it. The command's business
// result is CommandResponse.events.
message Outcome {
  DeliveryOutcome delivery = 1;
  // Synchronous projector results. Produced only by the coordinator's
  // HandleSync (SIMPLE); empty for Handle (DECISION). (Projectors
  // persist their own read models; these are copies returned to the caller.)
  repeated Projection projections = 2;
  // Synchronous projectors that failed on this command's events. HandleSync
  // answers OK whenever the decision committed: a projector failure never
  // undoes it and never turns the response into an error status. Each
  // failing projector appears here instead of in projections, and its
  // events are retried or dead-lettered on the asynchronous projection
  // path. Empty for Handle (DECISION).
  repeated ProjectorFailure projector_failures = 3;
}

// One synchronous projector that failed during HandleSync.
message ProjectorFailure {
  string projector = 1; // Registered name of the projector
  // The failure as a gRPC status code (google.rpc.Code numbering). Whether
  // the projection will be retried follows the retryable set in
  // command_handler.proto.
  int32 code = 2;
  // The failure's key and args (decision 14.37): its status's ErrorInfo
  // reason and metadata. Never the status's text.
  Diagnostic diagnostic = 4;
}

// What the coordinator did with this delivery of a command. Deduplication
// is in the command_identity region.
//
//   APPLIED    business code ran and the result committed: the events are
//              new (possibly none; a zero-event decision leaves nothing to
//              deduplicate against, so a redelivery is APPLIED again).
//   DUPLICATE  the addressed stream already held events with this
//              command_id: business code did not run, and the events are
//              those, re-read from the stream.
//   PARKED     a Fact whose ingest handler failed (a process manager's
//              fact handler included), or that lost a race at every
//              write until the race re-run cap: it was accepted
//              and dead-lettered for an operator, with no events. Such a
//              failure is a bug, never a rejection, so the sender is
//              answered OK and must not treat it as a refusal.
//
// A rejection is never an outcome: it is a gRPC error status, and it writes
// nothing, so the same command_id may be retried.
enum DeliveryOutcome {
  DELIVERY_OUTCOME_UNSPECIFIED = 0; // Not reported
  DELIVERY_OUTCOME_APPLIED = 1; // Business code ran for this delivery; the events are new
  DELIVERY_OUTCOME_DUPLICATE = 2; // The stream already held this command_id's events; they are re-read
  DELIVERY_OUTCOME_PARKED = 3; // Fact accepted but its handler failed or it reached the race re-run cap; dead-lettered, no events
}
// endregion

message ContextualCommand {
  // Passed from aggregate coordinator to aggregate, consists of everything
  // needed to execute/evaluate the command: the target stream's history (a
  // snapshot plus pages up to the head) and the command, whose handling is
  // always resolved by the time it arrives here (see Handling):
  // expected_sequence provided by the caller or stamped by the coordinator
  // (always stamped for a Fact), and conflict_resolution concrete.
  //
  // The window boundary is command.handling.expected_sequence (call it E).
  // Under AGGREGATE_HANDLES and COMMUTATIVE (delivered identically) the
  // pages with sequences E .. events.next_sequence-1 are the conflict
  // window, and they are always delivered as pages: events.snapshot, when
  // present, has sequence <= E-1 (and there is no snapshot when E is 0), so
  // no part of the window is hidden inside snapshot state. Under STRICT, E
  // is the head and the window is empty.
  //
  // The snapshot, when present, has passed the coordinator's validity
  // checks (see Snapshot); it is the starting state. The coordinator has
  // dropped every page it covers (sequence <= snapshot.sequence), so pages
  // holds only the events after it (decision 14.40). The client library
  // decodes the starting state without checking it again and folds every
  // page it is given, in order, never comparing sequences with the
  // snapshot's. Every page and the command's payload are in the current
  // shape: the coordinator has upcast them (decision 14.39).
  EventBook events = 1;
  CommandBook command = 2;
  // When the input was accepted: stamped by the runtime that accepted it
  // (core's coordinator, or the angzarr-embedded kernel) before the
  // handler runs, never by the caller (decision 14.37), so command and
  // fact handlers can read it. (Whether the events of the write carry this
  // same instant as EventMeta.recorded_at is open; see 14.37.)
  google.protobuf.Timestamp recorded_at = 4;
  // The conflict nonce. Set when, and only when, the resolved
  // conflict_resolution is AGGREGATE_HANDLES or COMMUTATIVE (including an
  // empty window, so the handler path is uniform); empty under STRICT.
  // Under COMMUTATIVE the client library's own resolver reports the unit
  // sets instead (see ConflictResolution); the handler never sees it. An opaque value
  // minted by the coordinator per delivery and never persisted. It comes
  // back only as the value a handler resolved with
  // (CommandHandlerResponse.conflict.resolved_nonce).
  //
  // The client library passes it to the handler as a parameter, and the
  // handler must call resolve_conflicts(window, nonce) with exactly this
  // value before returning: that call is the handler's declaration that it
  // examined the window. The library reports the value the handler passed
  // (none if it never called it) with the handler's events, and the
  // COORDINATOR judges it (decision 14.42): without it, or with another
  // value, the coordinator discards the output and fails the command as
  // stale (ABORTED, COORDINATOR_REASON_CONFLICT_UNRESOLVED, as STRICT would), persisting
  // nothing. A value minted per delivery (rather than expected_sequence
  // itself) means a handler cannot satisfy the check without receiving the
  // parameter.
  bytes conflict_nonce = 3;
}

// Query types
message SequenceRange {
  uint64 lower = 1;
  optional uint64 upper = 2; // If not set, query to latest
}

message SequenceSet {
  repeated uint64 values = 1;
}

// Temporal query: retrieve aggregate state at a point in history.
//
// The returned EventBook may start from a snapshot instead of sequence 0,
// but only from one that cannot contain state from after the point:
// - as_of_sequence N: a snapshot with sequence <= N, followed by pages
//   snapshot.sequence+1 .. N.
// - as_of_time T: the stream's prefix up to and including the last event
//   whose EventMeta.recorded_at <= T. recorded_at is non-decreasing per
//   stream (see EventMeta), so this is a prefix: no later event can have an
//   earlier recorded_at. The book may start from a snapshot whose last
//   folded event (the page at snapshot.sequence) lies in that prefix.
// Without a qualifying kept snapshot (by default only the newest is kept)
// the book carries no snapshot and every page from 0 up to the point. Either
// way, folding the book yields the same state as a full replay to the point.
message TemporalQuery {
  oneof point_in_time {
    google.protobuf.Timestamp as_of_time = 1; // The prefix of events with EventMeta.recorded_at <= this
    uint64 as_of_sequence = 2; // Events with sequence <= this
  }
}

// Selects events within one domain. cover.domain is required, and
// cover.edition picks the timeline (unset = main; a set name must be a
// known edition, see Cover.edition, and each stream is read by its fork:
// main below its fork sequence, then the edition's own events; a stream
// not yet forked reads as main). For every event of one correlation across
// all domains, use EventQueryService.GetCorrelatedEvents (CorrelationQuery).
//   By stream:       cover { domain, root }
//   By correlation:  cover { domain } + correlation_id; every stream of the
//                    domain is searched, one EventBook per matching stream
//   Both:            cover { domain, root } + correlation_id; that stream only
// The selection, when set, applies within each selected stream.
message Query {
  Cover cover = 1;
  oneof selection {
    SequenceRange range = 3;
    SequenceSet sequences = 4;
    TemporalQuery temporal = 5;
  }
  // Correlation selector: when set, only pages whose
  // EventMeta.correlation_id equals it (the same 16 bytes) are
  // returned; a set value that is not 16 bytes is INVALID_ARGUMENT. Correlation
  // is recorded per page only (covers carry none); all pages of one write
  // share one correlation. Never crosses cover.domain (CorrelationQuery
  // does).
  UUID correlation_id = 6;
}

// region correlation_query
// Selects every event of one correlation, across all domains: the whole
// workflow a request or a fact started. Answered by
// EventQueryService.GetCorrelatedEvents as one EventBook per stream (domain,
// edition, root) holding that stream's pages with this correlation, in
// sequence order. The order of books is unspecified.
//
// Forward causation, from the result alone. Every reaction (a policy's
// commands, their events, a process manager's events, and refusal facts
// and their events) carries its trigger's correlation (see the
// command_identity region), so everything event E led to is in the result.
// How exactly each edge is known depends on the kind of event (decision
// 13.3):
//   - Events of a refusal fact are linked EXACTLY: their
//     causation.command_id is the refused command's id, derived from E,
//     the policy and the command's index (derived_ids region; decision
//     14.31).
//   - Events of reaction commands are linked only COARSELY, by
//     correlation: the pages of one command share its
//     causation.command_id, but the command's trigger (its causation_id)
//     is not on its events. The exact trigger edge (E -> the commands a
//     policy emitted for it -> their events) is in the traces and
//     logs the coordinators write (OpenTelemetry), not in the store.
// Accepted cost: the event store alone answers "what belongs to this
// workflow", but not "which events did
// this policy's reaction to E produce"; that question goes to the traces,
// whose retention the deployment chooses. Rejected commands leave no
// events, so they do not appear (see the attempt-audit sink in the design
// record).
message CorrelationQuery {
  // Required: INVALID_ARGUMENT when unset or not 16 bytes.
  UUID correlation_id = 1;
  // The timeline, as Cover.edition: unset = main; a set name must be
  // non-empty (a set "" is refused INVALID_ARGUMENT) and must be a known
  // edition (Cover.edition), and each stream is read as the edition reads
  // it (main's events below that stream's fork sequence, then its own; a
  // stream not yet forked reads as main).
  optional string edition = 2;
}
// endregion

// region event_stream_filter
// Subscription filter for event streaming: matches events whose
// EventMeta.correlation_id equals correlation_id (correlation is
// recorded per page only; all pages of one write share one correlation).
message EventStreamFilter {
  UUID correlation_id = 1; // Required: INVALID_ARGUMENT when unset or not 16 bytes
}
// endregion

// ============================================================================
// Dead Letter Queue (DLQ) Messages
// ============================================================================

// region dlq_details
// Sequence mismatch details for DLQ entries.
// Contains expected vs actual sequence for debugging and replay.
message SequenceMismatchDetails {
  uint64 expected_sequence = 1; // What the command expected (CommandBook.handling.expected_sequence)
  uint64 actual_sequence = 2; // What the stream was at (its next_sequence)
}

// A typed business refusal of an asynchronous command, for DLQ entries
// (decision 14.48, amended): the refusal object the handler answered, kept
// whole, as the wire carries it in the status details. The dead letter's
// reason is ROUTER_REASON_COMMAND_REFUSED with the same refusal_type.
message CommandRefusedDetails {
  // The refusal's fully-qualified type name, as the reason's refusal_type
  // arg.
  string refusal_type = 1;
  // The refusal object itself (one of the command's `refuses` types).
  google.protobuf.Any refusal = 2;
}

// Failure details for DLQ entries: why a handler, or the coordinator,
// failed to process the dead letter's payload. Events a policy, process
// manager or projector could not process, and every command, fact or
// removal the mapping on AngzarrDeadLetter.rejection_details assigns here
// (a bug, an untyped business, fatal refusal of an asynchronous command, a
// retry cap; decision 14.48). Named EventProcessingFailedDetails until
// 14.48's amendment; the field numbers are unchanged.
message ProcessingFailedDetails {
  Diagnostic failure = 5; // The handler's failure: its code and args, never its text (decision 14.37)
  uint32 retry_count = 2; // Number of retry attempts before DLQ routing
  bool is_transient = 3; // Whether the failure is considered transient
  // Flat array of captured errors representing the cause chain
  // (most-causal-first; the originating caught error is the LAST
  // element). Matches Sentry's `exception.values` shape; linkage via
  // each entry's `mechanism.exception_id` / `mechanism.parent_id`.
  // Empty when no capture was attempted. See sererr.fyi/spec/proto
  // for the schema rationale.
  repeated sererr.v1.CapturedError stack_trace = 4;
}

// Payload retrieval failure details for DLQ entries.
// Contains information about why a claim-checked payload (see
// PayloadReference: a bus-envelope concern) couldn't be retrieved.
message PayloadRetrievalFailedDetails {
  PayloadStorageType storage_type = 1; // Storage backend type
  string uri = 2; // URI of the payload that couldn't be retrieved
  bytes content_hash = 3; // Content hash for identification
  uint64 original_size = 4; // Original payload size in bytes
  Diagnostic failure = 6; // The retrieval's failure: its code and args, never its text (decision 14.37)
}
// endregion

// region dead_letter
// Dead letter queue entry for failed messages requiring manual intervention.
// Per-domain topics: angzarr.dlq.{domain}
//
// Among other failures, a fact whose ingest handler fails lands here: a
// failing fact handler is a bug, never a business rejection (see Fact).
//
// Replay (see dlq_admin.proto). An entry is immutable once written; replays
// of it are recorded beside it in the admin store (StoredDeadLetter.replays).
// A replay keeps the original command_id, correlation_id and causation_id:
// it is a redelivery of the same message, never a new command, so
// deduplication answers it DUPLICATE if the original did apply after all.
// Replays are delivered by a framework component (the DLQ replayer, mTLS
// identity), so a reaction command keeps its causation_id.
//   rejected_command  re-sent to the coordinator as an asynchronous command
//                     (HandleAsync), carrying its original ids.
//   rejected_events   re-delivered to the one component that failed
//                     (source_component), never re-published to every
//                     subscriber.
//   failed_edition_removal  the removal of that stream's rows of the
//                     edition attempted again (meta.proto, DeleteEdition).
//
// The stream concerned is the payload's own cover (rejected_command.cover,
// rejected_events.cover or failed_edition_removal.cover); the entry does not
// repeat it.
message AngzarrDeadLetter {
  oneof payload {
    // Command that failed, stored with its ids assigned (command_id and
    // correlation_id as minted, derived or supplied; pipeline step 2) and
    // its Handling as sent, before the coordinator resolved it (see
    // Handling). A command refused at validation never reaches the DLQ with
    // a minted id: it has none. Replay AS_IS keeps the Handling;
    // FRESH_SEQUENCE clears handling.expected_sequence so the coordinator
    // stamps the current head.
    CommandBook rejected_command = 2;
    EventBook rejected_events = 9; // Events that failed (policy/projector failures)
    // An edition removal that failed (meta.proto, DeleteEdition): the
    // stream whose rows of the edition could not be removed, as its cover,
    // and its meta.EditionDeleted event, as recorded there, as the one
    // page. An EventBook, since meta/events.proto imports this file.
    // Reason COORDINATOR_REASON_EDITION_REMOVAL_FAILED (decision 14.48,
    // amended).
    EventBook failed_edition_removal = 18;
  }
  // Why it was dead-lettered: a key and its args, never text (decision
  // 14.37). A typed business rejection is code ROUTER_REASON_COMMAND_REFUSED with arg
  // refusal_type, as on the wire; the object itself rides in
  // command_refused (CommandRefusedDetails). A command or fact the
  // coordinator gave up on after losing write races, at the retry cap
  // (AGGREGATE_HANDLES and COMMUTATIVE re-deliveries) or the race re-run
  // cap, is code COORDINATOR_REASON_RETRY_CAP_EXHAUSTED with args attempts
  // and cap, as answered to a waiting caller (decision 14.46); that key is
  // for write races only. A retryable bug dead-lettered at its cap records
  // the bug's own key and args, as last answered, never
  // COORDINATOR_REASON_RETRY_CAP_EXHAUSTED (decision 14.48, amended). An
  // asynchronous command (HandleAsync) refused by a business, fatal key,
  // COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD among them, records that
  // key and its args (decision 14.47). Which rejection_details variant a
  // reason carries is the mapping on rejection_details, below.
  Diagnostic reason = 16;
  // Exactly one variant on every dead letter, chosen by its reason
  // (decision 14.48). This is the one statement of the mapping; the
  // features and the decision log refer to it.
  //
  // sequence_mismatch: expected_sequence is the command's
  // CommandBook.handling.expected_sequence, actual_sequence the stream's
  // head (its next_sequence) when the command was refused.
  //   - COORDINATOR_REASON_EXPECTED_SEQUENCE_STALE: args expected and
  //     actual, as the two fields.
  //   - COORDINATOR_REASON_EXPECTED_SEQUENCE_AHEAD: args expected and head,
  //     head as actual_sequence.
  //   - COORDINATOR_REASON_CONFLICT_UNRESOLVED,
  //     COORDINATOR_REASON_CONFLICT_OVERLAP and a handler's own ABORTED
  //     key, on an asynchronous command that carries its caller's
  //     expected_sequence (command_handler.proto, status codes).
  // command_refused: a typed business refusal of an asynchronous command.
  //   - ROUTER_REASON_COMMAND_REFUSED: refusal_type is the reason's arg,
  //     refusal the object. A typed refusal always travels as this key; a
  //     handler's own business key is an untyped Diagnostic, below.
  // processing_failed: failure is the same Diagnostic as reason.
  //   - COORDINATOR_REASON_RETRY_CAP_EXHAUSTED, a command or fact at either
  //     write-race cap, with or without an expected sequence: retry_count
  //     is arg attempts, is_transient true.
  //   - An untyped business, fatal refusal of an asynchronous command
  //     (COORDINATOR_REASON_PM_NO_INSTANCE, a handler's own business key;
  //     14.37): retry_count 0, is_transient false.
  //   - A fatal bug (INTERNAL, UNKNOWN, DATA_LOSS):
  //     ROUTER_REASON_UNHANDLED_HANDLER_ERROR, ROUTER_REASON_FOLD_FAILED,
  //     ROUTER_REASON_FOLD_FAILED_EMITTED,
  //     ROUTER_REASON_PERSISTED_EVENT_CORRUPT,
  //     ROUTER_REASON_ANY_DECODE_FAILED, ROUTER_REASON_UNKNOWN_COMMAND_TYPE,
  //     ROUTER_REASON_NO_FACT_HANDLER, ROUTER_REASON_NO_REFUSAL_HANDLER,
  //     ROUTER_REASON_CONFLICT_RESOLUTION_UNSUPPORTED, and, with the
  //     policy's trigger as rejected_events,
  //     COORDINATOR_REASON_REFUSAL_FACT_WRONG_STREAM,
  //     COORDINATOR_REASON_REFUSAL_FACT_ADDRESSED,
  //     COORDINATOR_REASON_REFUSAL_FACT_NO_PAGE,
  //     COORDINATOR_REASON_REFUSAL_FACT_NOT_A_FACT,
  //     COORDINATOR_REASON_REFUSAL_FACT_IDENTIFIED,
  //     COORDINATOR_REASON_POLICY_COMMAND_OUTSIDE_DESTINATION,
  //     COORDINATOR_REASON_POLICY_COMMAND_OUTSIDE_EDITION,
  //     COORDINATOR_REASON_POLICY_COMMAND_NO_ROOT,
  //     COORDINATOR_REASON_POLICY_COMMAND_OTHER_CORRELATION and
  //     COORDINATOR_REASON_POLICY_COMMAND_WITH_HANDLING (also a reaction
  //     command refused at its destination, as rejected_command):
  //     retry_count 0, is_transient false, stack_trace when captured.
  //   - COORDINATOR_REASON_EDITION_REMOVAL_FAILED, with the
  //     failed_edition_removal payload: retry_count the attempts made,
  //     is_transient as the store's failure was judged.
  //   - A retryable bug, or a policy step's ABORTED re-run, at its cap
  //     (ROUTER_REASON_NO_COMPONENT_OF_KIND, a handler's retryable bug),
  //     its reason the bug's own key as last answered: retry_count the
  //     attempts made, is_transient true.
  // payload_retrieval_failed: a claim-checked payload (PayloadReference)
  // that cannot be retrieved.
  // Never a dead letter's reason: the readiness keys, the HostReason keys,
  // ROUTER_REASON_NO_HANDLERS_REGISTERED, ROUTER_REASON_DUPLICATE_COMPONENT
  // and ROUTER_REASON_HANDLER_PANICKED (only ever a cause).
  oneof rejection_details {
    SequenceMismatchDetails sequence_mismatch = 12; // Sequence conflict details
    ProcessingFailedDetails processing_failed = 13; // Handler or coordinator failure details
    PayloadRetrievalFailedDetails payload_retrieval_failed = 14; // Payload store failure details
    CommandRefusedDetails command_refused = 17; // Typed business refusal
  }
  google.protobuf.Timestamp occurred_at = 7;
  map<string, string> metadata = 8; // Additional context
  string source_component = 10; // Which component sent to DLQ
  ComponentKind source_component_kind = 15; // Its kind
}
// endregion

// ============================================================================
// Component Descriptors - Self-description for topology discovery
// ============================================================================

// Describes what a component subscribes to.
// Topology edges derived from inputs: if A subscribes to domain X, edge
// X→A exists.
message Target {
  string domain = 1;
}

// ComponentKind identifies a kind of dispatch component: in a component
// declaration ((io.angzarr.v1.component) in options.proto), in a
// registration (ComponentDescriptor.kind) and in a dead letter
// (AngzarrDeadLetter.source_component_kind). Defined here, beside the
// runtime messages; options.proto imports it.
enum ComponentKind {
  COMPONENT_KIND_UNSPECIFIED = 0;
  COMPONENT_KIND_AGGREGATE = 1;
  COMPONENT_KIND_POLICY = 2;
  COMPONENT_KIND_PROCESS_MANAGER = 3;
  COMPONENT_KIND_PROJECTOR = 4;
}

// Component self-description: the one component a business process is.
// The coordinator pulls it from the business process
// (ComponentService.Describe in component.proto); holding it is what makes
// the component registered.
//
// Generated, then validated (decision 14.42). angzarr-cli generates the
// whole descriptor at build time from the component's protos (its
// (component) declaration, its (command) and (event) entries and its
// (state) message), with rules_version the build's baked-in version. The
// business process answers Describe with it unchanged; neither business
// code nor the client library's router builds or checks it. The
// COORDINATOR validates it and refuses (see ComponentService, Refusal) a
// descriptor that has: an empty rules_version (COORDINATOR_REASON_MISSING_RULES_VERSION);
// starting_types on a kind other than PROCESS_MANAGER
// (COORDINATOR_REASON_STARTING_TYPES_ON_NON_PM); no state on an AGGREGATE or PROCESS_MANAGER
// (COORDINATOR_REASON_MISSING_STATE_TYPE), or a state on a POLICY or PROJECTOR
// (COORDINATOR_REASON_STATE_ON_STATELESS_KIND); for a POLICY, other than exactly one input
// (COORDINATOR_REASON_POLICY_INPUT_COUNT) or no output_domain (COORDINATOR_REASON_POLICY_NO_OUTPUT_DOMAIN); an
// output_domain on any other kind (COORDINATOR_REASON_OUTPUT_DOMAIN_ON_NON_POLICY).
message ComponentDescriptor {
  string name = 1;
  ComponentKind kind = 5;
  repeated Target inputs = 3; // Domains I subscribe to (event types I consume)
  // The business binary's full version, baked in when it is built: the same
  // value the component reports on every response
  // (CommandHandlerResponse.rules_version). Required: the coordinator
  // refuses a descriptor with an empty rules_version, so a binary
  // built without a version is never registered and never delivered to
  // (see ComponentService for how the refusal surfaces). The coordinator
  // checks snapshot
  // versions against it before offering a snapshot (see Snapshot), and
  // refuses a response that reports any other version (see
  // CommandHandlerResponse.rules_version).
  string rules_version = 4;
  // The component's event-sourced state: set for AGGREGATE and
  // PROCESS_MANAGER, unset for POLICY and PROJECTOR. Generated from the state
  // message's descriptor by angzarr-cli (business code never writes it by
  // hand).
  StateDescriptor state = 6;
  // PROCESS_MANAGER only: the fully-qualified type NAMES (no type URL
  // prefix: "examples.v1.OpenTable", never "/examples.v1.OpenTable") of the
  // command and fact types that are the PM's STARTING inputs, generated
  // from its (command) entries with starts set (options.proto). The
  // coordinator matches an input by the name its type URL ends in, after
  // upcasting (decision 14.41). An input for a correlation
  // with no PM instance is delivered only if its type is listed here;
  // otherwise the coordinator skips a fact silently and refuses a command
  // (ruling B1, adapted; decision 14.31; see
  // process_manager.proto, Starting an instance). Empty for every other
  // kind: a descriptor of another kind that sets it is refused, as one
  // with an empty rules_version is (see ComponentService, Refusal).
  // Generated by angzarr-cli (decision 14.42).
  repeated string starting_types = 7;
  // POLICY only: the one domain its commands go to
  // (ComponentOptions.output_domain, options.proto; decision 14.24),
  // generated by angzarr-cli. The policy's coordinator refuses a command
  // for any other domain (PolicyResponse in policy.proto; decision 14.42).
  // Required for a POLICY; set on any other kind, the descriptor is
  // refused (see above).
  string output_domain = 8;
}

// A component's state message, as the domain-blind coordinator needs it:
// its type and the conflict resolutions it supports. Nothing of its schema.
message StateDescriptor {
  // The state message's type URL ("/" + its fully-qualified name; see the
  // type URL rules at the top of this file).
  string type_url = 1;
  // The FULL resolved list of supported resolutions: the implicit base
  // (STRICT, AGGREGATE_HANDLES) plus whatever the state's (state) option
  // lists, deduplicated, in enum-number order. Never empty. The coordinator
  // takes the built-in default from it (COMMUTATIVE if listed, else STRICT)
  // and refuses a command or configuration naming a resolution it lacks.
  StateOptions options = 2;
}
