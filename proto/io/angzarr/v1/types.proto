// DOC: This file is referenced in docs/docs/reference/patterns.mdx
//      Update documentation when making changes to MergeStrategy, Handling,
//      Cover (editions), Snapshot, or the CommandPage body. The command
//      handling modes (DECISION, ASYNC, SIMPLE) are RPCs, documented in
//      command_handler.proto.

syntax = "proto3";
package io.angzarr.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
// Sentry-compat structured stack-trace + error-chain capture from the sererr
// project (sererr.fyi). The schema is vendored in this repo at
// proto/sererr/v1/sererr.proto and resolves from the same proto root as
// this file.
import "sererr/v1/sererr.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// Type URLs. Every google.protobuf.Any an Angzarr implementation emits uses
// the type URL "/" + the message's fully-qualified name (TYPE_URL_PREFIX =
// "/"), e.g. "/io.angzarr.v1.EventPage", "/orders.OrderCreated". Readers
// accept any prefix: a type URL identifies the message whose fully-qualified
// name is the text after its last "/", so "type.googleapis.com/orders.OrderCreated",
// "/orders.OrderCreated" and "orders.OrderCreated" all name the same message.
// Matching compares full names exactly: "orders.OrderCreated" never matches
// "OrderCreated" or "orders.v2.OrderCreated".

message UUID {
  bytes value = 1;
}

// region cover
// Stream identity, and nothing else: one stream is (domain, edition, root).
// Everything that varies per write or per page (correlation, actor, origin)
// lives on the page and its meta (CommandPage, EventMeta), and how a command
// is handled (expected sequence, merge) lives on CommandBook.handling;
// never on the Cover. Parent/child relationships between aggregates are
// carried in domain event payloads, not in the Cover.
message Cover {
  string domain = 2; // Domain name; never contains ':' (the root-derivation separator)
  UUID root = 1;
  // Edition: the NAME of the timeline the stream belongs to.
  //
  // Main timeline: the empty string "". It is the canonical and only name of
  // the main timeline (proto3 unset == ""). Every non-empty name is a
  // non-main edition. Editions are part of stream identity on the wire
  // (here and in EventRef.stream), so an edition's events can never be
  // mistaken for, or copied as, main-timeline events.
  //
  // Everything else about an edition is edition CONFIGURATION, not wire
  // data: its divergence points (where it branches from main, per domain;
  // reads fall through to main up to the divergence) and its storage.
  //
  // What-if execution. A what-if is a command run in an edition: send an
  // ordinary CommandBook whose cover names the edition. There is no
  // separate speculative RPC. Reactions (sagas, process managers) stay in
  // the edition of the event they react to.
  //
  // Storage. A configured edition uses its own storage configuration; an
  // unconfigured (unknown) edition falls back to the configured default
  // edition store, which may be in memory, redis, another persistent store,
  // or the existing production database (the edition is part of the storage
  // key, and the edition column stays in every database schema so the
  // existing database can host editions). Placement never changes the wire
  // contract. Projector output follows the edition's storage configuration:
  // an in-memory edition's projections are kept in memory.
  //
  // Lifetime follows the backend: memory lives as long as the process, redis
  // as long as its TTL, a database persists. DeleteEditionEvents (meta.proto)
  // discards a non-main edition explicitly.
  string edition = 4;
}
// endregion

// region merge_strategy
// Conflict strategy: how the aggregate coordinator treats a command whose
// expected sequence (Handling.expected_sequence) differs from the stream's
// head (a stale command). Carried by Handling.merge.
//
// MERGE_UNSPECIFIED (the zero value) means "not specified": the configured
// default applies (see Handling), and STRICT when configuration sets none.
// After the coordinator resolves Handling, merge is never UNSPECIFIED.
//
// The strategy matters only for commands whose sender provided
// expected_sequence. A command without one is stamped by the framework with
// the head it decides against, so it can never be stale.
//
// The concurrency window is the run of events the command did not see:
// sequences expected .. head-1.
//
// STRICT: any mismatch rejects with ABORTED (a failed test-and-set: the
// caller re-reads and re-issues), before business code runs.
// AGGREGATE_HANDLES: no coordinator check; decide receives the events since
// the expected sequence (the window) with the command and applies its own
// conflict rule. The window is always delivered as pages: the snapshot
// delivered with the command is at or below expected_sequence-1, never one
// that has already folded part of the window (see ContextualCommand).
//
// Conflict-resolution helpers live in the per-client libraries, computed
// locally over the events delivered with the command; there is no
// framework RPC for conflict resolution.
enum MergeStrategy {
  MERGE_UNSPECIFIED = 0; // Not specified: the configured default applies (STRICT if none)
  MERGE_STRICT = 2; // Reject on sequence mismatch (optimistic concurrency); default without config
  MERGE_AGGREGATE_HANDLES = 3; // decide receives the window and applies its own conflict rule
}
// endregion

// region payload_reference
// TRANSPORT-ONLY: claim-check references for the message bus.
//
// A bus envelope may carry a PayloadReference in place of an oversized
// payload when the payload exceeds the bus's size limit; the receiving side
// resolves it back into the payload before anything else sees the message.
// PayloadReference is never part of a persisted page: EventPage and
// CommandPage payloads are always a plain google.protobuf.Any, and the
// event store records the resolved payload. (These protos define no bus
// envelope message; the transport layer owns that envelope.)

// Storage backend type for externally stored payloads (claim check pattern).
enum PayloadStorageType {
  PAYLOAD_STORAGE_TYPE_UNSPECIFIED = 0;
  PAYLOAD_STORAGE_TYPE_FILESYSTEM = 1;
  PAYLOAD_STORAGE_TYPE_GCS = 2;
  PAYLOAD_STORAGE_TYPE_S3 = 3;
}

// Reference to an externally stored payload (claim check pattern), carried
// only by a bus envelope, never by a persisted page (see above).
message PayloadReference {
  PayloadStorageType storage_type = 1;
  // Location URI:
  // - file:///var/angzarr/payloads/{hash}.bin
  // - gs://bucket/prefix/{hash}.bin
  // - s3://bucket/prefix/{hash}.bin
  string uri = 2;
  // Content hash for integrity verification and deduplication (SHA-256)
  bytes content_hash = 3;
  // Original serialized payload size in bytes
  uint64 original_size = 4;
  // Timestamp when payload was stored (for TTL cleanup)
  google.protobuf.Timestamp stored_at = 5;
}
// endregion

// region event_page
// One persisted event. Sequences are uint64 wherever they appear (pages,
// snapshots, next_sequence, query ranges, DLQ details): a stream's sequence
// space is not bounded at 2^32.
//
// An event has no business-time field of its own: when it was recorded is
// EventMeta.recorded_at, and any business time (e.g. when an external fact
// originally occurred) belongs in the event payload.
message EventPage {
  // The domain event. Its type URL names the event type and version
  // (versioned packages: pkg.v1.Foo -> pkg.v2.Foo).
  google.protobuf.Any payload = 3;
  EventMeta meta = 8; // Provenance: who, when recorded, why, decided against what (see EventMeta)
  // The event's position in its stream (domain, edition, root). Always
  // definite: assigned by the framework when the event is persisted, never
  // deferred. Together with the stream it is the event's identity (EventRef).
  uint64 sequence = 9;
}
// endregion

// region event_ref
// Identifies one event: the page at `sequence` in the stream `stream`. This
// is an event's identity — no separate event id is minted — and is how one
// event names another (Causation.event).
message EventRef {
  Cover stream = 1; // The stream holding the event (domain, edition, root)
  uint64 sequence = 2; // The event's EventPage.sequence within that stream
}
// endregion

// region provenance
// Who issued a command and which workflow it belongs to. Carried by every
// command (CommandPage.provenance) and copied unchanged onto every event the
// command produces (EventMeta.provenance). On a command, empty fields mean
// "not supplied", never a meaningful empty value.
//
// Reaction commands. The coordinator stamps a reaction command's provenance
// from the triggering event's EventMeta.provenance: the same actor and the
// same correlation_id. A reactor leaves both empty; a reaction command that
// sets either to a different value is a reactor bug, refused (dead-lettered
// and alerted, never delivered). A reactor cannot start a new workflow or act
// as someone else.
//
// Correlation is never empty on a persisted event. The coordinator uses the
// caller's correlation_id when supplied; otherwise it derives one
// deterministically from the command's key (request_id for a request,
// external_id for a fact), so every retry of one request lands in one
// correlation; a keyless request gets a freshly minted one.
message Provenance {
  // Who caused the command. Opaque and pseudonymous: an identifier whose
  // mapping to a real person lives outside the event store, so erasing the
  // mapping anonymises the history without rewriting any event. Never an
  // email, name or other direct identifier.
  string actor = 1;
  // Workflow correlation; opaque. This (on commands and on EventMeta) is the
  // only record of correlation: covers carry none. All pages of one write
  // share one correlation. Query.correlation_id selects by it.
  string correlation_id = 2;
}
// endregion

// region origin
// Why a command exists, and therefore why the events it produced exist.
// A command's origin sits in its body arm (Command.origin or Fact.source);
// EventMeta.origin persists the full union, request | causation | fact.
//
// Idempotency: the claim model. The coordinator deduplicates every keyed
// command before business code runs, against an idempotency key store (see
// IdempotencyClaim). Each origin supplies the key:
//   request   — (request_id, index)
//   causation — (event, component, index)
//   fact      — external_id
// A request-origin command with no request_id has no key and is not
// deduplicated; HandleAsync and DLQ replay require one (see
// command_handler.proto).
//
// Scope. A key is claimed per addressed aggregate: the key store is keyed on
// (CommandBook.cover, key), so the same key sent to two streams is two
// claims.
//
// Claims. Only an APPLIED outcome is claimed, and the claim is written in the
// same transaction as the event append, so a claim exists iff its events do.
// Concurrent deliveries of one key race on that write with optimistic
// concurrency (the stream's expected sequence and the claim's uniqueness):
// exactly one commits, and the loser re-reads and answers DUPLICATE. An
// applied outcome is a sequence range on the addressed stream; zero events
// is a valid applied outcome (an empty range), and it is claimed too.
//
// Rejections are released, not claimed. A rejected command (a gRPC error
// status) writes nothing, so a retry with the same key runs business code
// again. The same holds for a failed fact ingest (answered PARKED).
//
// Duplicates. A delivery whose key is already claimed does not reach
// business code: the coordinator re-reads the claimed range from the stream
// and answers with those events and Outcome.delivery DUPLICATE.
//
// Fingerprint. Each claim records a fingerprint of the command as received:
// a hash over the serialized body payload (its google.protobuf.Any, type URL
// and value bytes, exactly as they arrived; the coordinator never
// re-serialises before hashing). SDKs serialise deterministically so an
// honest retry reproduces the same bytes. A request key that arrives again
// with a different fingerprint is refused FAILED_PRECONDITION (the key was
// reused for a different command) and is never answered DUPLICATE. Causation
// and fact keys record the fingerprint too; how a mismatch on them is
// answered is open (see docs/design/audit-meta/idempotency.md).
//
// Retention. A claim expires 24 hours after it was written for a request key
// and 7 days after for a causation or fact key; after expiry the key may run
// again. DLQ replay refuses an entry older than its key's retention unless
// the operator overrides it (see dlq_admin.proto).
//
// Backend capability. The claim must be atomic with the append. A storage
// backend that cannot write both in one transaction offers no HandleAsync
// and no DLQ replay (both answer UNIMPLEMENTED), because both deliver at
// least once and rely on the claim to make redelivery safe.

// A command issued directly by a caller, as part of one inbound request
// (e.g. one API call). (request_id, index) is the command's idempotency key
// at the addressed aggregate, kept 24 hours (see the claim model above).
message RequestOrigin {
  // Identifier of the inbound request, chosen by the caller and reused
  // verbatim on every retry of that request. Empty means "no key": the
  // command is not deduplicated, and HandleAsync refuses it.
  string request_id = 1;
  uint32 index = 2; // Position of the command within that request
}

// A command emitted by a saga, process manager or policy reacting to an
// event. The tuple (event, component, index) is the command's idempotency
// key at the destination, kept 7 days.
message Causation {
  // The event being reacted to: always the triggering event, never the
  // reactor's own earlier event. A process manager's command names the
  // trigger it is answering, like a saga's.
  EventRef event = 1;
  // Registered name of the reacting component. Stamped by the coordinator;
  // emitters leave it empty.
  string component = 2;
  // Position of this command within the reaction's emitted commands;
  // disambiguates several commands produced by one (event, component).
  // Stamped by the coordinator from the emission order.
  uint32 index = 3;
}

// Where a fact came from: something that already happened outside the
// system (a webhook, an integration). See Fact.
message FactOrigin {
  // Idempotency key from the external system (e.g. "pi_1234" from Stripe).
  // The framework deduplicates on it, per addressed aggregate, before
  // business code runs, and keeps the claim 7 days.
  string external_id = 1;
  string description = 2; // Human-readable origin (e.g. "Stripe webhook")
}
// endregion

// region idempotency_claim
// STORAGE-ONLY: one row of the idempotency key store, documented here as a
// schema so every storage backend records the same thing. No RPC carries it
// and no client sends or receives it; backends may store it as columns
// rather than as this encoded message. See the claim model in the origin
// region.
//
// Written in the same transaction as the events it records, and only for an
// APPLIED outcome: rejections and parked facts are never claimed.
message IdempotencyClaim {
  // The addressed aggregate: the claim's scope. (stream, key) is unique.
  Cover stream = 1;
  // The key: the producing command's origin, exactly as it arrived.
  oneof key {
    RequestOrigin request = 2; // (request_id, index); request_id never empty here
    Causation causation = 3; // (event, component, index)
    FactOrigin fact = 4; // external_id (description is not part of the key)
  }
  // Hash of the body payload as received (type URL and value bytes); a
  // later delivery of the key is compared against it.
  bytes fingerprint = 5;
  // The applied outcome: events first_sequence .. first_sequence+event_count-1
  // of `stream`. event_count 0 is a valid applied outcome with no events, and
  // first_sequence is then the stream's next_sequence at the time.
  uint64 first_sequence = 6;
  uint64 event_count = 7;
  // When the claim was written (the append's EventMeta.recorded_at) and when
  // it lapses: 24 hours later for a request key, 7 days for causation and
  // fact keys.
  google.protobuf.Timestamp claimed_at = 8;
  google.protobuf.Timestamp expires_at = 9;
}
// endregion

// region event_meta
// Provenance of one persisted event, stamped by the framework from the
// producing command. Every persisted event carries meta. Business code never
// sets meta: an EventBook returned by business code whose pages carry meta
// is refused (see CommandHandlerService.Handle).
//
// base_sequence and recorded_at are always recorded, and
// provenance.correlation_id is never empty on a persisted event (see
// Provenance). Every other field is optional on the wire: an empty value
// means "not recorded", never a meaningful empty value.
//
// The event's own identity is the EventRef of its page (its stream plus
// EventPage.sequence); EventMeta does not repeat it. The event that caused
// this one is not a separate field: it is origin.causation.event.
//
// One write is the events one command produced. All pages of one write
// share one provenance, one origin, one base_sequence and one rules_version.
message EventMeta {
  Provenance provenance = 1; // Copied from the producing command (actor, correlation)
  // Why the producing command exists (see the origin region). The command's
  // body does not persist with its events, so the full union is kept here.
  oneof origin {
    RequestOrigin request = 2;
    Causation causation = 3;
    FactOrigin fact = 4;
  }
  // When the event was durably recorded, stamped by the server that persisted
  // it. The only timestamp an event carries; TemporalQuery.as_of_time selects
  // by it.
  //
  // Non-decreasing per stream: the coordinator stamps
  // max(previous event's recorded_at, now), so a clock step backwards never
  // makes a later event look older. Events of one write share one
  // recorded_at. Because of this, the events recorded at or before any time
  // T are always a prefix of the stream (see TemporalQuery).
  google.protobuf.Timestamp recorded_at = 5;
  // The base the decision was made against: the length of the stream (its
  // next_sequence, the number of events in it) that decide saw when it
  // produced this event. Always recorded, for every origin and strategy; 0
  // means the decision saw an empty stream. It equals the producing
  // command's Handling.expected_sequence when that was stamped, or provided
  // and checked under STRICT; under AGGREGATE_HANDLES it is the head decide
  // saw, which may be past the provided sequence. (Renamed from decided_at:
  // it is a sequence, not a time.)
  uint64 base_sequence = 6;
  // Version of the business rules (handler code / configuration) that decided
  // the event. Declared by the deciding component when it registers
  // (ComponentDescriptor.rules_version) and stamped by the coordinator;
  // business code never sets it. Opaque to the framework; used to explain a
  // historical decision. Empty when the component declared none.
  // (annals, which shares these protos, treats rules_version as
  // load-bearing rather than opaque: a documented divergence, see
  // docs/design/audit-meta/annals-divergence.md.)
  string rules_version = 7;
}
// endregion

// region aggregate_snapshot
// Snapshot of aggregate state at a given sequence number.
// State must be a protobuf Message to serialize into Any.
//
// Snapshots are a framework optimisation, never business data. How often
// they are taken and how many are kept is framework/storage policy,
// configured per domain and following the edition's storage configuration;
// the default keeps the newest snapshot only. Business milestones are domain
// events, never retained snapshots.
message Snapshot {
  // Sequence of the last event folded into `state`. A TemporalQuery
  // as_of_time T may start from this snapshot iff that event's
  // EventMeta.recorded_at <= T, i.e. iff the snapshot lies within the
  // prefix recorded by T (see TemporalQuery).
  //
  // Business code may return a snapshot's state with its events (see
  // CommandHandlerService.Handle); the framework sets the sequence.
  uint64 sequence = 2;
  google.protobuf.Any state = 3;
}
// endregion

// region event_book
// A run of events from one stream. Every page shares the book's Cover.
message EventBook {
  Cover cover = 1;
  Snapshot snapshot = 2; // Snapshot state; sequence computed by framework on persist
  repeated EventPage pages = 3;
  uint64 next_sequence = 6; // Computed on load, never stored: (last page seq OR snapshot seq if no pages) + 1
}
// endregion

message Projection {
  Cover cover = 1;
  string projector = 2;
  uint64 sequence = 3;
  google.protobuf.Any projection = 4;
}

// region handling
// How the system treats one command. Handling is instructions, not data:
// it is never persisted (EventMeta records what was decided, not how the
// command was handled), and identity, business data and provenance never
// live here.
//
// How much of the processing the caller waits for is NOT handling: it is a
// call-level choice, made by which coordinator RPC the caller uses (Handle,
// HandleAsync or HandleSync; see the command_modes region in
// command_handler.proto).
//
// As sent, then resolved. Before the coordinator, Handling holds what the
// sender asked for, and any field may be unset. Before business code runs,
// the coordinator resolves it in place: it stamps expected_sequence when
// absent, and fills merge from configuration when unspecified. From then on
// (ContextualCommand, business code) every field is concrete. A dead letter
// stores the book as received, with Handling as sent (see
// AngzarrDeadLetter).
//
// Defaults come from configuration. The merge strategy is configured per
// command type and per component (the aggregate, saga or process manager).
// Precedence, highest first:
//   1. Handling, when the field is set and configuration allows the override
//   2. configuration for the command type (its payload's type URL)
//   3. configuration for the component
//   4. the built-in default: STRICT
//
// Violations are refused loudly, never silently ignored. Each of these is
// malformed, refused before deduplication or business code:
//   - a field that configuration forbids overriding for the command type or
//     component;
//   - expected_sequence on a Fact (see below);
//   - any Handling on a reaction command (see below).
// A client's malformed command is answered INVALID_ARGUMENT, by every
// coordinator RPC (HandleAsync included: it validates before enqueueing).
// A reaction command has no caller to answer, so it is dead-lettered as a
// reactor bug (and alerted), never delivered.
//
// Reaction commands (emitted by sagas and process managers) carry NO
// Handling at all: expected_sequence and merge are both forbidden. A reactor
// never knows the destination's state, so the destination always stamps
// expected_sequence, and with a stamped sequence merge can never apply. How
// a reaction command is delivered comes from the emitting component's
// configuration. An empty Handling (no field set) is the same as none.
//
// Facts (CommandPage.body = Fact) cannot be refused, so no sequence check
// applies: a Fact that sets expected_sequence is malformed and refused as
// above. The coordinator always stamps a Fact.
message Handling {
  // The stream state the command was issued against: the expected
  // next_sequence of the target stream.
  //
  // If provided, the command is rejected before business code unless the
  // stream is at expected_sequence, or the resolved merge strategy is
  // AGGREGATE_HANDLES, in which case decide receives the events since
  // expected_sequence and applies its own conflict rule. If absent, the
  // framework stamps the head it decides against, before business code.
  //
  // Either way, the check or the stamp happens in the framework before the
  // command reaches business code, so decide always sees a concrete
  // sequence, and the version decided against is recorded on every
  // resulting event (EventMeta.base_sequence).
  optional uint64 expected_sequence = 1;
  // Conflict strategy on a stale expected_sequence (see MergeStrategy).
  // Unspecified: the configured default.
  MergeStrategy merge = 2;
}
// endregion

// region command_page
// One command: provenance, and a body that is either a decision-requesting
// Command or an already-happened Fact. How the command is handled is not
// part of the page (see CommandBook.handling).
//
// Reflective dispatch. The framework picks the pipeline from which body arm
// is set (the arm's message type): a Command goes through decide (fallible:
// it may be rejected), a Fact through ingest (infallible). Within the
// pipeline the payload's type URL picks the handler. On the wire the arm is
// the fact marker.
//
// Facts cannot carry a causation origin: Fact has no such field, so a
// reaction can never inject a fact. Reactions emit Commands.
message CommandPage {
  Provenance provenance = 2; // Stamped onto the events this command produces
  oneof body {
    Command command = 3; // Asks the aggregate to decide; may be rejected
    Fact fact = 4; // Records something that already happened; never rejected
  }
}

// A command proper: a request for the aggregate to decide. decide may emit
// events or reject it.
//
// Idempotency (see the claim model in the origin region): the origin is the
// key, claimed per addressed aggregate only when the command is applied. A
// rejected command is not claimed, so the same key may be retried; a request
// key reused with a different payload is refused FAILED_PRECONDITION.
message Command {
  google.protobuf.Any payload = 1; // The domain command; its type URL picks the handler
  // Why the command exists (see the origin region).
  oneof origin {
    RequestOrigin request = 2; // Issued by a caller
    Causation causation = 3; // Emitted by a saga, process manager or policy
  }
}

// A fact: something that already happened outside the system (a webhook,
// an integration), delivered through the command coordinator like any
// command (Handle, HandleAsync or HandleSync).
//
// Fact handlers are infallible: they record the fact (possibly together
// with events that flag it, e.g. a payment received for an unknown order)
// and never reject it. A failing fact handler is a bug, not a business
// rejection: the fact is dead-lettered and alerted, and the sender is
// answered "accepted, parked" (OK, Outcome.delivery PARKED, no events),
// never a rejection. The framework deduplicates on source.external_id, per
// addressed aggregate, before the handler runs; only an applied fact is
// claimed (see the claim model in the origin region), so a parked fact
// redelivered by its source runs ingest again.
//
// A Fact is never checked against a sequence: the coordinator always stamps
// the head. A book whose Fact sets handling.expected_sequence is malformed
// and refused loudly (INVALID_ARGUMENT), before deduplication or ingest;
// it is never silently stamped over (see Handling).
message Fact {
  google.protobuf.Any payload = 1; // The fact; its type URL picks the ingest handler
  FactOrigin source = 2; // Where it came from; carries the idempotency key
}
// endregion

// region command_book
// Exactly one command addressed to one stream, with how it is to be
// handled. Commands are not batched: a CommandBook holds a single page.
// (EventBooks, by contrast, group the pages of one stream under a shared
// Cover.) CommandBook is the request itself: the coordinator's Handle,
// HandleAsync and HandleSync take it directly, with no request wrapper.
message CommandBook {
  Cover cover = 1; // The target stream (domain, edition, root)
  CommandPage page = 3;
  // How the system treats this command: as sent before the coordinator,
  // resolved after it (see Handling). Never persisted.
  Handling handling = 6;
}
// endregion

// region outcome
// What the system did with one command: results of its handling, carried on
// CommandResponse and NEVER persisted. Nothing here is written to any
// stream, and replaying a stream cannot reproduce it. The command's business
// result is CommandResponse.events.
message Outcome {
  DeliveryOutcome delivery = 1;
  // Synchronous projector results. Produced only by the coordinator's
  // HandleSync (SIMPLE); empty for Handle (DECISION). (Projectors
  // persist their own read models; these are copies returned to the caller.)
  repeated Projection projections = 2;
  // Synchronous projectors that failed on this command's events. HandleSync
  // answers OK whenever the decision committed: a projector failure never
  // undoes it and never turns the response into an error status. Each
  // failing projector appears here instead of in projections, and its
  // events are retried or dead-lettered on the asynchronous projection
  // path. Empty for Handle (DECISION).
  repeated ProjectorFailure projector_failures = 3;
}

// One synchronous projector that failed during HandleSync.
message ProjectorFailure {
  string projector = 1; // Registered name of the projector
  // The failure as a gRPC status code (google.rpc.Code numbering) and
  // message. Whether the projection will be retried follows the retryable
  // set in command_handler.proto.
  int32 code = 2;
  string message = 3;
}

// What the coordinator did with this delivery of a command. The claim model
// behind APPLIED and DUPLICATE is in the origin region.
//
//   APPLIED    business code ran and the result committed: the events are
//              new (possibly none), and the command's key, if any, is now
//              claimed for that sequence range.
//   DUPLICATE  the key was already claimed: business code did not run, and
//              the events are the claimed range, re-read from the stream.
//   PARKED     a Fact whose ingest handler failed: the fact was accepted and
//              dead-lettered for an operator, with no events. Ingest failure
//              is a bug, never a rejection, so the sender is answered OK and
//              must not treat it as a refusal; the key is not claimed.
//
// A rejection is never an outcome: it is a gRPC error status, and the key
// is released (not claimed), so the same key may be retried.
enum DeliveryOutcome {
  DELIVERY_OUTCOME_UNSPECIFIED = 0; // Not reported
  DELIVERY_OUTCOME_APPLIED = 1; // Business code ran for this delivery; the events are new
  DELIVERY_OUTCOME_DUPLICATE = 2; // Already claimed; the events are re-read from the claimed range
  DELIVERY_OUTCOME_PARKED = 3; // Fact accepted but its ingest failed; dead-lettered, no events
}
// endregion

message ContextualCommand {
  // Passed from aggregate coordinator to aggregate, consists of everything
  // needed to execute/evaluate the command: the target stream's history (a
  // snapshot plus pages up to the head) and the command, whose handling is
  // always resolved by the time it arrives here (see Handling):
  // expected_sequence provided by the caller or stamped by the coordinator
  // (always stamped for a Fact), and merge concrete. Under
  // AGGREGATE_HANDLES the pages from handling.expected_sequence to the head
  // are the conflict window decide resolves, and they are always delivered
  // as pages: events.snapshot, when present, has sequence <=
  // expected_sequence-1 (and there is no snapshot when expected_sequence is
  // 0), so no part of the window is hidden inside snapshot state.
  EventBook events = 1;
  CommandBook command = 2;
}

// Query types
message SequenceRange {
  uint64 lower = 1;
  optional uint64 upper = 2; // If not set, query to latest
}

message SequenceSet {
  repeated uint64 values = 1;
}

// Temporal query: retrieve aggregate state at a point in history.
//
// The returned EventBook may start from a snapshot instead of sequence 0,
// but only from one that cannot contain state from after the point:
// - as_of_sequence N: a snapshot with sequence <= N, followed by pages
//   snapshot.sequence+1 .. N.
// - as_of_time T: the stream's prefix up to and including the last event
//   whose EventMeta.recorded_at <= T. recorded_at is non-decreasing per
//   stream (see EventMeta), so this is a prefix: no later event can have an
//   earlier recorded_at. The book may start from a snapshot whose last
//   folded event (the page at snapshot.sequence) lies in that prefix.
// Without a qualifying kept snapshot (by default only the newest is kept)
// the book carries no snapshot and every page from 0 up to the point. Either
// way, folding the book yields the same state as a full replay to the point.
message TemporalQuery {
  oneof point_in_time {
    google.protobuf.Timestamp as_of_time = 1; // The prefix of events with EventMeta.recorded_at <= this
    uint64 as_of_sequence = 2; // Events with sequence <= this
  }
}

// Selects events. cover.domain is required, and cover.edition picks the
// timeline ("" = main).
//   By stream:       cover { domain, root }
//   By correlation:  cover { domain } + correlation_id; every stream of the
//                    domain is searched, one EventBook per matching stream
//   Both:            cover { domain, root } + correlation_id; that stream only
// The selection, when set, applies within each selected stream.
message Query {
  Cover cover = 1;
  oneof selection {
    SequenceRange range = 3;
    SequenceSet sequences = 4;
    TemporalQuery temporal = 5;
  }
  // Correlation selector: when non-empty, only pages whose
  // EventMeta.provenance.correlation_id equals it are returned. Correlation
  // is recorded per page only (covers carry none); all pages of one write
  // share one correlation. Never crosses cover.domain.
  string correlation_id = 6;
}

message AggregateRoot {
  string domain = 1;
  UUID root = 2;
}

// region event_stream_filter
// Subscription filter for event streaming: matches events whose
// EventMeta.provenance.correlation_id equals correlation_id (correlation is
// recorded per page only; all pages of one write share one correlation).
message EventStreamFilter {
  string correlation_id = 1;
}
// endregion

// ============================================================================
// Dead Letter Queue (DLQ) Messages
// ============================================================================

// region dlq_details
// Sequence mismatch details for DLQ entries.
// Contains expected vs actual sequence for debugging and replay.
message SequenceMismatchDetails {
  uint64 expected_sequence = 1; // What the command expected (CommandBook.handling.expected_sequence)
  uint64 actual_sequence = 2; // What the stream was at (its next_sequence)
}

// Event processing failure details for DLQ entries.
// Contains information about why a saga/projector failed to process events.
message EventProcessingFailedDetails {
  string error = 1; // Error message from the handler
  uint32 retry_count = 2; // Number of retry attempts before DLQ routing
  bool is_transient = 3; // Whether the failure is considered transient
  // Flat array of captured errors representing the cause chain
  // (most-causal-first; the originating caught error is the LAST
  // element). Matches Sentry's `exception.values` shape; linkage via
  // each entry's `mechanism.exception_id` / `mechanism.parent_id`.
  // Empty when no capture was attempted. See sererr.fyi/spec/proto
  // for the schema rationale.
  repeated sererr.v1.CapturedError stack_trace = 4;
}

// Payload retrieval failure details for DLQ entries.
// Contains information about why a claim-checked payload (see
// PayloadReference: a bus-envelope concern) couldn't be retrieved.
message PayloadRetrievalFailedDetails {
  PayloadStorageType storage_type = 1; // Storage backend type
  string uri = 2; // URI of the payload that couldn't be retrieved
  bytes content_hash = 3; // Content hash for identification
  uint64 original_size = 4; // Original payload size in bytes
  string error = 5; // Error message from the retrieval attempt
}
// endregion

// region dead_letter
// Dead letter queue entry for failed messages requiring manual intervention.
// Per-domain topics: angzarr.dlq.{domain}
//
// Among other failures, a fact whose ingest handler fails lands here: a
// failing fact handler is a bug, never a business rejection (see Fact).
//
// Replay (see dlq_admin.proto). An entry is immutable once written; replays
// of it are recorded beside it in the admin store (StoredDeadLetter.replays).
// A replay keeps the original provenance, origin and idempotency key: it is
// a redelivery of the same message, never a new command, so the key store
// answers it DUPLICATE if the original did apply after all.
//   rejected_command  re-sent to the coordinator as an asynchronous command
//                     (HandleAsync), carrying its original key.
//   rejected_events   re-delivered to the one component that failed
//                     (source_component), never re-published to every
//                     subscriber.
message AngzarrDeadLetter {
  Cover cover = 1; // Stream the failed message concerns: domain, edition, root
  oneof payload {
    // Command that failed, stored as received: its Handling is as sent,
    // before the coordinator resolved it (see Handling). Replay AS_IS keeps
    // it; FRESH_SEQUENCE clears handling.expected_sequence so the
    // coordinator stamps the current head.
    CommandBook rejected_command = 2;
    EventBook rejected_events = 9; // Events that failed (saga/projector failures)
  }
  string rejection_reason = 3; // Human-readable reason
  oneof rejection_details {
    SequenceMismatchDetails sequence_mismatch = 12; // Sequence conflict details
    EventProcessingFailedDetails event_processing_failed = 13; // Handler failure details
    PayloadRetrievalFailedDetails payload_retrieval_failed = 14; // Payload store failure details
  }
  google.protobuf.Timestamp occurred_at = 7;
  map<string, string> metadata = 8; // Additional context
  string source_component = 10; // Which component sent to DLQ
  string source_component_type = 11; // "aggregate" | "saga" | "projector" | "process_manager"
}
// endregion

// ============================================================================
// Component Descriptors - Self-description for topology discovery
// ============================================================================

// Describes what a component subscribes to.
// Topology edges derived from inputs: if A subscribes to domain X, edge X→A exists.
message Target {
  string domain = 1;
}

// Component self-description, given when a component registers with its
// coordinator.
message ComponentDescriptor {
  string name = 1;
  string component_type = 2;
  repeated Target inputs = 3; // Domains I subscribe to (event types I consume)
  // Version of the business rules this running component decides with
  // (handler code and configuration; e.g. a build id or release tag).
  // Opaque. Declared here, once per registration, and stamped by the
  // coordinator onto every event the component's decisions produce
  // (EventMeta.rules_version); business code never sets it per event. A
  // deployment that changes rules re-registers with a new value.
  string rules_version = 4;
}
