// DOC: This file is referenced in docs/docs/reference/patterns.mdx
//      Update documentation when making changes to MergeStrategy, SyncMode,
//      Edition, SnapshotRetention, or Notification types.

syntax = "proto3";
package io.angzarr.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
// Sentry-compat structured stack-trace + error-chain capture from the sererr
// project (sererr.fyi). The schema is vendored in this repo at
// proto/sererr/v1/sererr.proto and resolves from the same proto root as
// this file.
import "sererr/v1/sererr.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// Type URLs. Every google.protobuf.Any an Angzarr implementation emits uses
// the type URL "/" + the message's fully-qualified name (TYPE_URL_PREFIX =
// "/"), e.g. "/io.angzarr.v1.Notification", "/orders.OrderCreated". Readers
// accept any prefix: a type URL identifies the message whose fully-qualified
// name is the text after its last "/", so "type.googleapis.com/orders.OrderCreated",
// "/orders.OrderCreated" and "orders.OrderCreated" all name the same message.
// Matching compares full names exactly: "orders.OrderCreated" never matches
// "OrderCreated" or "orders.v2.OrderCreated".

message UUID {
  bytes value = 1;
}

// region cover
message Cover {
  string domain = 2;
  UUID root = 1;
  string correlation_id = 3; // Workflow correlation - flows through all commands/events
  Edition edition = 4; // Edition for diverged timelines; unset or empty name = main timeline
  // Field 5 removed: external_id moved to ExternalDeferredSequence in PageHeader
  reserved 5;
  reserved "external_id";
  // Client-supplied extension slot. Most consumers pack a nested
  // ``Cover`` here to express parent-aggregate relationships (e.g.
  // table events carry the tournament Cover; hand events carry the
  // table Cover). Helper ``unpack_parent_cover`` extracts the typed
  // Cover when present. Framework code treats this as opaque routing
  // metadata — it propagates without inspecting.
  //
  // WARNING — mass-propagating: the framework stamps this slot onto
  // EVERY event a child aggregate emits, so the payload is paid per
  // event. Keep what you pack small. The intended workload is a single
  // nested Cover (~50–80 bytes packed); larger payloads multiply
  // across the event stream and the bus.
  google.protobuf.Any ext = 6;
}
// endregion

// region edition
// Edition identifier with optional explicit divergence points.
//
// Main timeline: its canonical name is "angzarr" (the DEFAULT_EDITION
// constant). On the wire it is sent as an unset Edition or an empty name;
// every reader treats "", unset and "angzarr" as the same timeline, and
// storage keys all three identically.
//
// Two modes:
// - Implicit (divergences empty): Divergence derived from first edition event's sequence
// - Explicit (divergences populated): Per-domain divergence points for historical branching,
//  saga coordination, or speculative execution
message Edition {
  string name = 1; // Edition name, e.g., "v2"; empty (or "angzarr") = main timeline
  repeated DomainDivergence divergences = 2; // Optional: explicit per-domain divergence points
}

// Explicit divergence point for a specific domain.
// Used when creating historical branches or coordinating saga writes across domains.
message DomainDivergence {
  string domain = 1; // Domain name
  uint32 sequence = 2; // Divergence sequence number
}
// endregion

// region sync_mode
// Controls synchronous processing behavior.
//
// Default: ASYNC. SYNC_MODE_UNSPECIFIED (the zero value) is treated as ASYNC.
//
// Impact ordering (lowest to highest):
//   ASYNC  < DECISION < SIMPLE < CASCADE
// ISOLATED sits outside this ordering: it persists synchronously but
// suppresses every downstream reaction, sync or async.
//
// Primary caller of DECISION is process managers coordinating cross-aggregate
// flows: the PM issues a command to the target aggregate and needs to know
// *only* whether the aggregate accepted or rejected, without paying the cost
// of projector propagation or saga fan-out. The aggregate's accept path
// (events persisted + returned) and reject path (CommandRejectedError) are
// both observable; everything downstream runs asynchronously.
enum SyncMode {
  SYNC_MODE_UNSPECIFIED = 0; // Unset — the server treats it as the documented default (Async)
  SYNC_MODE_ASYNC = 1; // Async: fire and forget (default)
  SYNC_MODE_SIMPLE = 2; // Sync projectors only, no saga cascade
  SYNC_MODE_CASCADE = 3; // Full sync: projectors + saga cascade (expensive)
  SYNC_MODE_DECISION = 4; // Sync aggregate accept/reject only; projectors + sagas run async
  SYNC_MODE_ISOLATED = 5; // Sync accept/reject + persist; NO downstream (sync OR async). Replay / migration / recovery writes that must not trigger reactions. Distinct from DECISION (which still publishes to bus for async downstream).
}
// endregion

// region cascade_error_mode
// Controls how CASCADE mode handles errors from sagas/PMs.
// Only relevant when sync_mode = CASCADE.
// Default: FAIL_FAST. CASCADE_ERROR_UNSPECIFIED (the zero value) is treated as FAIL_FAST.
enum CascadeErrorMode {
  CASCADE_ERROR_UNSPECIFIED = 0; // Unset — the server treats it as the documented default (FailFast)
  CASCADE_ERROR_FAIL_FAST = 1; // Stop on first error, fail request (default)
  CASCADE_ERROR_CONTINUE = 2; // Continue through all, return successes + errors
  // On first error, fail the request and compensate every reaction command
  // that already executed: one Compensate notification per executed command,
  // delivered to its target aggregate through the coordinator's compensation
  // outbox (see Notification). A rejected reaction command's
  // RejectionNotification is still delivered to its source.
  CASCADE_ERROR_COMPENSATE = 3;
  CASCADE_ERROR_DEAD_LETTER = 4; // On error, send to DLQ and continue with remaining
}
// endregion

// region merge_strategy
// Controls how the aggregate coordinator treats a command whose expected
// sequence differs from the aggregate's next_sequence (a stale command).
// Default: COMMUTATIVE. MERGE_UNSPECIFIED (the zero value) is treated as COMMUTATIVE.
//
// Merge strategies apply only to commands that carry an explicit expected
// sequence (PageHeader.sequence) — commands from external clients, or a
// saga/PM command that deliberately sets one. Deferred commands
// (PageHeader.angzarr_deferred) carry no expected version: they are never
// sequence- or merge-checked under any strategy, are appended at the
// destination head, and are guarded only by the destination handler's own
// validation and by their idempotency key.
//
// The concurrency window is the run of events the command did not see:
// sequences expected .. next_sequence-1.
//
// COMMUTATIVE: the command runs against current state; the state fields its
// events change are compared (via CommandHandlerService.Replay) with the
// fields changed inside the window. Disjoint changes are persisted; an
// overlap rejects with a retryable FAILED_PRECONDITION. A handler without
// Replay gets STRICT behaviour.
// STRICT: any mismatch rejects with a retryable FAILED_PRECONDITION.
// AGGREGATE_HANDLES: no coordinator check; the handler receives the full
// prior history and decides.
// MANUAL: a mismatch is published to the dead letter queue and rejected
// with a non-retryable ABORTED.
enum MergeStrategy {
  MERGE_UNSPECIFIED = 0; // Unset — the server treats it as the documented default (Commutative)
  MERGE_COMMUTATIVE = 1; // Default: merge unless changed fields overlap the window
  MERGE_STRICT = 2; // Reject on sequence mismatch (optimistic concurrency)
  MERGE_AGGREGATE_HANDLES = 3; // Aggregate handles its own concurrency
  MERGE_MANUAL = 4; // Dead-letter for manual review on mismatch
}
// endregion

// region snapshot_retention
// Decides which snapshots of an aggregate (domain, edition, root) survive
// when a newer snapshot of it is written. The newest snapshot is never
// deleted, and reads always use the newest snapshot. The retention a handler
// sets on its snapshot is persisted unchanged.
enum SnapshotRetention {
  RETENTION_DEFAULT = 0; // Same as TRANSIENT: deleted when a newer snapshot is written
  RETENTION_PERSIST = 1; // Keep indefinitely (business milestone)
  RETENTION_TRANSIENT = 2; // Delete when a newer snapshot is written
}
// endregion

// region payload_reference
// Storage backend type for externally stored payloads (claim check pattern).
enum PayloadStorageType {
  PAYLOAD_STORAGE_TYPE_UNSPECIFIED = 0;
  PAYLOAD_STORAGE_TYPE_FILESYSTEM = 1;
  PAYLOAD_STORAGE_TYPE_GCS = 2;
  PAYLOAD_STORAGE_TYPE_S3 = 3;
}

// Reference to externally stored payload (claim check pattern).
// Used when event/command payloads exceed message bus size limits.
message PayloadReference {
  PayloadStorageType storage_type = 1;
  // Location URI:
  // - file:///var/angzarr/payloads/{hash}.bin
  // - gs://bucket/prefix/{hash}.bin
  // - s3://bucket/prefix/{hash}.bin
  string uri = 2;
  // Content hash for integrity verification and deduplication (SHA-256)
  bytes content_hash = 3;
  // Original serialized payload size in bytes
  uint64 original_size = 4;
  // Timestamp when payload was stored (for TTL cleanup)
  google.protobuf.Timestamp stored_at = 5;
}
// endregion

// region page_header
// Shared header for CommandPage and EventPage.
// Encodes sequence type and provenance for framework processing.
message PageHeader {
  oneof sequence_type {
    uint32 sequence = 1; // Explicit sequence: client commands and persisted events
    ExternalDeferredSequence external_deferred = 2; // External fact (Stripe, FedEx, etc.)
    AngzarrDeferredSequence angzarr_deferred = 3; // Saga-produced command/fact
  }
  // Per-command override of the enclosing CommandRequest's sync_mode.
  // Only meaningful on CommandPage headers; ignored on EventPage headers.
  // PMs emit a `repeated CommandBook` and cannot reach the request wrapper
  // themselves; setting sync_mode here lets a PM tag a single emitted
  // command (e.g. SYNC_MODE_DECISION when its accept/reject must surface
  // synchronously) while the surrounding flow stays whatever the original
  // caller asked for. When unset (the common case) coordinators inherit
  // CommandRequest.sync_mode unchanged.
  optional SyncMode sync_mode = 4;
}

// For facts from external systems (webhooks, integrations).
// Framework stamps sequence on delivery; idempotency via external_id.
message ExternalDeferredSequence {
  string external_id = 1; // Idempotency key from external system (e.g., "pi_1234" from Stripe)
  string description = 2; // Human-readable origin (e.g., "Stripe webhook")
}

// Provenance header for commands (and facts) emitted by sagas and process
// managers. A deferred command has no expected version: the destination
// appends it at its head with no sequence or merge-strategy check of any
// kind; the destination handler's own validation is the only business
// guard, and the idempotency key below is the duplicate guard. Rejections
// route back to `source`.
//
// The emitter (the client router dispatching the saga/PM) sets:
//   source        — cover of the EventBook that triggered the handler
//   source_seq    — sequence of the triggering event
//   command_index — position of the command in the invocation's output
// The coordinator fills `source` when empty, always stamps
// `source_component`, and re-stamps `command_index` from the emission order.
//
// A saga/PM command that sets an explicit PageHeader.sequence instead is
// validated by the destination exactly like a client command under its merge
// strategy. Such a command forgoes deferred provenance: it has no idempotency
// key and its rejection cannot be routed back for compensation.
//
// The idempotency key at the destination is (kind, source, source_seq,
// source_component, command_index), where kind is what the header is attached
// to: command (a deferred command), rejection-notification or
// compensate-notification (a Notification delivery envelope carrying that
// payload; see Notification). source/source_seq alone identify only the
// triggering event: one invocation emitting several commands at the same
// destination — or two components reacting to the same event — would collide
// and silently drop all but the first command on redelivery. kind keeps a
// notification about a command distinct from the command itself: a Compensate
// envelope carries the provenance tuple of the command it undoes and must
// never be dropped as a duplicate of that command.
message AngzarrDeferredSequence {
  Cover source = 1; // Full source aggregate (domain + root + edition) - rejection routes here
  uint32 source_seq = 2; // Sequence of the triggering event
  // Registered name of the producing component (saga/PM). Coordinator-stamped;
  // emitters leave it empty.
  string source_component = 3;
  // Position of this command within the invocation's emitted command list;
  // disambiguates multiple commands produced by one (source, source_seq)
  // trigger.
  uint32 command_index = 4;
  reserved 5;
  reserved "basis_seq";
}
// endregion

// region event_page
message EventPage {
  PageHeader header = 1; // Sequence type and provenance
  google.protobuf.Timestamp created_at = 2;
  oneof payload {
    google.protobuf.Any event = 3;
    PayloadReference external = 4; // Claim check: payload stored externally
  }
  // Field 5 removed: FactSequence replaced by PageHeader.external_deferred
  reserved 5;
  reserved "fact_sequence";

  reserved 6, 7;
  reserved "no_commit", "cascade_id";
}
// endregion

// region aggregate_snapshot
// Snapshot of aggregate state at a given sequence number.
// State must be a protobuf Message to serialize into Any.
message Snapshot {
  // Field 1 removed pre-v0.1.0; original name not recorded.
  reserved 1;
  uint32 sequence = 2;
  google.protobuf.Any state = 3;
  SnapshotRetention retention = 4; // Controls cleanup behavior
  // Wall-clock timestamp the snapshot was persisted. A TemporalQuery
  // as_of_time T may start from this snapshot iff created_at is set and
  // <= T (see TemporalQuery). Readers treat an absent created_at as "not
  // usable for as_of_time".
  google.protobuf.Timestamp created_at = 5;
}
// endregion

// region event_book
message EventBook {
  Cover cover = 1;
  Snapshot snapshot = 2; // Snapshot state; sequence computed by framework on persist
  repeated EventPage pages = 3;
  // Field 4 removed: correlation_id moved to Cover
  // Field 5 removed: snapshot_state unified into snapshot field
  reserved 4, 5;
  reserved "correlation_id", "snapshot_state";
  uint32 next_sequence = 6; // Computed on load, never stored: (last page seq OR snapshot seq if no pages) + 1
}
// endregion

// Request wrapper for event operations (fact injection).
// Adds execution metadata (sync_mode, skip_handler) to EventBook.
message EventRequest {
  EventBook events = 1;
  SyncMode sync_mode = 2;
  // Tag 3 (route_to_handler) must never be reused: skip_handler has the
  // inverted meaning, so sharing a tag would flip it for old wire bytes.
  reserved 3;
  reserved "route_to_handler";
  // For fact injection: zero value (false/unset) routes the fact through the
  // aggregate's handle_fact for validation/error checking before persistence
  // (safe default). Facts cannot be rejected, but the handler can validate
  // data integrity and log warnings. When true, facts are persisted directly
  // without handler invocation (projector-originated writes).
  bool skip_handler = 4;
}

message Projection {
  Cover cover = 1;
  string projector = 2;
  uint32 sequence = 3;
  google.protobuf.Any projection = 4;
}

message CommandPage {
  PageHeader header = 1; // Sequence type and provenance
  MergeStrategy merge_strategy = 2;
  oneof payload {
    google.protobuf.Any command = 3;
    PayloadReference external = 4; // Claim check: payload stored externally
  }
}

message CommandBook {
  Cover cover = 1;
  repeated CommandPage pages = 2;
  // Field 3 removed: correlation_id moved to Cover
  // Field 4 removed: saga_origin moved to PageHeader.angzarr_deferred
  // Field 5 removed: 'fact' was unused
  reserved 3, 4, 5;
  reserved "correlation_id", "saga_origin", "fact";
}

// Request wrapper for command operations.
// Adds execution metadata (sync_mode, cascade_error_mode) to CommandBook.
message CommandRequest {
  CommandBook command = 1;
  SyncMode sync_mode = 2;
  CascadeErrorMode cascade_error_mode = 3; // How to handle saga/PM errors in CASCADE mode
  reserved 4;
  reserved "cascade_id";
}

message ContextualCommand {
  // Passed from aggregate coordinator to aggregate, consists of everything needed to execute/evaluate the command
  EventBook events = 1;
  CommandBook command = 2;
}

// Request wrapper for contextual command operations (internal use).
// Adds execution metadata (sync_mode) to ContextualCommand.
message ContextualCommandRequest {
  ContextualCommand command = 1;
  SyncMode sync_mode = 2;
}

// Query types
message SequenceRange {
  uint32 lower = 1;
  optional uint32 upper = 2; // If not set, query to latest
}

message SequenceSet {
  repeated uint32 values = 1;
}

// Temporal query: retrieve aggregate state at a point in history.
//
// The returned EventBook may start from a snapshot instead of sequence 0,
// but only from one that cannot contain state from after the point:
// - as_of_sequence N: a snapshot with sequence <= N, followed by pages
//   snapshot.sequence+1 .. N.
// - as_of_time T: a snapshot whose created_at is set and <= T, followed by
//   pages after snapshot.sequence with created_at <= T. A snapshot without
//   created_at is never used for as_of_time.
// Without a qualifying snapshot the book carries no snapshot and every page
// from 0 up to the point. Either way, folding the book yields the same state
// as a full replay to the point.
message TemporalQuery {
  oneof point_in_time {
    google.protobuf.Timestamp as_of_time = 1; // Events with created_at <= this
    uint32 as_of_sequence = 2; // Events with sequence <= this
  }
}

message Query {
  // Cover identifies the aggregate: domain + (root | correlation_id | both)
  // Query by root: Cover { domain, root }
  // Query by correlation: Cover { domain, correlation_id }
  Cover cover = 1;
  // Field 2 removed: now use cover.root
  reserved 2;
  oneof selection {
    SequenceRange range = 3;
    SequenceSet sequences = 4;
    TemporalQuery temporal = 5;
  }
}

message AggregateRoot {
  string domain = 1;
  UUID root = 2;
}

// region event_stream_filter
// Subscription filter for event streaming
message EventStreamFilter {
  string correlation_id = 1;
}
// endregion

// ============================================================================
// Notifications - compensation signals delivered to aggregates
// ============================================================================
//
// Notifications differ from Events in key ways:
// - NEVER persisted to the target's event stream; only the events its
//   compensation handler emits in response are persisted
// - NO sequence numbers (not ordered within an aggregate)
// - NO event sourcing replay
//
// Compensation delivery. A Notification is a durable obligation of the
// coordinator that raises it:
// - Raised when a saga/PM command is rejected (payload RejectionNotification,
//   target = the command's angzarr_deferred.source) or when a CASCADE
//   request with CASCADE_ERROR_COMPENSATE must undo a reaction command that
//   already executed (payload Compensate, target = that command's cover).
// - The coordinator records the obligation in its compensation outbox before
//   it acknowledges the trigger (the triggering event delivery, or the
//   CASCADE request's response). A recorded obligation survives a
//   coordinator restart.
// - It is delivered at least once, as the delivery-envelope CommandBook
//   described on RejectionNotification, to the target domain's
//   CommandHandlerCoordinatorService.HandleCompensation; failed deliveries
//   are retried with backoff and, once the coordinator's configured outbox
//   retry budget is exhausted, the envelope is dead-lettered (AngzarrDeadLetter with
//   compensation_delivery_failed details) and the obligation is closed.
// - The target deduplicates deliveries by (kind, source, source_seq,
//   source_component, command_index) — see AngzarrDeferredSequence — with
//   kind rejection-notification or compensate-notification: a redelivered
//   notification does not invoke the compensation handler again and returns
//   the events of the first delivery. A notification is never deduplicated
//   against a command with the same provenance tuple.
// - A rejection always reaches its source, in every sync mode. Under
//   CASCADE_ERROR_COMPENSATE a failed CASCADE request raises both the
//   rejected reaction command's RejectionNotification (to its source) and a
//   Compensate notification for every reaction command that already executed
//   (to that command's target).
//
// Notifications reuse Cover for routing (domain, root, correlation_id) but
// lack EventPage's sequence semantics.

// region notification
// Compensation signal addressed to one aggregate. Routed by cover; never
// persisted to the aggregate's event stream. Type discrimination via
// the message name after the last "/" of payload.type_url.
message Notification {
  Cover cover = 1; // Routing: domain, root, correlation_id
  google.protobuf.Any payload = 2; // RejectionNotification or Compensate
  google.protobuf.Timestamp sent_at = 3; // When notification was created
  reserved 4;
  reserved "metadata";
}
// endregion

// region rejection_notification
// Notification payload for command rejection scenarios.
// Embedded in Notification.payload when a saga/PM command is rejected.
//
// Source info for compensation is in rejected_command.pages[].header.angzarr_deferred:
// - source.domain, source.root, source.edition → where to route rejection
// - source_seq → which event triggered the command
//
// Delivery envelope: the coordinator wraps the Notification in a CommandBook
// addressed to the source aggregate — cover = angzarr_deferred.source (with
// the rejected command's correlation_id when the source cover has none) and
// one CommandPage whose command is the Notification packed in an Any (type
// URL "/io.angzarr.v1.Notification"; consumers match the name after the last
// '/') and whose header is angzarr_deferred carrying the rejected
// command's source, source_seq, source_component and command_index. With
// kind rejection-notification, that tuple is the delivery's deduplication key. The CommandBook is delivered
// from the compensation outbox (see Notification) to the source domain's
// CommandHandlerCoordinatorService.HandleCompensation, which invokes
// CommandHandlerService.Handle; the handler answers with a BusinessResponse
// (compensation events, a RevocationResponse, or a Notification forwarded
// upstream). Handlers select compensation logic by the pair
// (rejected_command.cover.domain, rejected command type).
message RejectionNotification {
  CommandBook rejected_command = 1; // The command that was rejected (full context)
  string rejection_reason = 2; // Why: "insufficient_funds", "out_of_stock", etc.
  reserved 3, 4, 5, 6;
}
// endregion

// region compensate
// Notification payload asking an aggregate to undo the effects of a reaction
// command it already executed — raised when a CASCADE request with
// CASCADE_ERROR_COMPENSATE fails after that command ran. Delivered like a
// RejectionNotification (see Notification): the envelope's cover is the
// aggregate that executed the command, and its angzarr_deferred header carries
// that command's provenance tuple (deduplicated with kind
// compensate-notification). The aggregate's compensation handler emits new
// compensating events; the compensated events stay in the stream.
message Compensate {
  reserved 1;
  reserved "target";
  repeated uint32 sequences = 2;  // Sequences of the events the command produced
  string reason = 3;              // Why compensation is needed (the failure that aborted the request)
}
// endregion

// ============================================================================
// Dead Letter Queue (DLQ) Messages
// ============================================================================

// region dlq_details
// Sequence mismatch details for DLQ entries.
// Contains expected vs actual sequence for debugging and replay.
message SequenceMismatchDetails {
  uint32 expected_sequence = 1; // What the command expected
  uint32 actual_sequence = 2; // What the aggregate was at
  MergeStrategy merge_strategy = 3; // Strategy that triggered DLQ routing
}

// Event processing failure details for DLQ entries.
// Contains information about why a saga/projector failed to process events.
message EventProcessingFailedDetails {
  string error = 1; // Error message from the handler
  uint32 retry_count = 2; // Number of retry attempts before DLQ routing
  bool is_transient = 3; // Whether the failure is considered transient
  // Flat array of captured errors representing the cause chain
  // (most-causal-first; the originating caught error is the LAST
  // element). Matches Sentry's `exception.values` shape; linkage via
  // each entry's `mechanism.exception_id` / `mechanism.parent_id`.
  // Empty when no capture was attempted. See sererr.fyi/spec/proto
  // for the schema rationale.
  repeated sererr.v1.CapturedError stack_trace = 4;
}

// Payload retrieval failure details for DLQ entries.
// Contains information about why an externally stored payload couldn't be retrieved.
message PayloadRetrievalFailedDetails {
  PayloadStorageType storage_type = 1; // Storage backend type
  string uri = 2; // URI of the payload that couldn't be retrieved
  bytes content_hash = 3; // Content hash for identification
  uint64 original_size = 4; // Original payload size in bytes
  string error = 5; // Error message from the retrieval attempt
}

// Compensation delivery failure details for DLQ entries.
// The dead letter's rejected_command is the Notification delivery envelope.
message CompensationDeliveryFailedDetails {
  uint32 attempts = 1; // Delivery attempts made before dead-lettering
  string last_error = 2; // Error returned by the last attempt
}
// endregion

// region dead_letter
// Dead letter queue entry for failed messages requiring manual intervention.
// Per-domain topics: angzarr.dlq.{domain}
message AngzarrDeadLetter {
  Cover cover = 1; // Routing: domain, root, correlation_id
  oneof payload {
    CommandBook rejected_command = 2; // Command that failed
    EventBook rejected_events = 9; // Events that failed (saga/projector failures)
  }
  string rejection_reason = 3; // Human-readable reason
  reserved 4, 5, 6;
  oneof rejection_details {
    SequenceMismatchDetails sequence_mismatch = 12; // Sequence conflict details
    EventProcessingFailedDetails event_processing_failed = 13; // Handler failure details
    PayloadRetrievalFailedDetails payload_retrieval_failed = 14; // Payload store failure details
    CompensationDeliveryFailedDetails compensation_delivery_failed = 15; // Notification delivery exhausted its retries
  }
  google.protobuf.Timestamp occurred_at = 7;
  map<string, string> metadata = 8; // Additional context
  string source_component = 10; // Which component sent to DLQ
  string source_component_type = 11; // "aggregate" | "saga" | "projector" | "process_manager"
}
// endregion

// ============================================================================
// Component Descriptors - Self-description for topology discovery
// ============================================================================

// Describes what a component subscribes to.
// Topology edges derived from inputs: if A subscribes to domain X, edge X→A exists.
message Target {
  string domain = 1;
}

// Component self-description.
message ComponentDescriptor {
  string name = 1;
  string component_type = 2;
  repeated Target inputs = 3; // Domains I subscribe to (event types I consume)
}
