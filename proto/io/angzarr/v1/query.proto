syntax = "proto3";
package io.angzarr.v1;

import "io/angzarr/v1/types.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_outer_classname = "QueryServiceProto";
option java_package = "io.angzarr";
option ruby_package = "Angzarr";

// EventQueryService: query interface for retrieving events
//
// Editions: a Query or CorrelationQuery naming a non-main edition that was
// never created (EditionAdminService.CreateEdition, meta.proto) is refused
// NOT_FOUND.
service EventQueryService {
  // Get a single EventBook (unary) - use for explicit queries with gRPC tooling
  rpc GetEventBook(Query) returns (EventBook) {
    option (google.api.http) = {get: "/v1/query/{cover.domain}/events"};
  }
  // Stream EventBooks matching query - use for bulk retrieval (SSE)
  rpc GetEvents(Query) returns (stream EventBook) {
    option (google.api.http) = {get: "/v1/query/{cover.domain}/events/stream"};
  }
  // Every event of one correlation, across all domains: one EventBook per
  // stream holding that stream's pages with the correlation, in sequence
  // order (see CorrelationQuery in types.proto, which also says how to
  // derive forward causation from the result). A Query's correlation
  // selector stays within one domain; this RPC does not. An unset
  // correlation_id, or one that is not 16 bytes, is INVALID_ARGUMENT; a
  // correlation with no events is an empty stream, not NOT_FOUND. REST: the
  // path segment is the UUID's bytes, so transcoding takes base64
  // (URL-safe), not canonical UUID text (see UUID in types.proto).
  rpc GetCorrelatedEvents(CorrelationQuery) returns (stream EventBook) {
    option (google.api.http) = {get: "/v1/query/correlations/{correlation_id.value}/events"};
  }
  // List every stream (SSE): one Cover (domain, edition, root) per stream.
  rpc GetAggregateRoots(google.protobuf.Empty) returns (stream Cover) {
    option (google.api.http) = {get: "/v1/query/aggregates"};
  }
  // (Synchronize, a bidirectional stream answering each Query with
  // GetEventBook's result, was deleted in pass 6. It was not the catch-up
  // subscription the site describes: it never switched to live events. Use
  // GetEvents for bulk reads and EventStreamService.Subscribe for live
  // events.)
}
