syntax = "proto3";
package io.angzarr.scheduler.v1;

import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Scheduler";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/scheduler/v1;angzarrscheduler";
option java_multiple_files = true;
option java_package = "io.angzarr.scheduler";
option ruby_package = "Angzarr::Scheduler";

// DRAFT (decision 14.90), for the owner's review: the time facts of the
// scheduler, and nothing else.
//
// The owner's direction, 2026-11-02: "It'll need to be external, firing
// facts (datetime reached) into the domains that asked for them, in
// accordance with their alarms", and "we'll want proto for those time
// facts". The scheduler is its own component, a DOMAIN (ctxloom-rs-port
// D12: built in ctxloom first, lifted into angzarr-embedded later). It
// keeps ONE stream per target stream (D5 Q5): the target stream's alarms
// and nothing else, rooted compute_root("scheduler", <the target stream's
// text>) (types.proto, derived_ids; the stream text of reasons.proto's
// `stream` arg). The target re-checks every alarm it is told of against
// its own arming (D5 Q5). This supersedes FUTURE.md's "Timers and
// deadlines" sketch where they differ: no "after a duration" form (a
// domain asks for an instant), and the fact delivered is AlarmReached, not
// a payload the domain hands over.
//
// Why its own package. These are a domain's payloads (layer L0 of decision
// 46), the scheduler's: not core (io.angzarr.v1 holds the coordinator's
// records and imports nothing angzarr), not the handler layer (what any
// handler kind takes and returns), not a component service or a
// transport. Like any domain's package it imports only core (for Cover).
// The scheduler's own state, events and (component) declaration are its
// implementation's, not this contract's.

// A domain asks for an alarm on its own stream: tell `target` AlarmReached
// once `at` is reached. Addressed to the scheduler's stream for `target`.
// Arming an alarm_id that is armed already moves it to the new `at`; the
// old instant is never reached.
message ArmAlarm {
  // The stream to tell: the asking domain's own (domain, root, edition).
  io.angzarr.v1.Cover target = 1;
  // The asking domain's name for the alarm, unique within its stream:
  // what it re-checks AlarmReached against. Required, non-empty.
  string alarm_id = 2;
  // The instant asked for, UTC. One already past is reached at once.
  google.protobuf.Timestamp at = 3;
}

// A domain withdraws an alarm it armed: it is never reached. Cancelling an
// alarm that is not armed (never armed, reached, or cancelled already)
// records nothing.
message CancelAlarm {
  string alarm_id = 1;
}

// The time fact: `at` is reached for the alarm the target armed as
// `alarm_id`. Delivered to the target stream as a FACT, so it is never
// refused; the target re-checks it against its own arming and records
// nothing when the alarm was re-armed to another instant or cancelled
// meanwhile (a reached alarm and a cancel can cross).
//
// Its id is deterministic, so a delivery repeated across restarts is
// deduplicated by the target (types.proto, the command_identity region,
// Fact): its fact_origin.external_id is
//   "alarm:" <the target stream's text> "/" alarm_id "@" at
// with `at` as RFC 3339 in UTC with nanoseconds and a trailing `Z`, and its
// command_id the usual fact derivation from it. The same alarm re-armed to
// another instant is another fact.
message AlarmReached {
  string alarm_id = 1; // As armed
  google.protobuf.Timestamp at = 2; // The instant armed, not the clock's reading when it fired
}
