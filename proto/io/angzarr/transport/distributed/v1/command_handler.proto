syntax = "proto3";
package io.angzarr.transport.distributed.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Transport.Distributed";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/distributed/v1;angzarrdistributed";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.distributed";
option ruby_package = "Angzarr::Transport::Distributed";

// The distributed coordinator's command RPCs. The command modes, the
// pipeline and the status codes they follow are every runtime's
// (docs/design/command-handling.md §1; decision
// 14.64).
service CommandHandlerCoordinatorService {
  // DECISION. Process one command and answer with its decision. The
  // CommandBook is the request; a command's handling carries the client's
  // expected sequence, as data for its handler (see Handling). Facts (external realities) are injected
  // here too, in the Fact arm of CommandPage.body.
  //
  // Accepted: the response carries the persisted events, with delivery
  // APPLIED. A command whose command_id the addressed stream already holds
  // is not handed to business code again; the response carries those
  // events, re-read from the stream, with delivery DUPLICATE. A fact whose handler fails, or that lost a race at every
  // write until the race re-run cap, is dead-lettered and its sender
  // answered INTERNAL ANGZARR_REASON_FACT_DEAD_LETTERED (non-retryable; decision
  // 14.100, DRAFT). Rejected: a gRPC error status, and nothing is written (a
  // handler's refusal, under its own key; a command that lost a race at
  // every write until the race re-run cap is INTERNAL,
  // ANGZARR_REASON_RETRY_CAP_EXHAUSTED, and not dead-lettered: the
  // caller holds it; see the status codes above).
  rpc Handle(io.angzarr.v1.CommandBook) returns (CommandResult) {
    option (google.api.http) = {
      post: "/v1/ch/{cover.domain}/commands"
      body: "*"
    };
  }
  // ASYNC. Validate the command, assign its ids (pipeline steps 1-2),
  // enqueue it durably and return. The OK response says only that the
  // command was accepted for processing: no decision has been made, and
  // deduplication happens when it is processed, so there are no events and
  // no delivery outcome to report.
  //
  // Asynchronous delivery is at least once; the command_id assigned before
  // enqueueing makes redelivery from the queue safe. A caller that may
  // itself retry the call should supply the command_id, as for Handle.
  //
  // Validation happens before enqueueing: a malformed command (see Handling)
  // is refused here, never enqueued. A rejection happens later, with no caller to answer: like a reaction
  // command's, a retryable bug is retried up to its cap, and any other
  // failure is dead-lettered and alerted (status codes, above); a refusal
  // is dead-lettered as its typed refusal (AngzarrDeadLetter's refusal
  // arm; decisions 14.47 and 14.101).
  // A caller that needs the outcome
  // uses Handle, or follows the command's correlation_id
  // (EventStreamService.Subscribe, CorrelationFrom).
  rpc HandleAsync(io.angzarr.v1.CommandBook) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/ch/{cover.domain}/commands:async"
      body: "*"
    };
  }
  // SIMPLE. As Handle (DECISION), and also waits for the projectors the
  // request names (HandleSyncRequest.projectors, each through its
  // ProjectorCoordinatorService HandleSync) to project the persisted
  // events; their results come back in projections, one per named
  // projector. Which projectors to wait for is the call's choice: no
  // projector carries a synchronous mode (decision 14.107, DRAFT).
  //
  // Refused before anything runs, INVALID_ARGUMENT: an empty list
  // (ANGZARR_REASON_SYNC_NO_PROJECTORS; a caller that waits for no
  // projector calls Handle, so the list is required and there is no second
  // path), or a named projector that is not subscribed to the command's
  // domain, an unknown name included
  // (ANGZARR_REASON_SYNC_PROJECTOR_NOT_SUBSCRIBED). A name listed twice is
  // waited for once.
  //
  // A named projector that fails after the decision committed fails
  // the call with a RETRYABLE status: UNAVAILABLE
  // ANGZARR_REASON_SYNC_PROJECTION_FAILED, naming the projector, its
  // failure the cause (decision 14.105, DRAFT). The decision stays
  // committed; nothing is undone. There is no partial answer: the call
  // either answers every projection or fails. The caller retries with the
  // same command_id: the retry deduplicates (delivery DUPLICATE), answers
  // the same events, and waits on the named projectors again.
  rpc HandleSync(HandleSyncRequest) returns (CommandSyncResult) {
    option (google.api.http) = {
      post: "/v1/ch/{command.cover.domain}/commands:sync"
      body: "*"
    };
  }
  // A policy's output or refusal fact (decision 14.79, DRAFT; owner ruling
  // Q4 on decision 46). Framework components only (the entry_points region
  // below): a client is refused PERMISSION_DENIED. Answers as Handle
  // (DECISION), with a CommandResult: the persisted events and the
  // delivery, or the rejection's status, which the policy's coordinator
  // hands to Translate. No HTTP route: it is not a client entry point.
  rpc Deliver(io.angzarr.v1.ReactionDelivery) returns (CommandResult);
}

// region entry_points
// Clients use Handle, HandleAsync and HandleSync; framework components use
// them too, and alone use Deliver (decision 14.79, DRAFT).
//
// A framework component (a policy coordinator delivering reaction
// commands and refusal facts, the outbox dispatcher, the DLQ replayer, a
// coordinator delivering triggers) authenticates with its mTLS identity,
// issued to framework components only. Only such a caller may call:
//   - Deliver, with a ReactionDelivery (its derived command_id, or the
//     refused command's id on a refusal fact, and its causation; the
//     receiving coordinator trusts them from this caller);
//   - PolicyCoordinatorService.Execute, with a caller-supplied
//     trigger EventBook (whose stamping copies the trigger's correlation
//     and EventRef onto the policy's commands and refusal facts).
// Any other caller is a client. A client's CommandBook has no field for a
// causation (decision 14.79). A client call to Deliver or to a trigger
// entry point is refused PERMISSION_DENIED: the request is well formed,
// but the caller is not allowed to make it
// (INVALID_ARGUMENT would wrongly tell the caller to fix the message).
// Deployments may still expose the trigger routes over HTTP; the gateway
// forwards the caller's identity, so a client reaching them is refused the
// same way.
//
// Who called, framework or client, goes to the security log, never into
// the data (io/angzarr/v1/types.proto, security_logs region).
// endregion

// What HandleSync takes (decision 14.107, DRAFT): the command, and the
// projectors to wait for.
message HandleSyncRequest {
  io.angzarr.v1.CommandBook command = 1;
  // The registered names of the projectors to wait for: required,
  // non-empty, each subscribed to the command's domain.
  repeated string projectors = 2;
}

// What Handle and Deliver answer (decision 14.105, DRAFT): one command's
// events and what the coordinator did with this delivery of it. Never
// persisted.
message CommandResult {
  // The command's events: new (APPLIED) or re-read from the stream
  // (DUPLICATE).
  io.angzarr.v1.EventBook events = 1;
  // APPLIED or DUPLICATE (io.angzarr.v1.DeliveryOutcome).
  io.angzarr.v1.DeliveryOutcome delivery = 2;
}

// What HandleSync answers (decision 14.105, DRAFT): a CommandResult's
// fields and the named projectors' results. Never persisted.
message CommandSyncResult {
  // As CommandResult.events.
  io.angzarr.v1.EventBook events = 1;
  // As CommandResult.delivery.
  io.angzarr.v1.DeliveryOutcome delivery = 2;
  // One per projector HandleSyncRequest.projectors named, each covering
  // these events. (Projectors persist their own read models; these are copies
  // returned to the caller.)
  repeated io.angzarr.v1.Projection projections = 3;
}
