syntax = "proto3";
package io.angzarr.transport.distributed.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Transport.Distributed";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/distributed/v1;angzarrdistributed";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.distributed";
option ruby_package = "Angzarr::Transport::Distributed";

// The distributed coordinator's command RPCs. The command modes, the
// pipeline and the status codes they follow are every runtime's
// (io/angzarr/v1/command_handler.proto, the command_modes region; decision
// 14.64).
service CommandHandlerCoordinatorService {
  // DECISION. Process one command and answer with its decision. The
  // CommandBook is the request; a command's handling carries the client's
  // expected sequence, as data for its handler (see Handling). Facts (external realities) are injected
  // here too, in the Fact arm of CommandPage.body.
  //
  // Accepted: the response carries the persisted events, with
  // outcome.delivery APPLIED. A command whose command_id the addressed
  // stream already holds is not handed to business code again; the response
  // carries those events, re-read from the stream, with outcome.delivery
  // DUPLICATE. A fact whose ingest handler fails, or that lost a race at
  // every write until the race re-run cap, is answered OK with
  // outcome.delivery PARKED and no events ("accepted, parked"; it is
  // dead-lettered). outcome.projections and outcome.projector_failures are
  // always empty. Rejected: a gRPC error status, and nothing is written (a
  // handler's refusal, under its own key; a command that lost a race at
  // every write until the race re-run cap is INTERNAL,
  // COORDINATOR_REASON_RETRY_CAP_EXHAUSTED, and not dead-lettered: the
  // caller holds it; see the status codes above).
  rpc Handle(io.angzarr.v1.CommandBook) returns (CommandResponse) {
    option (google.api.http) = {
      post: "/v1/ch/{cover.domain}/commands"
      body: "*"
    };
  }
  // ASYNC. Validate the command, assign its ids (pipeline steps 1-2),
  // enqueue it durably and return. The OK response says only that the
  // command was accepted for processing: no decision has been made, and
  // deduplication happens when it is processed, so there are no events and
  // no delivery outcome to report.
  //
  // Asynchronous delivery is at least once; the command_id assigned before
  // enqueueing makes redelivery from the queue safe. A caller that may
  // itself retry the call should supply the command_id, as for Handle.
  //
  // Validation happens before enqueueing: a malformed command (see Handling)
  // is refused here, never enqueued. A rejection happens later, with no caller to answer: like a reaction
  // command's, a retryable bug is retried up to its cap, and any other
  // failure is dead-lettered and alerted (status codes, above); a business,
  // fatal refusal records its key and args as AngzarrDeadLetter.reason
  // (decision 14.47).
  // A caller that needs the outcome
  // uses Handle, or follows the command's correlation_id
  // (EventStreamFilter).
  rpc HandleAsync(io.angzarr.v1.CommandBook) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/ch/{cover.domain}/commands:async"
      body: "*"
    };
  }
  // SIMPLE. As Handle (DECISION), and also waits for the domain's
  // synchronous projectors to project the persisted events; their results
  // come back in outcome.projections. The projectors run on the committed
  // events, so a projector failure never undoes the decision and never
  // turns the answer into an error: once the decision commits, HandleSync
  // answers OK with the events, the projections that succeeded, and one
  // outcome.projector_failures entry per projector that failed (whose
  // events then follow the asynchronous projection path's retries).
  rpc HandleSync(io.angzarr.v1.CommandBook) returns (CommandResponse) {
    option (google.api.http) = {
      post: "/v1/ch/{cover.domain}/commands:sync"
      body: "*"
    };
  }
  // A policy's output or refusal fact (decision 14.79, DRAFT; owner ruling
  // Q4 on decision 46). Framework components only (the entry_points region
  // below): a client is refused PERMISSION_DENIED. Answers as Handle
  // (DECISION): the persisted events and the outcome, or the rejection's
  // status, which the policy's coordinator hands to Translate. No HTTP
  // route: it is not a client entry point.
  rpc Deliver(io.angzarr.v1.ReactionDelivery) returns (CommandResponse);
}

// region entry_points
// Clients use Handle, HandleAsync and HandleSync; framework components use
// them too, and alone use Deliver (decision 14.79, DRAFT).
//
// A framework component (a policy coordinator delivering reaction
// commands and refusal facts, the outbox dispatcher, the DLQ replayer, a
// coordinator delivering triggers) authenticates with its mTLS identity,
// issued to framework components only. Only such a caller may call:
//   - Deliver, with a ReactionDelivery (its derived command_id, or the
//     refused command's id on a refusal fact, and its causation; the
//     receiving coordinator trusts them from this caller);
//   - PolicyCoordinatorService.ExecuteStamped, with a caller-supplied
//     trigger EventBook (whose stamping copies the trigger's correlation
//     and EventRef onto the policy's commands and refusal facts).
// Any other caller is a client. A client's CommandBook has no field for a
// causation (decision 14.79). A client call to Deliver or to a trigger
// entry point is refused PERMISSION_DENIED: the request is well formed,
// but the caller is not allowed to make it
// (INVALID_ARGUMENT would wrongly tell the caller to fix the message).
// Deployments may still expose the trigger routes over HTTP; the gateway
// forwards the caller's identity, so a client reaching them is refused the
// same way.
//
// Who called, framework or client, goes to the security log, never into
// the data (io/angzarr/v1/types.proto, security_logs region).
// endregion

// Response to one command: its business result (the events) and what the
// system did with it (the outcome).
message CommandResponse {
  io.angzarr.v1.EventBook events = 1; // Events from the target aggregate
  // Results of handling: the core delivery outcome and, from HandleSync
  // (SIMPLE), synchronous projector results. Response-only, never persisted
  // (see io.angzarr.v1.Outcome).
  SyncOutcome outcome = 5;
}

// The core outcome of one command, wrapped with what only the distributed
// coordinator's HandleSync (SIMPLE) adds: its synchronous projectors'
// results (decision 14.64). Never persisted.
message SyncOutcome {
  io.angzarr.v1.Outcome outcome = 1; // The delivery outcome
  // Synchronous projector results. Produced only by HandleSync (SIMPLE);
  // empty for Handle (DECISION). (Projectors persist their own read models;
  // these are copies returned to the caller.)
  repeated io.angzarr.v1.Projection projections = 2;
  // Synchronous projectors that failed on this command's events. HandleSync
  // answers OK whenever the decision committed: a projector failure never
  // undoes it and never turns the response into an error status. Each
  // failing projector appears here instead of in projections, and its
  // events are retried or dead-lettered on the asynchronous projection
  // path. Empty for Handle (DECISION).
  repeated ProjectorFailure projector_failures = 3;
}

// One synchronous projector that failed during HandleSync.
message ProjectorFailure {
  string projector = 1; // Registered name of the projector
  // The failure as a gRPC status code (google.rpc.Code numbering). Whether
  // the projection will be retried follows the retryable set in
  // io/angzarr/v1/command_handler.proto.
  int32 code = 2;
  // The failure's key and args (decision 14.37): its status's ErrorInfo
  // reason and metadata. Never the status's text.
  io.angzarr.v1.Diagnostic diagnostic = 4;
}
