syntax = "proto3";
package io.angzarr.transport.distributed.v1;

import "io/angzarr/transport/distributed/v1/bus.proto";
import "io/angzarr/v1/types.proto";
// Sentry-compat structured stack-trace + error-chain capture from the sererr
// project (sererr.fyi). The schema is vendored in this repo at
// proto/sererr/v1/sererr.proto and resolves from the same proto root as
// this file. Only the distributed transport imports it (decision 14.64).
import "sererr/v1/sererr.proto";

option csharp_namespace = "Angzarr.Transport.Distributed";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/distributed/v1;angzarrdistributed";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.distributed";
option ruby_package = "Angzarr::Transport::Distributed";

// region dead_letter_envelope
// A dead letter as the distributed transport publishes and stores it: core's
// AngzarrDeadLetter, whole and unchanged, wrapped with what only this
// transport knows (decision 14.64). Topics, storage and the embedded kernel:
// docs/design/distributed-transport.md §5.
message DeadLetterEnvelope {
  io.angzarr.v1.AngzarrDeadLetter dead_letter = 1; // The entry, as core defines it
  // The failure's cause chain, when one was captured: a flat array of
  // captured errors, Sentry's `exception.values` shape; empty when no
  // capture was attempted. Order and linkage:
  // docs/design/distributed-transport.md §5.
  repeated sererr.v1.CapturedError stack_trace = 2;
}

// Why a claim-checked payload (bus.proto) could not be retrieved: the
// dead letter's why, packed in AngzarrDeadLetter's transport arm, its key
// implied as DISTRIBUTED_REASON_PAYLOAD_UNAVAILABLE (decision 14.107,
// DRAFT).
message PayloadRetrievalFailed {
  PayloadReference reference = 1; // The payload that could not be retrieved
  io.angzarr.v1.Diagnostic failure = 2; // The retrieval's failure: its code and args, never its text (decision 14.37)
}
// endregion
