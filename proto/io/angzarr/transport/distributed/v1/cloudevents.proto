syntax = "proto3";
package io.angzarr.transport.distributed.v1;

// The official CloudEvents Protobuf Format (io.cloudevents.v1.CloudEvent),
// vendored verbatim at io/cloudevents/v1/cloudevents.proto from
// github.com/cloudevents/spec, cloudevents/formats/cloudevents.proto
// (commit bad81171bd3d1c0343ef43b4b2ad4ffca9dc2012), Apache-2.0 (the
// CloudEvents Authors; proto/LICENSE-APACHE). Decision 14.108,
// ruled 2026-11-02.
import "io/cloudevents/v1/cloudevents.proto";

option csharp_namespace = "Angzarr.Transport.Distributed";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/distributed/v1;angzarrdistributed";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.distributed";
option ruby_package = "Angzarr::Transport::Distributed";

// region cloud_event
// What a projector returns, in Projection.projection, to publish CloudEvents
// to the configured sinks: the official CloudEvents Protobuf Format's events
// (decision 14.108). Publishing triggers only on this exact type;
// the attributes the framework fills: docs/design/cloudevents.md.
message CloudEventsResponse {
  repeated io.cloudevents.v1.CloudEvent events = 1;
}
// endregion
