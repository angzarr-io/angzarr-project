syntax = "proto3";
package io.angzarr.transport.distributed.v1;

import "io/angzarr/v1/types.proto";
import "google/api/annotations.proto";

option csharp_namespace = "Angzarr.Transport.Distributed";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/distributed/v1;angzarrdistributed";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.distributed";
option ruby_package = "Angzarr::Transport::Distributed";

// region event_stream_service
// EventStreamService: streams events to registered subscribers
service EventStreamService {
  // Subscribe to events whose EventMeta.correlation_id matches (required).
  // Correlation is recorded per page only; all pages of one write share one
  // correlation. Returns INVALID_ARGUMENT if correlation_id is unset or not
  // 16 bytes.
  // REST: Server-Sent Events (SSE) stream. The path segment is the UUID's
  // bytes field, so HTTP transcoding takes it as base64 (URL-safe), not as
  // canonical UUID text (the accepted cost of UUID-typed ids; see UUID in
  // io/angzarr/v1/types.proto).
  rpc Subscribe(EventStreamFilter) returns (stream io.angzarr.v1.EventBook) {
    option (google.api.http) = {get: "/v1/stream/{correlation_id.value}"};
  }
}
// endregion

// region event_stream_filter
// Subscription filter for event streaming: matches events whose
// EventMeta.correlation_id equals correlation_id (correlation is
// recorded per page only; all pages of one write share one correlation).
message EventStreamFilter {
  io.angzarr.v1.UUID correlation_id = 1; // Required: INVALID_ARGUMENT when unset or not 16 bytes
}
// endregion
