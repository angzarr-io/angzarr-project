syntax = "proto3";
package io.angzarr.transport.distributed.v1;

import "io/angzarr/v1/types.proto";
import "google/api/annotations.proto";

option csharp_namespace = "Angzarr.Transport.Distributed";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/distributed/v1;angzarrdistributed";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.distributed";
option ruby_package = "Angzarr::Transport::Distributed";

// region event_stream_service
// EventStreamService: streams events to subscribers, catch-up then live
// (decision 14.105, DRAFT).
service EventStreamService {
  // Subscribe to one target (SubscribeRequest.target): one stream, or
  // every stream of one correlation. Each answer is an EventBook of one
  // stream's pages. The server first delivers every page the target holds
  // after the subscriber's resume point (catch-up), then every page
  // committed after, as it commits (live), with no gap and no duplicate
  // between the two, so a subscriber that queried first loses nothing to
  // the race between its query and its subscription.
  //
  // Order is per stream only: a stream's pages arrive in sequence order;
  // pages of different streams arrive in no defined order. There is no
  // cross-stream order and no store-wide position: a resume point is one
  // sequence per stream, the next one to deliver, inclusive, as
  // SequenceRange.lower (StreamFrom.from_sequence, CorrelationFrom.seen;
  // decision 14.106, DRAFT).
  //
  // Refusals: a target that is unset, a cover with no domain or a root that
  // is not 16 bytes, or a correlation_id unset or not 16 bytes, is
  // INVALID_ARGUMENT; an unknown edition is NOT_FOUND (as
  // EventQueryService).
  //
  // REST: Server-Sent Events (SSE). A stream subscription is GET
  // /v1/stream/{domain}/{root}, with from_sequence and cover.edition as
  // query parameters. A correlation subscription is POST
  // /v1/stream/correlations/{correlation_id}, the request its body, since
  // its resume point (seen) is a list of messages, which a query string
  // cannot carry. A browser's EventSource opens GET only, so a browser
  // subscribes to a correlation with a fetch-based SSE reader (decision
  // 14.106, DRAFT: accepted). Path segments that are UUIDs take the UUID's bytes field,
  // so HTTP transcoding takes them as base64 (URL-safe), not as canonical
  // UUID text (the accepted cost of UUID-typed ids; see UUID in
  // io/angzarr/v1/types.proto).
  rpc Subscribe(SubscribeRequest) returns (stream io.angzarr.v1.EventBook) {
    option (google.api.http) = {
      get: "/v1/stream/{stream.cover.domain}/{stream.cover.root.value}"
      additional_bindings {
        post: "/v1/stream/correlations/{correlation.correlation_id.value}"
        body: "*"
      }
    };
  }
}
// endregion

// region subscribe_request
// What to subscribe to, and from where (decision 14.105, DRAFT).
message SubscribeRequest {
  oneof target {
    // One stream's pages.
    StreamFrom stream = 1;
    // Every page of one correlation, in every domain.
    CorrelationFrom correlation = 2;
  }
}

// One stream, from a sequence: every page of the stream with a sequence
// at or above from_sequence, then live. The stream's timeline is
// cover.edition, read as EventQueryService reads it. A subscriber that
// reconnects sets from_sequence to the last sequence it received + 1.
message StreamFrom {
  io.angzarr.v1.Cover cover = 1;
  // The first sequence to deliver, inclusive, as SequenceRange.lower: 0 is
  // the stream's start.
  uint64 from_sequence = 2;
}

// One correlation, from a set of per-stream positions: every page whose
// EventMeta.correlation_id is correlation_id, in every domain, from each
// listed stream's cursor (inclusive), and from the start of any stream not
// listed; then live.
//
// Building seen: for each EventBook received, the subscriber keeps its
// cover and its last page's sequence + 1, the highest per cover. On
// reconnect, seen is one StreamCursor per stream it kept. A stream it has
// never received from is simply not listed.
message CorrelationFrom {
  // Required.
  io.angzarr.v1.UUID correlation_id = 1;
  // The streams the subscriber has already received from, each with the
  // next sequence it needs. At most one cursor per stream; each cover's
  // edition is the subscription's (a cursor of another edition, or two of
  // one stream, is INVALID_ARGUMENT).
  repeated StreamCursor seen = 2;
  // The timeline, as CorrelationQuery.edition: unset = main; a set name
  // must be non-empty and a known edition, and each stream is read as the
  // edition reads it.
  optional string edition = 3;
}

// One stream's position in a correlation subscription.
message StreamCursor {
  io.angzarr.v1.Cover cover = 1;
  // The next sequence to deliver of that stream, inclusive: the last
  // sequence the subscriber received + 1.
  uint64 next_sequence = 2;
}
// endregion
