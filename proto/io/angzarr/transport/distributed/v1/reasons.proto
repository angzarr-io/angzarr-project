syntax = "proto3";
package io.angzarr.transport.distributed.v1;

import "io/angzarr/v1/reasons.proto";

option csharp_namespace = "Angzarr.Transport.Distributed";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/distributed/v1;angzarrdistributed";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.distributed";
option ruby_package = "Angzarr::Transport::Distributed";

// The distributed transport's reason keys (decision 14.64): what only a
// distributed coordinator raises, for registration by Describe, a
// standalone query server and the bus's claim check. The rules of core's
// reasons.proto hold here: a key travels as its value's full name, prefix
// included, each carries its (io.angzarr.v1.reason) args, its English is
// reasons.en-US.ftl beside this file. Keys are named by layer (decision
// 14.104, DRAFT): this transport's are DISTRIBUTED_REASON_*, and each key's
// comment says which component raises it.
enum DistributedReason {
  DISTRIBUTED_REASON_UNSPECIFIED = 0;
  // Raised by a distributed coordinator.
  // The coordinator holds no descriptor of `domain`'s component
  // (component/v1/component.proto, Registration): it has not yet been
  // described, or its Describe failed or was refused, so the coordinator
  // delivers nothing to it. A waiting caller is answered this key, to resend;
  // queued and reaction deliveries stay queued until the component is
  // registered, so it is never a dead letter's reason. A business process that
  // is described and then cannot be reached is
  // ANGZARR_REASON_HANDLER_UNAVAILABLE. (Decision 14.51.)
  DISTRIBUTED_REASON_COMPONENT_NOT_REGISTERED = 1 [(io.angzarr.v1.reason) = {
    args: ["domain"]
    grpc_status: UNAVAILABLE
  }];
  // Raised by a distributed coordinator.
  // A command or fact sent to a standalone query server for `domain`'s event
  // store, which has no component behind it and takes no commands
  // (query_server.feature, C-0588). Bug, retryable (decision 14.37): a
  // misroute or a stale deployment, which the caller's resend to the right
  // address, or a corrected deployment, can clear. Never a dead letter's
  // reason: a query server queues nothing. (Decision 14.51.)
  DISTRIBUTED_REASON_COMMANDS_NOT_SERVED = 2 [(io.angzarr.v1.reason) = {
    args: ["domain"]
    grpc_status: UNIMPLEMENTED
  }];
  // Raised by a distributed coordinator.
  // A claim-checked payload (PayloadReference, at `uri`) the coordinator could
  // not retrieve from its payload store (`cause`, the store's failure, a
  // third-party library's text as `cause.ext_err_txt`). Bug, retryable
  // (decision 14.37): retried under the retry cap with backoff and jitter; at
  // the cap dead-lettered with this key and its args as its
  // AngzarrDeadLetter.reason, the retrieval's details on the DeadLetterEnvelope
  // (payload_retrieval_failed), and alerted (C-0447). (Decision 14.51.)
  DISTRIBUTED_REASON_PAYLOAD_UNAVAILABLE = 3 [(io.angzarr.v1.reason) = {
    args: ["uri", "cause"]
    grpc_status: UNAVAILABLE
  }];
}
