syntax = "proto3";
package io.angzarr.transport.distributed.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Transport.Distributed";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/distributed/v1;angzarrdistributed";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.distributed";
option ruby_package = "Angzarr::Transport::Distributed";

// EventQueryService: query interface for retrieving events
//
// A separate, read-only interface, independent of
// CommandHandlerCoordinatorService. An aggregate (or process manager)
// coordinator serves it for its own component's domain. It may also run
// standalone, as a read-only query server for downstream readers with no
// component behind it; such a server serves no command RPCs: a command or
// fact sent to it is answered UNIMPLEMENTED
// COORDINATOR_REASON_COMMANDS_NOT_SERVED (arg domain; decision 14.51).
//
// Snapshots. A coordinator judges a snapshot against its own registration
// (see Snapshot in io/angzarr/v1/types.proto). A standalone query server holds no
// registration, so it never returns a snapshot: every result carries every
// page from sequence 0 (up to the query's point).
//
// Upcasting. A coordinator upcasts every event it returns through its
// component's upcaster sidecar (see io/angzarr/v1/upcaster.proto; decision 14.39).
//
// Editions: a Query or CorrelationQuery naming an unknown edition (no fork
// event of it exists: never created with EditionAdminService.ForkStream,
// meta.proto, or deleted) is refused NOT_FOUND.
service EventQueryService {
  // Get a single EventBook (unary) - use for explicit queries with gRPC tooling
  rpc GetEventBook(Query) returns (io.angzarr.v1.EventBook) {
    option (google.api.http) = {get: "/v1/query/{cover.domain}/events"};
  }
  // Stream EventBooks matching query - use for bulk retrieval (SSE)
  rpc GetEvents(Query) returns (stream io.angzarr.v1.EventBook) {
    option (google.api.http) = {get: "/v1/query/{cover.domain}/events/stream"};
  }
  // Every event of one correlation, across all domains: one EventBook per
  // stream holding that stream's pages with the correlation, in sequence
  // order (see CorrelationQuery, below, which also says how much
  // forward causation the result gives: exact for process events, by
  // correlation only for reaction commands' events). A Query's correlation
  // selector stays within one domain; this RPC does not. An unset
  // correlation_id, or one that is not 16 bytes, is INVALID_ARGUMENT; a
  // correlation with no events is an empty stream, not NOT_FOUND. REST: the
  // path segment is the UUID's bytes, so transcoding takes base64
  // (URL-safe), not canonical UUID text (see UUID in io/angzarr/v1/types.proto).
  rpc GetCorrelatedEvents(CorrelationQuery) returns (stream io.angzarr.v1.EventBook) {
    option (google.api.http) = {get: "/v1/query/correlations/{correlation_id.value}/events"};
  }
  // List every stream (SSE): one Cover (domain, edition, root) per stream.
  rpc GetAggregateRoots(google.protobuf.Empty) returns (stream io.angzarr.v1.Cover) {
    option (google.api.http) = {get: "/v1/query/aggregates"};
  }
  // (Synchronize, a bidirectional stream answering each Query with
  // GetEventBook's result, was deleted in pass 6. It was not the catch-up
  // subscription the site describes: it never switched to live events. Use
  // GetEvents for bulk reads and EventStreamService.Subscribe for live
  // events.)
}

// region query_types
// The query messages: the distributed transport's, with the service that
// takes them (decision 14.64).
message SequenceRange {
  uint64 lower = 1;
  optional uint64 upper = 2; // If not set, query to latest
}

message SequenceSet {
  repeated uint64 values = 1;
}

// Temporal query: retrieve aggregate state at a point in history.
//
// The returned EventBook may start from a snapshot instead of sequence 0,
// but only from one that cannot contain state from after the point:
// - as_of_sequence N: a snapshot with sequence <= N, followed by pages
//   snapshot.sequence+1 .. N.
// - as_of_time T: the stream's prefix up to and including the last event
//   whose EventMeta.recorded_at <= T. recorded_at is non-decreasing per
//   stream (see EventMeta), so this is a prefix: no later event can have an
//   earlier recorded_at. The book may start from a snapshot whose last
//   folded event (the page at snapshot.sequence) lies in that prefix.
// Without a qualifying kept snapshot (by default only the newest is kept)
// the book carries no snapshot and every page from 0 up to the point. Either
// way, folding the book yields the same state as a full replay to the point.
message TemporalQuery {
  oneof point_in_time {
    google.protobuf.Timestamp as_of_time = 1; // The prefix of events with EventMeta.recorded_at <= this
    uint64 as_of_sequence = 2; // Events with sequence <= this
  }
}

// Selects events within one domain. cover.domain is required, and
// cover.edition picks the timeline (unset = main; a set name must be a
// known edition, see Cover.edition, and each stream is read by its fork:
// main below its fork sequence, then the edition's own events; a stream
// not yet forked reads as main). For every event of one correlation across
// all domains, use EventQueryService.GetCorrelatedEvents (CorrelationQuery).
//   By stream:       cover { domain, root }
//   By correlation:  cover { domain } + correlation_id; every stream of the
//                    domain is searched, one EventBook per matching stream
//   Both:            cover { domain, root } + correlation_id; that stream only
// The selection, when set, applies within each selected stream.
message Query {
  io.angzarr.v1.Cover cover = 1;
  oneof selection {
    SequenceRange range = 3;
    SequenceSet sequences = 4;
    TemporalQuery temporal = 5;
  }
  // Correlation selector: when set, only pages whose
  // EventMeta.correlation_id equals it (the same 16 bytes) are
  // returned; a set value that is not 16 bytes is INVALID_ARGUMENT. Correlation
  // is recorded per page only (covers carry none); all pages of one write
  // share one correlation. Never crosses cover.domain (CorrelationQuery
  // does).
  io.angzarr.v1.UUID correlation_id = 6;
}

// region correlation_query
// Selects every event of one correlation, across all domains: the whole
// workflow a request or a fact started. Answered by
// EventQueryService.GetCorrelatedEvents as one EventBook per stream (domain,
// edition, root) holding that stream's pages with this correlation, in
// sequence order. The order of books is unspecified.
//
// Forward causation, from the result alone. Every reaction (a policy's
// commands, their events, a process manager's events, and refusal facts
// and their events) carries its trigger's correlation (see the
// command_identity region), so everything event E led to is in the result.
// How exactly each edge is known depends on the kind of event (decision
// 13.3):
//   - Events of a refusal fact are linked EXACTLY: their
//     causation.command_id is the refused command's id, derived from E,
//     the policy and the command's index (derived_ids region; decision
//     14.31).
//   - Events of reaction commands are linked only COARSELY, by
//     correlation: the pages of one command share its
//     causation.command_id, but the command's trigger (its causation_id)
//     is not on its events. The exact trigger edge (E -> the commands a
//     policy emitted for it -> their events) is in the traces and
//     logs the coordinators write (OpenTelemetry), not in the store.
// Accepted cost: the event store alone answers "what belongs to this
// workflow", but not "which events did
// this policy's reaction to E produce"; that question goes to the traces,
// whose retention the deployment chooses. Rejected commands leave no
// events, so they do not appear (see the attempt-audit sink in the design
// record).
message CorrelationQuery {
  // Required: INVALID_ARGUMENT when unset or not 16 bytes.
  io.angzarr.v1.UUID correlation_id = 1;
  // The timeline, as Cover.edition: unset = main; a set name must be
  // non-empty (a set "" is refused INVALID_ARGUMENT) and must be a known
  // edition (Cover.edition), and each stream is read as the edition reads
  // it (main's events below that stream's fork sequence, then its own; a
  // stream not yet forked reads as main).
  optional string edition = 2;
}
// endregion
// endregion
