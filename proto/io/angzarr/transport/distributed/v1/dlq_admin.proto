// Dead Letter Queue admin service for the `angzarr-status` operations
// console. Reads, replays and deletes the dead letters the distributed
// transport's DLQ publishers persist: each a DeadLetterEnvelope
// (dead_letter.proto) around core's AngzarrDeadLetter
// (io/angzarr/v1/types.proto).
//
// Part of the distributed transport (decision 14.64): only a distributed
// deployment runs an admin store of dead letters, and a transport's package
// holds its own services.
//
// Surface follows Google AIPs for resource naming, pagination and
// filtering. Every method returns a health envelope (`oneof state` of an
// `ok` payload or RFC 7807 `degraded` problem details) so a degraded
// backend renders as a per-panel error instead of failing the console.

syntax = "proto3";

package io.angzarr.transport.distributed.v1;

import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Transport.Distributed";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/distributed/v1;angzarrdistributed";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.distributed";
option ruby_package = "Angzarr::Transport::Distributed";

// What kind of failure a dead letter is, is its reason's key.

// One row from `dlq_entries`, surfaced via the API. The `payload`
// bytes are the proto-encoded `DeadLetterEnvelope` exactly as the
// publisher wrote it; ReplayDeadLetter reuses these bytes.
//
// The `payload_view` field carries a server-side descriptor-decoded
// JSON rendering of the same data, so operators see structured
// content in one round-trip without writing client-side decode logic.
// Nested `Any` payloads (rejected_command.page.command.payload or
// rejected_command.page.fact.payload, rejected_reaction's body,
// rejected_events.pages[].payload, refusal) are
// recursively decoded via the
// framework `DescriptorPool`. User-domain types not yet in the pool
// stay as `{"@type": type_url, "value_b64": "..."}` placeholders.
message StoredDeadLetter {
  int64 id = 1; // Store-assigned row number (not an identifier, so not a UUID)
  string domain = 2;
  // The dead-lettered message's correlation (a UUID; see
  // io.angzarr.v1.UUID).
  io.angzarr.v1.UUID correlation_id = 3;
  bytes payload = 4;
  // AngzarrDeadLetter's why, mirrored (decision 14.101, DRAFT): a typed
  // refusal, or a reason (a key and its args, never text; decision 14.37).
  oneof why {
    google.protobuf.Any refusal = 5;
    io.angzarr.v1.Diagnostic reason = 6;
  }
  string source_component = 7;
  io.angzarr.v1.ComponentKind source_component_kind = 8; // AngzarrDeadLetter.source_component_kind
  google.protobuf.Timestamp occurred_at = 9;
  google.protobuf.Timestamp created_at = 10;
  // JSON string. Empty when decoding failed entirely (the row is still
  // surfaced — clients can fall back to `payload` bytes).
  string payload_view = 11;
  // Every replay of this entry, oldest first: the record of when it was
  // replayed and with what result (who replayed it is in the security
  // log, not here). `payload` itself never
  // changes; replays are recorded here, beside it.
  repeated DeadLetterReplay replays = 12;
}

// One replay of a dead-letter entry, recorded in the entry when the replay
// is requested and updated when its result is known.
message DeadLetterReplay {
  google.protobuf.Timestamp replayed_at = 1; // When the replay was requested
  ReplayOutcome outcome = 2; // PENDING until the replayed delivery is decided
  google.protobuf.Timestamp outcome_at = 3; // When outcome left PENDING
  // Why the replay ended as it did (e.g. the new rejection's reason): a key
  // and its args, never text (decision 14.37). Unset while PENDING and
  // when nothing needs saying.
  io.angzarr.v1.Diagnostic reason = 4;
}

// What became of one replay.
enum ReplayOutcome {
  REPLAY_OUTCOME_UNSPECIFIED = 0;
  REPLAY_OUTCOME_PENDING = 1; // Enqueued; not yet decided
  REPLAY_OUTCOME_APPLIED = 2; // Business code ran and committed (or the component processed the events)
  REPLAY_OUTCOME_DUPLICATE = 3; // The stream already held the command's command_id: the original did apply
  REPLAY_OUTCOME_FAILED = 4; // Failed again: rejected or re-dead-lettered (see reason)
}

// RFC 7807 — Problem Details for HTTP APIs. Used when a tile's
// backend is unreachable so the UI can render an in-place error
// without crashing the page. Standards conformance: same shape the
// REST sidecar emits for envoy-side errors.
message ProblemDetails {
  // URI identifying the error type (RFC 7807). Default:
  // "about:blank" when not classified.
  string type = 1;
  string title = 2;       // human-readable summary
  int32 status = 3;       // HTTP-equivalent status code
  string detail = 4;      // human-readable per-occurrence detail
  string instance = 5;    // URI of the failing call (optional)
}

// ----- ListDeadLetters --------------------------------------------------

message ListDeadLettersRequest {
  // AIP-160 filter string. Grammar (simple AND-only for v1):
  //   field "=" string-literal { "AND" field "=" string-literal }
  // Recognised fields: domain, correlation_id, reason_code (the reason's
  // key, StoredDeadLetter.reason.code; for a refusal entry its implied key,
  // ANGZARR_REASON_COMMAND_REFUSED), refusal_type (a refusal entry's type,
  // its Any's fully-qualified type name), source_component,
  // occurred_after, occurred_before. The filter is text,
  // so it is an input boundary: a correlation_id literal is the UUID's
  // canonical text (hyphenated 8-4-4-4-12 hex, either case), parsed by the
  // server; one that does not parse is INVALID_ARGUMENT.
  // Example: `domain = "player" AND reason_code = "ANGZARR_REASON_RETRY_CAP_EXHAUSTED"`
  string filter = 1;

  // AIP-158 pagination. `page_size = 0` → server picks the default;
  // values above the server cap are silently clamped (no error).
  int32 page_size = 2;
  string page_token = 3;
}

// "ok" payload for ListDeadLettersResponse.
message ListDeadLettersOk {
  repeated StoredDeadLetter entries = 1;
  string next_page_token = 2;
}

// Health envelope: `state.ok` on success, `state.degraded` when the
// backend is unavailable. Clients render per-panel state from this
// discriminator.
message ListDeadLettersResponse {
  oneof state {
    ListDeadLettersOk ok = 1;
    ProblemDetails degraded = 2;
  }
  google.protobuf.Timestamp checked_at = 3;
  // Backend identifier, e.g. "postgres-dlq" / "sqlite-dlq" /
  // "noop". Lets the UI show which backend served the answer.
  string source = 4;
}

// ----- GetDeadLetter ----------------------------------------------------

message GetDeadLetterRequest {
  int64 id = 1;
}

// Wrapper retains the `state` discriminator pattern: an "ok"
// response with `entry` unset means "no row matches" (gRPC NOT_FOUND
// is the wire-level signal — see status code mapping in the handler).
message GetDeadLetterOk {
  StoredDeadLetter entry = 1;
}

message GetDeadLetterResponse {
  oneof state {
    GetDeadLetterOk ok = 1;
    ProblemDetails degraded = 2;
  }
  google.protobuf.Timestamp checked_at = 3;
  string source = 4;
}

// ----- ReplayDeadLetter -------------------------------------------------

// Replay semantics.
//
// Same message, same ids. A replay is a redelivery, never a new command: it
// keeps the original command_id, correlation_id and causation (the dead
// letter stores the command, or the reaction, with its ids assigned). If the original
// did apply after all, deduplication answers the replay DUPLICATE, so a
// replay can never apply a command twice (except one whose original
// decision produced no events, which is decided again; see the
// command_identity region of io/angzarr/v1/types.proto). The replayer delivers as a
// framework component (mTLS identity): a reaction
// (AngzarrDeadLetter.rejected_reaction) is replayed through Deliver, keeping
// its causation (decision 14.79). The replay itself (time, outcome) is recorded in the
// entry (StoredDeadLetter.replays), not on the replayed message; who asked
// for it goes to the security log.
//
// One replay, as-is (decision 14.101, DRAFT): the entry is re-sent exactly
// as it was dead-lettered, Handling included. A replayed stale command is
// refused again, which is correct; there is no mode that clears its
// expected sequence.
//
// Command entries. Published to the command bus and processed as an ASYNC
// command (the coordinator's HandleAsync): the call returns once the command
// is enqueued, not when it is decided; the recorded replay's outcome is
// PENDING until then. There is no hardcoded or per-replay sync mode. A
// replayed command that fails again is retried or dead-lettered like any
// asynchronous command.
//
// There is no age limit: deduplication by command_id is permanent, so an
// entry of any age replays safely.
//
// Event entries (rejected_events). Re-delivered to the one component that
// failed (AngzarrDeadLetter.source_component), never re-published to every
// subscriber.

message ReplayDeadLetterRequest {
  int64 id = 1;
}

// Successful replay request. The dead-letter row stays in `dlq_entries`
// (the operator can `Delete` it explicitly once the outcome is confirmed),
// and the replay is recorded in it (StoredDeadLetter.replays). The replayed
// message keeps its original correlation_id; follow that, or re-read the
// entry, for the outcome.
message ReplayDeadLetterOk {
  // The original correlation_id, kept on the replayed message.
  io.angzarr.v1.UUID correlation_id = 1;
  // RFC-3339 timestamp of when the replay was published.
  google.protobuf.Timestamp replayed_at = 2;
  // The replay as recorded in the entry (outcome PENDING for a command).
  DeadLetterReplay replay = 3;
}

message ReplayDeadLetterResponse {
  oneof state {
    ReplayDeadLetterOk ok = 1;
    ProblemDetails degraded = 2;
  }
  google.protobuf.Timestamp checked_at = 3;
  string source = 4;
}

// ----- DeleteDeadLetter -------------------------------------------------

message DeleteDeadLetterRequest {
  int64 id = 1;
}

// Idempotent: a row was removed, or none matched; either is a success
// outcome, and the arm says which (decision 14.91, DRAFT: no flag).
message DeleteDeadLetterOk {
  oneof outcome {
    DeadLetterRemoved removed = 1;
    NoDeadLetter no_entry = 2;
  }
}

// The row was removed.
message DeadLetterRemoved {}

// No row matched the id.
message NoDeadLetter {}

message DeleteDeadLetterResponse {
  oneof state {
    DeleteDeadLetterOk ok = 1;
    ProblemDetails degraded = 2;
  }
  google.protobuf.Timestamp checked_at = 3;
  string source = 4;
}

// ----- Service ----------------------------------------------------------

service DlqAdminService {
  // List dead letters matching `filter`, paginated.
  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse) {
    option (google.api.http) = {
      get: "/api/dlq"
    };
  }

  // Fetch a single entry by primary key.
  rpc GetDeadLetter(GetDeadLetterRequest) returns (GetDeadLetterResponse) {
    option (google.api.http) = {
      get: "/api/dlq/{id}"
    };
  }

  // Delete a single entry. Idempotent.
  rpc DeleteDeadLetter(DeleteDeadLetterRequest) returns (DeleteDeadLetterResponse) {
    option (google.api.http) = {
      delete: "/api/dlq/{id}"
    };
  }

  // Replay a dead-letter entry: a command through the command bus
  // (HandleAsync), an event book to the component that failed. The
  // original row is left in place, and the replay is recorded in it;
  // operators delete explicitly after confirming the outcome.
  rpc ReplayDeadLetter(ReplayDeadLetterRequest) returns (ReplayDeadLetterResponse) {
    option (google.api.http) = {
      post: "/api/dlq/{id}/replay"
      body: "*"
    };
  }
}
