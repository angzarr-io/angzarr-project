syntax = "proto3";
package io.angzarr.transport.embedded.v1;

import "google/protobuf/descriptor.proto";

option csharp_namespace = "Angzarr.Transport.Embedded";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/transport/embedded/v1;angzarrembedded";
option java_multiple_files = true;
option java_package = "io.angzarr.transport.embedded";
option ruby_package = "Angzarr::Transport::Embedded";

// region child_protocol
// The child-process launch protocol's declared constants (decision 14.64;
// docs/design/child-protocol.md, sections 1 and 2): the words both sides of
// the protocol must spell alike, stated once, here, for every language's
// code generator to read, as each reads the (io.angzarr.v1.reason) args.
//
// Why a file option: proto3 has no constants, an enum value holds a number
// and never a string, and the spec states no constant any other way. A
// custom option is the spec's existing idiom for data a generator reads off
// the descriptor (options.proto's (component), (state) and (conflict),
// reasons.proto's (reason)), so the constants are a typed message set as
// this file's option, read the same way, and nothing else on the wire.
message ChildProtocol {
  string socket_env = 1;
  // The longest socket path a host gives, in bytes (section 1): the
  // portable minimum of a Unix socket address's `sun_path`, less its NUL
  // (macOS and the BSDs: 104, so 103).
  uint32 max_socket_path_bytes = 2;
}

extend google.protobuf.FileOptions {
  // Set on this file, once: the protocol's constants. In angzarr's
  // extension range (options.proto).
  ChildProtocol child_protocol = 50106;
}

option (child_protocol) = {
  socket_env: "ANGZARR_SOCKET"
  max_socket_path_bytes: 103
};
// endregion
