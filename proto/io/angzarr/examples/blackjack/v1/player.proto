syntax = "proto3";
package io.angzarr.examples.blackjack.v1;

import "io/angzarr/v1/options.proto";

option csharp_namespace = "Angzarr.Examples.Blackjack";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/examples/blackjack/v1;blackjack";
option java_multiple_files = true;
option java_package = "io.angzarr.examples.blackjack";
option ruby_package = "Angzarr::Examples::Blackjack";

// =============================================================================
// Player domain ("player") — the wallet
// =============================================================================
//
// The player aggregate owns every chip that is not on a table. A hold earmarks
// part of the bankroll for one pending transfer to a table; it never moves
// money by itself. Money leaves the wallet only when a hold is captured (buy-in)
// or settled (top-up), and returns only as a cash-out credit.
//
// Invariant L1 (after every event):
//   bankroll >= sum(open holds) >= 0, every open hold > 0, and
//   bankroll = total_deposited - total_withdrawn - total_to_tables + total_from_tables.
//
// Rejections (gRPC status, reason code):
//   FAILED_PRECONDITION: PLAYER_ALREADY_EXISTS, PLAYER_NOT_FOUND,
//     INSUFFICIENT_AVAILABLE_FUNDS, HOLD_NOT_FOUND, HOLD_CONFLICT,
//     LOYALTY_NOT_ENROLLED.
//   INVALID_ARGUMENT: AMOUNT_NOT_POSITIVE, DISPLAY_NAME_REQUIRED, EMAIL_REQUIRED.
//
// Repeating a hold-lifecycle command (HoldFunds / CaptureFunds / ReleaseHold /
// RequestTopUp) whose effect is already recorded with an identical payload
// succeeds with no events: redelivery is harmless.
//
// Concurrency (client-chosen merge strategy, sent with an explicit expected
// sequence):
//   DepositFunds  — MERGE_COMMUTATIVE. Its events change {bankroll,
//                   total_deposited}; UpdateProfile changes {display_name}.
//                   A stale deposit merges past a rename and is refused as
//                   retryable when another deposit landed in between.
//   WithdrawFunds — MERGE_MANUAL. A stale withdrawal is dead-lettered for
//                   human review and refused as non-retryable.
// Saga and process-manager commands (HoldFunds, CaptureFunds, ReleaseHold,
// RecordRoundResult, AwardLoyaltyPoints) are angzarr_deferred: they carry no
// expected sequence and are deduplicated by provenance.

// -----------------------------------------------------------------------------
// Commands — client
// -----------------------------------------------------------------------------

// Open a wallet. Field tags 1 and 2 are stable: core's acceptance harness
// sends this command by tag.
message RegisterPlayer {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  string display_name = 1;
  string email = 2;
}

// Admin migration of a player from a legacy system: identity only, no
// balance. Sent with SYNC_MODE_ISOLATED so the write triggers no reactions.
message ImportPlayer {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  string display_name = 1;
  string email = 2;
  string legacy_id = 3; // Identifier in the system being migrated from
}

// Rename the player. Touches only display_name, so it commutes with money
// movements.
message UpdateProfile {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  string display_name = 1;
}

message DepositFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  int64 amount = 1;
}

// Withdraw from the available balance (bankroll minus open holds).
message WithdrawFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  int64 amount = 1;
}

// Ask to move more chips to a table the player is seated at. Places a hold
// keyed by request_id (hold_id = request_id) and emits TopUpRequested, which
// saga-player-table turns into AddChips at the table.
message RequestTopUp {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  bytes table_root = 1;
  int64 amount = 2;
  bytes request_id = 3; // Client-chosen idempotency key; becomes the hold_id
}

message EnrollLoyalty {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
}

// -----------------------------------------------------------------------------
// Commands — pmg-buy-in (SYNC_MODE_DECISION, angzarr_deferred)
// -----------------------------------------------------------------------------

// Earmark funds for a buy-in. hold_id is the buy_in_id.
message HoldFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

// Spend an open buy-in hold: bankroll and the hold both drop by its amount.
message CaptureFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  bytes hold_id = 1;
}

// Close an open hold without spending it.
message ReleaseHold {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  bytes hold_id = 1;
  string reason = 2;
}

// -----------------------------------------------------------------------------
// Commands — round reactions from the table (angzarr_deferred)
// -----------------------------------------------------------------------------

// From saga-table-player-history, one per settled seat. Recording the same
// (table_root, round) twice succeeds with no events.
message RecordRoundResult {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  bytes table_root = 1;
  uint32 round = 2;
  int64 wager = 3;
  int64 net = 4; // returned - wager; negative on a loss
}

// From saga-table-player-loyalty, one per settled seat. Refused with
// LOYALTY_NOT_ENROLLED when the player has not enrolled. Awarding the same
// (table_root, round) twice succeeds with no events.
message AwardLoyaltyPoints {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  bytes table_root = 1;
  uint32 round = 2;
  int64 points = 3;
}

// -----------------------------------------------------------------------------
// Events
// -----------------------------------------------------------------------------

message PlayerRegistered {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  string display_name = 1;
  string email = 2;
}

// Identity migrated from a legacy system; the wallet starts empty. Written
// with SYNC_MODE_ISOLATED, so the ledger projector only sees it on a rebuild.
message PlayerImported {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  string display_name = 1;
  string email = 2;
  string legacy_id = 3;
}

message ProfileUpdated {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  string display_name = 1;
}

message FundsDeposited {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  int64 amount = 1;
}

// Legacy shape of FundsDeposited. Never emitted by current code; it exists
// only in stored history. The player upcaster (served by the agg-player
// binary through UpcasterService) rewrites it to
// FundsDeposited{amount = amount_chips} before any handler sees it, so no
// component consumes it directly.
message FundsDepositedV1 {
  int64 amount_chips = 1;
}

message FundsWithdrawn {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  int64 amount = 1;
}

// A buy-in hold was opened.
message FundsHeld {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.BuyInState" domain: "player" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

// A buy-in hold was spent: the chips now belong to the table.
message FundsCaptured {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.BuyInState" domain: "player" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

// A hold was closed without spending it.
message HoldReleased {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes hold_id = 1;
  int64 amount = 2;
  string reason = 3;
}

// A top-up hold was opened; triggers saga-player-table.
message TopUpRequested {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerTableSaga" domain: "player" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

// Compensation output: the table refused the AddChips for this top-up, so its
// hold is released. Emitted by the player's OnAddChipsRejected handler.
message TopUpRefused {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes hold_id = 1;
  int64 amount = 2;
  string reason = 3; // The table's rejection reason, e.g. WAGER_IN_PLAY
}

// FACT from saga-table-player-settlement (external_id = hex(hold_id)): the
// table added the chips, so the top-up hold is spent. handle_fact cannot
// refuse it; when no open top-up hold matches hold_id and amount it records
// the fact with `anomaly` set for review, and the money still moves.
message TopUpSettled {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
  string anomaly = 4; // Empty when the fact matched an open hold
}

// FACT from saga-table-player-settlement (external_id = hex(cashout_id)): the
// player left a table with `amount` chips; the bankroll is credited.
message CashOutCredited {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes cashout_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

message LoyaltyEnrolled {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
}

message RoundResultRecorded {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes table_root = 1;
  uint32 round = 2;
  int64 wager = 3;
  int64 net = 4;
}

// Undo output: a CASCADE request that recorded this round result failed
// under CASCADE_ERROR_COMPENSATE, so the record is withdrawn. The
// original RoundResultRecorded stays in history; this event cancels it.
message RoundResultRetracted {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes table_root = 1;
  uint32 round = 2;
  int64 net = 3;
}

message LoyaltyPointsAwarded {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.PlayerState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.blackjack.v1.LedgerProjection" domain: "player" };
  bytes table_root = 1;
  uint32 round = 2;
  int64 points = 3;
}

// -----------------------------------------------------------------------------
// State
// -----------------------------------------------------------------------------

message Hold {
  enum Purpose {
    PURPOSE_UNSPECIFIED = 0;
    PURPOSE_BUY_IN = 1;
    PURPOSE_TOP_UP = 2;
  }
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OPEN = 1;     // Counts against the available balance
    STATUS_CAPTURED = 2; // Buy-in spent
    STATUS_SETTLED = 3;  // Top-up spent
    STATUS_RELEASED = 4; // Closed unspent (ReleaseHold)
    STATUS_REFUSED = 5;  // Closed unspent (top-up refused by the table)
  }
  bytes table_root = 1;
  int64 amount = 2;
  Purpose purpose = 3;
  Status status = 4;
}

message RoundResult {
  bytes table_root = 1;
  uint32 round = 2;
  int64 wager = 3;
  int64 net = 4;
  bool retracted = 5;
}

// The PlayerAggregate.
//   compensates AddChips — the table refused a top-up (saga-player-table's
//     command); OnAddChipsRejected emits TopUpRefused, releasing the hold.
//   undoes RecordRoundResult — a CASCADE request under
//     CASCADE_ERROR_COMPENSATE failed after this player's round result was
//     recorded; OnRecordRoundResultUndo emits RoundResultRetracted.
message PlayerState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    domain: "player"
    name: "PlayerAggregate"
    compensates: "io.angzarr.examples.blackjack.v1.AddChips"
    undoes: "io.angzarr.examples.blackjack.v1.RecordRoundResult"
  };
  string display_name = 1;
  string email = 2;
  bool registered = 3; // True after PlayerRegistered or PlayerImported
  string legacy_id = 4;
  int64 bankroll = 5; // Includes open holds
  map<string, Hold> holds = 6; // key = lowercase hex(hold_id); every hold ever opened
  int64 total_deposited = 7;
  int64 total_withdrawn = 8;
  int64 total_to_tables = 9;
  int64 total_from_tables = 10;
  bool loyalty_enrolled = 11;
  int64 loyalty_points = 12;
  map<string, RoundResult> round_results = 13; // key = hex(table_root) + "/" + round
  map<string, int64> loyalty_awards = 14; // key = hex(table_root) + "/" + round -> points
  int64 anomalies = 15; // Count of facts recorded with an anomaly
}
