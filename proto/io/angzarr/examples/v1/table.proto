syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/v1/types.proto";
import "io/angzarr/v1/options.proto";
import "io/angzarr/examples/v1/poker_types.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// Table Domain - Game session, seating, and configuration
// Root: table_id (derived from table_name)
// =============================================================================

// Commands

message CreateTable {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.TableState" };
  string table_name = 1;
  GameVariant game_variant = 2;
  int64 small_blind = 3;
  int64 big_blind = 4;
  int64 min_buy_in = 5;
  int64 max_buy_in = 6;
  int32 max_players = 7; // 2-10
  int32 action_timeout_seconds = 8;
}

message JoinTable {
  bytes player_root = 1;
  int32 preferred_seat = 2; // -1 for any available
  int64 buy_in_amount = 3;
}

message LeaveTable {
  bytes player_root = 1;
}

// Note: SitOut/SitIn commands moved to player domain (player owns intent)
// Table receives PlayerSatOut/PlayerSatIn as facts via saga

message StartHand {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.TableState" };
  // Dealer button advances automatically; no positional parameters.
  // ``players_on_penalty`` (TDA Rule 71C): players on a missed-hand or
  // missed-round penalty whose seats receive cards but whose hands are
  // immediately killed after the deal. Their blinds and antes are still
  // posted from their stacks.
  repeated bytes players_on_penalty = 1;
  // TDA Rule 23 — the saga passes the tournament's current blind
  // level so HandStarted records it; level changes mid-hand only take
  // effect on the next StartHand.
  int32 blind_level = 2;
}

message EndHand {
  bytes hand_root = 1;
  repeated PotResult results = 2;
}

message PotResult {
  bytes winner_root = 1;
  int64 amount = 2;
  string pot_type = 3; // "main" or "side_N"
  HandRanking winning_hand = 4;
}

message AddChips {
  bytes player_root = 1;
  int64 amount = 2;
}

// TDA Rule 33 / WSOP Rule 86 — voluntary seat change. The player
// requests to move from ``current_seat`` to ``requested_seat`` between
// hands. If the move skips a blind position the player forfeits both
// blinds and earns a missed-round penalty (emits BlindDodgePenalty);
// the handler also re-anchors seating per the new position.
message ChangeSeats {
  bytes player_root = 1;
  int32 current_seat = 2;
  int32 requested_seat = 3;
}

// Events

message TableCreated {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.TableState" };
  string table_name = 1;
  GameVariant game_variant = 2;
  int64 small_blind = 3;
  int64 big_blind = 4;
  int64 min_buy_in = 5;
  int64 max_buy_in = 6;
  int32 max_players = 7;
  int32 action_timeout_seconds = 8;
  google.protobuf.Timestamp created_at = 9;
}

message PlayerJoined {
  bytes player_root = 1;
  int32 seat_position = 2;
  int64 buy_in_amount = 3;
  int64 stack = 4; // Absolute stack after buy-in
  google.protobuf.Timestamp joined_at = 5;
}

message PlayerLeft {
  bytes player_root = 1;
  int32 seat_position = 2;
  int64 chips_cashed_out = 3;
  google.protobuf.Timestamp left_at = 4;
}

message PlayerSatOut {
  bytes player_root = 1;
  google.protobuf.Timestamp sat_out_at = 2;
}

message PlayerSatIn {
  bytes player_root = 1;
  google.protobuf.Timestamp sat_in_at = 2;
}

message HandStarted {
  // Multi-consumer: folded into TableAggregate's state AND triggers the
  // TableHandSaga — one (event) entry per consumer.
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.TableState" };
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.TableHandSaga"
    domain: "table"
  };
  bytes hand_root = 1; // New hand aggregate root
  int64 hand_number = 2;
  int32 dealer_position = 3;
  int32 small_blind_position = 4;
  int32 big_blind_position = 5;
  repeated SeatSnapshot active_players = 6;
  GameVariant game_variant = 7;
  int64 small_blind = 8;
  int64 big_blind = 9;
  google.protobuf.Timestamp started_at = 10;
  // TDA Rule 23 — blind level under which this hand is being played.
  // Captures the level at deal-time; mid-hand BlindLevelAdvanced events
  // do not change this value (the new level applies to the next hand).
  int32 blind_level = 11;
}

message SeatSnapshot {
  int32 position = 1;
  bytes player_root = 2;
  int64 stack = 3;
}

message HandEnded {
  bytes hand_root = 1;
  repeated PotResult results = 2;
  map<string, int64> stack_changes = 3; // player_root_hex -> delta
  google.protobuf.Timestamp ended_at = 4;
}

message ChipsAdded {
  bytes player_root = 1;
  int64 amount = 2;
  int64 new_stack = 3; // Absolute stack after add
  google.protobuf.Timestamp added_at = 4;
}

// TDA Rule 71C — a player on penalty had cards dealt to their seat
// then immediately killed; their posted blinds/antes are recorded as
// ``stack_charged`` so downstream stack accounting matches the kill.
message PlayerHandKilledByPenalty {
  bytes player_root = 1;
  bytes hand_root = 2;
  int32 seat_position = 3;
  int64 stack_charged = 4; // SB+BB+ante posted from the killed seat
  google.protobuf.Timestamp killed_at = 5;
}

// TDA Rule 11A — coordinator command to balance two tables. Source is
// the table with more players; destination is the shorter table. The
// player to be BB-next on the source table is moved to the worst
// position (never SB) on the destination table.
message BalanceTables {
  string source_table_name = 1;
  string destination_table_name = 2;
}

// TDA RP-9 / WSOP Rule 68 — coordinator command to combine multiple
// tables into a single final table. ``source_table_names`` is the
// list of tables being broken; ``final_table_name`` is the new
// final-table aggregate.
//
// ``active_players`` carries the source players + stacks the saga
// gathered from the breaking tables. The final-table aggregate
// stamps positions 0..N onto these and emits ``FinalTableCombined``
// — it cannot read source-aggregate state itself, so the caller
// (a balancing saga in production, the cucumber step in unit
// tests) is responsible for collecting the active set.
message CombineFinalTable {
  string final_table_name = 1;
  repeated string source_table_names = 2;
  int32 max_handed = 3; // 9 / 8 / 7 / 6
  repeated SeatSnapshot active_players = 4;
}

// TDA Rule 11D — coordinator command issued to a short table once the
// detection saga determines the deficit warrants a halt. The table
// aggregate emits ``TableHaltedForBalancing`` in response and
// subsequently refuses ``StartHand`` until ``ResumePlayAtTable``.
message HaltForBalancing {
  int32 deficit = 1; // players-short relative to the largest table
}

// TDA Rule 11D — coordinator command to resume play at a previously
// halted table once rebalancing has closed the deficit.
message ResumePlayAtTable {}

// TDA Rule 11A emit — a balancing move emitted at the source table.
message BalancingMoveDecided {
  bytes player_root = 1;
  bytes source_table_root = 2;
  bytes destination_table_root = 3;
  int32 destination_seat = 4;
  google.protobuf.Timestamp moved_at = 5;
}

// TDA RP-9 / WSOP Rule 68 emit — final table combined.
message FinalTableCombined {
  bytes final_table_root = 1;
  repeated bytes source_table_roots = 2;
  repeated SeatSnapshot active_players = 3;
  int32 max_handed = 4;
  google.protobuf.Timestamp combined_at = 5;
}

// TDA Rule 11D emit — table halted because it is 3+ players short of
// the largest table and the BB on the next hand would land on an
// empty seat.
message TableHaltedForBalancing {
  bytes table_root = 1;
  int32 deficit = 2; // players-short relative to the largest table
  google.protobuf.Timestamp halted_at = 3;
}

// TDA Rule 11D emit — table resumed play after the coordinator's
// ``ResumePlayAtTable`` command closed the halted_for_balancing flag.
message TableResumedForBalancing {
  bytes table_root = 1;
  google.protobuf.Timestamp resumed_at = 2;
}

// TDA Rule 11D part 1 — local trigger emitted when the table's next BB
// position becomes an empty seat. Edge-only: emitted on the false→true
// transition. Consumed by saga-table-tournament which forwards into
// the tournament aggregate for the cross-table deficit check.
message TableBBOnEmptyPredicted {
  bytes table_root = 1;
  google.protobuf.Timestamp predicted_at = 2;
}

// Edge-only counterpart: emitted on the true→false transition (BB
// position now occupied — typically because a rebalance seated a
// player at the BB-next seat). Triggers the resume path at the
// tournament side if the table is currently halted.
message TableBBOnEmptyResolved {
  bytes table_root = 1;
  google.protobuf.Timestamp resolved_at = 2;
}

// =============================================================================
// Cross-aggregate routing context
// =============================================================================
//
// Poker-domain wrapper packed into the framework ``Cover.ext`` slot on
// every command/event for a tournament-owned table. The framework
// treats Cover.ext as opaque Any; this typed wrapper gives the
// poker-side code a named field to read.
//
// The aggregate creator (operator / saga) constructs this with the
// owning tournament's Cover and packs into the CreateTable command's
// cover.ext. The framework dispatcher then propagates the same ext
// onto every event the table emits thereafter.
//
// Sagas that route per-tournament (e.g. saga-table-tournament) read
// ``unpack_table_ext(source_cover).tournament_cover.root.value`` for
// their target.
message TableExt {
  io.angzarr.v1.Cover tournament_cover = 1;
}

// TDA Rule 33 / WSOP Rule 86 emit — a player who skipped a blind by
// moving forfeits both blinds and earns a missed-round penalty.
message BlindDodgePenalty {
  bytes player_root = 1;
  int64 chips_forfeited = 2;
  int32 missed_round_count = 3;
  google.protobuf.Timestamp assessed_at = 4;
}

// =============================================================================
// Hand-for-hand at the bubble (TDA Rule 12, EA-0013)
// =============================================================================
//
// Each active table tracks its own H4H status. The lifecycle:
//
//   "" (default)
//      │
//      │ EnterTableHandForHand → TableHandForHandWaiting
//      ▼
//   "WAITING"
//      │
//      │ HandEnded (existing applier flips status)
//      ▼
//   "COMPLETE"   ← StartHand rejected here ("table waiting for round")
//      │
//      │ EndTableHandForHand → TableHandForHandEnded (cleared back to "")
//      │   (issued either between rounds to reset for the next H4H hand,
//      │    or once after PlayerEliminated breaks the bubble entirely)
//      ▼
//   "" (cleared)
//
// Cross-coordinator coordination — the saga or operator that drives
// these per-table commands also issues ``RecordHandForHandRoundComplete``
// on the tournament once every active H4H table reaches "COMPLETE".

// ``tournament_root`` lets the saga route the resulting per-table
// completion event back to the right tournament aggregate without a
// separate registry. Defaulting to empty bytes is the legacy form
// (no tournament owner — non-cluster tests).
message EnterTableHandForHand {
  bytes tournament_root = 1;
}

message EndTableHandForHand {}

// Operator/saga signal that the table's synchronised H4H hand has
// completed. Independent of the real-hand HandEnded path so an
// operator/saga can drive the round-complete arithmetic against a
// table that didn't play a betting-detail hand (e.g. the cluster-tier
// EA-0013 scenario where the test fast-forwards through bubble play
// without scripting every action). Emits ``TableHandForHandRoundComplete``;
// the apply transitions ``hand_for_hand_status`` from WAITING → COMPLETE.
message MarkTableHandForHandHandComplete {
  bytes hand_root = 1;
}

message TableHandForHandWaiting {
  google.protobuf.Timestamp entered_at = 1;
  bytes tournament_root = 2;
}

message TableHandForHandRoundComplete {
  bytes hand_root = 1;
  google.protobuf.Timestamp completed_at = 2;
  bytes tournament_root = 3;
}

message TableHandForHandEnded {
  google.protobuf.Timestamp ended_at = 1;
}

// State (for snapshots)
message TableState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    input_domain: "table"
    name: "TableAggregate"
    compensates: "io.angzarr.examples.v1.DealCards"
  };
  string table_id = 1;
  string table_name = 2;
  GameVariant game_variant = 3;
  int64 small_blind = 4;
  int64 big_blind = 5;
  int64 min_buy_in = 6;
  int64 max_buy_in = 7;
  int32 max_players = 8;
  int32 action_timeout_seconds = 9;
  repeated Seat seats = 10;
  int32 dealer_position = 11;
  int64 hand_count = 12;
  bytes current_hand_root = 13;
  string status = 14; // "waiting", "in_hand", "paused"
}
