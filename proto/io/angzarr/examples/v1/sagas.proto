syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/v1/options.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/examples/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// Sagas — stateless translators between player and table
// =============================================================================
//
// A saga has no state, so each is declared on an empty marker message. Its
// reactions are wired by the (event) entries on the events it consumes.
// There is one saga per (source domain, destination domain) pair: every
// reaction from table events to player commands is part of
// saga-table-player.
// Every saga takes target roots from fields of the source event (never from
// a lookup) and emits reaction commands: they carry no Handling, the
// destination stamps its own head, and redelivery is deduplicated on the
// command id derived from the triggering event.
//
// The buy-in's two sagas (saga-buy-in-player and saga-buy-in-table, from
// the PM's "buy-in" domain) are declared beside the PM, in buy_in.proto.
//
// Two reactions of the earlier spec are not part of this port:
// saga-player-table (top-ups, whose refusal was compensated back to the
// wallet) and the table -> player settlement reaction (which injected
// facts into the wallet; if restored, it is part of saga-table-player).
// Both wait on rulings in docs/design/blackjack-latest-proto-rulings.md.

// saga-table-player: the one saga for the table -> player pair. On
// RoundSettled, for each outcome in seat order, it emits to that outcome's
// player_root one RecordRoundResult{table_root, round, wager, net} followed
// by one AwardLoyaltyPoints{table_root, round, points = wager}. What the
// wallet does with an award for a player who never enrolled waits on a
// ruling: under the latest contract a refused reaction command is
// dead-lettered.
message TablePlayerSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "table"
    output_domain: "player"
  };
}
