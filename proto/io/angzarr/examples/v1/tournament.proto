syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/examples/v1/poker_types.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// Tournament Domain - Tournament lifecycle and player management
// Root: tournament_id (derived from name + start time)
// =============================================================================

// Tournament status
enum TournamentStatus {
  TOURNAMENT_STATUS_UNSPECIFIED = 0;
  TOURNAMENT_CREATED = 1; // Created but not open
  TOURNAMENT_REGISTRATION_OPEN = 2; // Accepting registrations
  TOURNAMENT_RUNNING = 3; // In progress
  TOURNAMENT_PAUSED = 4; // On break
  TOURNAMENT_COMPLETED = 5; // Finished
  TOURNAMENT_CANCELLED = 6; // Cancelled
  // WSOP Rule 125 — new hands halted after current hand; awaiting
  // BagAndTag command to take per-player snapshot.
  TOURNAMENT_HALTING = 7;
  // WSOP Rule 122 — bag-and-tag complete; awaiting ResumeTournament
  // on the subsequent day. Distinct from PAUSED (which is a within-day
  // break) in that the level clock is fully suspended.
  TOURNAMENT_BAGGED = 8;
}

// Rebuy configuration
message RebuyConfig {
  bool enabled = 1;
  int32 max_rebuys = 2; // 0 = unlimited
  int32 rebuy_level_cutoff = 3; // Last level allowing rebuys
  int64 stack_threshold = 4; // Max stack to be eligible
  int64 rebuy_cost = 5;
  int64 rebuy_chips = 6;
}

// Addon configuration
message AddonConfig {
  bool enabled = 1;
  int32 addon_level = 2; // Level when addon is available
  int64 addon_cost = 3;
  int64 addon_chips = 4;
}

// Payout schedule entry — position N pays this percentage of the pool.
// Sum of percentages across all entries must equal 100.
message PayoutPosition {
  int32 position = 1; // 1 = first place, 2 = second, ...
  int32 percentage = 2; // 0..100; sum across all entries == 100
}

// Player registration record
message PlayerRegistration {
  bytes player_root = 1;
  int64 fee_paid = 2;
  int64 starting_stack = 3;
  int32 rebuys_used = 4;
  bool addon_taken = 5;
  int32 table_assignment = 6; // Table number
  int32 seat_assignment = 7;
  google.protobuf.Timestamp registered_at = 8;
}

// -----------------------------------------------------------------------------
// Commands
// -----------------------------------------------------------------------------

message CreateTournament {
  string name = 1;
  GameVariant game_variant = 2;
  int64 buy_in = 3;
  int64 starting_stack = 4;
  int32 max_players = 5;
  int32 min_players = 6;
  google.protobuf.Timestamp scheduled_start = 7;
  RebuyConfig rebuy_config = 8;
  AddonConfig addon_config = 9;
  repeated BlindLevel blind_structure = 10;
  // Late-registration cutoff: 0 means registration auto-closes only
  // on explicit CloseRegistration. N > 0 means registration auto-closes
  // when the tournament reaches blind level N+1.
  int32 registration_cutoff_level = 11;
  // Prize-pool distribution by finishing position.
  repeated PayoutPosition payout_structure = 12;
}

message OpenRegistration {
  // No parameters - uses tournament config
}

message CloseRegistration {
  // No parameters
}

// PM sends this command to register a player in tournament
message EnrollPlayer {
  bytes player_root = 1;
  bytes reservation_id = 2; // Links to registration flow
}

// Player requests to unregister (refund if allowed)
message UnregisterPlayer {
  bytes player_root = 1;
}

// Start the tournament (requires min players)
message StartTournament {
  // No parameters
}

// Complete the tournament — records the winner and closes the tournament.
// Typically issued after the last elimination leaves one player remaining.
message CompleteTournament {
  bytes winner_root = 1;
  // Players in finishing order (1st place, 2nd, ...). Used to populate
  // TournamentResult entries when payout_structure is configured.
  // Must contain at least as many entries as payout_structure positions.
  repeated bytes finishing_order = 2;
}

// Operator command to retire low-denomination chips between levels.
message ColorUp {
  int64 retire_denomination = 1;
  int64 new_denomination = 2;
}

// Operator command to rebalance players across tables.
//
// The pre-decided move (computed by the operator or a counts-tracking
// projector against the current per-table active-player counts) is
// passed in explicitly. The aggregate echoes the fields onto the
// emitted ``PlayerMovedBetweenTables`` event, which the
// ``saga-tournament-table`` consumes to fan out the actual reseat —
// ``LeaveTable`` on the source and ``SeatPlayer`` on the destination,
// preserving the moved player's stack.
//
// All fields are optional for backward compatibility; when omitted the
// aggregate emits an empty-rooted ``PlayerMovedBetweenTables`` (the
// pre-batch-16 behavior, retained for unit tests that don't model
// the cross-coordinator move).
message RebalanceTables {
  bytes source_table_root = 1;
  bytes destination_table_root = 2;
  bytes player_root = 3;
  int32 destination_seat = 4;
  int64 stack = 5;
}

// Operator/coordinator command to enter hand-for-hand play at the
// money bubble. ``active_table_roots`` lists every table currently
// participating in the tournament — the saga consumes this list to
// fan ``EnterTableHandForHand`` out to each table, and the tournament
// uses it to seed the per-round pending-tables set so it knows when
// every table has finished its synchronised hand.
message EnterHandForHand {
  repeated bytes active_table_roots = 1;
}

// Operator/saga command — every active H4H table has finished its
// synchronised hand. Tournament emits ``HandForHandRoundComplete``
// (with auto-incremented ``round_number``) so the operator/saga can
// then re-arm each table for the next round via
// ``EndTableHandForHand`` + ``EnterTableHandForHand``.
message RecordHandForHandRoundComplete {}

// Saga signal — one specific table just finished its synchronised
// H4H hand. Tournament removes ``table_root`` from the per-round
// pending set; once the set empties (every active H4H table has
// reported in) the tournament emits ``HandForHandRoundComplete`` and
// reseeds the pending set with the same active_table_roots ready for
// the next synchronised round.
message RecordTableHandComplete {
  bytes table_root = 1;
}

// Coordinator/saga command emitted when a hand-for-hand hand completes.
// ``real_seconds`` is the wall-clock duration of the just-completed
// hand. The clock-deduction algorithm (TDA RP-8B/8C) caps the
// deduction at 3 minutes per hand; absent ``real_seconds`` it defaults
// to 2 minutes per hand ("whenever possible the clock should be
// reduced by 2-minutes each hand").
message RecordHandForHandHand {
  int32 real_seconds = 1;
}

// Coordinator/saga command emitted when a hand-for-hand hand produces
// multiple eliminations on the same hand. Per RP-8A the listed players
// share the next paid position(s); CompleteTournament reads recorded
// groups and splits the payout(s) accordingly. When ``same_table`` is
// true the WSOP Rule 126b tiebreak applies: the player with the
// higher ``pre_hand_stacks`` value wins the higher finishing position
// and the lower-stack busters are demoted (no payout split).
message RecordSimultaneousBusts {
  repeated bytes player_roots = 1;
  bytes hand_root = 2;
  bool same_table = 3;
  map<string, int64> pre_hand_stacks = 4; // player_root_hex -> chip count
}

// WSOP Rule 67c — operator-triggered seat redraw at a table-count
// threshold. The trigger label captures which threshold tripped:
// THREE_TABLES, TWO_TABLES, FINAL_TABLE.
message TriggerSeatRedraw {
  int32 tables_remaining = 1;
  int32 original_field = 2;
}

// TDA RP-16 — coordinator command to reseat an absent player from a
// breaking table to a new table; missed-blinds clock continues.
message ReseatAbsentPlayer {
  bytes player_root = 1;
  bytes from_table_root = 2;
  bytes to_table_root = 3;
  int32 to_seat = 4;
  int64 stack = 5;
}

// WSOP Rule 36 — saga ticks the absent-blind clock for a heads-up
// table where one player is absent. Emits AbsentBlindAdvanced; the
// button advances and the lone player banks SB+BB.
message AdvanceAbsentBlind {
  bytes table_root = 1;
  bytes absent_player_root = 2;
  bytes lone_player_root = 3;
  int64 small_blind = 4;
  int64 big_blind = 5;
}

// Tables signal the tournament after each synchronised hand completes.
message NotifyHandComplete {
  bytes table_root = 1;
}

// PM sends this command to process a rebuy
message ProcessRebuy {
  bytes player_root = 1;
  bytes reservation_id = 2; // Links to rebuy flow
}

// PM sends this command to process an addon
message ProcessAddon {
  bytes player_root = 1;
  bytes reservation_id = 2;
}

// Advance to next blind level
message AdvanceBlindLevel {
  // Optional chip-race fields (TDA Rule 24A). When ``retire_denomination``
  // is non-zero, the level advance includes a color-up: the named
  // denomination is removed from play and players' residual chips below
  // the chip cutoff are raced for ``new_denomination`` chips. Emits a
  // ``ColorUpCompleted`` event in addition to ``BlindLevelAdvanced``.
  int64 retire_denomination = 1;
  int64 new_denomination = 2;
  // Optional deterministic seed for the race (RP-14). Empty → use
  // crypto-random; tests pass an explicit seed for reproducibility.
  bytes race_seed = 3;
}

// Eliminate a player (from table event via saga)
message EliminatePlayer {
  bytes player_root = 1;
  bytes hand_root = 2; // Hand where elimination occurred
}

// Pause the tournament (break)
message PauseTournament {
  string reason = 1;
}

// Resume the tournament
message ResumeTournament {
  // No parameters
}

// TDA Rule 71 / WSOP Rule 113 — operator-issued penalty against a
// player. Severity translates to downstream behavior via sagas:
// VERBAL_WARNING is recorded only; MISSED_HAND/MISSED_ROUND result in
// PlayerOnPenalty events at the table; DISQUALIFICATION removes the
// player and their chips from total_chips_in_play (Rule 71D).
message AssessPenalty {
  bytes player_root = 1;
  PenaltySeverity severity = 2;
  string reason = 3; // free-form, e.g. "DISCLOSURE_VIOLATION"
}

// TDA Rule 71A — operator-issued penalty with type + rounds parameter.
// Sibling to AssessPenalty using string types and explicit rounds for
// MISSED_ROUND penalties (Rule 71's "one hand per player at the table
// times rounds" calculation).
message IssuePenalty {
  bytes player_root = 1;
  string type = 2; // "VERBAL_WARNING" / "MISSED_HAND" / "MISSED_ROUND" / "DISQUALIFIED"
  int32 rounds = 3; // For MISSED_ROUND, the number of round-cycles.
  int32 table_size = 4; // For MISSED_ROUND, players at the table when issued.
}

// TDA Rule 71D / WSOP Rule 114 — disqualification removes the player
// and their chips. Distinct from elimination (which keeps chips on the
// table for redistribution); DQ chips are removed from
// total_chips_in_play entirely.
message DisqualifyPlayer {
  bytes player_root = 1;
  string reason = 2;
}

// TDA Rule 71 — saga decrements a player's penalty round-counter
// after a hand in which their seat was charged blinds and the hand
// was killed. Emits ``PenaltyRoundsDecremented``.
message DecrementPenalty {
  bytes player_root = 1;
}

// TDA Rule 8B — a busted player re-enters the event. The chips they
// forfeited (their last remaining stack at bust time) are removed from
// total_chips_in_play and a fresh starting stack is added.
message ReEntryPlayer {
  bytes player_root = 1;
  int64 chips_forfeited = 2;
}

// TDA RP-22 / WSOP Rule 39 — bounty payout when a player is knocked
// out by another. Coordinator emits BountyAwarded; downstream player
// aggregates receive funds.
message AwardBounty {
  bytes eliminator_root = 1;
  bytes knocked_out_root = 2;
  int64 amount = 3;
  // Tiebreak metadata when last-two simultaneous bust resolved by
  // pre-hand stack. Empty otherwise.
  string tiebreak_reason = 4;
}

// WSOP Rule 16 — operator-issued no-show detection after the first-break
// deadline. The aggregate emits NoShowDetected and removes the player's
// chips from total_chips_in_play; the player remains marked for refund
// processing via the buy_in_held_amount field.
message DetectNoShow {
  bytes player_root = 1;
}

// WSOP Rule 125 — operator-issued end-of-day stop. New hands halted
// after the in-progress hand completes; bag-and-tag begins afterward.
message StopNewHands {
  string reason = 1; // e.g. "END_OF_DAY"
}

// WSOP Rule 122 — bag-and-tag completed; tournament ready to resume
// the following day.
message BagAndTag {
  // No parameters — the aggregate snapshots stacks/seats from current
  // state.
}

// TDA RP-18 — operator/saga rotation tick for a HORSE event. Each
// completed orbit triggers the next variant in the fixed cycle:
// H(old'em) → O(maha Hi/Lo) → R(azz) → S(even Card Stud) →
// E(even Card Stud Hi/Lo 8 or Better) → repeat.
message RotateMixedGameVariant {
  // No parameters — the aggregate cycles based on its current state.
}

// -----------------------------------------------------------------------------
// Events
// -----------------------------------------------------------------------------

message TournamentCreated {
  string name = 1;
  GameVariant game_variant = 2;
  int64 buy_in = 3;
  int64 starting_stack = 4;
  int32 max_players = 5;
  int32 min_players = 6;
  google.protobuf.Timestamp scheduled_start = 7;
  RebuyConfig rebuy_config = 8;
  AddonConfig addon_config = 9;
  repeated BlindLevel blind_structure = 10;
  google.protobuf.Timestamp created_at = 11;
  int32 registration_cutoff_level = 12;
  repeated PayoutPosition payout_structure = 13;
}

message RegistrationOpened {
  google.protobuf.Timestamp opened_at = 1;
}

message RegistrationClosed {
  int32 total_registrations = 1;
  google.protobuf.Timestamp closed_at = 2;
}

message TournamentPlayerEnrolled {
  bytes player_root = 1;
  bytes reservation_id = 2;
  int64 fee_paid = 3;
  int64 starting_stack = 4;
  int32 registration_number = 5; // Order of registration
  google.protobuf.Timestamp enrolled_at = 6;
}

message TournamentEnrollmentRejected {
  bytes player_root = 1;
  bytes reservation_id = 2;
  string reason = 3; // "full", "closed", "already_registered"
  google.protobuf.Timestamp rejected_at = 4;
}

message PlayerUnregistered {
  bytes player_root = 1;
  int64 refund_amount = 2;
  google.protobuf.Timestamp unregistered_at = 3;
}

message TournamentStarted {
  int32 total_players = 1;
  int32 tables_created = 2;
  int64 total_prize_pool = 3;
  google.protobuf.Timestamp started_at = 4;
}

message RebuyProcessed {
  bytes player_root = 1;
  bytes reservation_id = 2;
  int64 rebuy_cost = 3;
  int64 chips_added = 4;
  int32 rebuy_count = 5; // Player's total rebuys
  google.protobuf.Timestamp processed_at = 6;
}

message RebuyDenied {
  bytes player_root = 1;
  bytes reservation_id = 2;
  string reason = 3; // "window_closed", "stack_too_high", "max_reached"
  google.protobuf.Timestamp denied_at = 4;
}

message AddonProcessed {
  bytes player_root = 1;
  bytes reservation_id = 2;
  int64 addon_cost = 3;
  int64 chips_added = 4;
  google.protobuf.Timestamp processed_at = 5;
}

message BlindLevelAdvanced {
  int32 level = 1;
  int64 small_blind = 2;
  int64 big_blind = 3;
  int64 ante = 4;
  google.protobuf.Timestamp advanced_at = 5;
}

message PlayerEliminated {
  bytes player_root = 1;
  int32 finish_position = 2;
  bytes hand_root = 3;
  int64 payout = 4; // 0 if out of the money
  google.protobuf.Timestamp eliminated_at = 5;
}

message TournamentPaused {
  string reason = 1;
  google.protobuf.Timestamp paused_at = 2;
}

message TournamentResumed {
  google.protobuf.Timestamp resumed_at = 1;
}

message TournamentCompleted {
  bytes winner_root = 1;
  int64 total_prize_pool = 2;
  repeated TournamentResult results = 3;
  google.protobuf.Timestamp completed_at = 4;
}

// Color-up event: low-denomination chips retired, replaced with
// higher-denomination chips on every active stack. When a chip race
// occurs (TDA Rule 24A) the ``per_player_awards`` capture how many
// chips each player received; ``chips_added_by_rescue`` and
// ``chips_removed_by_race`` give the auditable conservation deltas.
message ColorUpCompleted {
  int64 retired_denomination = 1;
  int64 new_denomination = 2;
  google.protobuf.Timestamp completed_at = 3;
  // Per-player race awards. ``chips_won`` is the count of chips of the
  // new denomination awarded by the race; ``rescued`` is true when the
  // award came from the single-chip rescue clause rather than the race.
  repeated ChipRaceAward per_player_awards = 4;
  // Total value (in stake units) added to the chip economy by the
  // single-chip rescue clause. Conservation invariant: post_total ==
  // pre_total + chips_added_by_rescue - chips_removed_by_race.
  int64 chips_added_by_rescue = 5;
  // Total value removed from the chip economy by retired denominations
  // that did not earn a new-denomination chip in the race.
  int64 chips_removed_by_race = 6;
}

// Per-player record of a chip-race award.
message ChipRaceAward {
  bytes player_root = 1;
  int32 chips_won = 2;
  // True iff the award was the single-chip rescue (Rule 24A) rather
  // than a race award.
  bool rescued = 3;
}

// Player moved between tables for rebalancing (TDA Rule 14).
// The moved player keeps their stack.
message PlayerMovedBetweenTables {
  bytes player_root = 1;
  bytes source_table_root = 2;
  bytes destination_table_root = 3;
  int32 destination_seat = 4;
  int64 stack = 5;
  google.protobuf.Timestamp moved_at = 6;
}

// Hand-for-hand bubble play started (TDA Rule 12). Tables must
// complete each hand simultaneously until the next elimination.
// ``active_table_roots`` is the list of tables expected to play the
// synchronised round; saga-tournament-table-h4h reads this to know
// which tables to drive.
message HandForHandStarted {
  google.protobuf.Timestamp started_at = 1;
  repeated bytes active_table_roots = 2;
}

// All tables finished their synchronised hand. The next round can begin.
message HandForHandRoundComplete {
  int32 round_number = 1;
  google.protobuf.Timestamp completed_at = 2;
}

// Per-table progress receipt for ``RecordTableHandComplete`` while the
// pending-tables set still has unreported entries. Without this event
// the handler had no way to persist "table T already reported in" —
// each command rebuilds state from prior events and the original apply
// for ``HandForHandStarted`` reseeded the pending set to the full
// ``active_table_roots``, so the second-and-subsequent
// ``RecordTableHandComplete`` saw the original membership and only
// removed one entry per call. The progressive emit lets state replay
// converge: by the time the last table reports, the rebuilt state has
// the prior table's removal applied and the empty-set transition fires
// the ``HandForHandRoundComplete`` event.
message TableHandCompleteRecorded {
  bytes table_root = 1;
  google.protobuf.Timestamp recorded_at = 2;
}

// TDA RP-8B/8C emit — a single hand-for-hand hand finished.
// ``clock_seconds_deducted`` records the per-hand level-clock charge
// (capped at 180 = 3 min, defaults to 120 = 2 min per RP-8C).
message HandForHandHandRecorded {
  int32 real_seconds = 1;
  int32 clock_seconds_deducted = 2;
  google.protobuf.Timestamp recorded_at = 3;
}

// TDA RP-8A emit — multiple players bust on the same hand-for-hand
// hand. They share the next paid position(s); the split is computed by
// CompleteTournament when payouts are paid out. ``same_table`` carries
// the WSOP-126b tiebreak indicator; ``pre_hand_stacks`` captures the
// pre-hand chip counts used to break the tie.
message SimultaneousBustsRecorded {
  repeated bytes player_roots = 1;
  bytes hand_root = 2;
  bool same_table = 3;
  map<string, int64> pre_hand_stacks = 4;
  google.protobuf.Timestamp recorded_at = 5;
}

// WSOP Rule 67c emit — seat redraw triggered by the field collapsing
// to one of the redraw thresholds.
message SeatRedrawTriggered {
  string trigger = 1; // THREE_TABLES / TWO_TABLES / FINAL_TABLE
  int32 tables_remaining = 2;
  int32 original_field = 3;
  google.protobuf.Timestamp triggered_at = 4;
}

// WSOP Rule 36 emit — heads-up absent-blind tick. The dealer button
// advances and the lone player's stack is increased by SB+BB while the
// absent player's stack is decreased by the same amount.
message AbsentBlindAdvanced {
  bytes table_root = 1;
  bytes absent_player_root = 2;
  bytes lone_player_root = 3;
  int64 stack_delta = 4; // signed transfer (SB + BB)
  google.protobuf.Timestamp advanced_at = 5;
}

// An elimination occurred — bubble has burst, hand-for-hand ends.
message HandForHandEnded {
  google.protobuf.Timestamp ended_at = 1;
}

// TDA Rule 71 / WSOP Rule 113 emit — penalty assessed against a player.
// Companion event to AssessPenalty command.
message PlayerPenalized {
  bytes player_root = 1;
  PenaltySeverity severity = 2;
  string reason = 3;
  google.protobuf.Timestamp assessed_at = 4;
}

// TDA Rule 71 emit — operator-issued penalty with a specific type and
// rounds parameter. ``missed_hands`` is computed: 0 for VERBAL_WARNING
// and DISQUALIFIED, 1 for MISSED_HAND, ``rounds * table_size`` for
// MISSED_ROUND. Companion event to IssuePenalty command.
message PenaltyIssued {
  bytes player_root = 1;
  string type = 2; // "VERBAL_WARNING" / "MISSED_HAND" / "MISSED_ROUND" / "DISQUALIFIED"
  int32 rounds = 3;
  int32 missed_hands = 4;
  google.protobuf.Timestamp issued_at = 5;
}

// TDA Rule 8B emit — a busted player re-entered the event. Forfeited
// chips removed; fresh starting stack added.
message PlayerReEntered {
  bytes player_root = 1;
  int64 chips_forfeited = 2;
  int64 chips_added = 3;
  google.protobuf.Timestamp re_entered_at = 4;
}

// TDA Rule 71 — penalty round-counter decremented after one round of
// missed hands has been served.
message PenaltyRoundsDecremented {
  bytes player_root = 1;
  int32 rounds_remaining = 2;
  google.protobuf.Timestamp decremented_at = 3;
}

// TDA Rule 71D / WSOP Rule 114 emit — player disqualified, chips
// removed from total_chips_in_play.
message PlayerDisqualified {
  bytes player_root = 1;
  string reason = 2;
  int64 chips_removed = 3;
  google.protobuf.Timestamp disqualified_at = 4;
}

// TDA RP-22 / WSOP Rule 39 emit — bounty awarded to the player who
// knocked an opponent out.
message BountyAwarded {
  bytes eliminator_root = 1;
  bytes knocked_out_root = 2;
  int64 amount = 3;
  // Tiebreak metadata when last-two simultaneous bust resolved by
  // pre-hand stack (TDA RP-22 + WSOP Rule 39). Empty otherwise.
  string tiebreak_reason = 4;
  google.protobuf.Timestamp awarded_at = 5;
}

// WSOP Rule 16 emit — no-show detected after the first-break deadline.
// Player's chips are removed from total_chips_in_play; their buy-in
// is held in safekeeping (refund processing happens externally).
message NoShowDetected {
  bytes player_root = 1;
  int64 chips_removed = 2;
  int64 buy_in_held = 3;
  google.protobuf.Timestamp detected_at = 4;
}

// WSOP Rule 125 emit — new hands halted; in-progress hand allowed to
// complete before bagging begins.
message NewHandsHalted {
  string effective_at = 1; // "AFTER_CURRENT_HAND" / "IMMEDIATELY"
  string reason = 2;
  google.protobuf.Timestamp halted_at = 3;
}

// WSOP Rule 122 emit — bag-and-tag completed; per-player snapshot
// captured for resume on subsequent day.
message BagAndTagComplete {
  repeated PlayerBagSnapshot snapshots = 1;
  google.protobuf.Timestamp completed_at = 2;
}

// TDA RP-18 emit — HORSE rotation advanced to the next variant in the
// fixed cycle.
message MixedGameVariantRotated {
  GameVariant from_variant = 1;
  GameVariant to_variant = 2;
  google.protobuf.Timestamp rotated_at = 3;
}

// Per-player bag-and-tag snapshot. Used to restore stacks and seats
// when the tournament resumes after a day break (WSOP Rule 122).
message PlayerBagSnapshot {
  bytes player_root = 1;
  int64 stack = 2;
  bytes table_root = 3;
  int32 seat = 4;
}

// TDA RP-16 emit — a player on a breaking table moved to a new table
// while absent. Distinct from PlayerMovedBetweenTables in that the
// missed-blinds clock continues at the new table.
message PlayerMovedTables {
  bytes player_root = 1;
  bytes from_table_root = 2;
  bytes to_table_root = 3;
  int32 to_seat = 4;
  int64 stack = 5;
  bool absent_at_move = 6;
  google.protobuf.Timestamp moved_at = 7;
}

// TDA RP-14 — deterministic random tiebreak applied to a special
// situation (tied late-reg seats, tied stack draws). Reproducible via
// the seed for replay/audit.
message SeatTiebreakResolved {
  bytes seed = 1;
  repeated bytes contenders = 2;
  bytes winner = 3; // The contender selected by the tiebreak.
  string situation = 4; // e.g. "LATE_REG_TIE" / "STACK_DRAW_TIE"
  google.protobuf.Timestamp resolved_at = 5;
}

message TournamentResult {
  int32 position = 1;
  bytes player_root = 2;
  int64 payout = 3;
  // WSOP Rule 126b — when same-table simultaneous busts are tiebroken
  // by pre-hand stack, the loser of the tiebreak inherits a worse
  // finishing position. Recorded so audits can trace tiebreak outcomes.
  string tiebreak_reason = 4;
}

// -----------------------------------------------------------------------------
// Supporting Types
// -----------------------------------------------------------------------------

message BlindLevel {
  int32 level = 1;
  int64 small_blind = 2;
  int64 big_blind = 3;
  int64 ante = 4;
  int32 duration_minutes = 5;
}

// -----------------------------------------------------------------------------
// State (for snapshots)
// -----------------------------------------------------------------------------

message TournamentState {
  string tournament_id = 1;
  string name = 2;
  GameVariant game_variant = 3;
  TournamentStatus status = 4;
  int64 buy_in = 5;
  int64 starting_stack = 6;
  int32 max_players = 7;
  int32 min_players = 8;
  google.protobuf.Timestamp scheduled_start = 9;
  RebuyConfig rebuy_config = 10;
  AddonConfig addon_config = 11;
  repeated BlindLevel blind_structure = 12;
  int32 current_level = 13;
  map<string, PlayerRegistration> registered_players = 14; // player_root_hex -> registration
  int32 players_remaining = 15;
  int64 total_prize_pool = 16;

  // Bounty configuration (TDA RP-22 / WSOP Rule 39). Zero means no
  // bounty; non-zero is the per-knockout payout.
  int64 bounty_per_knockout = 17;
  // Per-player bounty totals (eliminator -> total chips won as bounty).
  map<string, int64> bounty_totals = 18;
  // Penalty register — players currently serving missed-hand /
  // missed-round penalties (TDA Rule 71). Cleared when the penalty
  // expires.
  map<string, PenaltySeverity> active_penalties = 19;
  // Bag-and-tag snapshots from the most recent end-of-day stop, keyed
  // by player_root_hex. Empty unless status == TOURNAMENT_BAGGED.
  map<string, PlayerBagSnapshot> bag_snapshots = 20;
}

// =============================================================================
// TDA Rule 11D — short-table halt orchestration
// =============================================================================
//
// Tournament aggregate as cross-table state-of-record. Per-table
// player counts and BB-on-empty flags are kept here so the deficit
// rule (3+ short relative to the largest table) can be evaluated
// inside an event-sourced aggregate handler. Two input paths feed
// the state:
//
//   1. Operator-issued: HaltShortTable / ResumeShortTable. The
//      operator decides (TD dashboard, ops gRPC); the tournament
//      records the order and the table halts via the fan-out saga.
//
//   2. Auto-detection: saga-table-tournament listens to table-domain
//      events (PlayerJoined / PlayerLeft / TableBBOnEmptyPredicted /
//      TableBBOnEmptyResolved), routes them via the tournament_cover
//      packed in Cover.ext, and emits the Record* commands below.
//      The handlers evaluate the rule and emit TableHaltOrdered when
//      deficit ≥ 3 and BB-on-empty are both true; TableResumeOrdered
//      when BB-on-empty resolves on a halted table.
//
// Both paths feed the same TableHaltOrdered / TableResumeOrdered
// events, which saga-tournament-halt-fanout translates into the
// table-domain HaltForBalancing / ResumePlayAtTable commands.

// Operator-issued: halt a short table directly. Deficit is computed
// externally (today by the operator, in future by a watcher) and
// passed as a parameter.
message HaltShortTable {
  bytes target_table_root = 1;
  int32 deficit = 2;
}

// Operator-issued: resume a previously halted table.
message ResumeShortTable {
  bytes target_table_root = 1;
}

// Saga-issued: forwarded from table.PlayerJoined / buy_in.PlayerSeated
// via saga-table-tournament. Tournament accumulates per-table counts.
message RecordTablePlayerJoined {
  bytes table_root = 1;
  bytes player_root = 2;
}

// Saga-issued: forwarded from table.PlayerLeft.
message RecordTablePlayerLeft {
  bytes table_root = 1;
  bytes player_root = 2;
}

// Saga-issued: forwarded from table.TableBBOnEmptyPredicted. The
// handler evaluates the deficit rule and ALSO emits TableHaltOrdered
// if deficit ≥ 3 and this table is not already in pending_halt_orders.
message RecordTableBBOnEmpty {
  bytes table_root = 1;
}

// Saga-issued: forwarded from table.TableBBOnEmptyResolved. The
// handler ALSO emits TableResumeOrdered if the table was halted.
message RecordTableBBOnEmptyCleared {
  bytes table_root = 1;
}

// Order-of-record events consumed by saga-tournament-halt-fanout to
// emit the per-table HaltForBalancing / ResumePlayAtTable commands.

message TableHaltOrdered {
  bytes target_table_root = 1;
  int32 deficit = 2;
  google.protobuf.Timestamp ordered_at = 3;
}

message TableResumeOrdered {
  bytes target_table_root = 1;
  google.protobuf.Timestamp ordered_at = 2;
}

// State-of-record events from the saga-fed Record* handlers — apply
// onto the tournament's per-table count / flag dictionaries.

message TournamentTablePlayerJoined {
  bytes table_root = 1;
  bytes player_root = 2;
  google.protobuf.Timestamp recorded_at = 3;
}

message TournamentTablePlayerLeft {
  bytes table_root = 1;
  bytes player_root = 2;
  google.protobuf.Timestamp recorded_at = 3;
}

message TournamentTableBBOnEmpty {
  bytes table_root = 1;
  google.protobuf.Timestamp recorded_at = 2;
}

message TournamentTableBBOnEmptyCleared {
  bytes table_root = 1;
  google.protobuf.Timestamp recorded_at = 2;
}

// =============================================================================
// TDA RP-9 / WSOP Rule 68 — final-table combination orchestration
// =============================================================================
//
// Same operator-parameterized shape as the Rule 11D halt orchestration
// above: an operator-issued command at the tournament aggregate
// records an order-of-record event, which a stateless fan-out saga
// translates into the per-table ``CombineFinalTable`` command. Today
// the rule itself (when to combine — e.g. 9-handed event collapses to
// one table at 9 players, 6-handed at 7) stays the operator's call;
// auto-detection paths can be added later as ``RecordTableField*``
// saga-issued commands without changing the operator-issued contract.

// Operator-issued: order a final-table combination at the tournament
// level. Field shape mirrors the existing table-domain
// ``CombineFinalTable`` (names, not roots) so the fan-out saga is a
// pure field-by-field translation — the table aggregate's
// name-addressed handler stays unchanged.
message OrderCombineFinalTable {
  string final_table_name = 1;
  repeated string source_table_names = 2;
  int32 max_handed = 3; // 9 / 8 / 7 / 6
}

// Order-of-record event consumed by saga-tournament-combine-fanout to
// emit the table-domain ``CombineFinalTable`` command against the
// final table aggregate.
message FinalTableCombineOrdered {
  string final_table_name = 1;
  repeated string source_table_names = 2;
  int32 max_handed = 3;
  google.protobuf.Timestamp ordered_at = 4;
}
