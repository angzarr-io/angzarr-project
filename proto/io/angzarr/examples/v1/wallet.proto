syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/v1/options.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/examples/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// Wallet domain ("wallet") — identity, funds, holds and captures, loyalty
// =============================================================================
//
// The wallet aggregate (Rust) owns every chip that is not on a table. It was
// the "player" aggregate until the owner's ruling of 2026-10-28 (decision
// 14.38): "player" is now the bot that plays a seat (player.proto). A
// person's wallet and their player share one root, the player_root the
// table and the buy-in carry. A hold earmarks
// part of the bankroll for one pending transfer to a table; it never moves
// money by itself. Money leaves the wallet only when a buy-in hold is
// captured. Top-ups and cash-out credits, the other two transfers of the
// earlier spec, wait on rulings (docs/design/blackjack-latest-proto-rulings.md).
//
// Invariant L1 (after every event):
//   bankroll >= sum(open holds) >= 0, every open hold > 0, and
//   bankroll = total_deposited - total_withdrawn - total_to_tables + total_from_tables.
//
// Rejections: one typed refusal message per refusal (below; decision
// 14.82), each named in the refuses of the client commands that refuse with
// it (each command of a domain a policy targets names one, decision 14.76);
// HoldFunds refuses with InsufficientFunds. Each refusal's status is its
// (io.angzarr.v1.refusal_status) message option, declared on each
// (decision 14.95): AmountNotPositive, DisplayNameRequired and EmailRequired
// are INVALID_ARGUMENT, the rest FAILED_PRECONDITION.
// A hold for no wallet, of nothing, or reusing a hold id for another hold
// (HOLD_CONFLICT) is the buy-in's bug.
//
// Repeating HoldFunds whose hold is already open with an identical payload
// succeeds with no events; a fact whose effect is already recorded
// (CaptureFunds or ReleaseHold of a closed hold, a round result or award
// already recorded) records nothing (decision 14.75): redelivery is
// harmless.
//
// Concurrency: the coordinator appends at the head it loaded and re-runs a
// lost race on the new head, so every handler decides on the current state
// (decision 14.92; there is no conflict resolution). The earlier spec's
// commutative deposit and manually reviewed withdrawal are the wallet's
// own business rules, if ever wanted.
// Policy outputs (HoldFunds, a command; CaptureFunds, ReleaseHold,
// RecordRoundResult and AwardLoyaltyPoints, facts its policies emit as
// facts, decision 14.69) carry no Handling, the wallet stamps its own
// head, and redelivery is deduplicated on their derived id.

// -----------------------------------------------------------------------------
// Commands — client
// -----------------------------------------------------------------------------

// Open a wallet. Field tags 1 and 2 are stable: core's acceptance harness
// sends this command by tag (its type URL changed with the rename to
// RegisterWallet, decision 14.38).
message RegisterWallet {
  option (io.angzarr.v1.command) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.WalletRegistered"
    refuses: "io.angzarr.examples.v1.WalletAlreadyExists"
    refuses: "io.angzarr.examples.v1.DisplayNameRequired"
    refuses: "io.angzarr.examples.v1.EmailRequired"
  };
  string display_name = 1;
  string email = 2;
}

// Admin migration of a wallet from a legacy system: identity only, no
// balance.
message ImportWallet {
  option (io.angzarr.v1.command) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.WalletImported"
    refuses: "io.angzarr.examples.v1.WalletAlreadyExists"
    refuses: "io.angzarr.examples.v1.DisplayNameRequired"
    refuses: "io.angzarr.examples.v1.EmailRequired"
  };
  string display_name = 1;
  string email = 2;
  string legacy_id = 3; // Identifier in the system being migrated from
}

// Rename the wallet's owner. Touches only display_name, so it commutes with money
// movements.
message UpdateProfile {
  option (io.angzarr.v1.command) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.ProfileUpdated"
    refuses: "io.angzarr.examples.v1.WalletNotFound"
    refuses: "io.angzarr.examples.v1.DisplayNameRequired"
  };
  string display_name = 1;
}

message DepositFunds {
  option (io.angzarr.v1.command) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.FundsDeposited"
    refuses: "io.angzarr.examples.v1.WalletNotFound"
    refuses: "io.angzarr.examples.v1.AmountNotPositive"
  };
  int64 amount = 1;
}

// Withdraw from the available balance (bankroll minus open holds).
message WithdrawFunds {
  option (io.angzarr.v1.command) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.FundsWithdrawn"
    refuses: "io.angzarr.examples.v1.WalletNotFound"
    refuses: "io.angzarr.examples.v1.AmountNotPositive"
    refuses: "io.angzarr.examples.v1.InsufficientAvailableFunds"
  };
  int64 amount = 1;
}

message EnrollLoyalty {
  option (io.angzarr.v1.command) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.LoyaltyEnrolled"
    refuses: "io.angzarr.examples.v1.WalletNotFound"
  };
}

// -----------------------------------------------------------------------------
// Commands — the buy-in (reaction commands from policy-buy-in-wallet)
// -----------------------------------------------------------------------------

// Earmark funds for a buy-in. hold_id is the buy_in_id. A hold the wallet
// cannot fund is refused
// (FAILED_PRECONDITION) with its typed InsufficientFunds, and the wallet
// records nothing; policy-buy-in-wallet translates the refusal into the
// buy-in's FundsHoldRefused fact, and the buy-in rolls back (decision
// 14.76; the refusal flows in buy_in.proto). A hold that reuses a hold id
// for another amount (HOLD_CONFLICT) is the buy-in's bug; whether it is a
// refusal instead is still the buy-in refusal ruling (R2).
message HoldFunds {
  option (io.angzarr.v1.command) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.FundsHeld"
    refuses: "io.angzarr.examples.v1.InsufficientFunds"
  };
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

// The wallet's typed refusals of its client commands (decision 14.82,
// DRAFT; the owner's ruling F3): one message per refusal, its args its
// fields, its status its (io.angzarr.v1.refusal_status) message option
// (declared on each, decision 14.95), each named in the refuses of every command
// that refuses with it. Refusal objects, never events; on the wire each is
// ANGZARR_REASON_COMMAND_REFUSED with its type as refusal_type. Was
// WalletRefused, one message with a 6-code Reason enum and optional args.

// RegisterWallet or ImportWallet for a wallet that exists.
message WalletAlreadyExists {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;
}

// Any client command but RegisterWallet and ImportWallet before either.
message WalletNotFound {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;
}

// WithdrawFunds beyond what is available (the bankroll minus open holds).
message InsufficientAvailableFunds {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;
  int64 available = 1; // Funds available
  int64 requested = 2; // The amount asked for
}

// DepositFunds or WithdrawFunds of nothing or less.
message AmountNotPositive {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;
  int64 amount = 1; // The amount that is not positive
}

// RegisterWallet, ImportWallet or UpdateProfile with no display name.
message DisplayNameRequired {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;
}

// RegisterWallet or ImportWallet with no email.
message EmailRequired {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_INVALID_ARGUMENT;
}

// The wallet's typed refusal of HoldFunds when available funds fall short
// (HoldFunds' refuses): a refusal object,
// never an event; packed as an Any into the refusal, which the issuing
// policy's Translate reads (decision 14.78).
message InsufficientFunds {
  option (io.angzarr.v1.refusal_status) = REFUSAL_STATUS_FAILED_PRECONDITION;
  int64 available = 1; // Funds available to hold
  int64 requested = 2; // The amount asked for
}

// Spend an open buy-in hold: bankroll and the hold both drop by its amount.
// A fact (decision 14.69): the buy-in seated its player, so the wallet
// records it and never refuses it. A hold that is not open (already
// captured or released, or never placed) records nothing (decision 14.75).
message CaptureFunds {
  option (io.angzarr.v1.fact) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.FundsCaptured"
  };
  bytes hold_id = 1;
}

// Close an open hold without spending it. A fact (decision 14.69): the
// buy-in's compensation of its held funds, which the wallet records and
// never refuses. policy-buy-in-wallet sends it on HoldReleaseDue, the
// buy-in's undo of its held funds when it rolls back (decision 14.74; see
// buy_in.proto). A hold that is not open records nothing (decision 14.75).
message ReleaseHold {
  option (io.angzarr.v1.fact) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.HoldReleased"
  };
  bytes hold_id = 1;
  string reason = 2;
}

// -----------------------------------------------------------------------------
// Facts — round reactions from the table (reaction facts)
// -----------------------------------------------------------------------------

// From policy-table-wallet, one per settled seat: a fact (decision 14.69),
// a round that is already settled. Recording the same (table_root, round)
// twice records nothing (decision 14.75).
message RecordRoundResult {
  option (io.angzarr.v1.fact) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.RoundResultRecorded"
  };
  bytes table_root = 1;
  uint32 round = 2;
  int64 wager = 3;
  int64 net = 4; // returned - wager; negative on a loss
}

// From policy-table-wallet, one per settled seat: a fact (decision 14.69),
// a round that is already settled. Awarding the same (table_root, round)
// twice records nothing (decision 14.75). An award for a wallet that never enrolled cannot
// be refused (it was refused with LOYALTY_NOT_ENROLLED): the wallet flags
// it with an event, as a fact handler flags input it cannot use.
message AwardLoyaltyPoints {
  option (io.angzarr.v1.fact) = {
    component: "io.angzarr.examples.v1.WalletState"
    emits: "io.angzarr.examples.v1.LoyaltyPointsAwarded"
  };
  bytes table_root = 1;
  uint32 round = 2;
  int64 points = 3;
}

// -----------------------------------------------------------------------------
// Events
// -----------------------------------------------------------------------------

message WalletRegistered {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  string display_name = 1;
  string email = 2;
}

// Identity migrated from a legacy system; the wallet starts empty.
message WalletImported {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  string display_name = 1;
  string email = 2;
  string legacy_id = 3;
}

message ProfileUpdated {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  string display_name = 1;
}

message FundsDeposited {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  int64 amount = 1;
}

// Legacy shape of FundsDeposited. Never emitted by current code; it exists
// only in stored history. The wallet upcaster (the wallet's upcaster
// sidecar, serving UpcasterService to the wallet's coordinator) rewrites it to
// FundsDeposited{amount = amount_chips} before any handler sees it, so no
// component consumes it directly.
message FundsDepositedV1 {
  int64 amount_chips = 1;
}

message FundsWithdrawn {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  int64 amount = 1;
}

// A buy-in hold was opened.
message FundsHeld {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletBuyInPolicy"
  };
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

// A buy-in hold was spent: the chips now belong to the table.
message FundsCaptured {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletBuyInPolicy"
  };
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

// A hold was closed without spending it.
message HoldReleased {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  bytes hold_id = 1;
  int64 amount = 2;
  string reason = 3;
}

message LoyaltyEnrolled {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
}

message RoundResultRecorded {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  bytes table_root = 1;
  uint32 round = 2;
  int64 wager = 3;
  int64 net = 4;
}

message LoyaltyPointsAwarded {
  option (io.angzarr.v1.event) = {component: "io.angzarr.examples.v1.WalletState"};
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.WalletLedgerProjection"
  };
  bytes table_root = 1;
  uint32 round = 2;
  int64 points = 3;
}

// -----------------------------------------------------------------------------
// State
// -----------------------------------------------------------------------------

message Hold {
  enum Purpose {
    PURPOSE_UNSPECIFIED = 0;
    PURPOSE_BUY_IN = 1;
  }
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OPEN = 1; // Counts against the available balance
    STATUS_CAPTURED = 2; // Buy-in spent
    STATUS_RELEASED = 3; // Closed unspent (ReleaseHold)
  }
  bytes table_root = 1;
  int64 amount = 2;
  Purpose purpose = 3;
  Status status = 4;
}

message RoundResult {
  bytes table_root = 1;
  uint32 round = 2;
  int64 wager = 3;
  int64 net = 4;
}

// The WalletAggregate.
message WalletState {
  option (io.angzarr.v1.component) = {
    component_name: "wallet"
    aggregate: { domain: "wallet" }
  };
  string display_name = 1;
  string email = 2;
  bool registered = 3; // True after WalletRegistered or WalletImported
  string legacy_id = 4;
  int64 bankroll = 5; // Includes open holds
  map<string, Hold> holds = 6; // key = lowercase hex(hold_id); every hold ever opened
  int64 total_deposited = 7;
  int64 total_withdrawn = 8;
  int64 total_to_tables = 9;
  int64 total_from_tables = 10; // Cash-out credits; nothing credits it until the cash-out ruling
  bool loyalty_enrolled = 11;
  int64 loyalty_points = 12;
  map<string, RoundResult> round_results = 13; // key = hex(table_root) + "/" + round
  map<string, int64> loyalty_awards = 14; // key = hex(table_root) + "/" + round -> points
}
