syntax = "proto3";
package io.angzarr.examples.v1;
import "io/angzarr/v1/options.proto";

import "io/angzarr/examples/v1/poker_types.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// Player Domain - Player identity, bankroll, and player type abstraction
// Root: player_id (derived from email or wallet address)
// =============================================================================

// Commands

message RegisterPlayer {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.PlayerState" };
  string display_name = 1;
  string email = 2; // Used for root derivation
  PlayerType player_type = 3; // HUMAN or AI
  string ai_model_id = 4; // For AI players: which model to use
}

message DepositFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.PlayerState" };
  Currency amount = 1;
}

message WithdrawFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.PlayerState" };
  Currency amount = 1;
}

// Reserve funds for a lifecycle action (buy-in, rebuy, tournament registration).
// ``key`` identifies the reservation bucket — a table_root for buy-in / rebuy
// flows, a tournament_root for registration flows. Matches the ``key`` field on
// ``DeductReservedFunds`` / ``FundsDeducted``.
message ReserveFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.PlayerState" };
  Currency amount = 1;
  bytes key = 2;
}

// Release reserved funds back to bankroll (cancel / compensate).
message ReleaseFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.PlayerState" };
  bytes key = 1;
}

// Settle a previously-reserved amount: reserved_funds AND bankroll both drop.
// Emitted by the reservation PM after a confirmed lifecycle action
// (BuyInConfirmed / RebuyFeeConfirmed / RegistrationFeeConfirmed).
message DeductReservedFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.PlayerState" };
  Currency amount = 1;
  bytes key = 2;
  bytes reservation_id = 3;
}

// Player decides to sit out at a table (stop receiving hands)
message SitOut {
  bytes table_root = 1;
}

// Player decides to return to play at a table
message SitIn {
  bytes table_root = 1;
}

// Transfer funds from one player to another (pot award)
message TransferFunds {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.PlayerState" };
  bytes from_player_root = 1; // Source player (for reserved funds)
  Currency amount = 2;
  bytes hand_root = 3; // Which hand this transfer is for
  string reason = 4; // "pot_win", "side_pot_win", etc.
}

// Request action from player (triggers AI sidecar for AI players)
message RequestAction {
  bytes hand_root = 1;
  bytes table_root = 2;
  int64 amount_to_call = 3;
  int64 min_raise = 4;
  int64 max_raise = 5; // Player's remaining stack
  repeated Card hole_cards = 6;
  repeated Card community_cards = 7;
  int64 pot_size = 8;
  BettingPhase phase = 9;
  int32 timeout_seconds = 10;
}

// Events

message PlayerRegistered {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.OutputProjection" domain: "player" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.PlayerState" };
  string display_name = 1;
  string email = 2;
  PlayerType player_type = 3;
  string ai_model_id = 4;
  google.protobuf.Timestamp registered_at = 5;
}

message FundsDeposited {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.OutputProjection" domain: "player" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.PlayerState" };
  Currency amount = 1;
  Currency new_balance = 2; // Absolute value after deposit
  google.protobuf.Timestamp deposited_at = 3;
}

message FundsWithdrawn {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.OutputProjection" domain: "player" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.PlayerState" };
  Currency amount = 1;
  Currency new_balance = 2; // Absolute value after withdrawal
  google.protobuf.Timestamp withdrawn_at = 3;
}

message FundsReserved {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.OutputProjection" domain: "player" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.PlayerState" };
  Currency amount = 1;
  bytes key = 2;
  Currency new_available_balance = 3; // Bankroll minus reserved
  Currency new_reserved_balance = 4; // Total reserved across all keys
  google.protobuf.Timestamp reserved_at = 5;
}

message FundsReleased {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.PlayerState" };
  Currency amount = 1;
  bytes key = 2;
  Currency new_available_balance = 3;
  Currency new_reserved_balance = 4;
  google.protobuf.Timestamp released_at = 5;
}

message FundsTransferred {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.PlayerState" };
  bytes from_player_root = 1;
  bytes to_player_root = 2;
  Currency amount = 3;
  bytes hand_root = 4;
  string reason = 5;
  Currency new_balance = 6; // Recipient's new balance
  google.protobuf.Timestamp transferred_at = 7;
}

// Emitted after DeductReservedFunds — settles a reservation permanently.
message FundsDeducted {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.PlayerState" };
  Currency amount = 1;
  bytes key = 2;
  bytes reservation_id = 3;
  Currency new_balance = 4;
  Currency new_reserved_balance = 5;
  google.protobuf.Timestamp deducted_at = 6;
}

// Emitted when action is needed - AI players respond via sidecar
message ActionRequested {
  bytes hand_root = 1;
  bytes table_root = 2;
  bytes player_root = 3;
  PlayerType player_type = 4;
  int64 amount_to_call = 5;
  int64 min_raise = 6;
  int64 max_raise = 7;
  repeated Card hole_cards = 8;
  repeated Card community_cards = 9;
  int64 pot_size = 10;
  BettingPhase phase = 11;
  google.protobuf.Timestamp deadline = 12;
}

// Player has chosen to sit out at a table
message PlayerSittingOut {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.PlayerTableSaga" domain: "player" };
  bytes table_root = 1;
  google.protobuf.Timestamp sat_out_at = 2;
}

// Player has chosen to return to play at a table
message PlayerReturningToPlay {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.PlayerTableSaga" domain: "player" };
  bytes table_root = 1;
  google.protobuf.Timestamp sat_in_at = 2;
}

// State (for snapshots)
message PlayerState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_AGGREGATE
    input_domain: "player"
    name: "PlayerAggregate"
  };
  string player_id = 1;
  string display_name = 2;
  string email = 3;
  PlayerType player_type = 4;
  string ai_model_id = 5;
  Currency bankroll = 6;
  Currency reserved_funds = 7;
  map<string, int64> table_reservations = 8; // key_hex -> amount (legacy name retained for on-disk compatibility)
  string status = 9; // "active", "suspended", etc.
}
