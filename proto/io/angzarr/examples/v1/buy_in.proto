syntax = "proto3";
package io.angzarr.examples.v1;
import "io/angzarr/v1/options.proto";

import "io/angzarr/examples/v1/orchestration.proto";
import "io/angzarr/examples/v1/poker_types.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// Buy-In Orchestration - PM-coordinated flow for Player ↔ Table
// =============================================================================

// -----------------------------------------------------------------------------
// Commands (Player Domain)
// -----------------------------------------------------------------------------

// Client initiates buy-in - triggers PM orchestration
message InitiateBuyIn {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.ReservationState" };
  bytes table_root = 1;
  int32 seat = 2; // Preferred seat (-1 for any)
  Currency amount = 3;
  bytes player_root = 4;
}

// PM confirms successful buy-in
message ConfirmBuyIn {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.ReservationState" };
  bytes reservation_id = 1;
}

// PM releases funds after failed seating
message ReleaseBuyIn {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.ReservationState" };
  bytes reservation_id = 1;
  string reason = 2;
}

// -----------------------------------------------------------------------------
// Commands (Table Domain)
// -----------------------------------------------------------------------------

// PM seats player at table (separate from JoinTable for PM flow)
message SeatPlayer {
  option (io.angzarr.v1.command) = { component: "io.angzarr.examples.v1.TableState" };
  bytes player_root = 1;
  bytes reservation_id = 2; // Links to buy-in flow
  int32 seat = 3; // Preferred seat (-1 for any)
  int64 amount = 4; // Buy-in amount
  // TDA Rule 7 / WSOP Rule 34 — when set, the table is in tournament
  // mode and seat assignment must be RNG-driven; the rng_seed is
  // recorded on the resulting PlayerSeated event for replay.
  bool tournament_mode = 5;
  bytes rng_seed = 6; // Optional explicit seed; auto-derived if empty.
  // TDA Rule 10A — when set, this is a player from a broken table
  // being reseated mid-orbit. The handler skips the destination's
  // ``min_buy_in`` check because the player carries their existing
  // stack (which may legitimately fall below the destination's
  // minimum) and is dealt out of the current hand, dealt in for the
  // next.
  bool moved_player = 7;
}

// -----------------------------------------------------------------------------
// Events (Player Domain)
// -----------------------------------------------------------------------------

// Emitted when buy-in is requested - triggers PM
message BuyInRequested {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationProcessManagerState" domain: "reservation" };
  bytes reservation_id = 1; // UUID for this buy-in flow
  bytes table_root = 2;
  int32 seat = 3;
  Currency amount = 4;
  google.protobuf.Timestamp requested_at = 5;
  bytes player_root = 6;
}

// Emitted when buy-in is confirmed
message BuyInConfirmed {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationProcessManagerState" domain: "reservation" };
  bytes reservation_id = 1;
  bytes table_root = 2;
  int32 seat = 3;
  Currency amount = 4;
  google.protobuf.Timestamp confirmed_at = 5;
  bytes player_root = 6;
}

// Emitted when buy-in reservation is released
message BuyInReservationReleased {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationState" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationProcessManagerState" domain: "reservation" };
  bytes reservation_id = 1;
  string reason = 2;
  google.protobuf.Timestamp released_at = 3;
  bytes player_root = 4;
  bytes table_root = 5;
  Currency amount = 6;
}

// -----------------------------------------------------------------------------
// Events (Table Domain)
// -----------------------------------------------------------------------------

// Emitted when player is seated via PM flow
message PlayerSeated {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationProcessManagerState" domain: "table" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.OutputProjection" domain: "table" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.TableState" };
  bytes player_root = 1;
  bytes reservation_id = 2;
  int32 seat_position = 3;
  int64 stack = 4;
  google.protobuf.Timestamp seated_at = 5;
  // TDA Rule 7 / WSOP Rule 34 — RNG seed used to pick the seat (when
  // ``tournament_mode`` was set on the SeatPlayer command). Empty in
  // cash-game flows.
  bytes rng_seed = 6;
}

// Emitted when seating is rejected
message SeatingRejected {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationProcessManagerState" domain: "table" };
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.TableState" };
  bytes player_root = 1;
  bytes reservation_id = 2;
  int32 requested_seat = 3;
  string reason = 4; // "seat_occupied", "invalid_amount", etc.
  google.protobuf.Timestamp rejected_at = 5;
}

// -----------------------------------------------------------------------------
// PM Events (BuyInOrchestrator Domain)
// -----------------------------------------------------------------------------

// PM state: buy-in flow initiated
message BuyInInitiated {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationProcessManagerState" applies: true };
  bytes player_root = 1;
  bytes table_root = 2;
  bytes reservation_id = 3;
  int32 seat = 4;
  Currency amount = 5;
  BuyInPhase phase = 6;
  google.protobuf.Timestamp initiated_at = 7;
}

// PM state: buy-in flow completed successfully
message BuyInCompleted {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationProcessManagerState" applies: true };
  bytes player_root = 1;
  bytes table_root = 2;
  bytes reservation_id = 3;
  int32 seat = 4;
  Currency amount = 5;
  google.protobuf.Timestamp completed_at = 6;
}

// PM state: buy-in flow failed
message BuyInFailed {
  option (io.angzarr.v1.event) = { component: "io.angzarr.examples.v1.ReservationProcessManagerState" applies: true };
  bytes player_root = 1;
  bytes table_root = 2;
  bytes reservation_id = 3;
  OrchestrationFailure failure = 4;
}

// PM state: phase transition
message BuyInPhaseChanged {
  bytes reservation_id = 1;
  BuyInPhase from_phase = 2;
  BuyInPhase to_phase = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// -----------------------------------------------------------------------------
// PM State (for snapshots)
// -----------------------------------------------------------------------------

message BuyInOrchestratorState {
  bytes reservation_id = 1; // Correlation ID for this flow
  bytes player_root = 2;
  bytes table_root = 3;
  int32 seat = 4;
  int64 amount = 5;
  BuyInPhase phase = 6;
  google.protobuf.Timestamp started_at = 7;
}
