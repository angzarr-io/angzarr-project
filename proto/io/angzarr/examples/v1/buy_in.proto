syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/examples/v1/player.proto";
import "io/angzarr/v1/options.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/examples/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// pmg-buy-in — the buy-in process manager (domain "buy-in")
// =============================================================================
//
// A buy-in must secure two resources in two domains — a held seat at the
// table and held funds in the wallet — and confirm each in turn. It is the
// example's only process manager.
//
// State is keyed by the correlation id: the PM's root is the correlation id
// itself, unchanged (process_manager.proto, Stream). A process manager is
// a domain (decision 14.31): it takes commands, which sagas from the table
// and the wallet send it, and facts (the refusal facts its own sagas
// deliver); it sends no commands. Each step it decides
// is a PM event carrying the data the next command needs, and a saga from
// "buy-in" builds that command. Flow:
//
//   source event          saga -> command to the PM                  phase change                      PM event        saga -> command
//   table  SeatHeld       saga-table-buy-in  -> StartBuyIn           (new) -> AWAITING_HOLD            BuyInStarted    saga-buy-in-player -> player HoldFunds
//   player FundsHeld      saga-player-buy-in -> RecordFundsHeld      AWAITING_HOLD -> AWAITING_SEAT    BuyInFundsHeld  saga-buy-in-table  -> table  ConfirmSeat
//   table  PlayerSeated   saga-table-buy-in  -> RecordPlayerSeated   AWAITING_SEAT -> AWAITING_CAPTURE BuyInSeated     saga-buy-in-player -> player CaptureFunds
//   player FundsCaptured  saga-player-buy-in -> RecordFundsCaptured  AWAITING_CAPTURE -> COMPLETED     BuyInCompleted  —
//
// StartBuyIn is the PM's one starting input (its (command) entry sets
// starts; ruling B1, adapted, decision 14.31): it alone starts an instance
// for a correlation the PM has not seen. Any other command for a
// correlation with no buy-in instance is refused by the PM's coordinator
// before the handler (PM_NO_INSTANCE). saga-table-buy-in and
// saga-player-buy-in declare no refusal path (their sends lists are
// unset), so such a refusal is dead-lettered and alerted, for a human
// (decision 14.31).
//
// Two refusals, end to end, one in each mode (decision 2.2, as amended by
// 14.31; SagaService in saga.proto, Refusals). The mode is the generator's
// choice (angzarr-cli's refusal switch); these are the protos' defaults.
//
// PASS-THROUGH: the wallet cannot fund the buy-in.
//   1. BuyInStarted -> saga-buy-in-player sends HoldFunds to the wallet;
//   2. the wallet refuses it (FAILED_PRECONDITION,
//      INSUFFICIENT_AVAILABLE_FUNDS) and records NOTHING;
//   3. saga-buy-in-player's coordinator calls OnRefused; its sends entry
//      for HoldFunds names no refusal_fact, so its generated code, with no
//      user code, forwards the standard CommandRefused{command = the
//      HoldFunds sent, response, trigger = BuyInStarted's EventRef} to its
//      own source: the buy-in stream of BuyInStarted (this PM instance).
//      The coordinator stamps it (its command_id = HoldFunds' command_id,
//      causation_id = BuyInStarted, the correlation) and writes it to the
//      outbox in the same transaction that clears HoldFunds' entry;
//   4. BuyInState lists HoldFunds in its refusals, so its generated
//      on_refused_HoldFunds(refusal, state) (infallible; this file imports
//      player.proto for HoldFunds) records BuyInFailed{reason}, phase
//      AWAITING_HOLD -> FAILED;
//   5. BuyInFailed -> saga-buy-in-table sends ReleaseSeat to the table,
//      which records SeatReleased.
//
// TRANSLATE: the table cannot confirm the seat (the hold is gone, or the
// player took another seat meanwhile).
//   1. BuyInFundsHeld -> saga-buy-in-table sends ConfirmSeat to the table;
//   2. the table refuses it (FAILED_PRECONDITION, SEAT_HOLD_NOT_FOUND or
//      PLAYER_ALREADY_SEATED) and records NOTHING;
//   3. saga-buy-in-table's sends entry for ConfirmSeat names refusal_fact
//      SeatConfirmationRefused, so its callback
//      on_refused_ConfirmSeat(Refusal{event = BuyInFundsHeld, command = the
//      ConfirmSeat sent, response}) returns SeatConfirmationRefused
//      {buy_in_id, reason}, a buy-in fact: the buy-in domain never refers
//      to the table's ConfirmSeat. Stamped and written as above (its
//      command_id = ConfirmSeat's command_id);
//   4. the PM's SeatConfirmationRefused fact handler records
//      BuyInSeatLost{reason}, phase AWAITING_SEAT -> FAILED;
//   5. BuyInSeatLost -> saga-buy-in-player sends ReleaseHold to the
//      wallet, which records HoldReleased.
//
// In both, the refused command's id is the refusal fact's id: never
// applied in the target's stream, recorded once in the buy-in stream, so a
// redelivered or re-run step is deduplicated at both ends. Which refusals
// the table and the wallet answer this way, and which are bugs, is still
// the buy-in refusal ruling (R2) in
// docs/design/blackjack-latest-proto-rulings.md. CaptureFunds, ReleaseHold
// and ReleaseSeat have no refusal path (their refusal is a bug), so the
// generator warns about them by design; such a refusal is dead-lettered and
// alerted.
//
// The command handlers never refuse a step of their own buy-in: a command
// whose id field (buy_in_id, or hold_id from the wallet, which equals the
// buy_in_id) does not match state.buy_in_id, or that arrives in the wrong
// phase, is stale, so the PM accepts it and records nothing (a stale
// command is not an error). The PM makes no business decisions:
// validation lives in the two aggregates. Its events carry their command's
// or fact's id as their cause, and the PM's coordinator deduplicates a
// redelivered input on that id before the PM runs.
//
// Invariant L3 (buy-in half): each PlayerSeated(B, X) pairs with exactly one
// FundsCaptured(B, X).

// -----------------------------------------------------------------------------
// The PM's commands: what the table and the wallet report, as the sagas
// into "buy-in" build them. Each is addressed to the buy-in instance its
// source event's correlation names (cover root = that correlation).
// -----------------------------------------------------------------------------

// Start a buy-in (from SeatHeld). The starting input.
message StartBuyIn {
  option (io.angzarr.v1.command) = {
    component: "io.angzarr.examples.v1.BuyInState"
    starts: true
  };
  bytes buy_in_id = 1;
  bytes player_root = 2;
  bytes table_root = 3; // The source event's own stream root
  int32 seat = 4;
  int64 amount = 5;
}

// The wallet held the funds (from FundsHeld; hold_id = the buy_in_id).
message RecordFundsHeld {
  option (io.angzarr.v1.command) = {component: "io.angzarr.examples.v1.BuyInState"};
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

// The table seated the player (from PlayerSeated).
message RecordPlayerSeated {
  option (io.angzarr.v1.command) = {component: "io.angzarr.examples.v1.BuyInState"};
  bytes buy_in_id = 1;
  bytes player_root = 2;
  int32 seat = 3;
  int64 stack = 4;
}

// The wallet spent the hold (from FundsCaptured; hold_id = the buy_in_id).
message RecordFundsCaptured {
  option (io.angzarr.v1.command) = {component: "io.angzarr.examples.v1.BuyInState"};
  bytes hold_id = 1;
  bytes table_root = 2;
  int64 amount = 3;
}

// The table refused ConfirmSeat: the DOMESTIC fact that
// saga-buy-in-table's translating callback returns (TRANSLATE mode;
// decision 14.31). A fact of the PM's own domain, so its handler is
// infallible, and the buy-in domain needs no table proto for it.
message SeatConfirmationRefused {
  option (io.angzarr.v1.command) = {component: "io.angzarr.examples.v1.BuyInState"};
  bytes buy_in_id = 1; // The refused ConfirmSeat's buy_in_id
  string reason = 2; // The refusal's reason, e.g. SEAT_HOLD_NOT_FOUND
}

// -----------------------------------------------------------------------------
// The PM's events
// -----------------------------------------------------------------------------

// Starts a buy-in. saga-buy-in-player sends HoldFunds{hold_id = buy_in_id,
// table_root, amount} to player_root.
message BuyInStarted {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
  };
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInPlayerSaga"
    domain: "buy-in"
  };
  bytes buy_in_id = 1;
  bytes player_root = 2;
  bytes table_root = 3;
  int32 seat = 4;
  int64 amount = 5;
}

// The wallet holds the funds. saga-buy-in-table sends
// ConfirmSeat{buy_in_id} to table_root.
message BuyInFundsHeld {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
  };
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInTableSaga"
    domain: "buy-in"
  };
  bytes buy_in_id = 1;
  bytes table_root = 2; // The saga's target root (a saga never looks one up)
}

// The player is seated. saga-buy-in-player sends
// CaptureFunds{hold_id = buy_in_id} to player_root.
message BuyInSeated {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
  };
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInPlayerSaga"
    domain: "buy-in"
  };
  bytes buy_in_id = 1;
  int64 stack = 2;
  bytes player_root = 3; // The saga's target root (a saga never looks one up)
}

message BuyInCompleted {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
  };
  bytes buy_in_id = 1;
}

// The buy-in failed: the wallet refused HoldFunds (the pass-through
// CommandRefused, handled by on_refused_HoldFunds). saga-buy-in-table
// sends ReleaseSeat{buy_in_id, reason} to table_root, freeing the held
// seat.
message BuyInFailed {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
  };
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInTableSaga"
    domain: "buy-in"
  };
  bytes buy_in_id = 1;
  bytes table_root = 2; // The saga's target root (a saga never looks one up)
  string reason = 3; // The refusal's reason, e.g. INSUFFICIENT_AVAILABLE_FUNDS
}

// The buy-in failed: the table refused ConfirmSeat (the translated
// SeatConfirmationRefused). saga-buy-in-player sends
// ReleaseHold{hold_id = buy_in_id, reason} to player_root, freeing the
// held funds.
message BuyInSeatLost {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
  };
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInPlayerSaga"
    domain: "buy-in"
  };
  bytes buy_in_id = 1;
  bytes player_root = 2; // The saga's target root (a saga never looks one up)
  string reason = 3; // The refusal's reason, e.g. SEAT_HOLD_NOT_FOUND
}

// The BuyInProcessManager. Owns the "buy-in" stream and subscribes to
// nothing: its inputs are the four commands above, from saga-table-buy-in
// and saga-player-buy-in, the standard CommandRefused for HoldFunds
// (pass-through, from saga-buy-in-player) and SeatConfirmationRefused
// (translated, from saga-buy-in-table). It
// sends no commands; its events feed saga-buy-in-player and
// saga-buy-in-table.
message BuyInState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_PROCESS_MANAGER
    domain: "buy-in"
    name: "BuyInProcessManager"
    // Pass-through refusals it handles: generates on_refused_HoldFunds.
    refusals: "io.angzarr.examples.v1.HoldFunds"
  };
  enum Phase {
    PHASE_UNSPECIFIED = 0; // No buy-in started under this correlation
    PHASE_AWAITING_HOLD = 1;
    PHASE_AWAITING_SEAT = 2;
    PHASE_AWAITING_CAPTURE = 3;
    PHASE_COMPLETED = 4;
    PHASE_FAILED = 5; // A step was refused (BuyInFailed or BuyInSeatLost)
  }
  bytes buy_in_id = 1;
  bytes player_root = 2;
  bytes table_root = 3;
  int32 seat = 4;
  int64 amount = 5;
  Phase phase = 6;
  string failure_reason = 7; // Set with PHASE_FAILED
}

// =============================================================================
// saga-buy-in-player, saga-buy-in-table — the buy-in's commands
// =============================================================================
//
// The two sagas from "buy-in", one per destination domain (one saga per
// (source domain, destination domain) pair). Each takes its target root from
// a field of the PM event (never from a lookup) and emits reaction commands:
//   - no Handling; the destination stamps its own head and deduplicates on
//     the command id derived from the PM event, the saga's registered name
//     and the command's index;
//   - delivered in DECISION mode (the coordinator's Handle), chosen by the
//     saga's configuration;
//   - correlation_id left empty; the saga's coordinator stamps the PM
//     event's correlation (the buy-in's), so the targets' replies reach the
//     PM under it;
//   - each lists the commands it sends (sends), with its refusal path:
//     HoldFunds passes through (CommandRefused to the buy-in), ConfirmSeat
//     is translated (SeatConfirmationRefused), and the rest have none (the
//     refusal flows above);
//   - type URLs come from generated code only.

// saga-buy-in-player: BuyInStarted -> HoldFunds; BuyInSeated ->
// CaptureFunds; BuyInSeatLost -> ReleaseHold.
message BuyInPlayerSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "buy-in"
    output_domain: "player"
    sends: {command: "io.angzarr.examples.v1.HoldFunds"} // pass-through
    sends: {command: "io.angzarr.examples.v1.CaptureFunds"}
    sends: {command: "io.angzarr.examples.v1.ReleaseHold"}
  };
}

// saga-buy-in-table: BuyInFundsHeld -> ConfirmSeat; BuyInFailed ->
// ReleaseSeat.
message BuyInTableSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "buy-in"
    output_domain: "table"
    sends: {
      command: "io.angzarr.examples.v1.ConfirmSeat"
      refusal_fact: "io.angzarr.examples.v1.SeatConfirmationRefused" // translate
    }
    sends: {command: "io.angzarr.examples.v1.ReleaseSeat"}
  };
}

// =============================================================================
// saga-table-buy-in, saga-player-buy-in — the buy-in is told, by command
// =============================================================================
//
// One saga per (source domain, destination domain) pair, so one from each
// of "table" and "player" into "buy-in". The PM is a domain, so these are
// ordinary sagas emitting reaction commands (decision 14.31): each command
// is addressed to the buy-in instance its source event's correlation names
// (cover domain "buy-in", root = that correlation), with no Handling, and
// deduplicated by its derived command id. They declare no sends, so no
// refusal path: the PM refuses none of their commands except a
// non-starting command for an unknown buy-in, which is dead-lettered for a
// human.

// saga-table-buy-in: SeatHeld -> StartBuyIn; PlayerSeated ->
// RecordPlayerSeated.
message TableBuyInSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "table"
    output_domain: "buy-in"
  };
}

// saga-player-buy-in: FundsHeld -> RecordFundsHeld; FundsCaptured ->
// RecordFundsCaptured.
message PlayerBuyInSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "player"
    output_domain: "buy-in"
  };
}
