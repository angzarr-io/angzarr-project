syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/v1/options.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/examples/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// =============================================================================
// pmg-buy-in — the buy-in process manager (domain "buy-in")
// =============================================================================
//
// A buy-in must secure two resources in two domains — a held seat at the
// table and held funds in the wallet — and confirm each in turn. It is the
// example's only process manager.
//
// State is keyed by the correlation id: the PM's root is the correlation id
// itself, unchanged (see ProcessManagerService, Stream). Flow:
//
//   trigger                    phase change                  PM event        sends
//   table  SeatHeld            (new) -> AWAITING_HOLD         BuyInStarted    player HoldFunds
//   player FundsHeld           AWAITING_HOLD -> AWAITING_SEAT BuyInFundsHeld  table  ConfirmSeat
//   table  PlayerSeated        AWAITING_SEAT -> AWAITING_CAPTURE BuyInSeated  player CaptureFunds
//   player FundsCaptured       AWAITING_CAPTURE -> COMPLETED  BuyInCompleted  —
//
// The failure branches (the wallet refuses HoldFunds, the table refuses
// ConfirmSeat, and the PM releases whichever half went through) are not part
// of this port. They reached the PM as rejection notifications through the
// compensation channel, which the latest contract deletes: a PM learns of a
// refusal only when the target records it as a domain event. They wait on
// the buy-in refusal ruling in docs/design/blackjack-latest-proto-rulings.md.
//
// Rules for every emitted command:
//   - a reaction command: no Handling; the destination stamps its own head
//     and deduplicates on the command id derived from the trigger, the PM's
//     registered name and the command's index.
//   - delivered in DECISION mode (the coordinator's Handle), chosen by the
//     PM's configuration: each next step depends on the previous outcome.
//   - correlation_id left empty; the coordinator stamps the trigger's
//     correlation.
//   - type URLs come from generated code only.
// Every handler first checks that the trigger's id (buy_in_id, or hold_id for
// player events, which equals the buy_in_id) matches state.buy_in_id and that
// the phase is the expected one; anything else is a no-op. The PM makes no
// business decisions: validation lives in the two aggregates.
//
// Invariant L3 (buy-in half): each PlayerSeated(B, X) pairs with exactly one
// FundsCaptured(B, X).

message BuyInStarted {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
    applies: true
  };
  bytes buy_in_id = 1;
  bytes player_root = 2;
  bytes table_root = 3;
  int32 seat = 4;
  int64 amount = 5;
}

message BuyInFundsHeld {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
    applies: true
  };
  bytes buy_in_id = 1;
}

message BuyInSeated {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
    applies: true
  };
  bytes buy_in_id = 1;
  int64 stack = 2;
}

message BuyInCompleted {
  option (io.angzarr.v1.event) = {
    component: "io.angzarr.examples.v1.BuyInState"
    applies: true
  };
  bytes buy_in_id = 1;
}

// The BuyInProcessManager. Owns the "buy-in" stream. Triggers come from
// "table" and "player" (each (event) entry's domain); commands go to
// "player" (HoldFunds, CaptureFunds, ReleaseHold) and "table" (ConfirmSeat,
// ReleaseSeat).
message BuyInState {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_PROCESS_MANAGER
    domain: "buy-in"
    output_domains: "player"
    output_domains: "table"
    name: "BuyInProcessManager"
  };
  enum Phase {
    PHASE_UNSPECIFIED = 0; // No buy-in started under this correlation
    PHASE_AWAITING_HOLD = 1;
    PHASE_AWAITING_SEAT = 2;
    PHASE_AWAITING_CAPTURE = 3;
    PHASE_COMPLETED = 4;
  }
  bytes buy_in_id = 1;
  bytes player_root = 2;
  bytes table_root = 3;
  int32 seat = 4;
  int64 amount = 5;
  Phase phase = 6;
}
