syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/v1/options.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// Component declarations are message annotations now — no services, no rpcs.
// The TableAggregate is declared on its state message (TableState, table.proto);
// its commands (CreateTable, StartHand) and events (TableCreated, HandStarted)
// are annotated on their own message definitions. HandStarted carries two
// (event) entries — it folds into TableAggregate AND triggers the saga below.
//
// The stateless TableHandSaga has no state message to anchor on, so it is
// declared on this marker message. Its reaction to HandStarted is wired by the
// (event) entry on HandStarted; its compensation of a rejected DealCards by
// the `compensates` entry here. The generator emits a strict handler interface
// + dispatch wiring; no gRPC service code — transport stays on the generic
// framework services and the Any envelope.
message TableHandSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "table"
    output_domain: "hand"
    compensates: "io.angzarr.examples.v1.DealCards"
  };
}

// Stateless saga markers. Reactions are wired by the (event) entries on the
// triggering events (e.g. HandComplete carries an (event) naming HandTableSaga).
message HandTableSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "hand"
    output_domain: "table"
  };
}

message HandPlayerSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "hand"
    output_domain: "player"
  };
}

message TablePlayerSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "table"
    output_domain: "player"
  };
}

message PlayerTableSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "player"
    output_domain: "table"
  };
}

// TableTournamentSaga forwards per-table facts up to the owning tournament so
// the tournament aggregate can run its cross-table coordination rules (Rule 11D
// short-table halt, hand-for-hand round tracking, final-table sizing). Stateless:
// reactions are wired by the (event) entries on the table events it forwards
// (PlayerJoined, PlayerLeft, TableBBOnEmptyPredicted, TableBBOnEmptyResolved,
// HandEnded, TableHandForHandRoundComplete). It routes to the right tournament
// via the tournament_cover packed in the source event's Cover.ext (TableExt).
message TableTournamentSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "table"
    output_domain: "tournament"
  };
}

// TournamentTableSaga fans the tournament's order-of-record events out to the
// per-table commands that execute them (TableHaltOrdered -> HaltForBalancing,
// TableResumeOrdered -> ResumePlayAtTable, FinalTableCombineOrdered ->
// CombineFinalTable, HandForHandStarted -> EnterTableHandForHand,
// HandForHandEnded -> EndTableHandForHand). Stateless field-by-field
// translation; the coordination decision lives in the tournament aggregate.
message TournamentTableSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "tournament"
    output_domain: "table"
  };
}

// OutputProjector is a genuinely stateless projector — it formats events into
// log lines and holds no event-sourced state — so it anchors on an empty
// marker (like the stateless sagas). The other PM/projector/aggregate
// components carry real state messages in their own files (reservation.proto,
// order_workflow.proto, hand.proto HandFlowState, projection.proto).
message OutputProjection {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_PROJECTOR
    input_domain: "hand"
    name: "OutputProjector"
  };
}
