syntax = "proto3";
package io.angzarr.examples.v1;

import "io/angzarr/v1/options.proto";

option csharp_namespace = "Angzarr.Examples";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/examples/v1;examples";
option java_multiple_files = true;
option java_package = "io.angzarr.examples";
option ruby_package = "Angzarr::Examples";

// Component declarations are message annotations now — no services, no rpcs.
// The TableAggregate is declared on its state message (TableState, table.proto);
// its commands (CreateTable, StartHand) and events (TableCreated, HandStarted)
// are annotated on their own message definitions. HandStarted carries two
// (event) entries — it folds into TableAggregate AND triggers the saga below.
//
// The stateless TableHandSaga has no state message to anchor on, so it is
// declared on this marker message. Its reaction to HandStarted is wired by the
// (event) entry on HandStarted; its compensation of a rejected DealCards by
// the `compensates` entry here. The generator emits a strict handler interface
// + dispatch wiring; no gRPC service code — transport stays on the generic
// framework services and the Any envelope.
message TableHandSaga {
  option (io.angzarr.v1.component) = {
    kind: COMPONENT_KIND_SAGA
    input_domain: "table"
    output_domain: "hand"
    compensates: "io.angzarr.examples.v1.DealCards"
  };
}
