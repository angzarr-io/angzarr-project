syntax = "proto3";
package io.angzarr.handler.v1;

import "google/protobuf/any.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Handler";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/handler/v1;angzarrhandler";
option java_multiple_files = true;
option java_package = "io.angzarr.handler";
option ruby_package = "Angzarr::Handler";

// A projector's business logic (decision 14.78, DRAFT). The layer rule is
// command_handler.proto's.

// What Project is handed: a run of one stream's events, in order, upcast.
// A projector folds the run into one write, reading each page's context
// from its EventMeta.
message ProjectRequest {
  // The stream's cover and the run of pages, each with its sequence and
  // EventMeta.
  io.angzarr.v1.EventBook events = 1;
}

// What Project answers: the projection, and nothing the coordinator
// knows. The coordinator builds core's Projection from it: cover the run's,
// projector the component's registered name, next_sequence the last page's
// sequence + 1. That is what HandleSync answers its caller
// (io.angzarr.transport.distributed.v1.SyncOutcome.projections) and what
// the projector's position records.
message ProjectResponse {
  google.protobuf.Any projection = 1;
}
