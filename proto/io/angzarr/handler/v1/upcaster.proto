syntax = "proto3";
package io.angzarr.handler.v1;

import "google/protobuf/any.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Handler";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/handler/v1;angzarrhandler";
option java_multiple_files = true;
option java_package = "io.angzarr.handler";
option ruby_package = "Angzarr::Handler";

// An upcaster's rules (decision 14.78, DRAFT; what an upcaster is, where it
// runs and who calls it are io/angzarr/v1/upcaster.proto's). The layer rule
// is command_handler.proto's.

// What an upcaster is handed: a stream's pages to bring to their current
// shape, with their sequences and EventMeta, read-only; or a lone command
// or fact payload, which has no stream sequence (decision 14.97, DRAFT).
message UpcastRequest {
  // The domain whose streams, commands or facts these are.
  string domain = 1;
  oneof input {
    // A stream's pages, each answered keyed by its sequence.
    UpcastPages pages = 2;
    // A lone command or fact payload, answered keyed no_sequence.
    google.protobuf.Any lone_payload = 3;
  }
}

// A stream's pages to upcast.
message UpcastPages {
  repeated io.angzarr.v1.EventPage events = 1;
}

// What an upcaster answers: each payload in its current shape, keyed by the
// page's sequence (decision 14.96, DRAFT), or no_sequence for a lone
// payload (decision 14.97): matched to the request by key, never by
// position. A page's sequence and
// EventMeta are the coordinator's and stay as stored, so an upcaster cannot
// rewrite them. An answer missing a requested sequence, naming one not
// requested, or naming one twice is a rule bug (an error from the
// upcaster).
message UpcastResponse {
  repeated Upcasted pages = 1;
}

// One upcast payload, keyed (decision 14.97, DRAFT; the owner: "NO_SEQ or
// something similar").
message Upcasted {
  oneof key {
    // The requested page's sequence.
    uint64 sequence = 1;
    // A lone command or fact payload, which has no stream sequence.
    NoSequence no_sequence = 2;
  }
  // Its payload, in current shape.
  google.protobuf.Any payload = 3;
}

// A lone command or fact payload, which has no stream sequence.
message NoSequence {}
