syntax = "proto3";
package io.angzarr.handler.v1;

import "google/protobuf/any.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Handler";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/handler/v1;angzarrhandler";
option java_multiple_files = true;
option java_package = "io.angzarr.handler";
option ruby_package = "Angzarr::Handler";

// An upcaster's rules (decision 14.78), under the handler layer's
// rule (docs/design/handler-contract.md §2). What an upcaster is, where it
// runs and who calls it: docs/design/upcasting.md.

// What an upcaster is handed: a stream's pages, read-only, or a lone
// command or fact payload (decision 14.97).
message UpcastRequest {
  // The domain whose streams, commands or facts these are.
  string domain = 1;
  oneof input {
    // A stream's pages, each answered keyed by its sequence.
    UpcastPages pages = 2;
    // A lone command or fact payload, answered keyed no_sequence.
    google.protobuf.Any lone_payload = 3;
  }
}

// A stream's pages to upcast.
message UpcastPages {
  repeated io.angzarr.v1.EventPage events = 1;
}

// What an upcaster answers: each payload in its current shape, keyed by the
// page's sequence (decision 14.96), or no_sequence for a lone payload
// (decision 14.97). The keying rule: docs/design/upcasting.md §6.
message UpcastResponse {
  repeated Upcasted pages = 1;
}

// One upcast payload, keyed (decision 14.97).
message Upcasted {
  oneof key {
    // The requested page's sequence.
    uint64 sequence = 1;
    // A lone command or fact payload, which has no stream sequence.
    NoSequence no_sequence = 2;
  }
  // Its payload, in current shape.
  google.protobuf.Any payload = 3;
}

// A lone command or fact payload, which has no stream sequence.
message NoSequence {}
