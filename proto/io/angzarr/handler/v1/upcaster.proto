syntax = "proto3";
package io.angzarr.handler.v1;

import "google/protobuf/any.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Handler";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/handler/v1;angzarrhandler";
option java_multiple_files = true;
option java_package = "io.angzarr.handler";
option ruby_package = "Angzarr::Handler";

// An upcaster's rules (decision 14.78, DRAFT; what an upcaster is, where it
// runs and who calls it are io/angzarr/v1/upcaster.proto's). The layer rule
// is command_handler.proto's.

// What an upcaster is handed: the pages to bring to their current shape,
// with their sequences and EventMeta, read-only. For a command or a fact
// the coordinator sends one page carrying only its payload and sequence 0
// (it has no stream sequence; decision 14.96, DRAFT), and takes the one
// answer entry keyed 0.
message UpcastRequest {
  // The domain whose streams these pages belong to.
  string domain = 1;
  repeated io.angzarr.v1.EventPage events = 2;
}

// What an upcaster answers: each page's payload in its current shape,
// keyed by the page's sequence (decision 14.96, DRAFT): matched to the
// request's pages by sequence, never by position. A page's sequence and
// EventMeta are the coordinator's and stay as stored, so an upcaster cannot
// rewrite them. An answer missing a requested sequence, naming one not
// requested, or naming one twice is a rule bug (an error from the
// upcaster).
message UpcastResponse {
  repeated Upcasted pages = 1;
}

// One page's upcast payload.
message Upcasted {
  // The requested page's sequence (0 for a command's or a fact's one page).
  uint64 sequence = 1;
  // Its payload, in current shape.
  google.protobuf.Any payload = 2;
}
