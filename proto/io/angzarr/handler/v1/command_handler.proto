syntax = "proto3";
package io.angzarr.handler.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "io/angzarr/v1/options.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Handler";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/handler/v1;angzarrhandler";
option java_multiple_files = true;
option java_package = "io.angzarr.handler";
option ruby_package = "Angzarr::Handler";

// The handler layer (decision 14.78, DRAFT): what each kind of business
// logic takes and returns, and nothing else. Between core (io.angzarr.v1,
// the coordinator's records and envelopes) and the component services
// (io.angzarr.component.v1, which bind these messages to gRPC). The
// dependency direction is component -> handler -> core: this package
// imports core, and core imports nothing of it.
//
// The rule that shapes every message here, one half per direction:
//   - A request carries the full angzarr context, read-only: the books the
//     coordinator built (CommandBook, EventBook), with every id, cover,
//     sequence and EventMeta it stamped or loaded. Business logic gets what
//     it needs (the owner's ruling on decision 46, Q1).
//   - A response carries only what business code decides on success:
//     payloads, the post-decision state, the rules version. A refusal, a
//     re-run and a bug are gRPC error statuses (decision 14.95, DRAFT).
//     It has no field the coordinator stamps (a cover, a sequence, an id,
//     EventMeta), so there is nothing for the coordinator to refuse.
// The coordinator alone converts between this layer and core's: it wraps
// each payload a response returns in core's EventPage, Snapshot or
// CommandBook, under the input's cover, never transforming the payload.
//
// The command handler of an aggregate, and of a process manager (a domain
// too, decision 14.31), is two calls, one per input arm (decision 46, Q3):
// Decide for a command, which may be refused; Ingest for a fact, which
// never is.

// What Decide is handed: one command and the stream it addresses, after
// the coordinator's pipeline steps 1-4 (io/angzarr/v1/types.proto,
// Handling). The command is validated, its ids assigned, deduplicated,
// admitted (a process manager's start rule) and, when it sets an expected
// sequence, found at the head; every payload is in its current shape (upcast, decision 14.39).
message DecideRequest {
  // The command as the coordinator holds it: its cover (the stream), its
  // page (command_id, correlation_id) and its Handling
  // (page.command.handling) as the client sent it. A set expected_sequence
  // equals history.next_sequence here: the coordinator refused any other
  // before calling the handler (io.angzarr.v1.ExpectedSequenceMismatch;
  // decision 14.94, DRAFT). The page's body is the Command arm.
  io.angzarr.v1.CommandBook command = 1;
  // The stream as loaded: the starting state (a snapshot that passed the
  // coordinator's validity checks, see Snapshot) and every page after it
  // (decision 14.40), each with its sequence and EventMeta, and the head
  // (next_sequence). The client library folds what it is given, in order,
  // never checking the snapshot or comparing sequences with it.
  io.angzarr.v1.EventBook history = 2;
  // When the input was accepted: stamped by the runtime that accepted it
  // before the handler runs, never by the caller (decision 14.37).
  google.protobuf.Timestamp recorded_at = 3;
  // A policy's command only: its trigger (ReactionDelivery.causation;
  // decision 14.79). Unset for a client's command.
  io.angzarr.v1.EventRef causation = 4;
}

// What Decide answers: SUCCESS ONLY, the accepted command's result and the
// rules version that decided it (decision 14.95, DRAFT, reversing decision
// 46's Q2; the owner: "grpc should carry the error (both retryable and
// not)"). Every other outcome is a gRPC error status, per AIP-193 and
// decision 14.37:
//   - a refusal: the business status its refusal message declares
//     ((io.angzarr.v1.refusal_status), required), with a
//     google.rpc.ErrorInfo (reason ROUTER_REASON_COMMAND_REFUSED, metadata
//     refusal_type) and the typed refusal object packed in the status
//     details. The refusing domain records nothing;
//   - a re-run ("re-read and re-decide"): ABORTED under the handler's own
//     key and args;
//   - a bug: its error status (ROUTER_REASON_UNHANDLED_HANDLER_ERROR and the
//     router's other bug keys; io/angzarr/v1/command_handler.proto, status
//     codes).
message DecideResponse {
  // The command is accepted: these are its events.
  Decided decided = 1;
  // The full version of the business binary that produced this answer
  // (e.g. "1.4.2+build.7"), baked in when the binary is built, never a
  // label chosen by hand: the same value the component registered
  // (ComponentDescriptor.rules_version). The client library fills it on
  // every answer. The coordinator stamps it in full onto every event
  // (EventMeta.rules_version) and any snapshot written from this answer.
  // One that differs from the registered version (an empty one included) is
  // a handler bug: refused, nothing persisted,
  // COORDINATOR_REASON_RULES_VERSION_MISMATCH (decision 14.56).
  string rules_version = 2;
}

// An accepted command's result: payloads and the post-decision state,
// nothing the coordinator stamps.
message Decided {
  // The events, payloads only, in order: empty, one or many (decision
  // 14.75). The coordinator wraps event i as an EventPage under the
  // command's cover, at sequence head + i, with one EventMeta for the
  // write (causation.command_id and correlation_id from the command's
  // page, recorded_at, rules_version from this answer).
  repeated google.protobuf.Any events = 1;
  // The state with the command's events folded in, filled by the client
  // library on every accepted answer, never by business code. The
  // coordinator persists it as a Snapshot (sequence, state, rules_version)
  // per the domain's storage policy; business code never decides whether
  // or when.
  google.protobuf.Any state = 2;
  // There is no conflict report: the coordinator has no conflict concept
  // (decision 14.92, DRAFT). The events are appended at the head the
  // coordinator loaded, and a lost race is re-run on the new head.
}

// A business rejection as the refused policy's Translate receives it
// (io/angzarr/handler/v1/policy.proto, TranslateRequest.refusal): the typed
// refusal and the status it travelled as, which the policy's coordinator
// reads off the target's gRPC status (decision 14.95, DRAFT). Typed only:
// every refusal is one of its command's refuses messages (decision 14.95;
// there is no untyped refusal).
message Refusal {
  // The business status the refusal travelled as: its message's declared
  // (io.angzarr.v1.refusal_status). Only business statuses are
  // representable.
  io.angzarr.v1.RefusalStatus status = 1;
  // The typed refusal object: one of the command's CommandOptions.refuses
  // types (options.proto), packed, as it travelled in the status details.
  // Its type is the key and its fields the map.
  google.protobuf.Any typed = 2;
}

// What Ingest is handed: one fact and the stream it addresses, after the
// same pipeline steps as Decide. A fact carries no Handling.
message IngestRequest {
  // The fact as the coordinator holds it: its cover, its page (command_id,
  // correlation_id) and its Fact (payload, origin). A policy's fact or a
  // refusal fact arrives as a ReactionDelivery, which the coordinator
  // turns into this book with its derived origin.
  io.angzarr.v1.CommandBook fact = 1;
  // The stream as loaded, as for Decide.
  io.angzarr.v1.EventBook history = 2;
  // When the input was accepted, as for Decide.
  google.protobuf.Timestamp recorded_at = 3;
  // A policy's fact or a refusal fact only: its trigger
  // (ReactionDelivery.causation; decision 14.79).
  io.angzarr.v1.EventRef causation = 4;
}

// What Ingest answers: SUCCESS ONLY (decision 14.95, DRAFT). A fact is
// never refused. Any error status from Ingest is a bug: the fact is
// dead-lettered under the status's key and args and alerted, and its sender
// answered OK, PARKED, as any failing fact handler's (decision 14.72).
message IngestResponse {
  // The fact is recorded: these are its events.
  Ingested ingested = 1;
  // As DecideResponse.rules_version.
  string rules_version = 2;
}

// A recorded fact's result: payloads and the post-ingest state.
message Ingested {
  // The events, payloads only, in order; may be empty (decision 14.75).
  // Wrapped as Decided.events are, with EventMeta.fact the fact's origin.
  repeated google.protobuf.Any events = 1;
  // The post-ingest state, filled by the client library, as
  // Decided.state.
  google.protobuf.Any state = 2;
}
