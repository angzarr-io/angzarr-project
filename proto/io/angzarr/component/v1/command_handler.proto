syntax = "proto3";
package io.angzarr.component.v1;

import "io/angzarr/handler/v1/command_handler.proto";

option csharp_namespace = "Angzarr.Component";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/component/v1;angzarrcomponent";
option java_multiple_files = true;
option java_package = "io.angzarr.component";
option ruby_package = "Angzarr::Component";

// The handler-side contract of an aggregate's (or a process manager's)
// business logic: the one service its business process serves for it,
// however the runtime reaches it (in process, a local child's socket, or the
// network). Its messages are the handler layer's
// (io/angzarr/handler/v1/command_handler.proto; decision 14.78, DRAFT):
// each request carries the books, read-only, and each response only what
// business code decides.
//
// CommandHandlerService: the business logic for one domain's aggregates,
// implemented in a client library and called by the coordinator. Business
// code behaves the same in every command mode. Two RPCs, one per input arm
// (decision 46, Q3): the arm picks the RPC, so a command is never ingested
// and a fact never decided.
//
// Before either is called the coordinator has run pipeline steps 1-4
// (io/angzarr/v1/types.proto, Handling): validated the input, assigned its
// command_id and correlation_id, loaded and deduplicated it, admitted it
// (a process manager's start rule; decision 14.42), and refused it if its
// expected sequence is not the head (decision 14.94). Which coordinator RPC the caller
// used (the command mode) is not passed on. It has upcast every payload
// through the component's upcaster sidecar (decision 14.39) and dropped the
// pages the snapshot covers (decision 14.40). Every delivery is well formed
// (the coordinator builds it): the client library guards no envelope
// (decision 14.42).
//
// In the client library: the type URL picks the handler. A type URL no
// registered handler claims is refused INTERNAL (a bug: decision 14.37)
// with reason ROUTER_REASON_UNKNOWN_COMMAND_TYPE (ROUTER_REASON_NO_FACT_HANDLER
// for a fact), which is also the status message (a key, never text); the
// status details carry a google.rpc.ErrorInfo whose metadata key "type_url"
// holds the type URL the library was given. The coordinator answers its
// caller with "type_url" as sent and "upcast_type_url" as delivered (see
// io/angzarr/v1/upcaster.proto). The state the handler sees is the
// starting state (history.snapshot.state, when present) decoded, with
// every delivered page folded in order.
//
// The coordinator persists nothing from an answer it refuses: a
// rules_version other than the registered one
// (COORDINATOR_REASON_RULES_VERSION_MISMATCH, decision 14.56). A caller of
// Handle or HandleSync is answered INTERNAL; an asynchronous or reaction
// delivery is dead-lettered and alerted. Neither is a business rejection.
service CommandHandlerService {
  // Decide one command: on success its events, with the rules version that
  // decided it. Every other outcome is a gRPC error status, per AIP-193
  // and decision 14.37 (decision 14.95, DRAFT, reversing decision 46's Q2):
  // a refusal under its message's declared business status, a re-run as
  // ABORTED under the handler's own key, a bug as its error status.
  //
  // The handler always decides on the current state: the coordinator
  // appends at the head it loaded and re-runs a lost race on the new head
  // (types.proto, the concurrency region). A command whose expected
  // sequence is not that head is refused before Decide is called
  // (ExpectedSequenceMismatch; decision 14.94, DRAFT).
  //
  // A refusal records nothing. It is typed (one of the command's refuses
  // messages; decision 14.95): its status is the message's declared
  // (io.angzarr.v1.refusal_status), its google.rpc.ErrorInfo reason
  // ROUTER_REASON_COMMAND_REFUSED with refusal_type, and the object packed in
  // the status details (decision 14.37). The coordinator answers a client
  // caller with that status unchanged; a refused HandleAsync command is
  // dead-lettered (AngzarrDeadLetter.reason and .refusal); a refused
  // policy command reaches the policy's Translate (the one refusal path;
  // io/angzarr/v1/policy.proto, Refusals). There is no compensation input:
  // the policy delivers a fact of the refusal to its own source domain
  // (decision 14.31).
  rpc Decide(io.angzarr.handler.v1.DecideRequest) returns (io.angzarr.handler.v1.DecideResponse);

  // Ingest one fact: on success its events (decision 14.95, DRAFT). A fact
  // is never refused (decision 14.34): any error status from Ingest is a
  // bug, never a business rejection. The
  // fact is dead-lettered (and alerted) under the key and args the process
  // answered, and its sender answered OK, PARKED (C-0785, C-0786; decision
  // 14.72).
  rpc Ingest(io.angzarr.handler.v1.IngestRequest) returns (io.angzarr.handler.v1.IngestResponse);
}
