syntax = "proto3";
package io.angzarr.component.v1;

import "io/angzarr/v1/command_handler.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Component";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/component/v1;angzarrcomponent";
option java_multiple_files = true;
option java_package = "io.angzarr.component";
option ruby_package = "Angzarr::Component";

// The handler-side contract of an aggregate's (or a process manager's)
// business logic: the one service its business process serves for it,
// however the runtime reaches it (in process, a local child's socket, or the
// network). Its messages are core's (io/angzarr/v1/command_handler.proto,
// io/angzarr/v1/types.proto; decision 14.64).
//
// CommandHandlerService: the business logic for one domain's aggregates,
// implemented in a client library and called by the coordinator. Business code behaves the same in every
// command mode.
service CommandHandlerService {
  // Process one command and return the events it produces, with the rules
  // version that decided them. This is the only input path into an
  // aggregate: facts arrive here too, in the Fact arm of CommandPage.body.
  //
  // By the time Handle is called the coordinator has already run pipeline
  // steps 1-4 (io/angzarr/v1/types.proto, Handling): validated the command, assigned its
  // command_id and correlation_id, deduplicated it, admitted it (a refusal
  // fact's stream, a process manager's start rule; decision 14.42), and
  // resolved its
  // Handling (checked or stamped the expected sequence and resolved the
  // conflict resolution), so decide always sees a concrete sequence. Which
  // coordinator RPC the caller used (the command mode) is not passed on.
  //
  // Before Handle, the coordinator has also upcast the payload through the
  // component's upcaster sidecar (decision 14.39; see io/angzarr/v1/upcaster.proto) and
  // dropped the pages the snapshot covers (decision 14.40), so the library
  // sees only current shapes, the starting state and the pages after it.
  // Every delivery is well formed (the coordinator builds it): the client
  // library guards no envelope (decision 14.42).
  //
  // In the client library, in order:
  //   1. reflective dispatch: the body arm picks the pipeline (Command ->
  //      decide, which may reject; Fact -> ingest, which never rejects), and
  //      the type URL picks the handler. A type URL no registered handler
  //      claims is refused INTERNAL (a bug: decision 14.37) with reason
  //      ROUTER_REASON_UNKNOWN_COMMAND_TYPE (ROUTER_REASON_NO_FACT_HANDLER for a fact), which is also
  //      the status message (a key, never text); the status details carry a
  //      google.rpc.ErrorInfo whose metadata key "type_url" holds the type
  //      URL the library was given. The coordinator answers its caller with
  //      "type_url" as sent and "upcast_type_url" as delivered (see
  //      io/angzarr/v1/upcaster.proto). A failing fact handler is a bug,
  //      not a business rejection: the fact is dead-lettered (and alerted)
  //      and the sender answered PARKED, never a rejection. So is a fact
  //      the business process answers with a business status: a fact
  //      cannot be refused, and the coordinator dead-letters it, under the
  //      key and args the process answered, as it does any input it
  //      cannot deliver (C-0785, C-0786; decision 14.72).
  //   2. under AGGREGATE_HANDLES the library reports the nonce the handler
  //      resolved with, and under COMMUTATIVE it computes the window's and
  //      the command's conflict units (CommandHandlerResponse.conflict).
  //      It never discards the handler's events for a conflict: the
  //      coordinator judges the report (decision 14.42; see
  //      ConflictResolution).
  // The state the handler sees is the starting state (events.snapshot.state,
  // when present) decoded, with every delivered page folded in order; the
  // library never compares a page's sequence with the snapshot's.
  // The library never checks a delivered snapshot: the coordinator offers
  // only snapshots that pass its validity checks (see Snapshot in
  // io/angzarr/v1/types.proto), and the library folds whatever it is given.
  //
  // A rejection is answered as a gRPC error status, never as a response
  // message, and the refusing domain records nothing. A business rejection
  // (a status of the business set; see the status codes below, and
  // FAILED_PRECONDITION for a typed refusal) carries a message and, optionally, a typed
  // refusal object: one of the command's CommandOptions.refuses types
  // (options.proto), which the client library packs into the status
  // details as a google.protobuf.Any; the generated handler returns its
  // events or one of those refusals (decision 14.31). The
  // coordinator passes the status on unchanged, and a policy whose command
  // was refused receives it as RefusalResponse (io/angzarr/v1/types.proto). There is no
  // compensation input: when a policy's command is refused, the policy delivers
  // a refusal fact to its own source domain, which decides how to respond
  // (decision 14.31; PolicyService in io/angzarr/v1/policy.proto, Refusals).
  //
  // Business output is payloads, plus the post-command state, and nothing
  // else. The returned EventBook carries pages with only a payload set, and
  // on EVERY response snapshot.state: the aggregate's state with the
  // command's events folded in, filled by the client library. Business code
  // never decides whether or when a snapshot is taken, and the request
  // carries no flag asking for one. The coordinator persists the state as a
  // snapshot per the domain's storage policy (see Snapshot) and supplies the
  // cover (the command's), every sequence and every EventMeta, stamping
  // EventMeta.rules_version (and Snapshot.rules_version) in full from the
  // response's rules_version. Output that sets page meta or a page sequence,
  // or a cover other than the command's (empty counts as the command's), or
  // a response whose rules_version differs from the registered one, is a
  // handler bug: the coordinator refuses it and persists nothing. A caller
  // of Handle or HandleSync is answered INTERNAL; an asynchronous or
  // reaction delivery is dead-lettered and alerted. It is never treated as
  // a business rejection. The version's refusal is keyed
  // COORDINATOR_REASON_RULES_VERSION_MISMATCH (decision 14.56).
  rpc Handle(io.angzarr.v1.ContextualCommand) returns (io.angzarr.v1.CommandHandlerResponse);
}
