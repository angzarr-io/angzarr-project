syntax = "proto3";
package io.angzarr.component.v1;

import "io/angzarr/handler/v1/upcaster.proto";

option csharp_namespace = "Angzarr.Component";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/component/v1;angzarrcomponent";
option java_multiple_files = true;
option java_package = "io.angzarr.component";
option ruby_package = "Angzarr::Component";

// UpcasterService: the upcaster sidecar's one service (decision 14.39). Its
// messages are the handler layer's (io/angzarr/handler/v1/upcaster.proto;
// decision 14.78). What an upcaster is, where it runs and who calls
// it: docs/design/upcasting.md §1 to §3 and §6.
service UpcasterService {
  // Bring payloads to their current shape, keyed by sequence or
  // no_sequence (UpcastResponse), transformed where a rule applies.
  rpc Upcast(io.angzarr.handler.v1.UpcastRequest) returns (io.angzarr.handler.v1.UpcastResponse);
}
