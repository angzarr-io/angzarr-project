syntax = "proto3";
package io.angzarr.component.v1;

import "io/angzarr/v1/policy.proto";
import "io/angzarr/v1/types.proto";

option csharp_namespace = "Angzarr.Component";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/io/angzarr/component/v1;angzarrcomponent";
option java_multiple_files = true;
option java_package = "io.angzarr.component";
option ruby_package = "Angzarr::Component";

// PolicyService: a policy's business logic, the one service its business
// process serves for it. What a policy is, its translation, its refusals
// and its outbox are core's (io/angzarr/v1/policy.proto), as are its
// messages (decision 14.64).
service PolicyService {
  // Translate source events into the commands and facts the destination
  // domain declares (an aggregate's or a process manager's; decision
  // 14.69).
  rpc Handle(io.angzarr.v1.EventBook) returns (io.angzarr.v1.PolicyResponse);

  // One refusal of the policy's command (Refusals, above): the translated
  // fact, or no translation. Called by the policy's coordinator only, for
  // every business rejection of one of its commands. The business process
  // runs the translating callback for the refused command's type and
  // answers its fact (payload only), or answers an empty response when it
  // has none; the coordinator then builds the pass-through CommandRefused
  // (decision 14.42). An error status, or a fact the coordinator refuses as
  // malformed, is a policy bug (dead-lettered and alerted).
  rpc OnRefused(io.angzarr.v1.Refusal) returns (io.angzarr.v1.OnRefusedResponse);
}
