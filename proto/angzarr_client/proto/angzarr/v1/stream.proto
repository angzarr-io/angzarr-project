syntax = "proto3";
package angzarr_client.proto.angzarr.v1;

import "angzarr_client/proto/angzarr/v1/types.proto";
import "google/api/annotations.proto";

option csharp_namespace = "Angzarr";
option go_package = "github.com/benjaminabbitt/angzarr/client/go/proto/angzarr_client/proto/angzarr/v1;angzarr";
option java_multiple_files = true;
option java_package = "dev.angzarr";
option ruby_package = "Angzarr";

// region event_stream_service
// EventStreamService: streams events to registered subscribers
service EventStreamService {
  // Subscribe to events matching correlation ID (required)
  // Returns INVALID_ARGUMENT if correlation_id is empty
  // REST: Server-Sent Events (SSE) stream
  rpc Subscribe(EventStreamFilter) returns (stream EventBook) {
    option (google.api.http) = {get: "/v1/stream/{correlation_id}"};
  }
}
// endregion
